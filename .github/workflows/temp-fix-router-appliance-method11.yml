name: temp-fix-router-appliance-method11
on:
  push:
    paths:
      - '.github/workflows/temp-fix-router-appliance-method11.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply correction
        run: python3 .github/temp_fix_router_appliance_method11.py
      - name: Commit and clean helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-07-26_GCP_Shared_VPC_Centralized_Firewall_Insertion_Method_11_Deep_Dive.md
          git rm .github/temp_fix_router_appliance_method11.py .github/workflows/temp-fix-router-appliance-method11.yml
          git commit -m 'Correct Router Appliance gcloud syntax in Shared VPC Method 11'
          git push
