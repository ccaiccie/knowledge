name: temp-link-gcp-summary-methods
on:
  push:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Link GCP summary methods
        run: python3 .github/scripts/temp_link_gcp_summary_methods.py
      - name: Commit update and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-07-26_GCP_Firewall_Insertion_Summary.md
          git rm .github/scripts/temp_link_gcp_summary_methods.py
          git rm .github/workflows/temp_link_gcp_summary_methods.yml
          git commit -m 'Link GCP firewall insertion methods to deep dives'
          git push
