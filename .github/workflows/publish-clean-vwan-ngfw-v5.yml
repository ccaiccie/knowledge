name: Publish clean vWAN NGFW v5 diagrams
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-clean-vwan-ngfw-v5.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate clean diagrams
        run: python tools/generate_vwan_ngfw_v5.py
      - name: Patch guide references and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          guide=Path('09-05-26-20-00_Azure_Virtual_WAN_Integrated_Third_Party_NGFW_Direct_Hub_Deep_Dive.md')
          s=guide.read_text()
          s=s.replace('_v4.svg','_v5.svg').replace('_v4.drawio','_v5.drawio')
          guide.write_text(s)
          for f in Path('images').glob('*_v5.svg'): ET.parse(f)
          for f in Path('images').glob('*_v5.drawio'): ET.parse(f)
          assert len(list(Path('images').glob('*_v5.svg'))) == 10
          assert len(list(Path('images').glob('*_v5.drawio'))) == 10
          assert '_v5.svg' in s and '_v5.drawio' in s
          PY
      - name: Remove temporary generator and workflow
        run: rm -f tools/generate_vwan_ngfw_v5.py .github/workflows/publish-clean-vwan-ngfw-v5.yml
      - name: Commit clean redesign
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/*_v5.svg images/*_v5.drawio 09-05-26-20-00_Azure_Virtual_WAN_Integrated_Third_Party_NGFW_Direct_Hub_Deep_Dive.md tools/generate_vwan_ngfw_v5.py .github/workflows/publish-clean-vwan-ngfw-v5.yml
          git commit -m 'Simplify vWAN NGFW diagrams for clarity and readability'
          git push
