name: temp-run-shared-vpc-gcloud-edit
on:
  push:
    paths:
      - '.github/workflows/temp-run-shared-vpc-gcloud-edit.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply edit
        run: python3 .github/temp_edit_shared_vpc_gcloud.py
      - name: Commit and clean helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-07-26_GCP_Shared_VPC_Centralized_Firewall_Insertion_Method_11_Deep_Dive.md
          git rm .github/temp_edit_shared_vpc_gcloud.py .github/workflows/temp-run-shared-vpc-gcloud-edit.yml
          git commit -m 'Add section-aligned gcloud commands to Shared VPC Method 11'
          git push
