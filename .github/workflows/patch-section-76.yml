          replacement = r'''## 7.6 Inter-VPC / hub-and-spoke east-west inspection

This design deserves special attention because **VPC Network Peering is not transitive**. If `spoke-a-vpc` peers only with `hub-vpc`, and `spoke-b-vpc` also peers only with `hub-vpc`, Spoke A does **not** automatically learn or use Spoke B's subnet route through the hub. A working inspection design therefore relies on a deliberately exported/imported **custom static route** that sends otherwise-unreachable destinations to the VM-Series service in the hub.

### 7.6.1 The route pattern that actually works

A common peering-based inspection pattern is:

```text
Spoke A subnet: 10.10.0.0/16
Spoke B subnet: 10.20.0.0/16
Hub trust subnet: 10.0.0.0/24
Trust ILB VIP: 10.0.0.10
VM-Series trust NICs: hub-vpc / 10.0.0.0/24
```

The hub creates an **untagged** custom static route such as:

```text
0.0.0.0/0 -> next hop internal passthrough ILB 10.0.0.10
```

The hub exports custom routes on each peering. Each spoke imports custom routes from the hub.

Why use a broader route such as `0.0.0.0/0` instead of a static route that exactly equals `10.20.0.0/16` or `10.10.0.0/16`?

- Google requires subnet and peering-subnet routes to remain the most-specific routes for their address ranges.
- A local or imported static route cannot exactly match or fit inside a local/peering subnet route unless you are using the separate hybrid-subnet behavior.
- The spoke does not directly import the other spoke's subnet route because VPC peering is non-transitive.
- Therefore, the imported broader custom route acts as the catch-all route that sends the otherwise-unreachable remote-spoke destination to the firewall service.

This creates an intentional two-stage routing model:

```text
Spoke A route lookup
  10.20.1.20 does not match a local or directly peered subnet route
  -> imported hub custom route 0.0.0.0/0
  -> next hop trust ILB 10.0.0.10
  -> VM-Series

VM-Series allows the packet and emits it back into hub-vpc
  -> hub VPC route lookup
  -> hub has a directly learned peering subnet route for 10.20.0.0/16
  -> hub-to-spoke-b peering
  -> Spoke B workload
```

The return direction follows the mirror image:

```text
Spoke B
  -> imported hub custom route 0.0.0.0/0
  -> trust ILB 10.0.0.10
  -> same VM-Series service / existing PAN-OS session
  -> hub peering subnet route for 10.10.0.0/16
  -> Spoke A
```

### 7.6.2 Why this does not make VPC peering transitively routable

The hub is not forwarding a packet simply because it has two peerings. The first route lookup in the source spoke deliberately chooses an **imported custom route whose next hop is the hub's internal passthrough Network Load Balancer**. That delivers the packet to a VM-Series forwarding appliance.

After inspection, VM-Series emits a new packet onto its hub-facing dataplane interface. Google then performs a new hub-VPC route lookup. At that stage, the hub can use the directly learned peering subnet route to the destination spoke.

So the transit function is provided by:

```text
imported custom route
        +
internal passthrough ILB
        +
VM-Series L3 forwarding
        +
hub's direct peering route to the destination spoke
```

—not by peering alone.

### 7.6.3 Important route-exchange constraints

Keep these Google Cloud rules in mind:

1. **Policy-based routes are not exchanged through VPC Network Peering.** Use PBR for same-VPC service insertion, but do not expect a hub PBR to appear in spokes.
2. **Tagged static routes are not exchanged through VPC Network Peering.** The exported inspection route must therefore be untagged if the spoke is expected to import it.
3. `--export-custom-routes` / `--import-custom-routes` controls custom static and dynamic route exchange as a class; it is not a per-prefix route filter.
4. Default routes whose next hop is the **default Internet gateway** are not exported as custom peering routes. A static `0.0.0.0/0` whose next hop is an internal passthrough ILB is different and is eligible for exchange.
5. The next-hop ILB route should normally identify the internal passthrough forwarding rule by its internal IP when the route is consumed from a connected VPC.
6. Enable **global access** on the internal passthrough ILB if clients in regions other than the ILB's region must use it.

### 7.6.4 Build the three VPCs and subnets

The following example keeps all resources in one project for clarity. Cross-project peering works too when IAM and project references are adjusted.

```cli
PROJECT_ID=SEC_PROJECT
REGION=us-central1

# Hub VPC
gcloud compute networks create hub-vpc \
  --project=${PROJECT_ID} \
  --subnet-mode=custom

gcloud compute networks subnets create hub-trust-uscentral1 \
  --project=${PROJECT_ID} \
  --network=hub-vpc \
  --region=${REGION} \
  --range=10.0.0.0/24

# Spoke A
gcloud compute networks create spoke-a-vpc \
  --project=${PROJECT_ID} \
  --subnet-mode=custom

gcloud compute networks subnets create spoke-a-uscentral1 \
  --project=${PROJECT_ID} \
  --network=spoke-a-vpc \
  --region=${REGION} \
  --range=10.10.0.0/16

# Spoke B
gcloud compute networks create spoke-b-vpc \
  --project=${PROJECT_ID} \
  --subnet-mode=custom

gcloud compute networks subnets create spoke-b-uscentral1 \
  --project=${PROJECT_ID} \
  --network=spoke-b-vpc \
  --region=${REGION} \
  --range=10.20.0.0/16
```

Do not overlap subnet ranges across networks that will be peered.

### 7.6.5 Create the hub-and-spoke peerings

Create both directions for each peering relationship. On the **hub side**, export custom routes. On the **spoke side**, import custom routes.

```cli
# Hub <-> Spoke A
gcloud compute networks peerings create hub-to-spoke-a \
  --project=${PROJECT_ID} \
  --network=hub-vpc \
  --peer-project=${PROJECT_ID} \
  --peer-network=spoke-a-vpc \
  --export-custom-routes

gcloud compute networks peerings create spoke-a-to-hub \
  --project=${PROJECT_ID} \
  --network=spoke-a-vpc \
  --peer-project=${PROJECT_ID} \
  --peer-network=hub-vpc \
  --import-custom-routes

# Hub <-> Spoke B
gcloud compute networks peerings create hub-to-spoke-b \
  --project=${PROJECT_ID} \
  --network=hub-vpc \
  --peer-project=${PROJECT_ID} \
  --peer-network=spoke-b-vpc \
  --export-custom-routes

gcloud compute networks peerings create spoke-b-to-hub \
  --project=${PROJECT_ID} \
  --network=spoke-b-vpc \
  --peer-project=${PROJECT_ID} \
  --peer-network=hub-vpc \
  --import-custom-routes
```

The hub does not need custom-route import merely to learn the spoke subnet ranges; ordinary subnet routes are exchanged automatically by peering. The hub should consequently have a direct peering subnet route for `10.10.0.0/16` and another for `10.20.0.0/16`.

Verify peering state:

```cli
gcloud compute networks peerings list \
  --project=${PROJECT_ID} \
  --format='table(network.basename(),name,peerNetwork.basename(),state,exportCustomRoutes,importCustomRoutes)'
```

### 7.6.6 Build the trust-side internal passthrough ILB

Assume the VM-Series trust interfaces are members of an instance group named `pan-trust-ig` in `us-central1-a` and the firewall VMs were created with IP forwarding enabled.

Create a health check:

```cli
gcloud compute health-checks create tcp pan-trust-hc \
  --project=${PROJECT_ID} \
  --region=${REGION} \
  --port=80
```

Create the regional internal backend service:

```cli
gcloud compute backend-services create pan-trust-bs \
  --project=${PROJECT_ID} \
  --region=${REGION} \
  --load-balancing-scheme=INTERNAL \
  --protocol=TCP \
  --health-checks=pan-trust-hc \
  --health-checks-region=${REGION}
```

Attach the VM-Series instance group:

```cli
gcloud compute backend-services add-backend pan-trust-bs \
  --project=${PROJECT_ID} \
  --region=${REGION} \
  --instance-group=pan-trust-ig \
  --instance-group-zone=us-central1-a
```

Reserve the trust ILB IP:

```cli
gcloud compute addresses create pan-trust-ilb-ip \
  --project=${PROJECT_ID} \
  --region=${REGION} \
  --subnet=hub-trust-uscentral1 \
  --addresses=10.0.0.10
```

Create the forwarding rule:

```cli
gcloud compute forwarding-rules create pan-trust-ilb-fr \
  --project=${PROJECT_ID} \
  --region=${REGION} \
  --load-balancing-scheme=INTERNAL \
  --network=hub-vpc \
  --subnet=hub-trust-uscentral1 \
  --address=10.0.0.10 \
  --ip-protocol=TCP \
  --ports=all \
  --allow-global-access \
  --backend-service=pan-trust-bs \
  --backend-service-region=${REGION}
```

When an internal passthrough Network Load Balancer is used as a route next hop, Google forwards the original packet to the selected backend. The forwarding rule is being used as a gateway-selection construct, not as an application VIP that terminates the flow.

### 7.6.7 Permit health checks and transit traffic to the firewall backends

The GCP firewall policy/rules protecting the hub trust NIC must allow both health probes and the actual original spoke source addresses that arrive through the next-hop ILB.

Example VPC firewall rules:

```cli
gcloud compute firewall-rules create allow-pan-trust-health-checks \
  --project=${PROJECT_ID} \
  --network=hub-vpc \
  --direction=INGRESS \
  --source-ranges=35.191.0.0/16,130.211.0.0/22 \
  --rules=tcp:80 \
  --target-tags=pan-fw

gcloud compute firewall-rules create allow-pan-east-west-transit \
  --project=${PROJECT_ID} \
  --network=hub-vpc \
  --direction=INGRESS \
  --source-ranges=10.10.0.0/16,10.20.0.0/16 \
  --rules=all \
  --target-tags=pan-fw
```

Ensure the VM-Series backend instances actually have the `pan-fw` network tag.

### 7.6.8 Create the exportable hub inspection route

Create the custom static route in the **hub VPC**. Do **not** attach a network tag because tagged static routes are not exported over peering.

```cli
gcloud compute routes create pan-inspection-default \
  --project=${PROJECT_ID} \
  --network=hub-vpc \
  --destination-range=0.0.0.0/0 \
  --next-hop-ilb=10.0.0.10 \
  --priority=800 \
  --description='Exportable east-west inspection route through VM-Series trust ILB'
```

You can use a narrower aggregate instead of `0.0.0.0/0` if your address plan permits it and the aggregate does not violate subnet/static-route interaction rules. For example, an enterprise RFC1918 aggregate might be preferable if you want this mechanism only for private east-west destinations and a separate spoke Internet-egress design.

**Design caution:** `--export-custom-routes` is not a per-route filter. If the hub also contains BGP-learned hybrid routes or other custom static routes, those can also become eligible for export. Review every custom route the spokes will receive.

### 7.6.9 Verify that the spokes actually import the route

List routes received from the hub into Spoke A:

```cli
gcloud compute networks peerings list-routes spoke-a-to-hub \
  --project=${PROJECT_ID} \
  --network=spoke-a-vpc \
  --region=${REGION} \
  --direction=INCOMING
```

List routes received from the hub into Spoke B:

```cli
gcloud compute networks peerings list-routes spoke-b-to-hub \
  --project=${PROJECT_ID} \
  --network=spoke-b-vpc \
  --region=${REGION} \
  --direction=INCOMING
```

**Success criteria:** each spoke shows the imported custom route for `0.0.0.0/0` whose next hop resolves through the hub peering toward the internal passthrough ILB service.

Also inspect the hub's view of the spoke subnet routes:

```cli
gcloud compute routes list \
  --project=${PROJECT_ID} \
  --filter='network:hub-vpc' \
  --format='table(name,destRange,priority,nextHopPeering,nextHopIlb)'
```

You should see peering routes covering `10.10.0.0/16` and `10.20.0.0/16` in addition to the hub's local routes.

### 7.6.10 PAN-OS routing for a one-arm trust/hub design

A common design uses the same VM-Series trust dataplane interface for packet ingress and egress. PAN-OS therefore needs a route that allows it to return the inspected packet to the GCP hub fabric.

Assume:

```text
VM-Series trust interface: ethernet1/1
Hub subnet gateway:         10.0.0.1
PAN-OS zone:                Trust
```

A simple static default route on the PAN-OS virtual router can hand the packet back to the GCP subnet gateway:

```cli
set network virtual-router default interface ethernet1/1
set network virtual-router default routing-table ip static-route gcp-trust-default destination 0.0.0.0/0
set network virtual-router default routing-table ip static-route gcp-trust-default interface ethernet1/1
set network virtual-router default routing-table ip static-route gcp-trust-default nexthop ip-address 10.0.0.1
```

After PAN-OS emits a packet for `10.20.1.20`, the hub VPC performs its own route lookup. The directly learned peering subnet route for `10.20.0.0/16` is more specific than the hub's inspection default route, so the packet goes to Spoke B rather than returning to the ILB.

That distinction prevents the east-west path from recursively looping through the firewall:

```text
PAN-OS default route -> GCP hub gateway
GCP hub route lookup:
  10.20.1.20 matches 10.20.0.0/16 peering subnet route
  not the broader 0.0.0.0/0 ILB route
```

### 7.6.11 PAN-OS Security policy and no-NAT handling

For east-west traffic, preserve the original private addresses unless your design explicitly requires translation. Palo Alto's documented GCP NSI examples use a no-NAT Trust-to-Trust rule for east-west traffic; the same PAN-OS policy concept is appropriate here.

Example no-NAT rule:

```cli
set rulebase nat rules no-nat-east-west from Trust to Trust
set rulebase nat rules no-nat-east-west source any destination any service any
```

Place the no-NAT rule before broader source-NAT rules that would otherwise match the session.

Use explicit Security policy rather than relying on default intrazone behavior. Example:

```cli
set rulebase security rules allow-spoke-a-to-b from Trust to Trust
set rulebase security rules allow-spoke-a-to-b source 10.10.0.0/16 destination 10.20.0.0/16
set rulebase security rules allow-spoke-a-to-b application any service application-default action allow

set rulebase security rules allow-spoke-b-to-a from Trust to Trust
set rulebase security rules allow-spoke-b-to-a source 10.20.0.0/16 destination 10.10.0.0/16
set rulebase security rules allow-spoke-b-to-a application any service application-default action allow
```

Attach the required Threat Prevention, URL Filtering, WildFire, DNS Security, or other Security Profiles according to your policy. Commit the PAN-OS configuration.

### 7.6.12 Forward packet flow in exact routing stages

Example session:

```text
10.10.1.10:51514 -> 10.20.1.20:443
```

1. `10.10.1.10` sends a packet toward `10.20.1.20`.
2. Spoke A has no local subnet route and no directly peered subnet route for `10.20.0.0/16` because Spoke A is not directly peered with Spoke B.
3. Spoke A therefore uses the imported hub custom route `0.0.0.0/0`.
4. The route's next hop is the hub trust internal passthrough ILB at `10.0.0.10`.
5. The ILB selects a healthy VM-Series trust backend using its connection-tracking/hash behavior.
6. VM-Series receives the original tuple; the destination remains `10.20.1.20`.
7. PAN-OS identifies the Trust zone, creates/looks up session state, evaluates Security policy and security profiles, applies the no-NAT result, and performs a virtual-router lookup.
8. The PAN-OS route points out `ethernet1/1` toward the GCP hub gateway `10.0.0.1`.
9. The packet re-enters `hub-vpc`.
10. The hub VPC route lookup sees the directly learned peering subnet route `10.20.0.0/16 -> hub-to-spoke-b`.
11. Google sends the packet over the hub-to-Spoke-B peering relationship.
12. Spoke B's subnet route delivers the packet to `10.20.1.20`.

No SNAT is required merely to make this work.

### 7.6.13 Return packet flow and state symmetry

Return packet:

```text
10.20.1.20:443 -> 10.10.1.10:51514
```

1. `10.20.1.20` sends the response.
2. Spoke B has no direct subnet route to Spoke A.
3. Spoke B uses its imported hub `0.0.0.0/0` route.
4. The packet reaches the same trust-side internal passthrough ILB service.
5. Google's symmetric hashing for next-hop internal passthrough load-balancer designs helps the reverse five-tuple select the same eligible firewall backend when the eligible backend set is stable.
6. VM-Series finds the existing PAN-OS session and applies reverse state processing.
7. PAN-OS emits the packet toward `10.10.1.10` through `ethernet1/1` and the hub gateway.
8. The hub route lookup matches its direct peering subnet route for `10.10.0.0/16`.
9. The packet crosses `hub-to-spoke-a` and reaches `10.10.1.10`.

If backend eligibility changes mid-session, traffic can move to another firewall that does not own the session unless the Palo Alto HA/session-synchronization design protects against that failure mode.

### 7.6.14 Why the hub default route does not loop east-west traffic

The hub contains both:

```text
0.0.0.0/0       -> trust ILB 10.0.0.10
10.10.0.0/16    -> peering subnet route to Spoke A
10.20.0.0/16    -> peering subnet route to Spoke B
```

For a post-inspection packet destined to `10.20.1.20`, the `/16` peering subnet route is more specific than the `/0` ILB route. The `/16` wins.

This logic applies only to destinations covered by direct hub subnet/peering routes. If the firewall emits Internet-bound traffic back into the same hub with no more-specific route, the `0.0.0.0/0 -> ILB` route can create recursion. Use a separate untrust VPC/interface, a deliberately different Internet-egress design, or an appropriate recursion/bypass mechanism for north-south traffic.

### 7.6.15 Global-access and regional behavior

An internal passthrough Network Load Balancer is regional. A next-hop route using that ILB is usable only from the appropriate region unless **global access** is enabled on the forwarding rule.

For multi-region spokes, verify:

```cli
gcloud compute forwarding-rules describe pan-trust-ilb-fr \
  --project=${PROJECT_ID} \
  --region=${REGION} \
  --format='yaml(name,IPAddress,allowGlobalAccess,backendService,network,subnetwork)'
```

**Success criteria:** `allowGlobalAccess: true` when clients outside `us-central1` must use this firewall next hop.

### 7.6.16 Verification checklist

#### Verify imported and advertised peering routes

**Where:** VPC Network Peering control plane.

```cli
gcloud compute networks peerings list-routes spoke-a-to-hub \
  --project=${PROJECT_ID} \
  --network=spoke-a-vpc \
  --region=${REGION} \
  --direction=INCOMING

gcloud compute networks peerings list-routes hub-to-spoke-a \
  --project=${PROJECT_ID} \
  --network=hub-vpc \
  --region=${REGION} \
  --direction=OUTGOING
```

**Success criteria:** the hub advertises the intended untagged inspection route and Spoke A receives it.

**Failure indicators:** route is missing, route is tagged, custom-route export/import is disabled, or the destination conflicts with subnet-route rules.

#### Verify ILB health

```cli
gcloud compute backend-services get-health pan-trust-bs \
  --project=${PROJECT_ID} \
  --region=${REGION}
```

**Success criteria:** the intended VM-Series backend is `HEALTHY`.

#### Verify PAN-OS route and session state

```cli
show routing route
show session all filter source 10.10.1.10 destination 10.20.1.20
show counter global filter severity drop delta yes
```

**Success criteria:** the session is present on the expected firewall, Trust-to-Trust policy is allowed, no unintended NAT is applied, and the route resolves out the trust interface toward the hub gateway.

#### Verify traffic on both firewall and workloads

Use packet captures on the source workload, VM-Series, and destination workload. The original tuple should remain unchanged for a no-NAT east-west flow:

```text
10.10.1.10:51514 -> 10.20.1.20:443
```

The return should remain:

```text
10.20.1.20:443 -> 10.10.1.10:51514
```

### 7.6.17 Common failure modes

| Symptom | Likely cause | What to check |
|---|---|---|
| Spoke A cannot reach Spoke B at all | Imported inspection route is missing | `list-routes ... --direction=INCOMING`, `importCustomRoutes`, `exportCustomRoutes` |
| Hub exports route but spoke does not install it | Destination conflicts with local/peering subnet route or route is tagged | Static/subnet-route interaction rules and route tags |
| Traffic reaches ILB but never VM-Series | Backend unhealthy or GCP firewall blocks original source | backend health, health-check rule, transit ingress rule |
| VM-Series allows session but destination never receives packet | PAN-OS route/egress interface wrong | `show routing route`, trust gateway, hub route table |
| Forward succeeds, return bypasses firewall | Spoke B did not import the same hub route | reverse peering custom-route configuration |
| Return hits a different firewall | Eligible backend sets/health changed or LB symmetry requirements not met | paired/same ILB backend health, PAN-OS HA/session sync |
| Packet repeatedly returns to firewall after inspection | Post-inspection destination has no more-specific hub route | verify hub peering subnet route and avoid using the same default-ILB route for Internet egress |
| Unexpected on-prem prefixes appear in spokes | Hub is exporting more custom routes than intended | remember custom-route export is not granular; audit hub static/dynamic routes |

### 7.6.18 When to use this peering model versus PBR or NCC

Use this **VPC peering + exported next-hop ILB route** design when:

- spokes are separate VPCs;
- each spoke peers directly to the inspection hub;
- you want a classic VM-Series routed firewall service;
- a broad exportable static route is acceptable;
- peering scale and route-exchange limits fit the design.

Prefer **PBR + next-hop ILB** when the workloads are in the same VPC and you need source/destination/protocol-based service insertion that overrides normal subnet routing.

Consider **Network Connectivity Center (NCC)** when you need a larger transit topology, centralized VPC connectivity, or more explicit network-spoke/hybrid-spoke routing than a peering mesh can provide. Do not treat VPC Network Peering as a generic transit-router service.

'''

