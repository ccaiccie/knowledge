name: temp-update-pan-gcp-nic0-collision
on:
  push:
    paths:
      - '.github/workflows/temp_update_pan_gcp_nic0_collision.yml'
jobs:
  edit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/temp_update_pan_gcp_nic0_collision.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 09-07-26-07-03_Palo_Alto_Networks_Firewalling_in_GCP_Deep_Dive.md
          git rm .github/scripts/temp_update_pan_gcp_nic0_collision.py .github/workflows/temp_update_pan_gcp_nic0_collision.yml
          git commit -m "Clarify VM-Series NIC0 constraint for NSI and Internet ingress"
          git push
