name: Apply professional vWAN NGFW diagrams
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-professional-vwan-ngfw-diagrams.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack validated guide and diagram assets
        shell: bash
        run: |
          echo '[... truncated for brevity in this copy ...]Q==' | base64 -d > /tmp/bundle.tgz
          tar -xzf /tmp/bundle.tgz -C .
          python - <<'PY'
          from pathlib import Path
          r=Path('README.md')
          s=r.read_text()
          old='with redesigned color-coded architecture/control-plane diagrams and independent forward/return SVG + editable draw.io packet-flow pairs for east-west, Internet egress, and Internet-inbound DNAT.'
          new='with professional Azure-style architecture/control-plane diagrams plus topology-specific forward/return SVG + editable draw.io packet-flow pairs for east-west, branch/ExpressRoute, Internet egress, and Internet-inbound DNAT; each view shows meaningful route, gateway, state, and NAT checkpoints instead of a reused box template.'
          if old in s: s=s.replace(old,new)
          r.write_text(s)
          PY
      - name: Validate references and uniqueness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          md=Path('09-05-26-20-00_Azure_Virtual_WAN_Integrated_Third_Party_NGFW_Direct_Hub_Deep_Dive.md').read_text()
          refs=re.findall(r'\((images/09-05-26-20-00_[^)]+(?:svg|drawio))\)',md)
          miss=[x for x in refs if not Path(x).exists()]
          if miss: raise SystemExit('Missing: '+str(miss))
          svgs=[Path(x) for x in refs if x.endswith('.svg') and '_v3' in x]
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in svgs}
          if len(set(hashes.values())) != len(hashes): raise SystemExit('Duplicate SVG bytes detected')
          required={
            'eastwest_forward_v3.svg':['SOURCE SPOKE','DESTINATION SPOKE','Routing Intent','Integrated NGFW'],
            'branch_forward_v3.svg':['ON-PREMISES / BRANCH','VPN / ER Gateway','AZURE SPOKE'],
            'internet_forward_v3.svg':['Secured default route','NAT TRANSFORMATION','PUBLIC INTERNET'],
            'dnat_forward_v3.svg':['Standard Public IP','Azure inbound LB','NAT AT NGFW','SAME-HUB BACKEND SPOKE'],
          }
          for suffix,terms in required.items():
            p=next(Path('images').glob('*'+suffix))
            t=p.read_text()
            if any(term not in t for term in terms): raise SystemExit(f'{p} missing semantic anchors')
          print('Validated',len(refs),'referenced assets and',len(svgs),'unique v3 SVGs')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply-professional-vwan-ngfw-diagrams.yml
      - name: Commit professional diagram redesign
        run: |
          git config user.name "ccaiccie"
          git config user.email "20251042+ccaiccie@users.noreply.github.com"
          git add 09-05-26-20-00_Azure_Virtual_WAN_Integrated_Third_Party_NGFW_Direct_Hub_Deep_Dive.md README.md images .github/workflows/apply-professional-vwan-ngfw-diagrams.yml
          git commit -m "Redesign vWAN NGFW diagrams for professional topology clarity"
          git push