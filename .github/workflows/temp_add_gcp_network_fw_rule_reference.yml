name: temp-add-gcp-network-fw-rule-reference
on:
  push:
    paths:
      - '.github/workflows/temp_add_gcp_network_fw_rule_reference.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/temp_add_gcp_network_fw_rule_reference.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-07-26_GCP_Firewall_Policy_Hierarchy_Goto_Next_NSI_Deep_Dive.md
          git rm .github/scripts/temp_add_gcp_network_fw_rule_reference.py
          git rm .github/workflows/temp_add_gcp_network_fw_rule_reference.yml
          git commit -m 'Add network firewall policy rule parameter reference'
          git push
