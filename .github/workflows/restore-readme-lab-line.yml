name: Restore README lab wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-readme-lab-line.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore text and remove workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = 'Covers Docker/FRR prerequisites, GNS3 API requirements, OSPF metrics, standard route-reflection versus ADD-PATH scenarios, configuration behavior, validation, and automation details.'
          new = 'Covers Docker/FRR prerequisites, GNS3 API requirements, the RR/E1/E2/C1/C2 topology, OSPF metrics, standard route-reflection versus ADD-PATH scenarios, configuration behavior, validation, and automation details.'
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text)
          elif new not in text:
              raise SystemExit('Expected README sentence not found; refusing to modify')
          Path('.github/workflows/restore-readme-lab-line.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/restore-readme-lab-line.yml
          git commit -m "Restore README GNS3 topology description"
          git push
