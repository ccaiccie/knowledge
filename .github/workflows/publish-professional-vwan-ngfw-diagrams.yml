name: Publish professional vWAN NGFW diagrams
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-professional-vwan-ngfw-diagrams.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate distinct SVG diagrams
        run: python tools/vwan_professional_svg.py
      - name: Generate matching editable draw.io diagrams
        run: python tools/vwan_professional_drawio.py
      - name: Publish, patch guide, and validate
        run: python tools/vwan_professional_finalize.py
      - name: Remove temporary generators
        run: |
          rm -rf images/.generated_vwan_tmp
          rm -f tools/vwan_professional_svg.py tools/vwan_professional_drawio.py tools/vwan_professional_finalize.py
          rm -f .github/workflows/publish-professional-vwan-ngfw-diagrams.yml
      - name: Commit professional redesign
        run: |
          git config user.name "ccaiccie"
          git config user.email "20251042+ccaiccie@users.noreply.github.com"
          git add README.md 09-05-26-20-00_Azure_Virtual_WAN_Integrated_Third_Party_NGFW_Direct_Hub_Deep_Dive.md images tools .github/workflows
          git commit -m "Publish professional topology-specific vWAN NGFW diagrams"
          git push