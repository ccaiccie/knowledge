name: Fix vWAN NGFW v5 asset paths
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vwan-ngfw-v5-paths.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix guide image paths and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          guide=Path('09-05-26-20-00_Azure_Virtual_WAN_Integrated_Third_Party_NGFW_Direct_Hub_Deep_Dive.md')
          s=guide.read_text().replace('images/09-05-26-20-00_','images/')
          guide.write_text(s)
          refs=[]
          for line in s.splitlines():
              if '(images/' in line and ('_v5.svg)' in line or '_v5.drawio)' in line):
                  refs.append(line.split('(images/',1)[1].split(')',1)[0])
          assert refs
          for ref in refs:
              assert Path('images',ref).exists(), ref
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-vwan-ngfw-v5-paths.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-05-26-20-00_Azure_Virtual_WAN_Integrated_Third_Party_NGFW_Direct_Hub_Deep_Dive.md .github/workflows/fix-vwan-ngfw-v5-paths.yml
          git commit -m 'Fix vWAN NGFW v5 diagram paths'
          git push
