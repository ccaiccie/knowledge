name: Apply vWAN NGFW redesign

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-vwan-ngfw-redesign.yml

permissions:
  contents: write

jobs:
  apply-redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate redesign
        run: python3 scripts/redesign_vwan_ngfw.py

      - name: Remove temporary automation files
        run: |
          git rm scripts/redesign_vwan_ngfw.py
          git rm .github/workflows/apply-vwan-ngfw-redesign.yml

      - name: Commit updated guide and README
        run: |
          git config user.name "knowledge-diagram-updater"
          git config user.email "actions@users.noreply.github.com"
          git add 09-05-26-20-00_Azure_Virtual_WAN_Integrated_Third_Party_NGFW_Direct_Hub_Deep_Dive.md README.md
          git commit -m "Redesign vWAN NGFW forward and return packet-flow diagrams"
          git push
