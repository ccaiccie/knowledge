name: temp-expand-dx-multiregion-firewall
on:
  push:
    paths:
      - '.github/scripts/temp_expand_dx_multiregion_firewall.py'
      - '.github/workflows/temp_expand_dx_multiregion_firewall.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/temp_expand_dx_multiregion_firewall.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-08-26_AWS_Direct_Connect_Transit_VIF_Deep_Dive.md
          git rm .github/scripts/temp_expand_dx_multiregion_firewall.py .github/workflows/temp_expand_dx_multiregion_firewall.yml
          git commit -m 'Add multi-region DX routing and firewall inspection'
          git push