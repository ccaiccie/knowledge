name: temp-add-azure-summary-toc
on:
  push:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add TOC
        run: python3 .github/scripts/temp_add_azure_summary_toc.py
      - name: Commit update and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-07-26_Azure_Firewall_Insertion_Summary.md
          git rm .github/scripts/temp_add_azure_summary_toc.py
          git rm .github/workflows/temp_add_azure_summary_toc.yml
          git commit -m 'Add TOC to Azure firewall insertion summary'
          git push
