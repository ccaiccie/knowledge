name: Patch GCP goto_next cross-link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-gcp-goto-next-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert cross-link and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('09-07-26-07-03_Palo_Alto_Networks_Firewalling_in_GCP_Deep_Dive.md')
          text = p.read_text()
          needle = "By contrast, `goto_next` means that this policy is **delegating**, not permitting:\n"
          link = "\n**For more details:** [GCP Firewall Policy Hierarchy, `goto_next`, and NSI — Deep Dive](09-07-26_GCP_Firewall_Policy_Hierarchy_Goto_Next_NSI_Deep_Dive.md)\n"
          if link.strip() not in text:
              if needle not in text:
                  raise SystemExit('Target sentence not found; refusing to modify file')
              text = text.replace(needle, needle + link, 1)
              p.write_text(text)
          Path('.github/workflows/patch-gcp-goto-next-link.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 09-07-26-07-03_Palo_Alto_Networks_Firewalling_in_GCP_Deep_Dive.md .github/workflows/patch-gcp-goto-next-link.yml
          git commit -m "Link GCP firewall policy hierarchy deep dive from goto_next section"
          git push
