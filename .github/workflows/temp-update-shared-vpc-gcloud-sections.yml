name: temp-update-shared-vpc-gcloud-sections
on:
  push:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update guide
        env:
          SCRIPT_B64: ""
        run: |
          echo "$SCRIPT_B64" | base64 -d > /tmp/edit.py
          python3 /tmp/edit.py
      - name: Commit change and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-07-26_GCP_Shared_VPC_Centralized_Firewall_Insertion_Method_11_Deep_Dive.md
          git rm .github/workflows/temp-update-shared-vpc-gcloud-sections.yml
          git commit -m 'Add section-aligned gcloud implementation to GCP Shared VPC Method 11'
          git push
