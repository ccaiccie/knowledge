name: temp-run-method11-ilb-protocol-fix
on:
  push:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply edit
        run: python3 .github/scripts/temp_fix_method11_ilb_protocols.py
      - name: Commit and clean helper files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-07-26_GCP_Shared_VPC_Centralized_Firewall_Insertion_Method_11_Deep_Dive.md
          git rm .github/scripts/temp_fix_method11_ilb_protocols.py .github/workflows/temp-run-method11-ilb-protocol-fix.yml
          git commit -m 'Clarify PBR versus static-route ILB protocol behavior in Method 11'
          git push
