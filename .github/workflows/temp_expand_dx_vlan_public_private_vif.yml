name: temp-expand-dx-vlan-public-private-vif
on:
  push:
    paths:
      - '.github/workflows/temp_expand_dx_vlan_public_private_vif.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/temp_expand_dx_vlan_public_private_vif.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-08-26_AWS_Direct_Connect_Transit_VIF_Deep_Dive.md
          git rm .github/scripts/temp_expand_dx_vlan_public_private_vif.py .github/workflows/temp_expand_dx_vlan_public_private_vif.yml
          git commit -m 'Expand Direct Connect VLAN and public/private VIF guidance'
          git push
