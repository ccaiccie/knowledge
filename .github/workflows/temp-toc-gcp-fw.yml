name: temp-toc-gcp-fw
on:
  push:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    env:
      TOC_B64: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert TOC
        run: |
          python3 -c "import os,base64; from pathlib import Path; p=Path('09-06-26-18-58_GCP_Firewall_Inspection_Insertion_Comprehensive_Study_Guide.md'); s=p.read_text(); marker='\n---\n\n# Firewall insertion taxonomy\n'; toc=base64.b64decode(os.environ['TOC_B64']).decode(); assert '## Table of contents\n' not in s; assert marker in s; p.write_text(s.replace(marker,'\n---\n\n'+toc+'\n---\n\n# Firewall insertion taxonomy\n',1))"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-06-26-18-58_GCP_Firewall_Inspection_Insertion_Comprehensive_Study_Guide.md
          git rm .github/workflows/temp-toc-gcp-fw.yml
          git commit -m 'Add TOC to GCP firewall inspection comprehensive guide'
          git push
