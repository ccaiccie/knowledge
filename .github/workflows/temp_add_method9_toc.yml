name: temp-add-method9-toc
on:
  push:
    paths:
      - '.github/workflows/temp_add_method9_toc.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add TOC
        run: python3 .github/temp_add_method9_toc.py
      - name: Commit update and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-06-26-10-24_Azure_Front_Door_Application_Gateway_WAF_Method_9_Deep_Dive.md
          git rm .github/temp_add_method9_toc.py
          git rm .github/workflows/temp_add_method9_toc.yml
          git commit -m 'Add TOC to Azure Front Door and Application Gateway WAF guide'
          git push
