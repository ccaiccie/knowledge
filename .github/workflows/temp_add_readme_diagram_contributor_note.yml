name: temp-add-readme-diagram-contributor-note
on:
  push:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update README contributor guidance
        run: python3 .github/scripts/temp_add_readme_diagram_contributor_note.py
      - name: Commit README update and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git rm .github/scripts/temp_add_readme_diagram_contributor_note.py
          git rm .github/workflows/temp_add_readme_diagram_contributor_note.yml
          git commit -m 'Add draw.io contributor guidance to README'
          git push
