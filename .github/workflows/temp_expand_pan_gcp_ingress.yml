name: temp-expand-pan-gcp-ingress
on:
  push:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand Internet ingress example
        run: python3 .github/scripts/temp_expand_pan_gcp_ingress.py
      - name: Commit guide update and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-07-26-07-03_Palo_Alto_Networks_Firewalling_in_GCP_Deep_Dive.md
          git rm .github/scripts/temp_expand_pan_gcp_ingress.py
          git rm .github/workflows/temp_expand_pan_gcp_ingress.yml
          git commit -m 'Add detailed Internet ingress example to Palo Alto GCP guide'
          git push
