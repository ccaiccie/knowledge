name: temp-add-vpc-route-server-toc
on:
  push:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add TOC
        run: python3 .github/scripts/temp_add_toc_vpc_route_server.py
      - name: Commit update and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-06-26-17-01_AWS_VPC_Route_Server_NVA_Dynamic_Service_Insertion_Deep_Dive.md
          git rm .github/scripts/temp_add_toc_vpc_route_server.py
          git rm .github/workflows/temp_add_toc_vpc_route_server.yml
          git commit -m 'Add TOC to AWS VPC Route Server NVA deep dive'
          git push
