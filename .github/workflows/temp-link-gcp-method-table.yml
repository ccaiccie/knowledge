name: temp-link-gcp-method-table
on:
  push:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Link method rows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('09-06-26-18-58_GCP_Firewall_Inspection_Insertion_Comprehensive_Study_Guide.md')
          s=p.read_text()
          repl={
          '| 1 | Cloud NGFW distributed policy |':'| 1 | [Cloud NGFW distributed policy](09-06-26-19-21_GCP_Cloud_NGFW_Distributed_Policy_Deep_Dive.md) |',
          '| 2 | Cloud NGFW Enterprise firewall endpoints |':'| 2 | [Cloud NGFW Enterprise firewall endpoints](09-07-26-07-05_GCP_Cloud_NGFW_Enterprise_Firewall_Endpoints_Deep_Dive.md) |',
          '| 3 | Network Security Integration (NSI) in-band |':'| 3 | [Network Security Integration (NSI) in-band](09-07-26-07-03_Palo_Alto_Networks_Firewalling_in_GCP_Deep_Dive.md) |',
          '| 4 | Policy-Based Route (PBR) → internal passthrough NLB → NVA |':'| 4 | [Policy-Based Route (PBR) → internal passthrough NLB → NVA](09-05-26-08-12_GCP_Policy_Based_Routing_Study_Guide.md) |',
          '| 5 | Static route → internal passthrough NLB → NVA |':'| 5 | [Static route → internal passthrough NLB → NVA](09-07-26-07-03_Palo_Alto_Networks_Firewalling_in_GCP_Deep_Dive.md) |',
          '| 6 | Direct next-hop VM / multi-NIC firewall |':'| 6 | [Direct next-hop VM / multi-NIC firewall](09-07-26-07-03_Palo_Alto_Networks_Firewalling_in_GCP_Deep_Dive.md) |',
          '| 7 | NCC Router Appliance + BGP |':'| 7 | [NCC Router Appliance + BGP](09-07-26-09-03_GCP_NCC_Router_Appliance_BGP_Firewall_Insertion_Deep_Dive.md) |',
          '| 8 | NCC Gateway + Security Service Edge (SSE) |':'| 8 | [NCC Gateway + Security Service Edge (SSE)](09-06-26-19-15_GCP_Network_Connectivity_Center_Comprehensive_Study_Guide.md) |',
          '| 9 | Load-balancer sandwich / proxy-fronted firewall |':'| 9 | [Load-balancer sandwich / proxy-fronted firewall](09-07-26-07-03_Palo_Alto_Networks_Firewalling_in_GCP_Deep_Dive.md) |',
          '| 10 | Packet Mirroring / NSI out-of-band / Cloud IDS |':'| 10 | [Packet Mirroring / NSI out-of-band / Cloud IDS](09-06-26-18-58_GCP_Firewall_Inspection_Insertion_Comprehensive_Study_Guide.md#10-packet-mirroring--nsi-out-of-band--cloud-ids--not-inline) |'
          }
          for old,new in repl.items():
              if old not in s:
                  raise SystemExit(f'missing expected row: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-06-26-18-58_GCP_Firewall_Inspection_Insertion_Comprehensive_Study_Guide.md
          git rm .github/workflows/temp-link-gcp-method-table.yml
          git commit -m 'Link GCP firewall insertion methods to deep dives'
          git push
