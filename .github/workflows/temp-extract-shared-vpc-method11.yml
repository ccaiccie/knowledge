name: temp-extract-shared-vpc-method11
on:
  push:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update parent guide and README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          guide = Path('09-06-26-18-58_GCP_Firewall_Inspection_Insertion_Comprehensive_Study_Guide.md')
          s = guide.read_text()

          # Replace the old nested Shared VPC TOC block with Method 11.
          toc_start = '- [Shared VPC / shared-services VPC centralized firewall architecture](#shared-vpc--shared-services-vpc-centralized-firewall-architecture)'
          toc_end = '  - [Shared VPC common mistakes](#shared-vpc-common-mistakes)\n'
          if toc_start in s:
              a = s.index(toc_start)
              b = s.index(toc_end, a) + len(toc_end)
              s = s[:a] + '- [11. Shared VPC centralized firewall architecture](#11-shared-vpc-centralized-firewall-architecture)\n' + s[b:]

          # Add Method 11 row after Method 10.
          row10 = '| 10 | [Packet Mirroring / NSI out-of-band / Cloud IDS](09-06-26-18-58_GCP_Firewall_Inspection_Insertion_Comprehensive_Study_Guide.md#10-packet-mirroring--nsi-out-of-band--cloud-ids--not-inline) | Mirroring policy | **No** | Passive detection and analysis |\n'
          row11 = '| 11 | [Shared VPC centralized firewall architecture](09-07-26_GCP_Shared_VPC_Centralized_Firewall_Insertion_Method_11_Deep_Dive.md) | Shared host-project routing/policy domain + selected insertion mechanism | Depends on insertion method | Centralized multi-project inspection and hybrid security |\n'
          if row11 not in s:
              if row10 not in s:
                  raise SystemExit('Method 10 row not found')
              s = s.replace(row10, row10 + row11, 1)

          # Replace old explanatory sentence after the table.
          old_note = '**Shared VPC is not a separate steering primitive.** It is an enterprise network architecture that can host or consume several of the methods above, especially PBR→internal passthrough NLB→NVA, Cloud NGFW Enterprise, NSI in-band, and NCC Router Appliance.'
          new_note = '**Method 11 note:** Shared VPC is an architecture wrapper, not a new packet-forwarding primitive. It centralizes the VPC routing/policy domain; PBR, Cloud NGFW Enterprise, NSI, static next-hop ILB routes, or NCC Router Appliance provide the actual steering/inspection mechanism.'
          s = s.replace(old_note, new_note, 1)

          # Extract the large embedded Shared VPC section and replace it with a concise Method 11 pointer.
          section_start = '# Shared VPC / shared-services VPC centralized firewall architecture\n'
          section_end = '# Method selection by traffic direction\n'
          if section_start not in s or section_end not in s:
              raise SystemExit('Shared VPC section markers not found')
          a = s.index(section_start)
          b = s.index(section_end, a)
          replacement = '''# 11. Shared VPC centralized firewall architecture

Shared VPC deserves its own method because it changes the **enterprise ownership and routing domain** used for centralized inspection across service projects.

However, Shared VPC itself does not redirect packets. The actual insertion mechanism is one of the supported methods already described in this guide, most commonly:

- PBR → internal passthrough NLB → third-party NVA;
- static default/destination route → internal passthrough NLB → NVA where route constraints permit;
- Cloud NGFW Enterprise packet interception;
- NSI in-band third-party packet interception;
- NCC Router Appliance + BGP for dynamic routed appliance insertion.

A service-project VM NIC attached to a shared subnet participates in the **host project's Shared VPC routing domain**, which gives the network/security team centralized control over routes, PBRs, hybrid connectivity, and firewall insertion while application resources remain in separate service projects.

For the complete architecture, east-west and hybrid packet flows, PBR design, SNAT/state symmetry, Router Appliance restrictions, CLI verification, HA behavior, and troubleshooting, see:

**Deep dive:** [GCP Shared VPC Centralized Firewall Insertion — Method 11](09-07-26_GCP_Shared_VPC_Centralized_Firewall_Insertion_Method_11_Deep_Dive.md)

---

'''
          s = s[:a] + replacement + s[b:]
          guide.write_text(s)

          # Add new standalone guide to README GCP index.
          readme = Path('README.md')
          r = readme.read_text()
          entry_title = '### [GCP Shared VPC Centralized Firewall Insertion — Method 11 Deep Dive](09-07-26_GCP_Shared_VPC_Centralized_Firewall_Insertion_Method_11_Deep_Dive.md)'
          if entry_title not in r:
              marker = '### [Google Cloud Firewall Inspection and Service Insertion — Comprehensive Study Guide](09-06-26-18-58_GCP_Firewall_Inspection_Insertion_Comprehensive_Study_Guide.md)\n'
              pos = r.find(marker)
              if pos < 0:
                  raise SystemExit('README marker not found')
              # Insert before the comprehensive guide entry.
              entry = entry_title + '\n' + 'Standalone Method 11 guide for centralized multi-project firewall insertion with Shared VPC. Explains host/service-project ownership, why Shared VPC is a common routing/policy domain rather than a steering primitive, PBR + internal passthrough NLB + NVA east-west inspection, hybrid Interconnect/HA VPN ingress, Internet egress and SNAT symmetry, Cloud NGFW Enterprise and NSI alternatives, NCC Router Appliance host-project requirements, HA/failover, gcloud verification, troubleshooting, and the existing matching SVG/editable draw.io architecture.\n\n'
              r = r[:pos] + entry + r[pos:]
              readme.write_text(r)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-06-26-18-58_GCP_Firewall_Inspection_Insertion_Comprehensive_Study_Guide.md README.md
          git rm .github/workflows/temp-extract-shared-vpc-method11.yml
          git commit -m 'Extract Shared VPC as GCP firewall insertion Method 11'
          git push
