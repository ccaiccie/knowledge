name: Apply vWAN branch flow diagrams

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-vwan-branch-flow-diagrams.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate guide
        run: python3 scripts/add_branch_flow_diagrams.py
      - name: Remove temporary files
        run: |
          git rm scripts/add_branch_flow_diagrams.py
          git rm .github/workflows/apply-vwan-branch-flow-diagrams.yml
      - name: Commit guide changes
        run: |
          git config user.name "knowledge-diagram-updater"
          git config user.email "actions@users.noreply.github.com"
          git add 09-05-26-20-00_Azure_Virtual_WAN_Integrated_Third_Party_NGFW_Direct_Hub_Deep_Dive.md README.md
          git commit -m "Add separate branch forward and return packet-flow diagrams"
          git push
