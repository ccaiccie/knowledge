name: Finalize ARS ExpressRoute VPN update
on:
  push:
    paths:
      - '.github/workflows/append-ars-er-vpn-sections.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh README description
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = "Deep dive into Azure Route Server as the BGP control plane for third-party firewall/SD-WAN NVA service insertion. Covers effective-route and UDR interaction, same-VNet route limitations, dynamically injected default/private routes, spoke-to-spoke East-West inspection, internet egress, ExpressRoute/VPN branch-to-branch exchange, routing preference, active/active ECMP and active/standby AS-path design, stateful symmetry/SNAT, route maps, limits, CLI deployment, verification, failover, and symptom-based troubleshooting, with matching SVG and editable draw.io diagrams."
          new = "Deep dive into Azure Route Server as the BGP control plane for third-party firewall/SD-WAN NVA service insertion. Covers effective-route and UDR interaction, hub/spoke peering requirements, dynamic route injection, same-VNet limitations, East-West and internet inspection, and detailed ExpressRoute and VPN Gateway integration including exact gateway termination points, branch-to-branch route exchange, hybrid route preference, inspection-bypass caveats, active-active VPN requirements, stateful symmetry, verification, and troubleshooting, with matching SVG and editable draw.io diagrams."
          if old in text:
              text = text.replace(old, new)
              p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update README for Route Server ExpressRoute and VPN coverage"
          git push
