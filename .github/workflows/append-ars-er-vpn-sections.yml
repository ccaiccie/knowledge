name: Append ARS ExpressRoute VPN sections
on:
  push:
    paths:
      - '.github/workflows/append-ars-er-vpn-sections.yml'
permissions:
  contents: write
jobs:
  update-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append detailed ExpressRoute and VPN Gateway sections
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('09-05-26-13-55_Azure_Route_Server_Third_Party_NVA_Dynamic_Service_Insertion_Study_Guide.md')
          text = p.read_text()
          if '## 22. ExpressRoute + Route Server + NVA in detail' not in text:
              appendix = Path('.github/ars-er-vpn-appendix.md').read_text().rstrip()
              text = text.replace('**Updated:** 2026-09-05 — expanded with NVA placement, route injection, and detailed hub/spoke peering requirements  ', '**Updated:** 2026-09-05 — expanded with NVA placement, route injection, hub/spoke peering, ExpressRoute, and VPN Gateway integration  ')
              anchor = '- https://learn.microsoft.com/en-us/azure/route-server/expressroute-vpn-support\n'
              extras = ('- https://learn.microsoft.com/en-us/azure/route-server/about-dual-homed-network\n'
                        '- https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-bgp-overview\n'
                        '- https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-highlyavailable\n')
              text = text.replace(anchor, anchor + extras)
              text = text.replace('\n## Sources\n', '\n' + appendix + '\n\n---\n\n## Sources\n', 1)
              p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 09-05-26-13-55_Azure_Route_Server_Third_Party_NVA_Dynamic_Service_Insertion_Study_Guide.md
          git diff --cached --quiet || git commit -m "Expand Azure Route Server ExpressRoute and VPN Gateway integration"
          git push
