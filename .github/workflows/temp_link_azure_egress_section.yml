name: temp-link-azure-egress-section
on:
  push:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Section 11 deep-dive links
        run: python3 .github/temp_link_azure_egress_section.py
      - name: Commit update and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09-07-26_Azure_Firewall_Insertion_Summary.md
          git rm .github/temp_link_azure_egress_section.py
          git rm .github/workflows/temp_link_azure_egress_section.yml
          git commit -m 'Link Azure Internet egress section to deep dives'
          git push
