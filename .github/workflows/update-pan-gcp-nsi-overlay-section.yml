name: Update PAN GCP NSI overlay section

on:
  push:
    paths:
      - '.github/workflows/update-pan-gcp-nsi-overlay-section.yml'

permissions:
  contents: write

jobs:
  update-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch guide
        run: python3 scripts/update_pan_gcp_nsi_overlay_section.py
      - name: Commit changes
        run: |
          git config user.name "openai-automation"
          git config user.email "actions@users.noreply.github.com"
          git add 09-07-26-07-03_Palo_Alto_Networks_Firewalling_in_GCP_Deep_Dive.md
          git commit -m "Expand Palo Alto GCP NSI Overlay direct egress configuration"
          git push
