frr defaults traditional
hostname E2
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.12/32
 ip ospf area 0.0.0.0
!
interface eth0
 description E2-to-RR
 ip address 10.0.0.6/30
 ip ospf area 0.0.0.0
 ip ospf cost 100
 ip ospf network point-to-point
!
interface eth1
 description E2-to-C1
 ip address 10.0.0.17/30
 ip ospf area 0.0.0.0
 ip ospf cost 100
 ip ospf network point-to-point
!
interface eth2
 description E2-to-C2
 ip address 10.0.0.21/30
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.12
 passive-interface default
 no passive-interface eth0
 no passive-interface eth1
 no passive-interface eth2
!
ip route 203.0.113.0/24 Null0
!
router bgp 65000
 bgp router-id 10.255.0.12
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 10.255.0.1 activate
 exit-address-family
!
end
