<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1473e6"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f57c00"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8e44ad"/></marker></defs><rect width="100%" height="100%" fill="#f7f8fa"/><text x="800" y="38" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">NLB → GWLBE → Firewall → IP Targets</text><g font-family="Arial" font-size="13"><rect x="40" y="190" width="180" height="120" rx="14" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/><text x="130" y="225" text-anchor="middle" font-weight="700">Client</text><text x="130" y="250" text-anchor="middle">203.0.113.8:44000</text><rect x="300" y="160" width="260" height="180" rx="14" fill="#fde7f3" stroke="#d13212" stroke-width="2"/><text x="430" y="198" text-anchor="middle" font-weight="700">Network Load Balancer</text><text x="430" y="226" text-anchor="middle">TCP/TLS supported pattern</text><text x="430" y="248" text-anchor="middle">Target type = ip</text><text x="430" y="276" text-anchor="middle">preserve_client_ip = false</text><rect x="650" y="160" width="230" height="180" rx="14" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/><text x="765" y="198" text-anchor="middle" font-weight="700">GWLBE — per AZ</text><text x="765" y="226" text-anchor="middle">Dedicated inspection subnet</text><text x="765" y="248" text-anchor="middle">More-specific route target</text><rect x="970" y="160" width="250" height="180" rx="14" fill="#f3e8fd" stroke="#8e44ad" stroke-width="2"/><text x="1095" y="198" text-anchor="middle" font-weight="700">GWLB + NGFW</text><text x="1095" y="226" text-anchor="middle">GENEVE UDP/6081</text><text x="1095" y="248" text-anchor="middle">Firewall sees NLB node source IP</text><rect x="1310" y="160" width="240" height="180" rx="14" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/><text x="1430" y="198" text-anchor="middle" font-weight="700">Backend IP Targets</text><text x="1430" y="226" text-anchor="middle">10.1.20.21:443</text><text x="1430" y="248" text-anchor="middle">10.1.20.22:443</text><text x="1430" y="276" text-anchor="middle">Return route → GWLBE</text><rect x="300" y="520" width="1250" height="220" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/><text x="925" y="560" text-anchor="middle" font-size="17" font-weight="700">Critical constraints</text><text x="330" y="598">• NLB instance-target traffic does not follow the route-table steering required for post-NLB GWLBE insertion.</text><text x="330" y="630">• NLB client-IP preservation is not supported when a GWLBE inspects NLB-to-target traffic.</text><text x="330" y="662">• UDP/TCP_UDP/QUIC/TCP_QUIC preserve client IP and cannot disable it; do not assume this TCP/TLS pattern applies.</text><text x="330" y="694">• Proxy Protocol v2 can carry client metadata to a compatible target, but it does not restore the client IP as the routed L3 source seen by the firewall.</text></g><g stroke="#1473e6" stroke-width="4" fill="none" marker-end="url(#b)"><path d="M220 250H300"/><path d="M560 250H650"/></g><path d="M880 225H970" stroke="#8e44ad" stroke-width="4" fill="none" marker-end="url(#p)"/><path d="M1220 250H1310" stroke="#1473e6" stroke-width="4" fill="none" marker-end="url(#b)"/><path d="M1430 340V430H765V340" stroke="#f57c00" stroke-width="4" fill="none" marker-end="url(#o)"/><path d="M650 300H610V430H430V340" stroke="#f57c00" stroke-width="4" fill="none" marker-end="url(#o)"/><path d="M300 300H270V430H130V310" stroke="#f57c00" stroke-width="4" fill="none" marker-end="url(#o)"/><text x="50" y="820" font-family="Arial" font-size="14" font-weight="700">Blue = request • Purple = GWLBE/GWLB service hop • Orange = inspected return</text></svg>