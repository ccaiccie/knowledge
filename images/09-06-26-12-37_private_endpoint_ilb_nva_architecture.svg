<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#333"/></marker></defs><text x="40" y="42" font-family="Arial" font-size="26" font-weight="bold">Private Endpoint Inspection — Standard ILB + HA Ports + NVA Cluster</text><rect x="45" y="155" width="250" height="125" rx="12" fill="#dae8fc" stroke="#333" stroke-width="2"/><text x="170" y="195" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Workload Spoke</text><text x="170" y="222" text-anchor="middle" font-family="Arial" font-size="14">Client 10.10.1.4</text><text x="170" y="246" text-anchor="middle" font-family="Arial" font-size="13">UDR: 10.20.0.0/16</text><text x="170" y="266" text-anchor="middle" font-family="Arial" font-size="13">→ VirtualAppliance 10.0.2.10</text><rect x="390" y="120" width="680" height="420" rx="14" fill="#f5f5f5" stroke="#666" stroke-width="2"/><text x="730" y="152" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Hub VNet 10.0.0.0/16</text><rect x="455" y="195" width="250" height="105" rx="12" fill="#fff2cc" stroke="#333" stroke-width="2"/><text x="580" y="230" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">Standard Internal Load Balancer</text><text x="580" y="255" text-anchor="middle" font-family="Arial" font-size="14">Frontend 10.0.2.10</text><text x="580" y="278" text-anchor="middle" font-family="Arial" font-size="13">HA Ports: protocol All, port 0</text><rect x="805" y="190" width="200" height="115" rx="12" fill="#f8cecc" stroke="#333" stroke-width="2"/><text x="905" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">NVA-1</text><text x="905" y="249" text-anchor="middle" font-family="Arial" font-size="14">10.0.3.4</text><text x="905" y="273" text-anchor="middle" font-family="Arial" font-size="13">Inspect + SNAT</text><rect x="805" y="365" width="200" height="115" rx="12" fill="#f8cecc" stroke="#333" stroke-width="2"/><text x="905" y="400" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">NVA-2</text><text x="905" y="424" text-anchor="middle" font-family="Arial" font-size="14">10.0.3.5</text><text x="905" y="448" text-anchor="middle" font-family="Arial" font-size="13">Inspect + SNAT</text><rect x="1170" y="160" width="280" height="155" rx="12" fill="#d5e8d4" stroke="#333" stroke-width="2"/><text x="1310" y="200" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Private Endpoint VNet</text><text x="1310" y="226" text-anchor="middle" font-family="Arial" font-size="14">10.20.0.0/16</text><text x="1310" y="251" text-anchor="middle" font-family="Arial" font-size="14">PE 10.20.1.4</text><text x="1310" y="277" text-anchor="middle" font-family="Arial" font-size="13">PE network policies: Enabled</text><rect x="1170" y="430" width="280" height="110" rx="12" fill="#d5e8d4" stroke="#333" stroke-width="2"/><text x="1310" y="470" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Azure PaaS</text><text x="1310" y="497" text-anchor="middle" font-family="Arial" font-size="14">Private Link service</text><line x1="295" y1="215" x2="455" y2="245" stroke="#333" stroke-width="3" marker-end="url(#a)"/><text x="360" y="202" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">1. UDR to ILB VIP</text><line x1="705" y1="245" x2="805" y2="245" stroke="#333" stroke-width="3" marker-end="url(#a)"/><text x="755" y="228" text-anchor="middle" font-family="Arial" font-size="12">2. 5-tuple selects NVA</text><line x1="1005" y1="247" x2="1170" y2="237" stroke="#333" stroke-width="3" marker-end="url(#a)"/><text x="1088" y="220" text-anchor="middle" font-family="Arial" font-size="12">3. inspect + SNAT</text><line x1="1310" y1="315" x2="1310" y2="430" stroke="#333" stroke-width="3" marker-end="url(#a)"/><text x="1324" y="376" font-family="Arial" font-size="12">4. Private Link</text><polyline points="1170,270 1090,270 1090,315 905,315" fill="none" stroke="#333" stroke-width="3" marker-end="url(#a)"/><text x="1055" y="338" text-anchor="middle" font-family="Arial" font-size="12">5. reply to SNAT owner</text><polyline points="805,315 700,315 700,335 295,335 295,260" fill="none" stroke="#333" stroke-width="3" marker-end="url(#a)"/><text x="570" y="358" text-anchor="middle" font-family="Arial" font-size="12">6. reverse SNAT → client</text><line x1="705" y1="265" x2="805" y2="405" stroke="#777" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="735" y="365" font-family="Arial" font-size="12">other flows may hash to NVA-2</text><text x="70" y="650" font-family="Arial" font-size="15" font-weight="bold">Key design rule:</text><text x="70" y="677" font-family="Arial" font-size="14">SNAT at the selected NVA makes the PE-side reply destination the same NVA/session owner, avoiding direct-return bypass.</text><text x="70" y="710" font-family="Arial" font-size="14">Vendor support for HA Ports, floating IP / DSR behavior, health probes, and failover state synchronization must be validated.</text></svg>