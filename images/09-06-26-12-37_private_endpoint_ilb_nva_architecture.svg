<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1380" viewBox="0 0 2200 1380">
<defs>
 <marker id="fwd" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0,12 4,0 8" fill="#0969da"/></marker>
 <marker id="ret" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0,12 4,0 8" fill="#1a7f37"/></marker>
 <marker id="ctrl" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0,12 4,0 8" fill="#8250df"/></marker>
 <marker id="fail" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0,12 4,0 8" fill="#cf222e"/></marker>
 <style>
 .title{font:700 31px Arial,Helvetica,sans-serif;fill:#24292f}.sub{font:17px Arial,Helvetica,sans-serif;fill:#57606a}.zone{font:700 22px Arial,Helvetica,sans-serif;fill:#24292f}.h{font:700 18px Arial,Helvetica,sans-serif;fill:#24292f}.t{font:16px Arial,Helvetica,sans-serif;fill:#24292f}.s{font:14px Arial,Helvetica,sans-serif;fill:#57606a}.step{font:700 15px Arial,Helvetica,sans-serif;fill:#24292f}.mono{font:14px Consolas,monospace;fill:#24292f}
 </style>
</defs>
<rect width="2200" height="1380" fill="#fff"/>
<text x="55" y="52" class="title">Azure Private Endpoint Inspection — Standard ILB + HA Ports + Third-Party NVA Cluster</text>
<text x="55" y="84" class="sub">Detailed service-insertion topology showing source UDR, ILB flow distribution, health probing, NVA state/SNAT ownership, Private Endpoint policy, forward/return symmetry, and failover behavior.</text>

<!-- CONTROL/DNS BAND -->
<rect x="45" y="115" width="2110" height="175" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="70" y="151" class="zone">DNS / Control Plane</text>
<rect x="100" y="178" width="290" height="78" rx="12" fill="#dbeafe" stroke="#0969da" stroke-width="2"/>
<text x="245" y="208" text-anchor="middle" class="h">Client DNS query</text><text x="245" y="235" text-anchor="middle" class="s">sql1.database.windows.net</text>
<rect x="755" y="168" width="450" height="96" rx="12" fill="#f3e8ff" stroke="#8250df" stroke-width="2"/>
<text x="980" y="198" text-anchor="middle" class="h">Private DNS zone / resolver path</text><text x="980" y="225" text-anchor="middle" class="s">privatelink.database.windows.net</text><text x="980" y="248" text-anchor="middle" class="s">A record → PE 10.20.1.4</text>
<line x1="390" y1="207" x2="755" y2="207" stroke="#8250df" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ctrl)"/><text x="570" y="194" text-anchor="middle" class="step">D1. Query</text>
<line x1="755" y1="242" x2="390" y2="242" stroke="#8250df" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ctrl)"/><text x="570" y="267" text-anchor="middle" class="step">D2. Answer = 10.20.1.4</text>
<rect x="1420" y="168" width="640" height="96" rx="12" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
<text x="1740" y="198" text-anchor="middle" class="h">Critical routing condition</text><text x="1740" y="226" text-anchor="middle" class="s">PE network policies must be enabled for UDR/NSG enforcement.</text><text x="1740" y="249" text-anchor="middle" class="s">A generic 0.0.0.0/0 route alone does not beat the more-specific PE route.</text>

<!-- MAJOR ZONES -->
<rect x="45" y="330" width="390" height="830" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2.5"/>
<text x="70" y="370" class="zone">Workload Spoke VNet</text><text x="70" y="399" class="s">10.10.0.0/16</text>
<rect x="485" y="330" width="985" height="830" rx="20" fill="#fff8c5" stroke="#bf8700" stroke-width="2.5"/>
<text x="510" y="370" class="zone">Hub VNet — NVA Service Insertion</text><text x="510" y="399" class="s">10.0.0.0/16</text>
<rect x="1520" y="330" width="390" height="830" rx="20" fill="#dafbe1" stroke="#1a7f37" stroke-width="2.5"/>
<text x="1545" y="370" class="zone">Private Endpoint VNet</text><text x="1545" y="399" class="s">10.20.0.0/16</text>
<rect x="1960" y="440" width="195" height="600" rx="20" fill="#ddf4ff" stroke="#0969da" stroke-width="2.5"/>
<text x="2057" y="480" text-anchor="middle" class="h">Azure PaaS</text><text x="2057" y="507" text-anchor="middle" class="s">Azure SQL</text><text x="2057" y="531" text-anchor="middle" class="s">Private Link</text>

<!-- WORKLOAD -->
<rect x="95" y="475" width="290" height="125" rx="14" fill="#dbeafe" stroke="#0969da" stroke-width="2.5"/>
<text x="240" y="515" text-anchor="middle" class="h">Client VM</text><text x="240" y="547" text-anchor="middle" class="t">10.10.1.4</text><text x="240" y="575" text-anchor="middle" class="s">snet-app 10.10.1.0/24</text>
<rect x="80" y="690" width="320" height="175" rx="14" fill="#fff3cd" stroke="#bf8700" stroke-width="2"/>
<text x="240" y="727" text-anchor="middle" class="h">Route Table: rt-app</text><text x="240" y="759" text-anchor="middle" class="mono">10.20.0.0/16</text><text x="240" y="785" text-anchor="middle" class="s">Next hop: VirtualAppliance</text><text x="240" y="812" text-anchor="middle" class="t" font-weight="700">10.0.2.10 (ILB frontend)</text><text x="240" y="839" text-anchor="middle" class="s">Attached to client subnet</text>
<rect x="80" y="925" width="320" height="120" rx="14" fill="#fff" stroke="#8c959f" stroke-width="2"/>
<text x="240" y="961" text-anchor="middle" class="h">Effective Route Check</text><text x="240" y="992" text-anchor="middle" class="s">PE prefix → VirtualAppliance</text><text x="240" y="1018" text-anchor="middle" class="s">next hop 10.0.2.10</text>

<!-- HUB ILB -->
<rect x="535" y="455" width="350" height="240" rx="16" fill="#fff" stroke="#bf8700" stroke-width="2"/>
<text x="560" y="490" class="h">Standard Internal Load Balancer</text>
<rect x="575" y="525" width="270" height="95" rx="12" fill="#fff3cd" stroke="#bf8700" stroke-width="2.5"/>
<text x="710" y="557" text-anchor="middle" class="h">Frontend VIP 10.0.2.10</text><text x="710" y="585" text-anchor="middle" class="s">UDR next-hop target</text><text x="710" y="607" text-anchor="middle" class="s">Standard SKU / internal frontend</text>
<text x="710" y="653" text-anchor="middle" class="t">HA Ports rule</text><text x="710" y="677" text-anchor="middle" class="s">Protocol All • Frontend 0 • Backend 0</text>

<!-- NVA BACKEND AREA -->
<rect x="935" y="440" width="480" height="610" rx="16" fill="#fff" stroke="#cf222e" stroke-width="2"/>
<text x="960" y="478" class="h">NVA Backend Pool / Inspection Tier</text><text x="960" y="503" class="s">NIC IP forwarding enabled • vendor-supported HA/DSR behavior required</text>
<rect x="985" y="545" width="350" height="150" rx="14" fill="#ffebe9" stroke="#cf222e" stroke-width="2.5"/>
<text x="1160" y="583" text-anchor="middle" class="h">NVA-1 — Active flow owner</text><text x="1160" y="613" text-anchor="middle" class="t">10.0.3.4</text><text x="1160" y="641" text-anchor="middle" class="s">Policy + inspection + session state</text><text x="1160" y="665" text-anchor="middle" class="s">SNAT PE-facing flow to NVA-owned address</text>
<rect x="985" y="760" width="350" height="150" rx="14" fill="#ffebe9" stroke="#cf222e" stroke-width="2.5"/>
<text x="1160" y="798" text-anchor="middle" class="h">NVA-2 — Healthy peer</text><text x="1160" y="828" text-anchor="middle" class="t">10.0.3.5</text><text x="1160" y="856" text-anchor="middle" class="s">Receives other/new flows from ILB</text><text x="1160" y="880" text-anchor="middle" class="s">Existing-flow recovery depends on vendor state sync</text>
<rect x="985" y="950" width="350" height="70" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="1160" y="978" text-anchor="middle" class="h">Backend health probe</text><text x="1160" y="1003" text-anchor="middle" class="s">Only healthy NVAs receive new ILB flows</text>

<!-- ILB to NVA distribution lines -->
<line x1="845" y1="570" x2="985" y2="610" stroke="#0969da" stroke-width="4" marker-end="url(#fwd)"/><text x="905" y="562" text-anchor="middle" class="step">2. Flow hashes to NVA-1</text>
<line x1="845" y1="602" x2="985" y2="825" stroke="#8c959f" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#fwd)"/><text x="905" y="760" text-anchor="middle" class="s">Other/new flows may hash to NVA-2</text>
<line x1="935" y1="985" x2="845" y2="660" stroke="#8250df" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ctrl)"/><text x="895" y="900" text-anchor="middle" class="s">Health state informs ILB</text>

<!-- PE SIDE -->
<rect x="1570" y="455" width="290" height="350" rx="16" fill="#fff" stroke="#1a7f37" stroke-width="2"/>
<text x="1595" y="490" class="h">PE Subnet</text><text x="1595" y="516" class="s">10.20.1.0/24</text>
<rect x="1605" y="555" width="220" height="130" rx="14" fill="#dcffe4" stroke="#1a7f37" stroke-width="2.5"/>
<text x="1715" y="592" text-anchor="middle" class="h">Private Endpoint NIC</text><text x="1715" y="623" text-anchor="middle" class="t">10.20.1.4</text><text x="1715" y="651" text-anchor="middle" class="s">Azure-managed PE NIC</text>
<rect x="1570" y="855" width="290" height="150" rx="14" fill="#fff" stroke="#8c959f" stroke-width="2"/>
<text x="1715" y="891" text-anchor="middle" class="h">PE Network Policies</text><text x="1715" y="922" text-anchor="middle" class="t" font-weight="700">ENABLED</text><text x="1715" y="951" text-anchor="middle" class="s">Allows UDR / NSG enforcement</text><text x="1715" y="977" text-anchor="middle" class="s">for Private Endpoint traffic</text>

<!-- PAAS INNER -->
<rect x="1985" y="580" width="145" height="180" rx="14" fill="#fff" stroke="#0969da" stroke-width="2"/>
<text x="2057" y="617" text-anchor="middle" class="h">SQL service</text><text x="2057" y="648" text-anchor="middle" class="s">Private Link</text><text x="2057" y="673" text-anchor="middle" class="s">terminates on</text><text x="2057" y="698" text-anchor="middle" class="s">PaaS service</text><text x="2057" y="728" text-anchor="middle" class="s">No public path</text>

<!-- PEERING LABELS -->
<text x="460" y="430" text-anchor="middle" class="s">VNet peering</text><text x="460" y="451" text-anchor="middle" class="s">allow forwarded traffic</text>
<text x="1495" y="430" text-anchor="middle" class="s">VNet peering</text><text x="1495" y="451" text-anchor="middle" class="s">hub ↔ PE VNet</text>

<!-- FORWARD FLOW -->
<line x1="385" y1="535" x2="575" y2="555" stroke="#0969da" stroke-width="4" marker-end="url(#fwd)"/>
<text x="478" y="514" text-anchor="middle" class="step">1. Client UDR sends PE flow to ILB VIP</text>
<text x="478" y="537" text-anchor="middle" class="s">10.10.1.4:53000 → 10.20.1.4:1433</text>
<line x1="1335" y1="610" x2="1605" y2="610" stroke="#0969da" stroke-width="4" marker-end="url(#fwd)"/>
<text x="1470" y="575" text-anchor="middle" class="step">3. NVA inspects + SNATs</text><text x="1470" y="598" text-anchor="middle" class="s">PE-facing source becomes NVA-owned address</text>
<line x1="1825" y1="620" x2="1985" y2="620" stroke="#0969da" stroke-width="4" marker-end="url(#fwd)"/>
<text x="1905" y="592" text-anchor="middle" class="step">4. Private Link</text>

<!-- RETURN FLOW -->
<line x1="1985" y1="715" x2="1825" y2="715" stroke="#1a7f37" stroke-width="4" marker-end="url(#ret)"/>
<text x="1905" y="747" text-anchor="middle" class="step">5. Service reply returns through PE</text>
<polyline points="1605,710 1480,710 1480,735 1335,735" fill="none" stroke="#1a7f37" stroke-width="4" marker-end="url(#ret)"/>
<text x="1470" y="772" text-anchor="middle" class="step">6. Reply goes directly to SNAT/session owner NVA-1</text>
<polyline points="985,710 900,710 900,1080 435,1080 435,575 385,575" fill="none" stroke="#1a7f37" stroke-width="4" marker-end="url(#ret)"/>
<text x="675" y="1108" text-anchor="middle" class="step">7. NVA-1 reverse-SNATs and routes reply to client</text>

<!-- STATE/NAT NOTE -->
<rect x="535" y="900" width="360" height="145" rx="14" fill="#fff" stroke="#8c959f" stroke-width="2"/>
<text x="715" y="935" text-anchor="middle" class="h">Example state / NAT ownership</text><text x="715" y="968" text-anchor="middle" class="mono">Original: 10.10.1.4:53000 → 10.20.1.4:1433</text><text x="715" y="997" text-anchor="middle" class="mono">PE leg: NVA-SNAT:* → 10.20.1.4:1433</text><text x="715" y="1023" text-anchor="middle" class="s">Return targets the same stateful NVA</text>

<!-- FAILOVER BAND -->
<rect x="45" y="1195" width="2110" height="125" rx="16" fill="#fff5f5" stroke="#cf222e" stroke-width="2"/>
<text x="70" y="1231" class="zone">Failure / HA behavior</text>
<text x="70" y="1264" class="t">If NVA-1 fails its probe, the Standard ILB stops assigning new flows to NVA-1 and sends new flows to healthy NVA-2. Existing NVA-1 sessions are not magically moved by Azure Load Balancer.</text>
<text x="70" y="1294" class="t">Existing-session survival requires vendor-supported state/NAT synchronization or a vendor cluster mechanism. SNAT design must match the vendor HA model; do not assume per-node SNAT and state ownership survive node failure.</text>

<!-- LEGEND -->
<rect x="45" y="1335" width="2110" height="35" rx="8" fill="#fff" stroke="#d0d7de"/><text x="65" y="1358" class="s">Blue = forward path   Green = return path   Purple dashed = control/health   Gray dashed = alternate flow distribution   Key point: ILB distributes the forward flow; SNAT anchors the PE return flow to the stateful NVA owner.</text>
</svg>