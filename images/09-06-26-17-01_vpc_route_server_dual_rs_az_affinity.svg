<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100"><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1473e6"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1b8f4b"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#c62828"/></marker></defs><rect width="1800" height="1100" fill="#ffffff"/><text x="45" y="48" font-family="Arial" font-size="28" font-weight="700" fill="#17233c">Dual VPC Route Servers — AZ-affinity inspection</text><text x="45" y="76" font-family="Arial" font-size="14" fill="#555">Topology follows AWS Figure 5: each AZ prefers its local firewall; the remote firewall is a BGP backup only.</text><rect x="180" y="100" width="1500" height="860" rx="16" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="2"/><text x="205" y="132" font-family="Arial" font-size="19" font-weight="700" fill="#17233c">Inspection VPC 10.47.0.0/16</text><rect x="220" y="165" width="1400" height="330" rx="14" fill="#eef4fb" stroke="#6c8ebf" stroke-width="2"/><text x="245" y="197" font-family="Arial" font-size="18" font-weight="700" fill="#234d75">Availability Zone A — steady state stays local</text><rect x="220" y="545" width="1400" height="330" rx="14" fill="#eef7ee" stroke="#82b366" stroke-width="2"/><text x="245" y="577" font-family="Arial" font-size="18" font-weight="700" fill="#1f5f35">Availability Zone B — steady state stays local</text><g font-family="Arial" fill="#17233c"><rect x="280" y="265" width="300" height="145" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="430" y="295" text-anchor="middle" font-size="17" font-weight="700">AZ-a TGW attachment subnet RT</text><text x="430" y="323" text-anchor="middle" font-size="14">10.0.0.0/8 or 0.0.0.0/0</text><text x="430" y="348" text-anchor="middle" font-size="14">Propagation from Route Server A</text><text x="430" y="373" text-anchor="middle" font-size="14">Normal next hop → FW1 ENI</text><text x="430" y="398" text-anchor="middle" font-size="14">10.47.3.42</text><rect x="670" y="220" width="300" height="135" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="820" y="250" text-anchor="middle" font-size="17" font-weight="700">VPC Route Server A</text><text x="820" y="278" text-anchor="middle" font-size="14">Own RIB / FIB</text><text x="820" y="303" text-anchor="middle" font-size="14">FW1: AS_PATH 65550 — preferred</text><text x="820" y="328" text-anchor="middle" font-size="14">FW2: 65550 65550 — backup</text><rect x="690" y="380" width="260" height="80" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="820" y="410" text-anchor="middle" font-size="16" font-weight="700">Route Server Endpoint A</text><text x="820" y="435" text-anchor="middle" font-size="14">BGP / BFD termination</text><rect x="1060" y="250" width="290" height="165" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="1205" y="280" text-anchor="middle" font-size="17" font-weight="700">FW1 — AZ-a</text><text x="1205" y="308" text-anchor="middle" font-size="14">ENI 10.47.3.42 • ASN 65550</text><text x="1205" y="336" text-anchor="middle" font-size="14">to RS-A: 65550</text><text x="1205" y="361" text-anchor="middle" font-size="14">to RS-B: 65550 65550</text><text x="1205" y="389" text-anchor="middle" font-size="14">Normal dataplane for AZ-a</text><rect x="1400" y="270" width="175" height="120" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1487" y="300" text-anchor="middle" font-size="16" font-weight="700">STEADY STATE</text><text x="1487" y="329" text-anchor="middle" font-size="14">AZ-a → FW1</text><text x="1487" y="354" text-anchor="middle" font-size="14">No cross-AZ hop</text><rect x="280" y="645" width="300" height="145" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="430" y="675" text-anchor="middle" font-size="17" font-weight="700">AZ-b TGW attachment subnet RT</text><text x="430" y="703" text-anchor="middle" font-size="14">10.0.0.0/8 or 0.0.0.0/0</text><text x="430" y="728" text-anchor="middle" font-size="14">Propagation from Route Server B</text><text x="430" y="753" text-anchor="middle" font-size="14">Normal next hop → FW2 ENI</text><text x="430" y="778" text-anchor="middle" font-size="14">10.47.4.229</text><rect x="670" y="600" width="300" height="135" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="820" y="630" text-anchor="middle" font-size="17" font-weight="700">VPC Route Server B</text><text x="820" y="658" text-anchor="middle" font-size="14">Own RIB / FIB</text><text x="820" y="683" text-anchor="middle" font-size="14">FW2: AS_PATH 65550 — preferred</text><text x="820" y="708" text-anchor="middle" font-size="14">FW1: 65550 65550 — backup</text><rect x="690" y="760" width="260" height="80" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="820" y="790" text-anchor="middle" font-size="16" font-weight="700">Route Server Endpoint B</text><text x="820" y="815" text-anchor="middle" font-size="14">BGP / BFD termination</text><rect x="1060" y="630" width="290" height="165" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="1205" y="660" text-anchor="middle" font-size="17" font-weight="700">FW2 — AZ-b</text><text x="1205" y="688" text-anchor="middle" font-size="14">ENI 10.47.4.229 • ASN 65550</text><text x="1205" y="716" text-anchor="middle" font-size="14">to RS-B: 65550</text><text x="1205" y="741" text-anchor="middle" font-size="14">to RS-A: 65550 65550</text><text x="1205" y="769" text-anchor="middle" font-size="14">Normal dataplane for AZ-b</text><rect x="1400" y="650" width="175" height="120" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1487" y="680" text-anchor="middle" font-size="16" font-weight="700">STEADY STATE</text><text x="1487" y="709" text-anchor="middle" font-size="14">AZ-b → FW2</text><text x="1487" y="734" text-anchor="middle" font-size="14">No cross-AZ hop</text></g><g fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M580 337 H1060" stroke="#1473e6" stroke-width="4" marker-end="url(#blue)"/><path d="M580 717 H1060" stroke="#1473e6" stroke-width="4" marker-end="url(#blue)"/><path d="M670 287 H620 V315 H580" stroke="#1b8f4b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#green)"/><path d="M670 667 H620 V695 H580" stroke="#1b8f4b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#green)"/><path d="M820 380 V355" stroke="#1b8f4b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#green)"/><path d="M820 760 V735" stroke="#1b8f4b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#green)"/><path d="M1060 315 H1000 V420 H950" stroke="#1b8f4b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#green)"/><path d="M1060 695 H1000 V800 H950" stroke="#1b8f4b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#green)"/><path d="M1350 355 H1640 V800 H950" stroke="#c62828" stroke-width="3" stroke-dasharray="12 9" marker-end="url(#red)"/><path d="M1350 690 H1660 V420 H950" stroke="#c62828" stroke-width="3" stroke-dasharray="12 9" marker-end="url(#red)"/></g><g font-family="Arial" font-size="13" font-weight="700"><text x="615" y="323" fill="#1473e6">Normal AZ-a dataplane: TGW subnet RT → FW1</text><text x="615" y="703" fill="#1473e6">Normal AZ-b dataplane: TGW subnet RT → FW2</text><text x="985" y="405" fill="#1b8f4b">preferred BGP/BFD</text><text x="985" y="785" fill="#1b8f4b">preferred BGP/BFD</text><text x="1390" y="515" fill="#c62828">FW1 backup advertisement to RS-B</text><text x="1390" y="570" fill="#c62828">FW2 backup advertisement to RS-A</text></g><rect x="480" y="920" width="840" height="115" rx="12" fill="#fff7f7" stroke="#b85450" stroke-width="2"/><text x="900" y="950" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#8d2d2d">FAILURE BEHAVIOR</text><text x="900" y="978" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">FW1 failure → Route Server A selects FW2 backup path; only AZ-a traffic crosses to AZ-b.</text><text x="900" y="1003" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">FW2 failure → Route Server B selects FW1 backup path; only AZ-b traffic crosses to AZ-a.</text><text x="45" y="1070" font-family="Arial" font-size="13" fill="#555">Blue = steady-state forwarding • Green dashed = local BGP/BFD + FIB propagation • Red dashed = cross-AZ backup advertisement. Reference: AWS Networking &amp; Content Delivery blog, Figure 5, July 24 2026.</text></svg>