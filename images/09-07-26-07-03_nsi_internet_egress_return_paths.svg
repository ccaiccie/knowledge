<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1150" viewBox="0 0 1900 1150"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1a73e8"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#188038"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d93025"/></marker></defs><rect width="1900" height="1150" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="950" y="55" text-anchor="middle" font-size="28" font-weight="700">NSI Internet egress — complete forward and return paths</text><rect x="50" y="90" width="1800" height="470" rx="18" fill="#f4f8ff" stroke="#1a73e8" stroke-width="2"/><text x="80" y="125" font-size="20" font-weight="700">A. Standard in-band reinjection — consumer keeps its own Internet/NAT path</text><rect x="90" y="210" width="180" height="85" rx="10" fill="#fff" stroke="#5f6368" stroke-width="2"/><text x="180" y="245" text-anchor="middle" font-size="15"><tspan x="180">Consumer VM</tspan><tspan x="180" dy="22">10.10.1.10</tspan></text><rect x="330" y="190" width="230" height="125" rx="10" fill="#d2e3fc" stroke="#1a73e8" stroke-width="2"/><text x="445" y="232" text-anchor="middle" font-size="15"><tspan x="445">Consumer firewall rule</tspan><tspan x="445" dy="22">APPLY_SECURITY_PROFILE_GROUP</tspan><tspan x="445" dy="22">EGRESS then INGRESS</tspan></text><rect x="630" y="180" width="245" height="145" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="752" y="220" text-anchor="middle" font-size="15"><tspan x="752">NSI producer service</tspan><tspan x="752" dy="22">GENEVE UDP/6081</tspan><tspan x="752" dy="22">ILB → VM-Series</tspan><tspan x="752" dy="22">inspect + reinject</tspan></text><rect x="950" y="205" width="210" height="95" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="1055" y="240" text-anchor="middle" font-size="15"><tspan x="1055">Consumer VPC routing</tspan><tspan x="1055" dy="22">default route</tspan></text><rect x="1230" y="190" width="210" height="125" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="1335" y="230" text-anchor="middle" font-size="15"><tspan x="1335">Cloud NAT or</tspan><tspan x="1335" dy="22">VM external IP</tspan><tspan x="1335" dy="22">SNAT if Cloud NAT</tspan></text><rect x="1510" y="205" width="220" height="95" rx="10" fill="#fff" stroke="#5f6368" stroke-width="2"/><text x="1620" y="240" text-anchor="middle" font-size="15"><tspan x="1620">Internet server</tspan><tspan x="1620" dy="22">198.51.100.25:443</tspan></text><path d="M270 245 H330" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M560 245 H630" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M875 245 H950" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M1160 245 H1230" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M1440 245 H1510" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><text x="285" y="225" font-size="12" fill="#1a73e8">1</text><text x="582" y="225" font-size="12" fill="#1a73e8">2 GENEVE</text><text x="887" y="225" font-size="12" fill="#1a73e8">3 reinject</text><text x="1175" y="225" font-size="12" fill="#1a73e8">4</text><text x="1460" y="225" font-size="12" fill="#1a73e8">5</text><path d="M1620 330 V420 H1335" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M1335 420 H1055" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M1055 420 H445 V345" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M445 345 V385 H752 V345" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M752 345 V470 H180 V315" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><text x="1465" y="405" font-size="12" fill="#d93025">6 Internet response; reverse NAT if used</text><text x="810" y="405" font-size="12" fill="#d93025">7 consumer ingress policy intercepts response</text><text x="560" y="375" font-size="12" fill="#d93025">8 GENEVE to VM-Series</text><text x="410" y="460" font-size="12" fill="#d93025">9 inspect → GENEVE reinject → VM</text><rect x="50" y="610" width="1800" height="470" rx="18" fill="#fff8f1" stroke="#f29900" stroke-width="2"/><text x="80" y="645" font-size="20" font-weight="700">B. Direct Internet egress — VM-Series becomes the Internet egress/return inspection point</text><rect x="90" y="755" width="180" height="85" rx="10" fill="#fff" stroke="#5f6368" stroke-width="2"/><text x="180" y="790" text-anchor="middle" font-size="15"><tspan x="180">Consumer VM</tspan><tspan x="180" dy="22">10.10.1.10</tspan></text><rect x="340" y="735" width="230" height="125" rx="10" fill="#d2e3fc" stroke="#1a73e8" stroke-width="2"/><text x="455" y="777" text-anchor="middle" font-size="15"><tspan x="455">Consumer firewall rule</tspan><tspan x="455" dy="22">selects egress flow</tspan><tspan x="455" dy="22">for NSI</tspan></text><rect x="650" y="715" width="300" height="165" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="800" y="755" text-anchor="middle" font-size="15"><tspan x="800">Producer VM-Series</tspan><tspan x="800" dy="22">trust: GENEVE decap</tspan><tspan x="800" dy="22">PAN-OS inspection / routing / NAT</tspan><tspan x="800" dy="22">untrust: direct Internet</tspan></text><rect x="1060" y="750" width="220" height="95" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="1170" y="785" text-anchor="middle" font-size="15"><tspan x="1170">Producer Internet path</tspan><tspan x="1170" dy="22">external IP / NAT as designed</tspan></text><rect x="1410" y="755" width="220" height="85" rx="10" fill="#fff" stroke="#5f6368" stroke-width="2"/><text x="1520" y="790" text-anchor="middle" font-size="15"><tspan x="1520">Internet server</tspan><tspan x="1520" dy="22">198.51.100.25:443</tspan></text><path d="M270 795 H340" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M570 795 H650" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M950 795 H1060" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M1280 795 H1410" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><text x="286" y="775" font-size="12" fill="#1a73e8">1</text><text x="590" y="775" font-size="12" fill="#1a73e8">2 GENEVE</text><text x="980" y="775" font-size="12" fill="#1a73e8">3 direct egress</text><text x="1320" y="775" font-size="12" fill="#1a73e8">4</text><path d="M1520 875 V970 H800 V900" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><text x="1120" y="955" font-size="12" fill="#d93025">5 response arrives at VM-Series untrust; PAN-OS reverses NAT/state and inspects</text><path d="M800 900 V1020 H180 V860" stroke="#188038" stroke-width="3" fill="none" marker-end="url(#g)"/><text x="430" y="1005" font-size="12" fill="#188038">6 VM-Series GENEVE-encapsulates response, flips direction metadata, direct reinjection to consumer VM</text></g></svg>