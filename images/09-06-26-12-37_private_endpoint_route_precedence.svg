<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#444"/></marker></defs><text x="30" y="38" font-family="Arial" font-size="24" font-weight="bold">Why a Default Route Does Not Automatically Inspect a Private Endpoint</text><g font-family="Arial" font-size="14" text-anchor="middle"><rect x="70" y="230" width="180" height="90" rx="12" fill="#dae8fc" stroke="#444"/><text x="160" y="265">Source subnet</text><text x="160" y="288">10.10.1.0/24</text><rect x="390" y="80" width="250" height="100" rx="12" fill="#f8cecc" stroke="#444"/><text x="515" y="115">Private Endpoint route</text><text x="515" y="138">10.20.1.4/32</text><text x="515" y="161">InterfaceEndpoint/direct</text><rect x="390" y="230" width="250" height="90" rx="12" fill="#fff2cc" stroke="#444"/><text x="515" y="265">UDR 0.0.0.0/0</text><text x="515" y="288">VirtualAppliance 10.0.1.4</text><rect x="390" y="370" width="250" height="110" rx="12" fill="#d5e8d4" stroke="#444"/><text x="515" y="407">UDR 10.20.0.0/16</text><text x="515" y="430">VirtualAppliance 10.0.1.4</text><text x="515" y="453">PE network policies enabled</text><rect x="820" y="180" width="230" height="110" rx="12" fill="#d5e8d4" stroke="#444"/><text x="935" y="225">Private Endpoint</text><text x="935" y="248">10.20.1.4</text><rect x="820" y="390" width="230" height="110" rx="12" fill="#f8cecc" stroke="#444"/><text x="935" y="435">Azure Firewall</text><text x="935" y="458">10.0.1.4</text></g><g fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"><polyline points="250,275 320,275 320,130 390,130"/><polyline points="250,275 390,275"/><polyline points="250,275 320,275 320,425 390,425"/><polyline points="640,130 730,130 730,235 820,235"/><polyline points="640,425 820,445"/><polyline points="935,390 935,290"/></g><g font-family="Arial" font-size="12" font-weight="bold"><text x="275" y="120">/32 is most specific if policies do not permit override</text><text x="290" y="260">0/0 is too broad</text><text x="265" y="455">specific PE-space UDR is the inspection path</text><text x="715" y="455">to firewall</text><text x="950" y="340">firewall forwards after policy/SNAT</text></g></svg>