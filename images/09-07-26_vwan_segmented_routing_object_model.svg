<text x="54" y="178" font-family="Arial" font-size="15">ER gateway connection</text>
<text x="54" y="200" font-family="Arial" font-size="15">Associated: defaultRouteTable</text>
<text x="54" y="222" font-family="Arial" font-size="15">Propagates: Default + RT_BLUE + RT_RED</text>
<rect x="560" y="100" width="300" height="190" rx="14" ry="14" fill="#f7f9fc" stroke="#333" stroke-width="2"/>
