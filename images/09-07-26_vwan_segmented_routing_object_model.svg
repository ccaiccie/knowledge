<text x="574" y="158" font-family="Arial" font-size="15">Managed vHub routing plane</text>
<text x="574" y="180" font-family="Arial" font-size="15">defaultRouteTable</text>
<text x="574" y="202" font-family="Arial" font-size="15">RT_BLUE</text>
<text x="574" y="224" font-family="Arial" font-size="15">RT_RED</text>
<text x="574" y="246" font-family="Arial" font-size="15">noneRouteTable</text>
