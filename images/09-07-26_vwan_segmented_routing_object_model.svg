<text x="1064" y="200" font-family="Arial" font-size="15">Red -&gt; RT_RED</text>
<text x="1064" y="222" font-family="Arial" font-size="15">Shared -&gt; Default or custom</text>
<rect x="520" y="410" width="380" height="150" rx="14" ry="14" fill="#f7f9fc" stroke="#333" stroke-width="2"/>
<text x="710.0" y="440" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Key Rule</text>
<text x="534" y="468" font-family="Arial" font-size="15">Association = where incoming traffic LOOKS</text>
<text x="534" y="490" font-family="Arial" font-size="15">Propagation = where connection routes GO</text>
<text x="534" y="512" font-family="Arial" font-size="15">Branches stay on default association</text>
