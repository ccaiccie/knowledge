<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><style>.t{font:700 30px Segoe UI,Arial;fill:#0f172a}.s{font:400 16px Segoe UI,Arial;fill:#475569}.bt{font:700 18px Segoe UI,Arial;fill:#0f172a}.bs{font:400 14px Segoe UI,Arial;fill:#334155}.al{font:600 13px Segoe UI,Arial;fill:#1d4ed8}</style></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="48" class="t">Pattern 2 — NVA in a Different Peered VNet</text><text x="40" y="78" class="s">Supported in documented multi-hub designs, but control-plane reachability and data-plane reachability must both be engineered.</text><rect x="60" y="160" width="360" height="260" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="85" y="195" class="bt">VNet A — Route Server VNet</text><text x="85" y="225" class="bs">RouteServerSubnet</text><text x="85" y="250" class="bs">Azure Route Server</text><text x="85" y="275" class="bs">ASN 65515</text><text x="85" y="300" class="bs">Two managed BGP IPs</text><rect x="520" y="160" width="360" height="260" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="545" y="195" class="bt">VNet B — NVA VNet</text><text x="545" y="225" class="bs">NVA 10.50.2.4</text><text x="545" y="250" class="bs">ASN 65001</text><text x="545" y="275" class="bs">Peers to both ARS IPs</text><text x="545" y="300" class="bs">BGP TCP/179 reachable over peering</text><rect x="1000" y="160" width="340" height="260" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="1025" y="195" class="bt">Workload VNet / Spoke</text><text x="1025" y="225" class="bs">Consumes remote Route Server routes</text><text x="1025" y="250" class="bs">Must also have a valid path to NVA</text><text x="1025" y="275" class="bs">Peering is not automatically transitive</text><text x="1025" y="300" class="bs">Route propagation ≠ packet transit</text><path d="M 420 290 L 520 290" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/><text x="470" y="272" text-anchor="middle" class="al">Peering + BGP</text><path d="M 880 290 L 1000 290" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="940" y="272" text-anchor="middle" class="al">Valid data path required</text><rect x="210" y="520" width="980" height="130" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="235" y="555" class="bt">Critical rule</text><text x="235" y="585" class="bs">The NVA may establish BGP successfully across peering while workload packets still fail if the workload VNet has no valid path to the NVA next-hop IP.</text><text x="235" y="610" class="bs">Always validate both: (1) ARS ⇄ NVA BGP reachability and (2) workload ⇄ NVA forwarding reachability.</text></svg>