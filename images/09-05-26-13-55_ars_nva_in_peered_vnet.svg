<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><style>.t{font:700 30px Segoe UI,Arial;fill:#0f172a}.s{font:400 16px Segoe UI,Arial;fill:#475569}.bt{font:700 18px Segoe UI,Arial;fill:#0f172a}.bs{font:400 14px Segoe UI,Arial;fill:#334155}.al{font:600 13px Segoe UI,Arial;fill:#1d4ed8}.n{font:400 13px Segoe UI,Arial;fill:#7c2d12}</style></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="48" class="t">Supported Concept: Route Server and NVA in Different Peered VNets</text><text x="40" y="78" class="s">Microsoft documents a dual-homed topology where Route Server and NVAs are separated by VNet peering.</text><rect x="60" y="150" width="380" height="240" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="76" y="178" class="bt">VNet A — Route Server VNet</text><text x="76" y="205" class="bs">RouteServerSubnet</text><text x="76" y="225" class="bs">ARS peer IP 1 + peer IP 2</text><text x="76" y="245" class="bs">ASN 65515</text><text x="76" y="265" class="bs">VNet peering to NVA hub</text><rect x="560" y="150" width="380" height="240" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="576" y="178" class="bt">VNet B — NVA Hub</text><text x="576" y="205" class="bs">Third-party NVA</text><text x="576" y="225" class="bs">Private IP reachable across peering</text><text x="576" y="245" class="bs">BGP to both ARS peer IPs</text><text x="576" y="265" class="bs">ASN different from 65515</text><rect x="1060" y="150" width="380" height="240" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="1076" y="178" class="bt">Workload VNet / spoke</text><text x="1076" y="205" class="bs">Must have a valid route-distribution relationship</text><text x="1076" y="225" class="bs">Must also have a real data path to NVA</text><text x="1076" y="245" class="bs">Peering is not automatically transitive</text><text x="1076" y="265" class="bs">Effective route alone does not create transit</text><rect x="310" y="520" width="880" height="160" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="326" y="548" class="bt">Two independent questions</text><text x="326" y="575" class="bs">CONTROL PLANE: Can NVA TCP/179 reach both Route Server BGP IPs and exchange routes?</text><text x="326" y="595" class="bs">DATA PLANE: Can a workload packet actually reach the NVA next-hop IP and then the destination?</text><text x="326" y="615" class="bs">Both must be true. Route Server does not forward packets and VNet peering is not transitive by default.</text><path d="M 440 270 L 560 270" stroke="#2563eb" stroke-width="4" fill="none" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="500" y="262" text-anchor="middle" class="al">VNet peering + BGP</text><path d="M 940 270 L 1060 270" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="1000" y="262" text-anchor="middle" class="al">Explicit connectivity required</text><rect x="40" y="790" width="1420" height="80" rx="12" fill="#fff7ed" stroke="#f59e0b"/><text x="58" y="820" class="n">The NVA placement requirement is supported BGP/IP reachability—not simply “same VNet.”</text><text x="58" y="842" class="n">However, a route advertisement does not create a missing data-plane transit path between non-transitively peered VNets.</text></svg>