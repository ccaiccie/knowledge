<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker><style>.b{fill:#fff;stroke:#333;stroke-width:2}.g{fill:#fafafa;stroke:#777;stroke-width:2;stroke-dasharray:8 6}.t{font:19px Arial}.s{font:15px Arial}.f{stroke:#333;stroke-width:3;fill:none;marker-end:url(#a)}.r{stroke:#777;stroke-width:3;fill:none;marker-end:url(#a);stroke-dasharray:8 5}</style></defs>
<text x="35" y="45" class="t">Internet egress — UDR forces inspection; Azure Firewall provides stateful policy and SNAT</text>
<rect x="35" y="135" width="280" height="130" rx="12" class="b"/><text x="76" y="175" class="t">Spoke VM 10.10.1.10</text><text x="68" y="207" class="s">Flow: 10.10.1.10:51514 → 203.0.113.80:443</text><text x="68" y="235" class="s">Route: 0.0.0.0/0 → 10.0.1.4</text>
<rect x="410" y="135" width="300" height="130" rx="12" class="b"/><text x="495" y="175" class="t">Azure Firewall</text><text x="470" y="207" class="s">Network/Application policy</text><text x="478" y="235" class="s">state + SNAT decision</text>
<rect x="835" y="135" width="280" height="130" rx="12" class="b"/><text x="898" y="175" class="t">Firewall Public IP</text><text x="885" y="207" class="s">Example: 198.51.100.10</text><text x="875" y="235" class="s">SNAT source becomes public IP</text>
<rect x="1220" y="135" width="240" height="130" rx="12" class="b"/><text x="1303" y="175" class="t">Internet</text><text x="1250" y="207" class="s">203.0.113.80:443</text>
<path d="M315 200 H410" class="f"/><text x="333" y="183" class="s">1 inspect</text><path d="M710 200 H835" class="f"/><text x="734" y="183" class="s">2 SNAT</text><path d="M1115 200 H1220" class="f"/><text x="1140" y="183" class="s">3 send</text>
<path d="M1220 245 H1115" class="r"/><path d="M835 245 H710" class="r"/><path d="M410 245 H315" class="r"/><text x="500" y="300" class="s">Return traffic matches firewall state; reverse SNAT restores 10.10.1.10.</text>
<text x="35" y="405" class="t">Optional NAT Gateway integration on AzureFirewallSubnet</text>
<rect x="410" y="470" width="300" height="130" rx="12" class="b"/><text x="495" y="510" class="t">Azure Firewall</text><text x="457" y="542" class="s">still performs inspection/policy</text><text x="456" y="570" class="s">outbound flow exits firewall subnet</text>
<rect x="835" y="470" width="280" height="130" rx="12" class="b"/><text x="902" y="510" class="t">NAT Gateway</text><text x="865" y="542" class="s">associated to AzureFirewallSubnet</text><text x="864" y="570" class="s">provides scalable public SNAT</text>
<rect x="1220" y="470" width="240" height="130" rx="12" class="b"/><text x="1303" y="510" class="t">Internet</text><text x="1252" y="542" class="s">sees NAT Gateway PIP</text>
<path d="M710 535 H835" class="f"/><text x="734" y="518" class="s">egress</text><path d="M1115 535 H1220" class="f"/><text x="1140" y="518" class="s">SNAT</text>
<rect x="80" y="680" width="1320" height="90" rx="12" class="g"/><text x="105" y="715" class="t">Design boundary</text><text x="105" y="746" class="s">NAT Gateway changes outbound public-source translation and SNAT scale; it does not replace Azure Firewall policy, routing, or inspection.</text></svg>