<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><defs><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#0078D4"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#16A085"/></marker><style>.title{font:700 27px Arial;fill:#16233A}.h{font:700 18px Arial;fill:#16233A}.s{font:15px Arial;fill:#294158}.lane1{fill:#EEF7FF;stroke:#A8D5F5;stroke-width:2}.lane2{fill:#F5F0FF;stroke:#C8B6FF;stroke-width:2}.vm{fill:#E8F7F0;stroke:#16A085;stroke-width:2.5}.fw{fill:#FFF1E8;stroke:#F26B38;stroke-width:2.5}.pip{fill:#E9F4FF;stroke:#1784D5;stroke-width:2.5}.nat{fill:#F1EBFF;stroke:#7B61FF;stroke-width:2.5}.net{fill:#F1F3F5;stroke:#56606B;stroke-width:2.5}.f{fill:none;stroke:#0078D4;stroke-width:4;marker-end:url(#b)}.r{fill:none;stroke:#16A085;stroke-width:4;marker-end:url(#g)}.lbl{font:700 14px Arial;fill:#24364B}</style></defs><rect width="1600" height="860" fill="#fff"/><text x="55" y="55" class="title">Internet egress — Azure Firewall SNAT and optional NAT Gateway</text><rect x="50" y="100" width="1500" height="300" rx="24" class="lane1"/><text x="75" y="135" class="h">PATH A — Azure Firewall public IP performs outbound SNAT</text><rect x="85" y="190" width="270" height="120" rx="15" class="vm"/><text x="135" y="226" class="h">Spoke VM</text><text x="125" y="255" class="s">10.10.1.10:51514</text><text x="110" y="284" class="s">0.0.0.0/0 → 10.0.1.4</text><rect x="455" y="190" width="270" height="120" rx="15" class="fw"/><text x="518" y="226" class="h">Azure Firewall</text><text x="495" y="255" class="s">policy + session state</text><text x="500" y="284" class="s">SNAT decision</text><rect x="825" y="190" width="270" height="120" rx="15" class="pip"/><text x="887" y="226" class="h">Firewall Public IP</text><text x="865" y="255" class="s">198.51.100.10</text><text x="852" y="284" class="s">source translated here</text><rect x="1195" y="190" width="270" height="120" rx="15" class="net"/><text x="1297" y="226" class="h">Internet</text><text x="1255" y="255" class="s">203.0.113.80:443</text><path d="M355 230 H455" class="f"/><text x="378" y="214" class="lbl">1 inspect</text><path d="M725 230 H825" class="f"/><text x="748" y="214" class="lbl">2 SNAT</text><path d="M1095 230 H1195" class="f"/><text x="1118" y="214" class="lbl">3 send</text><path d="M1195 285 H1095" class="r"/><path d="M825 285 H725" class="r"/><path d="M455 285 H355" class="r"/><text x="575" y="350" class="s">Return lane: existing firewall state reverses SNAT and restores destination 10.10.1.10.</text><rect x="50" y="445" width="1500" height="300" rx="24" class="lane2"/><text x="75" y="480" class="h">PATH B — NAT Gateway is associated to AzureFirewallSubnet</text><rect x="275" y="545" width="280" height="120" rx="15" class="fw"/><text x="343" y="581" class="h">Azure Firewall</text><text x="315" y="610" class="s">still inspects + enforces policy</text><text x="317" y="639" class="s">flow exits firewall subnet</text><rect x="680" y="545" width="280" height="120" rx="15" class="nat"/><text x="763" y="581" class="h">NAT Gateway</text><text x="710" y="610" class="s">on AzureFirewallSubnet</text><text x="712" y="639" class="s">scalable public SNAT</text><rect x="1085" y="545" width="280" height="120" rx="15" class="net"/><text x="1187" y="581" class="h">Internet</text><text x="1120" y="610" class="s">sees NAT Gateway public IP</text><path d="M555 605 H680" class="f"/><text x="590" y="588" class="lbl">egress</text><path d="M960 605 H1085" class="f"/><text x="995" y="588" class="lbl">SNAT</text><rect x="85" y="785" width="1430" height="45" rx="12" fill="#FFF7DB" stroke="#D6A500" stroke-width="2"/><text x="110" y="814" class="s">NAT Gateway changes public-source translation and SNAT scale; Azure Firewall remains the inspection and policy engine.</text></svg>