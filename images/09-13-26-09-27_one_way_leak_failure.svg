<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#111827">Example 3: Why a One-Way Leak Often Fails</text>
  <text x="600" y="66" text-anchor="middle" font-family="Arial" font-size="16" fill="#4b5563">Forward reachability alone is insufficient; the return destination must also be routable in the return-side VRF.</text>
  
  <g>
    <rect x="60" y="205" width="250" height="155" rx="18" ry="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="185" y="237" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">VRF 103 Host</text>
    <text x="185" y="267" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f2937">10.10.10.10</text><text x="185" y="291" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f2937">Has route to 10.50.50.53</text><text x="185" y="315" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f2937">Sends request</text>
  </g>
  <g>
    <rect x="445" y="145" width="310" height="275" rx="18" ry="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="600" y="177" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Router — Misconfigured</text>
    <text x="600" y="207" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f2937">Global 10.50.50.0/24 leaked → VRF 103</text><text x="600" y="231" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f2937">BUT 10.10.10.0/24 not leaked → global</text><text x="600" y="255" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f2937">Forward lookup succeeds</text><text x="600" y="279" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f2937">Return lookup fails</text>
  </g>
  <g>
    <rect x="900" y="205" width="250" height="155" rx="18" ry="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="1025" y="237" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Global Service</text>
    <text x="1025" y="267" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f2937">10.50.50.53</text><text x="1025" y="291" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f2937">Receives request</text><text x="1025" y="315" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f2937">Sends reply to 10.10.10.10</text>
  </g>
  
  <path d="M310 245 C360 245 395 215 445 215" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow0)"/>
  <defs><marker id="arrow0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#16a34a"/></marker></defs>
  <text x="380" y="195" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">1  Forward route exists</text>
  <path d="M755 215 C810 215 845 245 900 245" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow1)"/>
  <defs><marker id="arrow1" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#16a34a"/></marker></defs>
  <text x="825" y="195" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">2  Request reaches server</text>
  <path d="M900 325 C840 325 810 365 755 365" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow2)"/>
  <defs><marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#dc2626"/></marker></defs>
  <text x="825" y="390" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">3  Reply returns to router</text>
  <path d="M445 365 C395 365 360 325 310 325" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow3)"/>
  <defs><marker id="arrow3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#dc2626"/></marker></defs>
  <text x="375" y="395" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">4  DROP / no route to 10.10.10.0/24 in Global RIB</text>
</svg>