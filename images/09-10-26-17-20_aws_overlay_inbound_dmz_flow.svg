<rect width="1700" height="950" fill="white"/><text x="850" y="45" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold">Internet → DMZ Inbound Inspection Through GWLBE/GWLB/VM-Series</text>
<text x="850" y="78" text-anchor="middle" font-family="Arial" font-size="16">Blue = forward path | Orange = return path</text>
