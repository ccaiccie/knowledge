<rect x="1085" y="135" width="270" height="180" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="1220" y="180" text-anchor="middle" font-size="20" font-weight="bold">VM-Series</text><text x="1220" y="212" text-anchor="middle" font-size="15">vpce-dmz-a → e1/1.10</text><text x="1220" y="240" text-anchor="middle" font-size="15" font-weight="bold">Ingress Zone = DMZ</text><text x="1220" y="270" text-anchor="middle" font-size="14">Inspect inner flow / policy</text>
