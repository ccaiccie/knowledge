<rect x="190" y="400" width="1320" height="390" rx="16" fill="#FAFAFA" stroke="#455A64" stroke-width="2"/>
<text x="850" y="440" text-anchor="middle" font-size="21" font-weight="bold">Route Tables and Policy Context</text>
<text x="230" y="490" font-size="17" font-weight="bold">IGW gateway route table</text><text x="230" y="525" font-size="15">10.10.10.0/24 → vpce-dmz-a</text><text x="230" y="555" font-size="15">10.10.0.0/16 → local</text>
<text x="660" y="490" font-size="17" font-weight="bold">Endpoint identity</text><text x="660" y="525" font-size="15">vpce-dmz-a → ethernet1/1.10</text><text x="660" y="555" font-size="15">ethernet1/1.10 → DMZ zone</text>
<text x="1050" y="490" font-size="17" font-weight="bold">PAN-OS policy</text><text x="1050" y="525" font-size="15">From: DMZ / To: application path</text><text x="1050" y="555" font-size="15">App-ID / Threat Prevention / logging</text>
<text x="230" y="635" font-size="17" font-weight="bold">Important</text><text x="230" y="670" font-size="15">The initial interception is caused by the AWS route to GWLBE.</text><text x="230" y="700" font-size="15">Overlay routing is not TGW Connect and does not replace GWLBE.</text>
<text x="850" y="855" text-anchor="middle" font-size="17" font-weight="bold">For this inbound flow the packet may remain on the same GWLB service chain; endpoint mapping still preserves DMZ zone identity.</text>
