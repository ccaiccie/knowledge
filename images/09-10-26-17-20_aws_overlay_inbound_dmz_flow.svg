<rect x="555" y="180" width="210" height="90" rx="12" fill="#FFE0B2" stroke="#EF6C00" stroke-width="2"/><text x="660" y="220" text-anchor="middle" font-size="18" font-weight="bold">GWLBE-DMZ-A</text><text x="660" y="248" text-anchor="middle" font-size="14">vpce-dmz-a</text>
