<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:12;ry:12}.title{font:700 24px Arial,sans-serif;fill:#111}.h{font:700 18px Arial,sans-serif;fill:#111}.t{font:15px Arial,sans-serif;fill:#222}.s{font:13px Arial,sans-serif;fill:#444}.line{stroke:#333;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#666;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}.lane{fill:#f7f7f7;stroke:#aaa;stroke-width:1.5;rx:16;ry:16}
    </style>
  </defs>
  <text x="750" y="42" text-anchor="middle" class="title">Cloud NGFW Enterprise TLS Inspection — Certificate and Trust Flow</text>
  <rect x="40" y="80" width="1420" height="185" class="lane"/>
  <text x="60" y="108" class="h">Provisioning / control plane</text>
  <rect x="70" y="135" width="260" height="90" class="box"/><text x="200" y="165" text-anchor="middle" class="h">CA Pool (regional)</text><text x="200" y="190" text-anchor="middle" class="t">Root CA or subordinate CA</text><text x="200" y="212" text-anchor="middle" class="s">No issuance-policy/name constraints</text>
  <rect x="420" y="135" width="300" height="90" class="box"/><text x="570" y="165" text-anchor="middle" class="h">Network Security service agent</text><text x="570" y="190" text-anchor="middle" class="t">roles/privateca.certificateRequester</text><text x="570" y="212" text-anchor="middle" class="s">Requests short-lived intermediate CA</text>
  <rect x="810" y="135" width="280" height="90" class="box"/><text x="950" y="165" text-anchor="middle" class="h">TLS inspection policy</text><text x="950" y="190" text-anchor="middle" class="t">CA pool + TLS version/ciphers</text><text x="950" y="212" text-anchor="middle" class="s">Optional upstream trust config</text>
  <rect x="1180" y="135" width="240" height="90" class="box"/><text x="1300" y="165" text-anchor="middle" class="h">Endpoint association</text><text x="1300" y="190" text-anchor="middle" class="t">VPC + zone</text><text x="1300" y="212" text-anchor="middle" class="s">References TLS policy</text>
  <path d="M330 180 H420" class="line"/><text x="375" y="165" text-anchor="middle" class="s">signs CA</text>
  <path d="M720 180 H810" class="line"/><text x="765" y="165" text-anchor="middle" class="s">uses</text>
  <path d="M1090 180 H1180" class="line"/><text x="1135" y="165" text-anchor="middle" class="s">attach</text>
  <rect x="40" y="300" width="1420" height="540" class="lane"/>
  <text x="60" y="330" class="h">Runtime TLS interception — two TLS sessions</text>
  <rect x="80" y="410" width="250" height="115" class="box"/><text x="205" y="445" text-anchor="middle" class="h">Client workload</text><text x="205" y="473" text-anchor="middle" class="t">10.10.1.10</text><text x="205" y="498" text-anchor="middle" class="s">Trust store contains enterprise root</text>
  <rect x="535" y="385" width="390" height="170" class="box"/><text x="730" y="420" text-anchor="middle" class="h">Cloud NGFW firewall endpoint</text><text x="730" y="448" text-anchor="middle" class="t">1. Receives ClientHello / SNI</text><text x="730" y="473" text-anchor="middle" class="t">2. Mints leaf cert for requested server name</text><text x="730" y="498" text-anchor="middle" class="t">3. Terminates client-side TLS</text><text x="730" y="523" text-anchor="middle" class="t">4. Inspects plaintext, then opens upstream TLS</text>
  <rect x="1180" y="410" width="250" height="115" class="box"/><text x="1305" y="445" text-anchor="middle" class="h">Destination server</text><text x="1305" y="473" text-anchor="middle" class="t">www.example.com:443</text><text x="1305" y="498" text-anchor="middle" class="s">Presents real public/private cert</text>
  <rect x="535" y="625" width="390" height="120" class="box"/><text x="730" y="658" text-anchor="middle" class="h">Short-lived intermediate CA</text><text x="730" y="686" text-anchor="middle" class="t">Generated by Cloud NGFW</text><text x="730" y="711" text-anchor="middle" class="s">Signed by CA pool; refreshed periodically</text>
  <rect x="1030" y="625" width="330" height="120" class="box"/><text x="1195" y="658" text-anchor="middle" class="h">Optional upstream trust config</text><text x="1195" y="686" text-anchor="middle" class="t">Public CAs and/or private trust anchors</text><text x="1195" y="711" text-anchor="middle" class="s">Controls which server cert chains are trusted</text>
  <path d="M330 455 H535" class="line"/><text x="432" y="438" text-anchor="middle" class="t">A. Client TLS session</text><text x="432" y="478" text-anchor="middle" class="s">Leaf cert signed by NGFW intermediate</text>
  <path d="M925 455 H1180" class="line"/><text x="1052" y="438" text-anchor="middle" class="t">B. Upstream TLS session</text><text x="1052" y="478" text-anchor="middle" class="s">NGFW validates real server certificate</text>
  <path d="M730 625 V555" class="line"/><text x="745" y="594" class="s">signs dynamic leaf cert</text>
  <path d="M1195 625 V555 H925" class="dash"/><text x="1080" y="596" text-anchor="middle" class="s">trust decision for upstream server</text>
  <path d="M80 585 H1430" stroke="#999" stroke-width="1.5"/>
  <text x="80" y="790" class="h">Certificate chain seen by the client</text>
  <text x="80" y="818" class="t">Dynamic leaf: CN/SAN = requested destination → Cloud NGFW short-lived intermediate CA → your trusted root/subordinate chain</text>
</svg>