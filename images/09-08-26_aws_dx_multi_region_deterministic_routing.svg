nchor="middle" font-size="21" font-weight="bold" fill="#4c1d95">TGW us-west-2</text><text x="1635" y="800" text-anchor="middle" font-size="17" fill="#4c1d95">10.30.0.0/16</text><text x="1635" y="832" text-anchor="middle" font-size="17" fill="#4c1d95">10.40.0.0/16</text><rect x="590" y="455" width="470" height="150" rx="20" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/><text x="825" y="493" text-anchor="middle" font-size="18" font-weight="bold" fill="#713f12">Deterministic policy</text><text x="825" y="525" text-anchor="middle" font-size="17" fill="#713f12">East prefixes: DX-East primary, DX-West backup</text><text x="825" y="556" text-anchor="middle" font-size="17" fill="#713f12">West prefixes: DX-West primary, DX-East backup</text><text x="825" y="586" text-anchor="middle" font-size="16" fill="#713f12">Equal attributes only when ECMP is intentional</text></g><g fill="none" stroke-width="4"><path d="M320 505 H350 V275 H390" stroke="#2563eb" marker-end="url(#blue)"/><path d="M320 505 H350 V775 H390" stroke="#2563eb" marker-end="url(#blue)"/><path d="M660 275 H760" stroke="#ea580c" marker-end="url(#orange)"/><path d="M660 775 H760" stroke="#ea580c" marker-end="url(#orange)"/><path d="M1070 275 H1120 V470 H1160" stroke="#7e22ce" marker-end="url(#purple)"/><path d="M1070 775 H1120 V540 H1160" stroke="#7e22ce" marker-end="url(#purple)"/><path d="M1450 475 H1480 V255 H1510" stroke="#6d28d9" marker-end="url(#purple)"/><path d="M1450 535 H1480 V795 H1510" stroke="#6d28d9" marker-end="url(#purple)"/></g><g font-family="Arial" font-size="16" font-weight="bold"><text x="345" y="260" fill="#1d4ed8">East WAN</text><text x="345" y="760" fill="#1d4ed8">West WAN</text><text x="705" y="260" fill="#9a3412">Primary East</text><text x="705" y="760" fill="#9a3412">Primary West</text></g></svg>