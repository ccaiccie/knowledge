<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/>
  </marker>
  <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/></filter>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="48" font-family="Arial" font-size="28" font-weight="700" fill="#232f3e">AWS Cloud WAN Service Insertion — Core Mental Model</text>
<text x="40" y="78" font-family="Arial" font-size="16" fill="#545b64">Cloud WAN steers to the Network Function Group attachment; the Inspection VPC route tables and firewall dataplane perform the actual inspection.</text>
<rect x="40" y="120" width="260" height="135" rx="12" fill="#eaf4ff" stroke="#3b82f6" stroke-width="2"/>
<text x="56" y="148" font-family="Arial" font-size="17" font-weight="700" fill="#232f3e">Prod VPC A — us-east-1</text>
<text x="56" y="172" font-family="Arial" font-size="13.5" fill="#3b4146">10.10.0.0/16</text><text x="56" y="192" font-family="Arial" font-size="13.5" fill="#3b4146">Attachment → PROD segment</text><text x="56" y="212" font-family="Arial" font-size="13.5" fill="#3b4146">Workload subnet RT: remote CIDRs → Core Network</text>
<rect x="40" y="560" width="260" height="135" rx="12" fill="#f4f1ff" stroke="#7c3aed" stroke-width="2"/>
<text x="56" y="588" font-family="Arial" font-size="17" font-weight="700" fill="#232f3e">On-premises / Branch</text><text x="56" y="612" font-family="Arial" font-size="13.5" fill="#3b4146">192.168.0.0/16</text><text x="56" y="632" font-family="Arial" font-size="13.5" fill="#3b4146">DX transit VIF / VPN / Connect</text><text x="56" y="652" font-family="Arial" font-size="13.5" fill="#3b4146">Attachment → HYBRID segment</text>
<rect x="370" y="115" width="300" height="235" rx="12" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
<text x="386" y="143" font-family="Arial" font-size="17" font-weight="700" fill="#232f3e">Cloud WAN CNE — us-east-1</text><text x="386" y="167" font-family="Arial" font-size="13.5" fill="#3b4146">PROD route table</text><text x="386" y="187" font-family="Arial" font-size="13.5" fill="#3b4146">HYBRID route table</text><text x="386" y="207" font-family="Arial" font-size="13.5" fill="#3b4146">NFG route table (AWS managed)</text><text x="386" y="227" font-family="Arial" font-size="13.5" fill="#3b4146">send-via / send-to policy steering</text>
<rect x="760" y="100" width="355" height="300" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="776" y="128" font-family="Arial" font-size="17" font-weight="700" fill="#232f3e">Inspection VPC — us-east-1</text><text x="776" y="152" font-family="Arial" font-size="13.5" fill="#3b4146">Core Network attachment subnet</text><text x="776" y="172" font-family="Arial" font-size="13.5" fill="#3b4146">Appliance mode enabled</text><text x="776" y="192" font-family="Arial" font-size="13.5" fill="#3b4146">AWS Network Firewall OR</text><text x="776" y="212" font-family="Arial" font-size="13.5" fill="#3b4146">GWLB + GWLBE + third-party NGFW</text><text x="776" y="232" font-family="Arial" font-size="13.5" fill="#3b4146">Per-AZ route tables preserve symmetry</text>
<rect x="1210" y="120" width="320" height="140" rx="12" fill="#eaf4ff" stroke="#3b82f6" stroke-width="2"/>
<text x="1226" y="148" font-family="Arial" font-size="17" font-weight="700" fill="#232f3e">Prod VPC B — us-west-2</text><text x="1226" y="172" font-family="Arial" font-size="13.5" fill="#3b4146">10.20.0.0/16</text><text x="1226" y="192" font-family="Arial" font-size="13.5" fill="#3b4146">Attachment → PROD segment</text><text x="1226" y="212" font-family="Arial" font-size="13.5" fill="#3b4146">Inter-Region path across AWS backbone</text>
<rect x="1210" y="555" width="320" height="155" rx="12" fill="#eefbf3" stroke="#16a34a" stroke-width="2"/>
<text x="1226" y="583" font-family="Arial" font-size="17" font-weight="700" fill="#232f3e">Internet / External network</text><text x="1226" y="607" font-family="Arial" font-size="13.5" fill="#3b4146">send-to egress: firewall → NAT GW → IGW</text><text x="1226" y="627" font-family="Arial" font-size="13.5" fill="#3b4146">or firewall → on-premises exit</text><text x="1226" y="647" font-family="Arial" font-size="13.5" fill="#3b4146">Traffic does not re-enter Cloud WAN</text>
<rect x="760" y="520" width="355" height="190" rx="12" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
<text x="776" y="548" font-family="Arial" font-size="17" font-weight="700" fill="#232f3e">Network Function Group (NFG)</text><text x="776" y="572" font-family="Arial" font-size="13.5" fill="#3b4146">Global service-insertion construct</text><text x="776" y="592" font-family="Arial" font-size="13.5" fill="#3b4146">One NFG attachment per Region</text><text x="776" y="612" font-family="Arial" font-size="13.5" fill="#3b4146">Routes are automatically derived</text><text x="776" y="632" font-family="Arial" font-size="13.5" fill="#3b4146">No manual share/create-route inside NFG RT</text>
<path d="M 300,185 L 370,185" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><text x="315" y="165" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb">1 workload → CNE</text>
<path d="M 670,215 L 760,215" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/><text x="680" y="195" font-family="Arial" font-size="13" font-weight="700" fill="#dc2626">2 send-via/send-to</text>
<path d="M 1115,215 L 1210,215" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><text x="1120" y="195" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb">3A send-via → destination</text>
<path d="M 935,400 L 935,520" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)"/><text x="950" y="455" font-family="Arial" font-size="13" font-weight="700" fill="#ea580c">inspection attachment belongs to NFG</text>
<path d="M 760,615 L 610,615 L 610,350" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/><text x="620" y="520" font-family="Arial" font-size="13" font-weight="700" fill="#7c3aed">return routes via NFG</text>
<path d="M 300,625 L 370,625 L 370,305" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/><text x="385" y="560" font-family="Arial" font-size="13" font-weight="700" fill="#7c3aed">DX/VPN → HYBRID CNE</text>
<path d="M 1115,310 L 1335,310 L 1335,555" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/><text x="1150" y="290" font-family="Arial" font-size="13" font-weight="700" fill="#16a34a">3B send-to → NAT/IGW/on-prem</text>
</svg>