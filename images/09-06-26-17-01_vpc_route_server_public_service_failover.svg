<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1b8f4b"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#c62828"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="40" y="45" font-family="Arial" font-size="28" font-weight="700">VPC Route Server failover — both ingress and return next hops move together</text>
<rect x="60" y="115" width="420" height="210" rx="14" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="270" y="150" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">FW1 — initially ACTIVE</text><text x="270" y="185" text-anchor="middle" font-family="Arial" font-size="15">App CIDR: AS_PATH 65050</text><text x="270" y="215" text-anchor="middle" font-family="Arial" font-size="15">0.0.0.0/0: AS_PATH 65050</text><text x="270" y="255" text-anchor="middle" font-family="Arial" font-size="15">BFD/BGP fails</text><text x="270" y="285" text-anchor="middle" font-family="Arial" font-size="15" fill="#c62828">preferred routes withdrawn</text>
<rect x="60" y="520" width="420" height="190" rx="14" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="270" y="555" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">FW2 — STANDBY → ACTIVE</text><text x="270" y="590" text-anchor="middle" font-family="Arial" font-size="15">App CIDR: AS_PATH 65050 65050</text><text x="270" y="620" text-anchor="middle" font-family="Arial" font-size="15">0.0.0.0/0: AS_PATH 65050 65050</text><text x="270" y="660" text-anchor="middle" font-family="Arial" font-size="15" fill="#1b8f4b">becomes best remaining path</text>
<rect x="610" y="290" width="360" height="210" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="790" y="328" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Amazon VPC Route Server</text><text x="790" y="365" text-anchor="middle" font-family="Arial" font-size="15">RIB recomputes best path</text><text x="790" y="398" text-anchor="middle" font-family="Arial" font-size="15">FIB changes FW1 ENI → FW2 ENI</text><text x="790" y="438" text-anchor="middle" font-family="Arial" font-size="15">Propagates both route changes</text>
<rect x="1100" y="160" width="430" height="190" rx="14" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="1315" y="198" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">IGW gateway route table</text><text x="1315" y="238" text-anchor="middle" font-family="Arial" font-size="15">Before: 10.20.20.0/24 → eni-FW1</text><text x="1315" y="275" text-anchor="middle" font-family="Arial" font-size="15" fill="#1b8f4b">After: 10.20.20.0/24 → eni-FW2</text><text x="1315" y="312" text-anchor="middle" font-family="Arial" font-size="14">Inbound traffic moves to FW2</text>
<rect x="1100" y="500" width="430" height="190" rx="14" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1315" y="538" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Application subnet route table</text><text x="1315" y="578" text-anchor="middle" font-family="Arial" font-size="15">Before: 0.0.0.0/0 → eni-FW1</text><text x="1315" y="615" text-anchor="middle" font-family="Arial" font-size="15" fill="#1b8f4b">After: 0.0.0.0/0 → eni-FW2</text><text x="1315" y="652" text-anchor="middle" font-family="Arial" font-size="14">Return/new egress traffic moves to FW2</text>
<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M480 220 H560 V350 H610" stroke="#c62828" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#r)"/><path d="M480 615 H560 V445 H610" stroke="#1b8f4b" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#g)"/><path d="M970 350 H1040 V255 H1100" stroke="#1b8f4b" stroke-width="4" marker-end="url(#g)"/><path d="M970 445 H1040 V595 H1100" stroke="#1b8f4b" stroke-width="4" marker-end="url(#g)"/></g>
<rect x="610" y="740" width="920" height="90" rx="12" fill="#fff7f7" stroke="#b85450"/><text x="1070" y="775" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#8d2d2d">Route HA ≠ session HA</text><text x="1070" y="806" text-anchor="middle" font-family="Arial" font-size="14">New flows use FW2. Existing TCP/NAT sessions survive only if the firewall platform synchronizes the required state.</text></svg>