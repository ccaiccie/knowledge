<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker><style>.b{fill:#fff;stroke:#333;stroke-width:2}.g{fill:#fafafa;stroke:#777;stroke-width:2;stroke-dasharray:8 6}.t{font:19px Arial}.s{font:15px Arial}.f{stroke:#333;stroke-width:3;fill:none;marker-end:url(#a)}.r{stroke:#777;stroke-width:3;fill:none;marker-end:url(#a);stroke-dasharray:8 5}</style></defs>
<text x="35" y="45" class="t">Internet ingress — Azure Firewall DNAT preserves state and requires the backend return path through the firewall</text>
<rect x="35" y="140" width="260" height="120" rx="12" class="b"/><text x="103" y="180" class="t">Internet client</text><text x="77" y="212" class="s">198.18.10.25:53110</text>
<rect x="395" y="140" width="280" height="120" rx="12" class="b"/><text x="455" y="180" class="t">Firewall Public IP</text><text x="454" y="212" class="s">203.0.113.10:443</text>
<rect x="775" y="140" width="300" height="120" rx="12" class="b"/><text x="853" y="180" class="t">Azure Firewall</text><text x="814" y="212" class="s">DNAT: 203.0.113.10:443 → 10.10.1.20:443</text>
<rect x="1175" y="140" width="280" height="120" rx="12" class="b"/><text x="1210" y="180" class="t">Backend / App Gateway</text><text x="1235" y="212" class="s">10.10.1.20:443</text>
<path d="M295 200 H395" class="f"/><text x="320" y="183" class="s">1 connect</text><path d="M675 200 H775" class="f"/><text x="698" y="183" class="s">2 hit PIP</text><path d="M1075 200 H1175" class="f"/><text x="1095" y="183" class="s">3 DNAT + forward</text>
<text x="35" y="390" class="t">Return flow</text>
<rect x="1175" y="455" width="280" height="120" rx="12" class="b"/><text x="1210" y="495" class="t">Backend / App Gateway</text><text x="1200" y="527" class="s">UDR/default route → 10.0.1.4</text>
<rect x="775" y="455" width="300" height="120" rx="12" class="b"/><text x="853" y="495" class="t">Azure Firewall</text><text x="813" y="527" class="s">session match + reverse translation</text>
<rect x="395" y="455" width="280" height="120" rx="12" class="b"/><text x="455" y="495" class="t">Firewall Public IP</text><text x="445" y="527" class="s">source restored to 203.0.113.10:443</text>
<rect x="35" y="455" width="260" height="120" rx="12" class="b"/><text x="103" y="495" class="t">Internet client</text><text x="77" y="527" class="s">198.18.10.25:53110</text>
<path d="M1175 515 H1075" class="r"/><text x="1090" y="498" class="s">4 UDR</text><path d="M775 515 H675" class="r"/><text x="686" y="498" class="s">5 reverse NAT</text><path d="M395 515 H295" class="r"/><text x="309" y="498" class="s">6 return</text>
<rect x="85" y="680" width="1330" height="90" rx="12" class="g"/><text x="110" y="715" class="t">Layering</text><text x="110" y="746" class="s">For HTTP/HTTPS application attacks, place Application Gateway WAF or Front Door WAF in the publication architecture; Azure Firewall DNAT is network/application firewalling, not a replacement for WAF semantics.</text></svg>