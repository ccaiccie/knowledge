<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><defs><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#0078D4"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#16A085"/></marker><style>.title{font:700 27px Arial;fill:#16233A}.h{font:700 18px Arial;fill:#16233A}.s{font:15px Arial;fill:#294158}.laneF{fill:#EEF7FF;stroke:#A8D5F5;stroke-width:2}.laneR{fill:#EDFAF6;stroke:#9EDBCB;stroke-width:2}.client{fill:#F1F3F5;stroke:#56606B;stroke-width:2.5}.pip{fill:#E9F4FF;stroke:#1784D5;stroke-width:2.5}.fw{fill:#FFF1E8;stroke:#F26B38;stroke-width:2.5}.backend{fill:#EEF1FF;stroke:#5B65D8;stroke-width:2.5}.f{fill:none;stroke:#0078D4;stroke-width:4;marker-end:url(#b)}.r{fill:none;stroke:#16A085;stroke-width:4;marker-end:url(#g)}.lbl{font:700 14px Arial;fill:#24364B}</style></defs><rect width="1600" height="860" fill="#fff"/><text x="55" y="55" class="title">Internet ingress — Azure Firewall DNAT with a symmetric backend return path</text><rect x="50" y="100" width="1500" height="285" rx="24" class="laneF"/><text x="75" y="135" class="h">FORWARD PATH — PUBLIC LISTENER TO PRIVATE BACKEND</text><rect x="85" y="190" width="250" height="110" rx="15" class="client"/><text x="142" y="228" class="h">Internet client</text><text x="122" y="258" class="s">198.18.10.25:53110</text><rect x="450" y="190" width="250" height="110" rx="15" class="pip"/><text x="506" y="228" class="h">Firewall Public IP</text><text x="506" y="258" class="s">203.0.113.10:443</text><rect x="815" y="190" width="280" height="110" rx="15" class="fw"/><text x="886" y="228" class="h">Azure Firewall</text><text x="842" y="258" class="s">DNAT → 10.10.1.20:443</text><text x="856" y="284" class="s">session state created</text><rect x="1210" y="190" width="280" height="110" rx="15" class="backend"/><text x="1254" y="228" class="h">Backend / App Gateway</text><text x="1282" y="258" class="s">10.10.1.20:443</text><path d="M335 245 H450" class="f"/><text x="360" y="227" class="lbl">1 connect</text><path d="M700 245 H815" class="f"/><text x="723" y="227" class="lbl">2 hit PIP</text><path d="M1095 245 H1210" class="f"/><text x="1112" y="227" class="lbl">3 DNAT + forward</text><rect x="50" y="430" width="1500" height="285" rx="24" class="laneR"/><text x="75" y="465" class="h">RETURN PATH — BACKEND ROUTE MUST SEND THE SESSION BACK THROUGH AZURE FIREWALL</text><rect x="1210" y="530" width="280" height="110" rx="15" class="backend"/><text x="1254" y="568" class="h">Backend / App Gateway</text><text x="1238" y="598" class="s">UDR/default → 10.0.1.4</text><rect x="815" y="530" width="280" height="110" rx="15" class="fw"/><text x="886" y="568" class="h">Azure Firewall</text><text x="845" y="598" class="s">session match + reverse NAT</text><rect x="450" y="530" width="250" height="110" rx="15" class="pip"/><text x="506" y="568" class="h">Firewall Public IP</text><text x="478" y="598" class="s">source restored to public IP</text><rect x="85" y="530" width="250" height="110" rx="15" class="client"/><text x="142" y="568" class="h">Internet client</text><text x="122" y="598" class="s">198.18.10.25:53110</text><path d="M1210 585 H1095" class="r"/><text x="1120" y="567" class="lbl">4 UDR</text><path d="M815 585 H700" class="r"/><text x="718" y="567" class="lbl">5 reverse NAT</text><path d="M450 585 H335" class="r"/><text x="360" y="567" class="lbl">6 return</text><rect x="85" y="775" width="1430" height="55" rx="12" fill="#FFF7DB" stroke="#D6A500" stroke-width="2"/><text x="110" y="808" class="s">For HTTP/HTTPS threat protection, layer WAF where appropriate. DNAT provides publication and firewall policy, not full WAF semantics.</text></svg>