<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><style>.t{font:700 30px Segoe UI,Arial;fill:#0f172a}.s{font:400 16px Segoe UI,Arial;fill:#475569}.bt{font:700 18px Segoe UI,Arial;fill:#0f172a}.bs{font:400 14px Segoe UI,Arial;fill:#334155}.al{font:600 13px Segoe UI,Arial;fill:#1d4ed8}</style></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="48" class="t">Pattern 1 — Route Server and NVA in the Same Hub VNet</text><text x="40" y="78" class="s">The simplest and most common centralized service-insertion design.</text><rect x="70" y="145" width="690" height="450" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="95" y="180" class="bt">Hub VNet 10.0.0.0/16</text><rect x="110" y="225" width="260" height="150" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="130" y="258" class="bt">RouteServerSubnet</text><text x="130" y="285" class="bs">10.0.1.0/26</text><text x="130" y="310" class="bs">Azure Route Server</text><text x="130" y="335" class="bs">ASN 65515</text><rect x="455" y="225" width="260" height="150" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="475" y="258" class="bt">NVA subnet</text><text x="475" y="285" class="bs">10.0.2.0/24</text><text x="475" y="310" class="bs">NVA 10.0.2.4</text><text x="475" y="335" class="bs">ASN 65001</text><path d="M 455 300 L 370 300" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="412" y="285" text-anchor="middle" class="al">eBGP</text><rect x="920" y="220" width="360" height="210" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="945" y="255" class="bt">Spoke VNet 10.20.0.0/16</text><text x="945" y="285" class="bs">VM 10.20.1.10</text><text x="945" y="310" class="bs">Peered to hub</text><text x="945" y="335" class="bs">Uses remote Route Server</text><text x="945" y="360" class="bs">BGP routes appear in effective routes</text><path d="M 760 325 L 920 325" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="840" y="308" text-anchor="middle" class="al">VNet peering</text><text x="90" y="645" class="bs">Control plane: NVA ⇄ Route Server using BGP. Data plane: spoke packet goes directly to the NVA; Route Server is never inline.</text></svg>