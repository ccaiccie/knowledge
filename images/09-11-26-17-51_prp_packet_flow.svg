<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#333"/></marker></defs><rect width="1400" height="760" fill="white"/>
<text x="700" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">PRP Packet Flow — Duplicate in Parallel, Deliver Once</text>
<rect x="70" y="280" width="260" height="150" rx="20" fill="#eef2f7" stroke="#334e68" stroke-width="2"/><text x="200" y="320" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Source DANP</text><text x="200" y="350" text-anchor="middle" font-family="Arial" font-size="15">10.10.10.10</text><text x="200" y="378" text-anchor="middle" font-family="Arial" font-size="15">PRP sequence 4201</text>
<rect x="500" y="130" width="360" height="150" rx="20" fill="#fdeceb" stroke="#b83b32" stroke-width="3"/><text x="680" y="170" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">LAN A</text><text x="680" y="205" text-anchor="middle" font-family="Arial" font-size="16">Copy A — seq 4201</text><text x="680" y="235" text-anchor="middle" font-family="Arial" font-size="15">example latency 400 µs</text>
<rect x="500" y="470" width="360" height="150" rx="20" fill="#eaf2fc" stroke="#2c6db2" stroke-width="3"/><text x="680" y="510" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">LAN B</text><text x="680" y="545" text-anchor="middle" font-family="Arial" font-size="16">Copy B — seq 4201</text><text x="680" y="575" text-anchor="middle" font-family="Arial" font-size="15">example latency 750 µs</text>
<rect x="1060" y="280" width="270" height="150" rx="20" fill="#eef2f7" stroke="#334e68" stroke-width="2"/><text x="1195" y="320" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Destination DANP</text><text x="1195" y="350" text-anchor="middle" font-family="Arial" font-size="15">10.10.10.20</text><text x="1195" y="382" text-anchor="middle" font-family="Arial" font-size="15">A arrives first → deliver</text><text x="1195" y="408" text-anchor="middle" font-family="Arial" font-size="15">B arrives later → discard</text>
<path d="M330 330 C390 250 420 210 500 205" fill="none" stroke="#b83b32" stroke-width="5" marker-end="url(#ar)"/><text x="365" y="260" font-family="Arial" font-size="16">1. replicate A</text>
<path d="M330 390 C390 480 420 535 500 545" fill="none" stroke="#2c6db2" stroke-width="5" marker-end="url(#ar)"/><text x="360" y="505" font-family="Arial" font-size="16">2. replicate B</text>
<path d="M860 205 C960 210 1000 260 1060 325" fill="none" stroke="#b83b32" stroke-width="5" marker-end="url(#ar)"/><text x="915" y="235" font-family="Arial" font-size="16">3. first valid copy</text>
<path d="M860 545 C970 540 1010 470 1060 405" fill="none" stroke="#2c6db2" stroke-width="5" marker-end="url(#ar)"/><text x="900" y="515" font-family="Arial" font-size="16">4. later duplicate</text>
<rect x="980" y="90" width="330" height="95" rx="15" fill="#fff7dd" stroke="#a77d00"/><text x="1145" y="122" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">If LAN A fails</text><text x="1145" y="148" text-anchor="middle" font-family="Arial" font-size="15">copy B is already in flight</text><text x="1145" y="170" text-anchor="middle" font-family="Arial" font-size="15">no PRP topology convergence</text>
</svg>