<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="900" viewBox="0 0 2000 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs>
<rect width="2000" height="900" fill="#fff"/>
<text x="1000" y="42" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold">INBOUND — Internet → DMZ Application</text>
<text x="1000" y="76" text-anchor="middle" font-family="Arial" font-size="17">AWS route-table interception through GWLBE/GWLB; VM-Series classifies the flow as DMZ</text>

