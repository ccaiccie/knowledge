<path d="M1025 502 H860 V705 H570 V560" fill="none" stroke="#1565C0" stroke-width="5" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="810" y="685" text-anchor="middle" font-family="Arial" font-size="14" fill="#1565C0">6 inspected service-path continuation</text>

<rect x="80" y="735" width="1840" height="105" rx="14" fill="#FAFAFA" stroke="#455A64" stroke-width="2"/>
<text x="1000" y="770" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Inbound summary</text>
<text x="115" y="807" font-family="Arial" font-size="15">Internet → IGW → IGW gateway route redirects to GWLBE-DMZ → GWLB → GENEVE → VM-Series → DMZ zone/policy → GWLB/GWLBE → ALB/application.</text>
