<text x="685" y="228" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">GWLBE-DMZ</text><text x="685" y="257" text-anchor="middle" font-family="Arial" font-size="14">vpce-dmz-a</text><text x="685" y="280" text-anchor="middle" font-family="Arial" font-size="12">consumer endpoint</text>
<rect x="405" y="445" width="330" height="115" rx="12" fill="#FFF3E0" stroke="#FB8C00" stroke-width="2"/>
<text x="570" y="483" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">ALB / DMZ Application</text><text x="570" y="514" text-anchor="middle" font-family="Arial" font-size="14">ALB subnet 10.10.10.0/24</text><text x="570" y="540" text-anchor="middle" font-family="Arial" font-size="14">App subnet 10.10.20.0/24</text>
<rect x="360" y="585" width="420" height="55" rx="10" fill="#FFFDE7" stroke="#F9A825" stroke-width="2"/>
<text x="570" y="619" text-anchor="middle" font-family="Arial" font-size="14">IGW RT redirects DMZ prefix to vpce-dmz-a</text>

<rect x="900" y="120" width="680" height="540" rx="22" fill="#E3F2FD" stroke="#1976D2" stroke-width="4"/>
<text x="1240" y="157" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Security VPC — 10.100.0.0/16</text>
<rect x="950" y="190" width="240" height="105" rx="12" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
<text x="1070" y="228" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">AWS GWLB</text><text x="1070" y="257" text-anchor="middle" font-family="Arial" font-size="14">PrivateLink endpoint service</text><text x="1070" y="280" text-anchor="middle" font-family="Arial" font-size="12">GENEVE UDP/6081</text>
<rect x="1260" y="175" width="270" height="135" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
<text x="1395" y="213" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">VM-Series</text><text x="1395" y="243" text-anchor="middle" font-family="Arial" font-size="14">vpce-dmz-a → e1/1.10</text><text x="1395" y="268" text-anchor="middle" font-family="Arial" font-size="14">Security zone = DMZ</text><text x="1395" y="293" text-anchor="middle" font-family="Arial" font-size="13">Inspect inner packet</text>
<rect x="1025" y="445" width="430" height="115" rx="12" fill="#F1F8E9" stroke="#558B2F" stroke-width="2"/>
<text x="1240" y="482" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">PAN-OS result</text><text x="1240" y="513" text-anchor="middle" font-family="Arial" font-size="14">Destination stays on GWLB service path</text><text x="1240" y="539" text-anchor="middle" font-family="Arial" font-size="14">Packet returns through GWLB/GWLBE toward DMZ target</text>

