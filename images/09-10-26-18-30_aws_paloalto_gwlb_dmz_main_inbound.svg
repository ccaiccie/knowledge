<text x="865" y="223" text-anchor="middle" font-family="Arial" font-size="14" fill="#1565C0">3 PrivateLink</text>
<path d="M1190 242 H1260" fill="none" stroke="#1565C0" stroke-width="5" marker-end="url(#a)"/>
