<rect x="300" y="120" width="540" height="540" rx="22" fill="#FFF8E1" stroke="#FB8C00" stroke-width="4"/>
<text x="570" y="157" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">DMZ VPC — 10.10.0.0/16</text>
<rect x="345" y="190" width="190" height="105" rx="12" fill="#FFE0B2" stroke="#EF6C00" stroke-width="2"/>
<text x="440" y="228" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Internet Gateway</text><text x="440" y="257" text-anchor="middle" font-family="Arial" font-size="14">IGW gateway RT</text><text x="440" y="280" text-anchor="middle" font-family="Arial" font-size="12">10.10.10.0/24 → vpce-dmz-a</text>
