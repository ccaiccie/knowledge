<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><defs><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#107C10"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#CA5010"/></marker><filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/></filter><style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#14314A}.subtitle{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#4A4A4A}.label{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#173B5C}.small{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#173B5C}.tiny{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#173B5C}.legend{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#173B5C}</style></defs><text x="30" y="40" class="title">Forced tunneling from Azure through on-premises firewall</text><text x="30" y="64" class="subtitle">Azure sends default-routed traffic to the hybrid gateway so the corporate egress firewall remains the Internet breakout point.</text><rect x="260" y="130" width="760" height="620" rx="22" fill="#F8FBFF" stroke="#0078D4" stroke-width="3" stroke-dasharray="7 5"/><text x="640" y="165" class="label" text-anchor="middle">Azure region</text><rect x="320" y="220" width="200" height="180" rx="12" fill="#F8FCFF" stroke="#50B0F9" stroke-width="2" stroke-dasharray="7 5"/><text x="420" y="245" class="label" text-anchor="middle">Spoke VNet</text><rect x="375" y="295" width="90" height="55" rx="10" fill="white" stroke="#50B0F9" stroke-width="2" filter="url(#shadow)"/><text x="420" y="327" class="small" text-anchor="middle">Workloads</text><rect x="580" y="210" width="350" height="220" rx="14" fill="#FFFDF5" stroke="#D0A000" stroke-width="2" stroke-dasharray="7 5"/><text x="755" y="235" class="label" text-anchor="middle">Hub inspection VNet</text><rect x="675" y="290" width="160" height="75" rx="16" fill="#FFF6D8" stroke="#FFB900" stroke-width="2" filter="url(#shadow)"/><text x="755" y="333" class="label" text-anchor="middle">Azure Firewall</text><rect x="650" y="390" width="296" height="24" rx="12" fill="white" stroke="#CA5010" stroke-width="2"/><text x="798" y="407" class="tiny" text-anchor="middle">0.0.0.0/0 → gateway (forced tunnel)</text><rect x="670" y="500" width="170" height="70" rx="12" fill="#FFF7EB" stroke="#8A6D3B" stroke-width="2" filter="url(#shadow)"/><text x="755" y="542" class="small" text-anchor="middle">VPN / ER Gateway</text><rect x="1110" y="200" width="400" height="520" rx="18" fill="#FFF8F0" stroke="#8A6D3B" stroke-width="3" stroke-dasharray="7 5"/><text x="1310" y="235" class="label" text-anchor="middle">On-premises data center</text><rect x="1215" y="315" width="160" height="80" rx="16" fill="#ECF8D9" stroke="#7FBA00" stroke-width="2" filter="url(#shadow)"/><text x="1295" y="360" class="label" text-anchor="middle">Corporate firewall</text><rect x="1245" y="500" width="100" height="60" rx="10" fill="white" stroke="#50B0F9" stroke-width="2" filter="url(#shadow)"/><text x="1295" y="535" class="small" text-anchor="middle">Proxy / IDS / DNS</text><rect x="1400" y="100" width="170" height="80" rx="16" fill="#F4F7FA" stroke="#6E6E6E" stroke-width="2" filter="url(#shadow)"/><text x="1485" y="147" class="label" text-anchor="middle">Internet</text><polyline points="465,350 675,350" fill="none" stroke="#0078D4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowBlue)"/><polyline points="835,350 970,350 970,535 1110,535" fill="none" stroke="#CA5010" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowOrange)"/><polyline points="1110,535 1215,355" fill="none" stroke="#CA5010" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowOrange)"/><polyline points="1375,355 1450,355 1450,185 1485,185" fill="none" stroke="#107C10" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowGreen)"/><polyline points="1485,235 1485,650 1260,650 1260,580" fill="none" stroke="#107C10" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowGreen)"/><circle cx="560" cy="350" r="14" fill="white" stroke="#0078D4" stroke-width="3"/><text x="560" y="355" class="legend" text-anchor="middle">1</text><text x="594" y="354" class="tiny">Workload → Azure Firewall</text><circle cx="1010" cy="535" r="14" fill="white" stroke="#CA5010" stroke-width="3"/><text x="1010" y="540" class="legend" text-anchor="middle">2</text><text x="1047" y="540" class="tiny">Forced-tunnel default route to gateway</text><circle cx="1420" cy="355" r="14" fill="white" stroke="#107C10" stroke-width="3"/><text x="1420" y="360" class="legend" text-anchor="middle">3</text><text x="1390" y="390" class="tiny" text-anchor="end">On-premises firewall performs final egress</text><rect x="1090" y="35" width="340" height="114" rx="14" fill="white" stroke="#A0B3C4" stroke-width="1.5" filter="url(#shadow)"/><text x="1108" y="59" class="label">Legend</text><line x1="1108" y1="83" x2="1160" y2="83" stroke="#0078D4" stroke-width="4"/><text x="1172" y="88" class="small">Azure workload to Azure Firewall</text><line x1="1108" y1="111" x2="1160" y2="111" stroke="#CA5010" stroke-width="4"/><text x="1172" y="116" class="small">Forced tunnel toward on-premises edge</text><line x1="1108" y1="139" x2="1160" y2="139" stroke="#107C10" stroke-width="4"/><text x="1172" y="144" class="small">Corporate internet breakout and return</text></svg>