<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><style>text{font-family:Arial,sans-serif}.t{font-size:30px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.l{font-size:14px;font-weight:700}</style></defs><text x="50" y="55" class="t">Traditional VM-Series service insertion — internal passthrough LB + PBR/custom routes</text><rect x="50" y="150" width="280" height="190" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/><text x="70" y="185" class="h">Workload VPC A</text><text x="70" y="220" class="b">10.10.0.0/16</text><text x="70" y="245" class="b">workload-a 10.10.1.10</text><text x="70" y="270" class="b">PBR/custom route → ILB A</text><rect x="390" y="150" width="300" height="190" rx="14" fill="#e6f4ea" stroke="#188038" stroke-width="3"/><text x="410" y="185" class="h">Internal passthrough NLB A</text><text x="410" y="220" class="b">Frontend 10.10.0.10</text><text x="410" y="245" class="b">Backends: VM-Series NICs</text><text x="410" y="270" class="b">Health checks select backend</text><rect x="790" y="120" width="320" height="240" rx="14" fill="#fce8e6" stroke="#d93025" stroke-width="3"/><text x="810" y="155" class="h">VM-Series firewall pair/fleet</text><text x="810" y="190" class="b">Multi-NIC PAN-OS VMs</text><text x="810" y="215" class="b">NIC0/load-balancer constraints</text><text x="810" y="240" class="b">NICs fixed at VM creation</text><text x="810" y="265" class="b">Security/NAT policy + virtual router</text><text x="810" y="290" class="b">Active/passive or autoscale</text><rect x="1210" y="150" width="290" height="190" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/><text x="1230" y="185" class="h">Workload VPC B</text><text x="1230" y="220" class="b">10.20.0.0/16</text><text x="1230" y="245" class="b">workload-b 10.20.1.20</text><text x="1230" y="270" class="b">Return → ILB B for symmetry</text><rect x="790" y="520" width="320" height="170" rx="14" fill="#fef7e0" stroke="#f29900" stroke-width="3"/><text x="810" y="555" class="h">Internet / external LB</text><text x="810" y="590" class="b">External LB can front VM-Series</text><text x="810" y="615" class="b">Outbound uses firewall untrust path</text><text x="810" y="640" class="b">Cloud NAT/external IP by design</text><path d="M330 245 L390 245" stroke="#1a73e8" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="335" y="225" class="l">1 steer</text><path d="M690 245 L790 245" stroke="#188038" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="700" y="225" class="l">2 healthy firewall</text><path d="M1110 245 L1210 245" stroke="#d93025" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="1125" y="225" class="l">3 forward</text><path d="M1210 300 L1160 410 L700 410 L690 300" stroke="#188038" stroke-width="4" stroke-dasharray="9 7" fill="none" marker-end="url(#a)"/><text x="830" y="395" class="l">4 return via corresponding ILB / same logical state path</text><path d="M950 360 L950 520" stroke="#f29900" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="965" y="445" class="l">north/south</text></svg>