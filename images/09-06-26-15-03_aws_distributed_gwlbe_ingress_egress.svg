<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100"><defs><marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1473E6"/></marker><marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2E8540"/></marker><marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ED7100"/></marker><style>text{font-family:Arial,sans-serif;fill:#232F3E}.title{font-size:28px;font-weight:700}.section{font-size:18px;font-weight:700}.label{font-size:15px}.small{font-size:13px}.awsbox{rx:14;ry:14;stroke-width:2}.group{rx:20;ry:20;fill:none;stroke-width:3}.subnet{rx:14;ry:14;stroke-width:2}.blue{stroke:#1473E6;stroke-width:5;fill:none;marker-end:url(#blueArrow)}.green{stroke:#2E8540;stroke-width:5;fill:none;marker-end:url(#greenArrow)}.orange{stroke:#ED7100;stroke-width:5;fill:none;stroke-dasharray:12 8;marker-end:url(#orangeArrow)}.tag{fill:#fff;stroke-width:1.5;rx:8;ry:8}.iconText{font-size:16px;font-weight:700}.center{text-anchor:middle}</style></defs>
<text x="900" y="38" class="title center">AWS Distributed Gateway Load Balancer Endpoint (GWLBE) — Internet Ingress and Egress</text>
<rect x="585" y="58" width="630" height="46" class="awsbox" fill="#F7F7F7" stroke="#B7B7B7"/><text x="900" y="87" class="label center">Blue = inbound   •   Green = outbound   •   Orange dashed = inspection / GENEVE</text>
<ellipse cx="145" cy="245" rx="90" ry="52" fill="#EAF3FF" stroke="#1473E6" stroke-width="2"/><text x="145" y="251" class="section center">Internet</text>
<rect x="290" y="195" width="150" height="110" class="awsbox" fill="#F2ECFF" stroke="#8C4FFF"/><text x="365" y="228" class="iconText center">AWS</text><text x="365" y="252" class="iconText center">Internet Gateway</text><text x="365" y="278" class="small center">IGW ingress RT</text>
<rect x="470" y="135" width="1240" height="700" class="group" stroke="#248814"/><text x="490" y="165" class="section">Application VPC 10.10.0.0/16</text>
<rect x="505" y="190" width="1165" height="590" class="group" stroke="#7AA116"/><text x="525" y="220" class="section">Availability Zone us-east-1a</text>
<rect x="545" y="260" width="260" height="190" class="subnet" fill="#FFF7F7" stroke="#D13212"/><text x="675" y="286" class="label center">GWLBE subnet 10.10.10.0/28</text><rect x="610" y="315" width="130" height="90" class="awsbox" fill="#F2ECFF" stroke="#8C4FFF"/><text x="675" y="340" class="iconText center">AWS GWLBE</text><text x="675" y="365" class="small center">Gateway Load</text><text x="675" y="382" class="small center">Balancer Endpoint</text>
<rect x="875" y="260" width="300" height="190" class="subnet" fill="#FFFDF2" stroke="#C48A00"/><text x="1025" y="286" class="label center">Public LB subnet 10.10.20.0/24</text><rect x="960" y="315" width="130" height="90" class="awsbox" fill="#F2ECFF" stroke="#8C4FFF"/><text x="1025" y="340" class="iconText center">ALB / NLB</text><text x="1025" y="366" class="small center">Internet-facing</text><text x="1025" y="383" class="small center">entry point</text>
<rect x="1245" y="260" width="340" height="190" class="subnet" fill="#F2FFF7" stroke="#248814"/><text x="1415" y="286" class="label center">Private app subnet 10.10.30.0/24</text><rect x="1350" y="315" width="130" height="90" class="awsbox" fill="#FFF2E5" stroke="#ED7100"/><text x="1415" y="340" class="iconText center">EC2 / ECS</text><text x="1415" y="366" class="small center">Application</text><text x="1415" y="383" class="small center">targets</text>
<rect x="875" y="525" width="300" height="175" class="subnet" fill="#F0F8FF" stroke="#1473E6"/><text x="1025" y="552" class="label center">NAT Gateway subnet 10.10.40.0/28</text><rect x="960" y="575" width="130" height="82" class="awsbox" fill="#F2ECFF" stroke="#8C4FFF"/><text x="1025" y="602" class="iconText center">NAT Gateway</text><text x="1025" y="628" class="small center">SNAT before IGW</text>
<rect x="1245" y="540" width="300" height="88" class="awsbox" fill="#E9F8E9" stroke="#248814"/><text x="1395" y="568" class="label center">Private subnet route table</text><text x="1395" y="596" class="label center">0.0.0.0/0 → GWLBE</text>
<rect x="545" y="540" width="300" height="88" class="awsbox" fill="#FFF1F0" stroke="#D13212"/><text x="695" y="568" class="label center">GWLBE subnet route table</text><text x="695" y="596" class="small center">post-inspection destination routes</text>
<rect x="470" y="875" width="1240" height="185" class="group" stroke="#ED7100"/><text x="490" y="905" class="section">Security VPC</text><rect x="735" y="930" width="160" height="90" class="awsbox" fill="#F2ECFF" stroke="#8C4FFF"/><text x="815" y="958" class="iconText center">Gateway Load</text><text x="815" y="980" class="iconText center">Balancer</text><text x="815" y="1002" class="small center">flow hashing</text><rect x="1135" y="930" width="170" height="90" class="awsbox" fill="#FFF2E5" stroke="#D13212"/><text x="1220" y="958" class="iconText center">NGFW fleet</text><text x="1220" y="980" class="small center">GENEVE UDP/6081</text><text x="1220" y="1002" class="small center">inspect / allow / drop</text>
<path d="M235 245 H275 V170 H365 V195" class="blue"/><rect x="210" y="154" width="150" height="32" class="tag" stroke="#1473E6"/><text x="285" y="175" class="small center" fill="#1473E6">1  Client → IGW</text>
<path d="M440 250 H485 V125 H675 V315" class="blue"/><rect x="500" y="110" width="245" height="32" class="tag" stroke="#1473E6"/><text x="622" y="131" class="small center">2  IGW ingress route → GWLBE</text>
<path d="M740 360 H820 V235 H1025 V315" class="blue"/><rect x="800" y="220" width="300" height="32" class="tag" stroke="#1473E6"/><text x="950" y="241" class="small center">3  inspected flow returns → ALB/NLB</text>
<path d="M1090 360 H1195 V235 H1415 V315" class="blue"/><rect x="1185" y="220" width="255" height="32" class="tag" stroke="#1473E6"/><text x="1312" y="241" class="small center">4  ALB/NLB → application target</text>
<path d="M1480 360 H1625 V585 H1545" class="green"/><rect x="1500" y="465" width="235" height="32" class="tag" stroke="#2E8540"/><text x="1618" y="486" class="small center">A  app → private route table</text>
<path d="M1245 585 H1160 V745 H620 V405" class="green"/><rect x="905" y="727" width="210" height="32" class="tag" stroke="#2E8540"/><text x="1010" y="748" class="small center">B  0/0 → GWLBE</text>
<path d="M610 405 H525 V805 H1025 V657" class="green"/><rect x="695" y="790" width="275" height="32" class="tag" stroke="#2E8540"/><text x="832" y="811" class="small center">C  post-inspection → NAT Gateway</text>
<path d="M960 616 H900 V825 H250 V315 H145 V297" class="green"/><rect x="380" y="808" width="220" height="32" class="tag" stroke="#2E8540"/><text x="490" y="829" class="small center">D  NAT → IGW → Internet</text>
<path d="M650 405 H560 V850 H815 V930" class="orange"/><rect x="575" y="838" width="325" height="32" class="tag" stroke="#ED7100"/><text x="738" y="859" class="small center">Inspection: GWLBE → endpoint service → GWLB</text>
<path d="M895 975 H1135" class="orange"/><rect x="925" y="944" width="190" height="32" class="tag" stroke="#ED7100"/><text x="1020" y="965" class="small center">GENEVE UDP/6081</text>
<path d="M1220 1020 V1045 H815 V1020" class="orange"/><rect x="925" y="1025" width="255" height="32" class="tag" stroke="#ED7100"/><text x="1052" y="1046" class="small center">inspected packet returns to GWLB</text>
</svg>