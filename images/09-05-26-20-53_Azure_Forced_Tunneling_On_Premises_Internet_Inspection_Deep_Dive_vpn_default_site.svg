<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="48" text-anchor="middle" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#111827">Azure VPN Gateway Default Site — forced Internet tunneling</text>
<text x="800" y="78" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#475569">The Local Network Gateway identifies the chosen remote site; it is not a packet-forwarding hop.</text>
