<text x="205" y="438" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="600">Workload VM</text><text x="205" y="458" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#475569">10.0.1.4</text>
