<text x="515" y="438" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="600">Azure VPN Gateway</text><text x="515" y="458" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#475569">RouteBased • GatewaySubnet</text>
<g transform="translate(790 270) scale(5)"><rect x="-6.175" y="5.842" transform="rotate(-45)" width="12.35" height="12.35" rx=".57" fill="url(#lngGreen)"/><path fill="#fff" d="m6.56,4.18 1.88-1.88a.1.1 0 0 1 .14 0l1.93 1.88a.09.09 0 0 1-.07.16H9.29v2.53H7.83V4.34H6.63a.1.1 0 0 1-.07-.16zm3.95,8.64-1.93,1.88a.1.1 0 0 1-.14 0l-1.88-1.88a.1.1 0 0 1 .07-.16h1.11v-2.53h1.45v2.53h1.1a.1.1 0 0 1 .12.16z"/></g>
<text x="832" y="385" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="600">Local Network Gateway</text><text x="832" y="405" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#475569">LNG-HQ • remote-site object</text>
<rect x="740" y="440" width="225" height="100" rx="12" fill="#f0fdfa" stroke="#68c2b5"/><text x="852" y="469" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#0f766e">gatewayDefaultSite = LNG-HQ</text><text x="852" y="493" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#475569">Configuration association only</text><text x="852" y="516" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#475569">LNG does not forward packets</text>
<rect x="1060" y="110" width="500" height="680" rx="16" fill="#fafafa" stroke="#64748b" stroke-width="2"/><text x="1085" y="142" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#334155">On-premises / enterprise edge</text>
<rect x="1120" y="285" width="180" height="110" rx="12" fill="#fff" stroke="#94a3b8"/><text x="1210" y="316" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="700">On-prem VPN device</text><text x="1210" y="341" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#475569">203.0.113.10</text><text x="1210" y="365" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#475569">Terminates IPsec</text>
<rect x="1330" y="405" width="180" height="115" rx="12" fill="#fff7ed" stroke="#f59e0b"/><text x="1420" y="437" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="700">On-prem NGFW</text><text x="1420" y="462" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#475569">Stateful inspection</text><text x="1420" y="486" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#475569">Internet SNAT</text>
<ellipse cx="1437" cy="642" rx="62" ry="35" fill="#fff" stroke="#64748b"/><text x="1437" y="648" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="600">Internet</text>
<polyline points="550,310 620,245 790,245 820,270" fill="none" stroke="#49a498" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#ag)"/><text x="680" y="226" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#0f766e">CONTROL PLANE: select Default Site</text>
<line x1="250" y1="372" x2="470" y2="372" stroke="#0078D4" stroke-width="3" marker-end="url(#ab)"/><text x="360" y="357" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#075985">1 Internet destination</text>
<polyline points="550,375 1080,375 1120,350" fill="none" stroke="#0078D4" stroke-width="3" marker-end="url(#ab)"/><text x="820" y="360" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#075985">2 Forced into S2S IPsec — data plane bypasses LNG object</text>
<line x1="1300" y1="360" x2="1335" y2="420" stroke="#0078D4" stroke-width="3" marker-end="url(#ab)"/><text x="1295" y="410" text-anchor="end" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#075985">3 Routing</text>
<line x1="1420" y1="520" x2="1435" y2="605" stroke="#0078D4" stroke-width="3" marker-end="url(#ab)"/><text x="1395" y="565" text-anchor="end" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#075985">4 Inspect + SNAT</text>
<polyline points="1375,650 1315,650 1315,555 1370,520" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#ao)"/><text x="1305" y="637" text-anchor="end" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#92400e">5 Return</text>
<polyline points="1330,490 1260,600 1180,600 1180,400" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#ao)"/><text x="1230" y="586" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#92400e">6 Reverse NAT</text>
<polyline points="1120,380 1060,650 610,650 540,410" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#ao)"/><text x="835" y="636" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#92400e">7 S2S IPsec return</text>
<polyline points="480,410 450,650 280,650 235,410" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#ao)"/><text x="360" y="636" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#92400e">8 Deliver to VM</text>
<text x="80" y="835" font-family="Segoe UI,Arial" font-size="13" fill="#475569">Blue = forward traffic • Orange = return traffic • Green dashed = configuration/control-plane relationship</text>
<text x="80" y="858" font-family="Segoe UI,Arial" font-size="13" fill="#475569">The on-prem VPN device must accept the broad Internet destination space in the tunnel selectors/policy.</text>
