<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1473e6"/></marker><marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7b1fa2"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1b8f4b"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#c62828"/></marker></defs><rect width="1600" height="1000" fill="#ffffff"/><text x="40" y="45" font-family="Arial" font-size="28" font-weight="700" fill="#17233c">Single-VPC Internet ingress/egress — VPC Route Server dynamically selects the active NVA</text><rect x="250" y="70" width="1290" height="820" rx="16" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="2"/><text x="275" y="102" font-family="Arial" font-size="18" font-weight="700" fill="#17233c">Inspection / Application VPC 10.20.0.0/16</text><rect x="280" y="125" width="1230" height="220" rx="14" fill="#eef7ee" stroke="#82b366" stroke-width="2"/><text x="300" y="155" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f35">CONTROL PLANE — BGP / BFD</text><rect x="430" y="195" width="220" height="100" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="540" y="225" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#17233c">Route Server Endpoint A</text><text x="540" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">AWS-managed ENI</text><text x="540" y="273" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">AZ-a</text><rect x="735" y="185" width="320" height="120" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="895" y="215" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#17233c">Amazon VPC Route Server</text><text x="895" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">ASN 65000</text><text x="895" y="263" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">RIB → best path → FIB</text><text x="895" y="286" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">Propagates winner into selected route tables</text><rect x="1140" y="195" width="220" height="100" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="1250" y="225" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#17233c">Route Server Endpoint B</text><text x="1250" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">AWS-managed ENI</text><text x="1250" y="273" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">AZ-b</text><rect x="280" y="370" width="1230" height="250" rx="14" fill="#eef4fb" stroke="#6c8ebf" stroke-width="2"/><text x="300" y="400" font-family="Arial" font-size="15" font-weight="700" fill="#234d75">DATA PLANE — NORMAL STEADY-STATE FORWARDING</text><rect x="380" y="445" width="260" height="130" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="510" y="475" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#17233c">Internet Gateway</text><text x="510" y="503" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">IGW edge route table</text><text x="510" y="528" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">10.20.20.0/24 → FW1 ENI</text><text x="510" y="551" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">10.20.10.10</text><rect x="765" y="435" width="260" height="145" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="895" y="465" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#17233c">FW1 — ACTIVE in AZ-a</text><text x="895" y="493" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">ENI 10.20.10.10</text><text x="895" y="516" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">ASN 65050</text><text x="895" y="539" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">Preferred advertisement</text><text x="895" y="562" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">short AS_PATH</text><rect x="1150" y="435" width="270" height="145" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1285" y="465" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#17233c">Application subnet</text><text x="1285" y="493" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">10.20.20.0/24</text><text x="1285" y="521" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">Subnet route table</text><text x="1285" y="546" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">0.0.0.0/0 → FW1 ENI</text><text x="1285" y="569" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">10.20.10.10</text><rect x="280" y="645" width="1230" height="190" rx="14" fill="#fff7f7" stroke="#b85450" stroke-width="2"/><text x="300" y="675" font-family="Arial" font-size="15" font-weight="700" fill="#8d2d2d">FAILOVER / RETURN PATH</text><rect x="765" y="700" width="260" height="120" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="895" y="730" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#17233c">FW2 — STANDBY in AZ-b</text><text x="895" y="758" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">ENI 10.20.11.10 • ASN 65050</text><text x="895" y="784" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">Backup advertisement</text><text x="895" y="807" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">prepended AS_PATH</text><rect x="30" y="455" width="180" height="80" rx="12" fill="#f5f5f5" stroke="#777777" stroke-width="2"/><text x="120" y="490" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#17233c">Internet</text><text x="120" y="515" text-anchor="middle" font-family="Arial" font-size="14" fill="#17233c">Public client</text><g fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M210 495 H380" stroke="#1473e6" stroke-width="4" marker-end="url(#blue)"/><path d="M640 495 H765" stroke="#1473e6" stroke-width="4" marker-end="url(#blue)"/><path d="M1025 495 H1150" stroke="#1473e6" stroke-width="4" marker-end="url(#blue)"/><path d="M1285 580 V610 H1090 V610 H1090 V605 H895 V580" stroke="#7b1fa2" stroke-width="4" marker-end="url(#purple)"/><path d="M765 545 H710 V600 H510 V575" stroke="#7b1fa2" stroke-width="4" marker-end="url(#purple)"/><path d="M765 470 H690 V335 H540 V295" stroke="#1b8f4b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#green)"/><path d="M1025 760 H1450 V325 H1250 V295" stroke="#1b8f4b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#green)"/><path d="M650 245 H735" stroke="#1b8f4b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#green)"/><path d="M1140 245 H1055" stroke="#1b8f4b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#green)"/><path d="M1025 760 H1465 V595 H1420" stroke="#c62828" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#red)"/></g><g font-family="Arial" font-size="13" font-weight="700"><text x="245" y="482" fill="#1473e6">1  Internet → IGW</text><text x="650" y="482" fill="#1473e6">2  IGW edge RT → FW1 ENI</text><text x="1033" y="482" fill="#1473e6">3  inspected → application</text><text x="1110" y="628" fill="#7b1fa2">4  app subnet RT → FW1</text><text x="555" y="623" fill="#7b1fa2">5  FW1 → IGW → Internet</text><text x="575" y="350" fill="#1b8f4b">BGP/BFD preferred</text><text x="1220" y="350" fill="#1b8f4b">BGP/BFD backup</text><text x="1090" y="742" fill="#c62828">Failure: Route Server selects FW2; propagated next hop changes to ENI 10.20.11.10</text></g><text x="290" y="925" font-family="Arial" font-size="14" font-weight="700" fill="#17233c">Blue = forward path</text><text x="470" y="925" font-family="Arial" font-size="14" font-weight="700" fill="#7b1fa2">Purple = return path</text><text x="665" y="925" font-family="Arial" font-size="14" font-weight="700" fill="#1b8f4b">Green dashed = BGP/BFD control plane</text><text x="1000" y="925" font-family="Arial" font-size="14" font-weight="700" fill="#c62828">Red dashed = failover path</text></svg>