<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1473e6"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1b8f4b"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#c62828"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="45" font-family="Arial" font-size="27" font-weight="700">Single-VPC Internet ingress/egress — VPC Route Server selects the active NVA</text><g font-family="Arial" fill="#17233c"><rect x="50" y="350" width="180" height="90" rx="12" fill="#f5f5f5" stroke="#777" stroke-width="2"/><text x="65" y="382" font-size="19" font-weight="700">Internet</text><text x="65" y="410" font-size="15">Public clients</text><rect x="300" y="325" width="240" height="140" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="315" y="357" font-size="19" font-weight="700">Internet Gateway</text><text x="315" y="385" font-size="15">IGW edge RT</text><text x="315" y="410" font-size="15">10.20.20.0/24 → active FW ENI</text><rect x="640" y="145" width="240" height="145" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="655" y="177" font-size="19" font-weight="700">FW1 — AZ-a ACTIVE</text><text x="655" y="205" font-size="15">ENI 10.20.10.10</text><text x="655" y="230" font-size="15">ASN 65050 • short AS_PATH</text><rect x="640" y="545" width="240" height="145" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="655" y="577" font-size="19" font-weight="700">FW2 — AZ-b STANDBY</text><text x="655" y="605" font-size="15">ENI 10.20.11.10</text><text x="655" y="630" font-size="15">ASN 65050 • prepended AS_PATH</text><rect x="980" y="160" width="250" height="120" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="995" y="192" font-size="19" font-weight="700">Route Server Endpoints</text><text x="995" y="220" font-size="15">AWS-managed ENIs</text><text x="995" y="245" font-size="15">2 per subnet supported</text><rect x="970" y="345" width="270" height="150" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="985" y="377" font-size="19" font-weight="700">Amazon VPC Route Server</text><text x="985" y="405" font-size="15">ASN 65000</text><text x="985" y="430" font-size="15">RIB → best path → FIB</text><text x="985" y="455" font-size="15">Propagates into selected RTs</text><rect x="1280" y="345" width="190" height="150" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1295" y="377" font-size="19" font-weight="700">Application subnet</text><text x="1295" y="405" font-size="15">10.20.20.0/24</text><text x="1295" y="430" font-size="15">0/0 → active FW ENI</text></g><g fill="none" stroke-width="4"><path d="M230 395 H300" stroke="#1473e6" marker-end="url(#b)"/><path d="M540 395 H590 V218 H640" stroke="#1473e6" marker-end="url(#b)"/><path d="M880 218 H930 V420 H1280" stroke="#1473e6" marker-end="url(#b)"/><path d="M1280 455 H930 V260 H880" stroke="#1473e6" marker-end="url(#b)"/><path d="M640 260 H590 V425 H540" stroke="#1473e6" marker-end="url(#b)"/><path d="M880 205 H980" stroke="#1b8f4b" stroke-dasharray="9 7" marker-end="url(#g)"/><path d="M880 600 H925 V245 H980" stroke="#1b8f4b" stroke-dasharray="9 7" marker-end="url(#g)"/><path d="M1105 280 V345" stroke="#1b8f4b" stroke-dasharray="9 7" marker-end="url(#g)"/><path d="M880 618 H930 V470 H970" stroke="#c62828" stroke-dasharray="9 7" marker-end="url(#r)"/></g><g font-family="Arial" font-size="14"><text x="240" y="382" fill="#1473e6">1 inbound</text><text x="555" y="305" fill="#1473e6">2 IGW RT → FW1 ENI</text><text x="1020" y="324" fill="#1b8f4b">BGP/BFD control plane</text><text x="920" y="610" fill="#c62828">Failover path to FW2</text></g><text x="40" y="865" font-family="Arial" font-size="14" fill="#555">Blue: forwarding path • Green dashed: BGP/BFD • Red dashed: backup/failover</text></svg>