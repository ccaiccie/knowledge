<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><style>text{font-family:Arial,sans-serif}.t{font-size:30px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.l{font-size:14px;font-weight:700}</style></defs><text x="50" y="55" class="t">Palo Alto Networks firewalling in GCP — product boundary</text><rect x="60" y="130" width="430" height="250" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/><text x="80" y="165" class="h">Google Cloud NGFW Enterprise</text><text x="80" y="200" class="b">Google-managed firewall service</text><text x="80" y="225" class="b">Distributed in Google VPC fabric</text><text x="80" y="250" class="b">Palo Alto-powered threat prevention</text><text x="80" y="275" class="b">Google firewall policies/security profiles</text><text x="80" y="300" class="b">No customer PAN-OS VM required</text><rect x="585" y="130" width="430" height="250" rx="14" fill="#fce8e6" stroke="#d93025" stroke-width="3"/><text x="605" y="165" class="h">Palo Alto VM-Series on GCP</text><text x="605" y="200" class="b">Customer-deployed PAN-OS NGFW VMs</text><text x="605" y="225" class="b">PAN-OS zones, VR, Security/NAT policy</text><text x="605" y="250" class="b">PAYG or BYOL licensing</text><text x="605" y="275" class="b">Panorama / supported Strata management</text><text x="605" y="300" class="b">Requires traffic steering/service insertion</text><rect x="1110" y="130" width="430" height="250" rx="14" fill="#e6f4ea" stroke="#188038" stroke-width="3"/><text x="1130" y="165" class="h">Google Cloud NSI + VM-Series</text><text x="1130" y="200" class="b">Google NSI intercepts selected packets</text><text x="1130" y="225" class="b">GENEVE carries original packet + metadata</text><text x="1130" y="250" class="b">VM-Series inspects and reinjects or drops</text><text x="1130" y="275" class="b">Consumer VPC keeps normal routes</text><text x="1130" y="300" class="b">Producer/consumer service model</text><path d="M490 255 L585 255" stroke="#5f6368" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="515" y="235" class="l">different data plane</text><path d="M1015 255 L1110 255" stroke="#188038" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="1035" y="235" class="l">modern insertion</text><rect x="260" y="520" width="480" height="170" rx="14" fill="#fef7e0" stroke="#f29900" stroke-width="3"/><text x="280" y="555" class="h">Palo Alto Cloud NGFW product family</text><text x="280" y="590" class="b">Palo Alto documents Cloud NGFW for AWS and Azure.</text><text x="280" y="615" class="b">Do not treat that name as a separate GCP product.</text><rect x="860" y="520" width="500" height="170" rx="14" fill="#f3e8fd" stroke="#9334e6" stroke-width="3"/><text x="880" y="555" class="h">Which GCP design should you use?</text><text x="880" y="590" class="b">Google-managed → Cloud NGFW Enterprise</text><text x="880" y="615" class="b">PAN-OS/App-ID → VM-Series</text><text x="880" y="640" class="b">Route-transparent VM-Series → NSI</text><path d="M500 520 L500 430 L800 430 L800 380" stroke="#f29900" stroke-width="4" stroke-dasharray="9 7" fill="none" marker-end="url(#a)"/><path d="M1110 520 L1110 430 L800 430" stroke="#9334e6" stroke-width="4" stroke-dasharray="9 7" fill="none" marker-end="url(#a)"/></svg>