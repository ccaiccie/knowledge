<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
<style>.t{font:700 30px Segoe UI,Arial;fill:#0f172a}.s{font:400 16px Segoe UI,Arial;fill:#475569}.bt{font:700 18px Segoe UI,Arial;fill:#0f172a}.bs{font:400 14px Segoe UI,Arial;fill:#334155}.al{font:600 13px Segoe UI,Arial;fill:#1d4ed8}.n{font:400 13px Segoe UI,Arial;fill:#7c2d12}</style></defs>
<rect width="100%" height="100%" fill="white"/><text x="40" y="48" class="t">Common Design: Route Server and NVA in the Same Hub VNet</text><text x="40" y="78" class="s">This is the simplest deployment pattern, but not a universal placement requirement.</text>
<rect x="80" y="170" width="420" height="250" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="96" y="198" class="bt">Hub VNet — simplest pattern</text><text x="96" y="225" class="bs">RouteServerSubnet /26 or larger</text><text x="96" y="245" class="bs">Azure Route Server ASN 65515</text><text x="96" y="265" class="bs">NVA subnet</text><text x="96" y="285" class="bs">NVA peers with both ARS IPs</text><text x="96" y="305" class="bs">Spokes peer to this hub</text>
<rect x="610" y="170" width="350" height="250" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="626" y="198" class="bt">Spoke VNet</text><text x="626" y="225" class="bs">Workload VM</text><text x="626" y="245" class="bs">Uses remote Route Server</text><text x="626" y="265" class="bs">Receives NVA BGP routes in effective routes</text><text x="626" y="285" class="bs">No BGP process on VM</text>
<rect x="1070" y="170" width="350" height="250" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="1086" y="198" class="bt">Why this pattern is easiest</text><text x="1086" y="225" class="bs">BGP reachability is local to hub VNet</text><text x="1086" y="245" class="bs">Data path to NVA is straightforward</text><text x="1086" y="265" class="bs">Fewer peering/transit dependencies</text><text x="1086" y="285" class="bs">Common centralized inspection design</text>
<path d="M 500 290 L 610 290" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="555.0" y="282.0" text-anchor="middle" class="al">VNet peering</text><path d="M 960 290 L 1070 290" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="1015.0" y="282.0" text-anchor="middle" class="al">Operational model</text><rect x="40" y="790" width="1420" height="80" rx="12" fill="#fff7ed" stroke="#f59e0b"/><text x="58" y="820" class="n">Same-hub placement is common because it simplifies both BGP reachability and the data path.</text><text x="58" y="842" class="n">It should not be confused with a strict requirement that every NVA must live in the Route Server VNet.</text></svg>