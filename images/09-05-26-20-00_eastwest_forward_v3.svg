<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="blue" markerWidth="16" markerHeight="16" refX="12" refY="6" orient="auto"><path d="M0 0 L0 12 L13 6 z" fill="#0078D4"/></marker><marker id="orange" markerWidth="16" markerHeight="16" refX="12" refY="6" orient="auto"><path d="M0 0 L0 12 L13 6 z" fill="#EA580C"/></marker></defs><rect width="100%" height="100%" fill="#F7F9FC"/><text x="60" y="62" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#0F172A">East-west forward path — spoke to spoke</text><text x="60" y="94" font-family="Segoe UI,Arial" font-size="16" fill="#475569">Spoke A / VM-A sends traffic to Spoke B / VM-B; only this direction is shown.</text><rect x="65" y="180" width="350" height="535" rx="26" fill="#F0FDF4" stroke="#86EFAC"/><text x="90" y="215" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#15803D">SOURCE SPOKE</text><rect x="500" y="160" width="600" height="575" rx="28" fill="#EEF6FD" stroke="#60A5FA" stroke-width="3"/><text x="535" y="198" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#075985">VIRTUAL WAN HUB</text><rect x="1185" y="180" width="350" height="535" rx="26" fill="#FAF5FF" stroke="#D8B4FE"/><text x="1210" y="215" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#7E22CE">DESTINATION SPOKE</text><rect x="115" y="330" width="250" height="125" rx="18" fill="#EAF6EA" stroke="#107C10" stroke-width="2.5"/><text x="240.0" y="390.5" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#0F172A">Spoke A / VM-A</text><text x="240.0" y="417.5" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#475569">10.10.1.4</text><rect x="560" y="275" width="220" height="105" rx="18" fill="#E8F3FC" stroke="#0078D4" stroke-width="2.5"/><text x="670.0" y="325.5" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#0F172A">vHub route lookup</text><text x="670.0" y="352.5" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#475569">classify private traffic</text><rect x="820" y="275" width="220" height="105" rx="18" fill="#F0ECFF" stroke="#6B4EFF" stroke-width="2.5"/><text x="930.0" y="325.5" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#0F172A">Routing Intent</text><text x="930.0" y="352.5" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#475569">Private Traffic → NVA</text><rect x="690" y="500" width="220" height="120" rx="18" fill="#FDEBEC" stroke="#D13438" stroke-width="2.5"/><text x="800.0" y="558.0" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#0F172A">Integrated NGFW</text><text x="800.0" y="585.0" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#475569">stateful inspection</text><rect x="1235" y="330" width="250" height="125" rx="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2.5"/><text x="1360.0" y="390.5" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#0F172A">Spoke B / VM-B</text><text x="1360.0" y="417.5" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#475569">10.20.1.4</text><line x1="365" y1="392" x2="560" y2="327" stroke="#0078D4" stroke-width="6" stroke-linecap="round" marker-end="url(#blue)"/><rect x="384.5" y="330.5" width="156" height="28" rx="14" fill="#fff" stroke="#0078D4"/><text x="462.5" y="349.5" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#0078D4">VNet connection</text><circle cx="462.5" cy="379.5" r="15" fill="#0078D4"/><text x="462.5" y="384.5" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#fff">1</text><line x1="780" y1="327" x2="820" y2="327" stroke="#0078D4" stroke-width="6" stroke-linecap="round" marker-end="url(#blue)"/><rect x="722.0" y="298.0" width="156" he