<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="760" viewBox="0 0 1350 760"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#333"/></marker></defs><rect width="1350" height="760" fill="white"/>
<text x="675" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">Legacy SAN through a PRP RedBox — Failure of LAN A</text>
<rect x="60" y="305" width="220" height="110" rx="18" fill="#f2f2f2" stroke="#555" stroke-width="2"/><text x="170" y="345" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">SAN</text><text x="170" y="375" text-anchor="middle" font-family="Arial" font-size="15">ordinary Ethernet endpoint</text>
<rect x="385" y="285" width="240" height="150" rx="20" fill="#fff1cc" stroke="#a77d00" stroke-width="3"/><text x="505" y="330" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">PRP RedBox</text><text x="505" y="362" text-anchor="middle" font-family="Arial" font-size="15">duplicate outbound</text><text x="505" y="388" text-anchor="middle" font-family="Arial" font-size="15">discard inbound duplicate</text>
<rect x="760" y="115" width="300" height="145" rx="20" fill="#fdeceb" stroke="#b83b32" stroke-width="3"/><text x="910" y="155" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">LAN A</text><line x1="805" y1="205" x2="1015" y2="205" stroke="#b83b32" stroke-width="8"/><line x1="840" y1="170" x2="980" y2="235" stroke="#7a0000" stroke-width="8"/><line x1="980" y1="170" x2="840" y2="235" stroke="#7a0000" stroke-width="8"/><text x="910" y="245" text-anchor="middle" font-family="Arial" font-size="15">FAILED</text>
<rect x="760" y="490" width="300" height="145" rx="20" fill="#eaf2fc" stroke="#2c6db2" stroke-width="3"/><text x="910" y="530" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">LAN B</text><text x="910" y="565" text-anchor="middle" font-family="Arial" font-size="16">healthy copy continues</text>
<rect x="1120" y="305" width="180" height="110" rx="18" fill="#eef2f7" stroke="#334e68" stroke-width="2"/><text x="1210" y="345" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">DANP</text><text x="1210" y="375" text-anchor="middle" font-family="Arial" font-size="15">destination</text>
<path d="M280 360 L385 360" stroke="#555" stroke-width="5" fill="none" marker-end="url(#m)"/><text x="330" y="345" text-anchor="middle" font-family="Arial" font-size="14">1 ordinary frame</text>
<path d="M625 325 C680 260 705 200 760 185" stroke="#b83b32" stroke-width="5" fill="none" marker-end="url(#m)"/><text x="675" y="245" font-family="Arial" font-size="14">2A copy lost</text>
<path d="M625 395 C690 470 715 545 760 560" stroke="#2c6db2" stroke-width="5" fill="none" marker-end="url(#m)"/><text x="675" y="490" font-family="Arial" font-size="14">2B healthy copy</text>
<path d="M1060 560 C1110 530 1150 470 1185 415" stroke="#2c6db2" stroke-width="5" fill="none" marker-end="url(#m)"/><text x="1110" y="515" font-family="Arial" font-size="14">3 delivered</text>
<text x="675" y="705" text-anchor="middle" font-family="Arial" font-size="16">The LAN failure is masked for traffic, but monitoring must report the loss of redundancy.</text></svg>