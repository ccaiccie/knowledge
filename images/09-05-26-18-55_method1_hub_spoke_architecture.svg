<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
<defs>
<style>
.title{font:700 28px Arial,sans-serif;fill:#16233A}.h{font:700 20px Arial,sans-serif;fill:#16233A}.s{font:16px Arial,sans-serif;fill:#24364B}.tiny{font:14px Arial,sans-serif;fill:#36516C}
.hub{fill:#EAF4FF;stroke:#0078D4;stroke-width:3}.spokeA{fill:#E8F7F0;stroke:#16A085;stroke-width:3}.spokeB{fill:#EEF1FF;stroke:#5B65D8;stroke-width:3}.fw{fill:#FFF1E8;stroke:#F26B38;stroke-width:3}.gw{fill:#F1EBFF;stroke:#7B61FF;stroke-width:3}.shared{fill:#E8FAFB;stroke:#20A4B8;stroke-width:3}.onprem{fill:#F1F3F5;stroke:#56606B;stroke-width:3}.internet{fill:#E9F4FF;stroke:#1784D5;stroke-width:3}.peer{fill:none;stroke:#0078D4;stroke-width:3}.hybrid{fill:none;stroke:#7B61FF;stroke-width:3}.public{fill:none;stroke:#1784D5;stroke-width:3;stroke-dasharray:10 7}.label{fill:#fff;stroke:#D9E2EC;stroke-width:1.5}.note{fill:#F8FAFC;stroke:#CAD6E2;stroke-width:1.5}
</style>
</defs>
<rect width="1600" height="920" fill="#FFFFFF"/>
<text x="60" y="55" class="title">Method 1 — Azure Firewall in a Customer-Managed Hub VNet</text>
<text x="60" y="84" class="s">Base topology only: component placement and structural connectivity, without mixing packet-flow use cases.</text>

<rect x="470" y="110" width="660" height="690" rx="28" class="hub"/>
<text x="680" y="150" class="h">Hub VNet 10.0.0.0/16</text>

<rect x="615" y="205" width="370" height="125" rx="18" class="fw"/>
<text x="716" y="246" class="h">Azure Firewall</text>
<text x="674" y="278" class="s">AzureFirewallSubnet 10.0.1.0/26</text>
<text x="727" y="305" class="s">Private IP 10.0.1.4</text>

<rect x="615" y="430" width="370" height="110" rx="18" class="gw"/>
<text x="672" y="472" class="h">VPN / ExpressRoute Gateway</text>
<text x="697" y="505" class="s">GatewaySubnet 10.0.2.0/27+</text>

<rect x="615" y="635" width="370" height="115" rx="18" class="shared"/>
<text x="711" y="675" class="h">Shared Services</text>
<text x="747" y="705" class="s">10.0.3.0/24</text>
<text x="682" y="732" class="s">DNS · Bastion · Monitoring</text>

<rect x="70" y="210" width="310" height="220" rx="25" class="spokeA"/>
<text x="155" y="248" class="h">Spoke A VNet</text>
<text x="156" y="277" class="s">10.10.0.0/16</text>
<rect x="110" y="300" width="230" height="80" rx="16" fill="#FFFFFF" stroke="#16A085" stroke-width="2"/>
<text x="136" y="332" class="s">AppSubnet 10.10.1.0/24</text>
<text x="160" y="360" class="s">VM 10.10.1.10</text>

<rect x="1220" y="210" width="310" height="220" rx="25" class="spokeB"/>
<text x="1305" y="248" class="h">Spoke B VNet</text>
<text x="1305" y="277" class="s">10.20.0.0/16</text>
<rect x="1260" y="300" width="230" height="80" rx="16" fill="#FFFFFF" stroke="#5B65D8" stroke-width="2"/>
<text x="1286" y="332" class="s">AppSubnet 10.20.1.0/24</text>
<text x="1310" y="360" class="s">VM 10.20.1.20</text>

<rect x="95" y="650" width="280" height="110" rx="18" class="onprem"/>
<text x="153" y="692" class="h">On-premises network</text>
<text x="163" y="727" class="s">172.16.0.0/16</text>

<rect x="1225" y="650" width="280" height="110" rx="18" class="internet"/>
<text x="1335" y="692" class="h">Internet</text>
<text x="1307" y="727" class="s">Public networks</text>

<path d="M380 320 H430 H470" class="peer"/>
<rect x="397" y="289" width="120" height="28" rx="7" class="label"/>
<text x="414" y="309" class="tiny">VNet peering</text>

<path d="M1220 320 H1170 H1130" class="peer"/>
<rect x="1084" y="289" width="120" height="28" rx="7" class="label"/>
<text x="1101" y="309" class="tiny">VNet peering</text>

<path d="M375 705 H460 V485 H615" class="hybrid"/>
<rect x="280" y="558" width="190" height="30" rx="7" class="label"/>
<text x="295" y="579" class="tiny">Optional hybrid connectivity</text>

<path d="M1225 705 H1160 V267 H985" class="public"/>
<rect x="1082" y="462" width="250" height="30" rx="7" class="label"/>
<text x="1097" y="483" class="tiny">Public connectivity / firewall public IPs</text>

<rect x="220" y="835" width="1160" height="50" rx="12" class="note"/>
<text x="316" y="866" class="s">Base topology only — packet directions, UDR decisions, NAT, and symmetric return paths are shown in the dedicated flow diagrams.</text>
</svg>