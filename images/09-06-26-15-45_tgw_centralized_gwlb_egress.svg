<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1000" viewBox="0 0 1900 1000"><defs><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px}.m{font-family:monospace;font-size:13px}.box{fill:#fff;stroke:#64748b;stroke-width:2}.f{fill:none;stroke:#d97706;stroke-width:4;marker-end:url(#o)}.rf{fill:none;stroke:#dc2626;stroke-width:4;marker-end:url(#r)}.gf{fill:none;stroke:#16a34a;stroke-width:4;marker-end:url(#g)}</style></defs><text x="30" y="45" class="t">Centralized Internet Egress — Spoke → TGW → Inspection VPC → GWLBE/GWLB/NGFW → NAT → IGW</text><rect x="40" y="130" width="300" height="125" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="60" y="165" class="h">Spoke A 10.10.0.0/16</text><text x="60" y="195" class="s">EC2-A 10.10.10.10</text><text x="60" y="225" class="m">RT-A-App: 0.0.0.0/0 → tgw-1</text><rect x="430" y="130" width="320" height="125" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="450" y="165" class="h">TGW-RT-SPOKES</text><text x="450" y="198" class="m">0.0.0.0/0 → att-Inspection</text><text x="450" y="228" class="s">Associated with spoke attachments</text><rect x="840" y="120" width="360" height="145" rx="10" class="box"/><text x="860" y="155" class="h">Inspection TGW subnet AZ-a</text><text x="860" y="185" class="s">10.255.200.0/28</text><text x="860" y="218" class="m">RT-Insp-TGW-a:</text><text x="860" y="245" class="m">0.0.0.0/0 → vpce-gwlb-a</text><rect x="1290" y="110" width="390" height="165" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="1310" y="145" class="h">GWLBE-a 10.255.100.0/28</text><text x="1310" y="177" class="s">GWLB endpoint service</text><text x="1310" y="207" class="s">GWLB → GENEVE/6081 → NGFW</text><text x="1310" y="240" class="m">RT-GWLBE-a: 0.0.0.0/0 → nat-a</text><rect x="1290" y="390" width="390" height="185" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="1310" y="425" class="h">NAT Gateway nat-a</text><text x="1310" y="455" class="s">Public subnet 10.255.40.0/24</text><text x="1310" y="485" class="s">SNAT: 10.10.10.10 → EIP</text><text x="1310" y="515" class="m">RT-NAT-a: 0.0.0.0/0 → IGW</text><text x="1310" y="545" class="m">10.10.0.0/16 → vpce-gwlb-a</text><rect x="1290" y="690" width="390" height="105" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/><text x="1350" y="730" class="h">Internet Gateway</text><text x="1350" y="765" class="s">→ Internet 1.1.1.1:443</text><rect x="80" y="390" width="1040" height="300" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text x="105" y="425" class="h">Return path</text><text x="105" y="465" class="s">Internet → IGW → NAT Gateway reverse NAT → NAT-subnet route for 10.10.0.0/16</text><text x="105" y="495" class="s">→ GWLBE-a → GWLB/NGFW → same GWLBE → GWLBE RT 10.10.0.0/16 → TGW</text><text x="105" y="525" class="s">→ TGW-RT-INSPECTION → Spoke A attachment → EC2-A.</text><text x="105" y="575" class="h">Critical route</text><text x="105" y="610" class="m">RT-NAT-a: 10.10.0.0/16 → vpce-gwlb-a</text><text x="105" y="645" class="s">Without this return route, reverse-translated traffic can bypass inspection.</text><rect x="430" y="760" width="330" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="450" y="795" class="h">TGW-RT-INSPECTION</text><text x="450" y="830" class="m">10.10.0.0/16 → att-Spoke-A</text><text x="450" y="860" class="m">10.20.0.0/16 → att-Spoke-B</text><path d="M340 192 H430" class="f"/><path d="M750 192 H840" class="f"/><path d="M1200 192 H1290" class="rf"/><path d="M1485 275 V390" class="gf"/><path d="M1485 575 V690" class="gf"/></svg>