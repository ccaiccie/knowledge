ly="Arial" font-size="14">10.20.1.4</text><text x="920" y="309" text-anchor="middle" font-family="Arial" font-size="14">PE subnet 10.20.1.0/24</text><rect x="810" y="420" rx="12" ry="12" width="220" height="95" fill="#d5e8d4" stroke="#444" stroke-width="2"/><text x="920" y="457" text-anchor="middle" font-family="Arial" font-size="14">Azure SQL / PaaS</text><text x="920" y="479" text-anchor="middle" font-family="Arial" font-size="14">Private Link service</text><polyline points="155,285 342,285 342,285 530,285" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="342" y="277" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">1. UDR sends PE traffic to firewall</text><polyline points="530,285 725,285 725,285 920,285" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="725" y="277" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">2. Allow + SNAT to firewall IP</text><polyline points="920,285 1080,285 1080,467 920,467" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="1090" y="375" font-family="Arial" font-size="12" font-weight="bold">3. Private Link</text><polyline points="920,467 760,467 760,330 920,330" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="750" y="400" text-anchor="end" font-family="Arial" font-size="12" font-weight="bold">4. Return</text><polyline points="920,330 725,330 725,330 530,330" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="725" y="350" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">5. Return follows SNAT state</text><polyline points="530,330 342,330 342,330 155,330" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="342" y="350" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">6. Reverse SNAT</text><polyline points="155,285 300,285 300,467 420,467" fill="none" stroke="#777" stroke-width="2"