<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
  <defs>
    <marker id="blueArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0,12 4,0 8" fill="#0969da"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0,12 4,0 8" fill="#1a7f37"/></marker>
    <marker id="purpleArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0,12 4,0 8" fill="#8250df"/></marker>
    <style>
      .title{font:700 30px Arial,Helvetica,sans-serif;fill:#24292f}
      .subtitle{font:17px Arial,Helvetica,sans-serif;fill:#57606a}
      .zone{font:700 21px Arial,Helvetica,sans-serif;fill:#24292f}
      .label{font:17px Arial,Helvetica,sans-serif;fill:#24292f}
      .small{font:15px Arial,Helvetica,sans-serif;fill:#57606a}
      .step{font:700 16px Arial,Helvetica,sans-serif;fill:#24292f}
      .tiny{font:14px Arial,Helvetica,sans-serif;fill:#57606a}
    </style>
  </defs>
  <rect width="2000" height="1200" fill="#ffffff"/>
  <text x="55" y="52" class="title">Azure Private Endpoint Inspection — Detailed Hub/Spoke Architecture and Packet Flow</text>
  <text x="55" y="84" class="subtitle">Separate DNS/control-plane, forward-flow, inspection/SNAT, Private Link, and return-flow lanes. Example uses Azure SQL over a Private Endpoint.</text>

  <!-- DNS CONTROL PLANE -->
  <rect x="45" y="115" width="1910" height="170" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="70" y="150" class="zone">DNS / Name Resolution Control Plane</text>
  <rect x="105" y="178" width="265" height="76" rx="12" fill="#dbeafe" stroke="#0969da" stroke-width="2"/>
  <text x="238" y="207" text-anchor="middle" class="label" font-weight="700">Client DNS Query</text>
  <text x="238" y="232" text-anchor="middle" class="small">sql1.database.windows.net</text>
  <rect x="735" y="168" width="420" height="94" rx="12" fill="#f3e8ff" stroke="#8250df" stroke-width="2"/>
  <text x="945" y="198" text-anchor="middle" class="label" font-weight="700">Private DNS Zone / Resolver Path</text>
  <text x="945" y="224" text-anchor="middle" class="small">privatelink.database.windows.net</text>
  <text x="945" y="246" text-anchor="middle" class="small">A record resolves service name to PE IP 10.20.1.4</text>
  <line x1="370" y1="207" x2="735" y2="207" stroke="#8250df" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#purpleArrow)"/>
  <text x="552" y="194" text-anchor="middle" class="step">D1. Query</text>
  <line x1="735" y1="242" x2="370" y2="242" stroke="#8250df" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#purpleArrow)"/>
  <text x="552" y="266" text-anchor="middle" class="step">D2. Answer = 10.20.1.4</text>
  <rect x="1355" y="168" width="500" height="94" rx="12" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
  <text x="1605" y="197" text-anchor="middle" class="label" font-weight="700">Operational Requirement</text>
  <text x="1605" y="223" text-anchor="middle" class="small">Application continues using normal service FQDN.</text>
  <text x="1605" y="245" text-anchor="middle" class="small">Do not validate PE routing while DNS still returns a public endpoint.</text>

  <!-- VNET CONTAINERS -->
  <rect x="45" y="330" width="410" height="725" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2.5"/>
  <text x="70" y="370" class="zone">Workload Spoke VNet</text>
  <text x="70" y="398" class="small">10.10.0.0/16</text>
  <rect x="515" y="330" width="610" height="725" rx="20" fill="#fff8c5" stroke="#bf8700" stroke-width="2.5"/>
  <text x="540" y="370" class="zone">Hub VNet</text>
  <text x="540" y="398" class="small">10.0.0.0/16</text>
  <rect x="1185" y="330" width="420" height="725" rx="20" fill="#dafbe1" stroke="#1a7f37" stroke-width="2.5"/>
  <text x="1210" y="370" class="zone">Private Endpoint VNet</text>
  <text x="1210" y="398" class="small">10.20.0.0/16</text>
  <rect x="1665" y="420" width="290" height="520" rx="20" fill="#ddf4ff" stroke="#0969da" stroke-width="2.5"/>
  <text x="1810" y="460" text-anchor="middle" class="zone">Azure PaaS Service</text>
  <text x="1810" y="490" text-anchor="middle" class="small">Example: Azure SQL</text>
  <text x="1810" y="516" text-anchor="middle" class="small">Private Link service</text>

  <!-- WORKLOAD SPOKE OBJECTS -->
  <rect x="105" y="465" width="285" height="125" rx="14" fill="#dbeafe" stroke="#0969da" stroke-width="2.5"/>
  <text x="248" y="505" text-anchor="middle" class="label" font-weight="700">Client VM</text>
  <text x="248" y="537" text-anchor="middle" class="label">10.10.1.4</text>
  <text x="248" y="565" text-anchor="middle" class="small">App subnet 10.10.1.0/24</text>

  <rect x="90" y="675" width="315" height="155" rx="14" fill="#fff3cd" stroke="#bf8700" stroke-width="2"/>
  <text x="248" y="712" text-anchor="middle" class="label" font-weight="700">Route Table: rt-app</text>
  <text x="248" y="744" text-anchor="middle" class="small">10.20.0.0/16</text>
  <text x="248" y="770" text-anchor="middle" class="small">Next hop type: VirtualAppliance</text>
  <text x="248" y="797" text-anchor="middle" class="label" font-weight="700">Next hop IP: 10.0.1.4</text>

  <rect x="90" y="880" width="315" height="105" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="248" y="915" text-anchor="middle" class="label" font-weight="700">Effective Route Check</text>
  <text x="248" y="943" text-anchor="middle" class="small">PE prefix must resolve to</text>
  <text x="248" y="968" text-anchor="middle" class="small">VirtualAppliance → 10.0.1.4</text>

  <!-- HUB OBJECTS -->
  <rect x="565" y="445" width="510" height="315" rx="16" fill="#ffffff" stroke="#bf8700" stroke-width="2"/>
  <text x="590" y="480" class="label" font-weight="700">AzureFirewallSubnet</text>
  <text x="590" y="506" class="small">10.0.1.0/26</text>

  <rect x="655" y="530" width="330" height="145" rx="14" fill="#ffebe9" stroke="#cf222e" stroke-width="2.5"/>
  <text x="820" y="570" text-anchor="middle" class="label" font-weight="700">Azure Firewall</text>
  <text x="820" y="603" text-anchor="middle" class="label">Private IP: 10.0.1.4</text>
  <text x="820" y="631" text-anchor="middle" class="small">Stateful inspection + policy evaluation</text>
  <text x="820" y="655" text-anchor="middle" class="small">SNAT creates symmetric PE return path</text>

  <rect x="565" y="800" width="230" height="150" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="680" y="835" text-anchor="middle" class="label" font-weight="700">Firewall Policy</text>
  <text x="680" y="865" text-anchor="middle" class="small">Application rule preferred</text>
  <text x="680" y="891" text-anchor="middle" class="small">when protocol supports it</text>
  <text x="680" y="917" text-anchor="middle" class="small">Example: SQL TCP/1433</text>

  <rect x="835" y="800" width="240" height="150" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="955" y="835" text-anchor="middle" class="label" font-weight="700">State / NAT Table</text>
  <text x="955" y="866" text-anchor="middle" class="small">Original:</text>
  <text x="955" y="890" text-anchor="middle" class="tiny">10.10.1.4:53000 → 10.20.1.4:1433</text>
  <text x="955" y="916" text-anchor="middle" class="small">PE-facing source:</text>
  <text x="955" y="940" text-anchor="middle" class="tiny">10.0.1.4:* → 10.20.1.4:1433</text>

  <!-- PE VNET OBJECTS -->
  <rect x="1235" y="445" width="320" height="345" rx="16" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="1260" y="480" class="label" font-weight="700">PE Subnet</text>
  <text x="1260" y="507" class="small">10.20.1.0/24</text>

  <rect x="1280" y="555" width="230" height="130" rx="14" fill="#dcffe4" stroke="#1a7f37" stroke-width="2.5"/>
  <text x="1395" y="593" text-anchor="middle" class="label" font-weight="700">Private Endpoint NIC</text>
  <text x="1395" y="626" text-anchor="middle" class="label">10.20.1.4</text>
  <text x="1395" y="655" text-anchor="middle" class="small">Azure-managed endpoint NIC</text>

  <rect x="1235" y="835" width="320" height="150" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1395" y="870" text-anchor="middle" class="label" font-weight="700">Private Endpoint Network Policies</text>
  <text x="1395" y="903" text-anchor="middle" class="label" font-weight="700">Enabled</text>
  <text x="1395" y="931" text-anchor="middle" class="small">Required for UDR / NSG enforcement</text>
  <text x="1395" y="957" text-anchor="middle" class="small">when overriding PE routing behavior</text>

  <!-- PAAS INNER -->
  <rect x="1710" y="560" width="200" height="160" rx="14" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="1810" y="602" text-anchor="middle" class="label" font-weight="700">SQL Service</text>
  <text x="1810" y="633" text-anchor="middle" class="small">Receives traffic through</text>
  <text x="1810" y="658" text-anchor="middle" class="small">Azure Private Link</text>
  <text x="1810" y="687" text-anchor="middle" class="small">No public data path used</text>

  <!-- PEERING LABELS -->
  <text x="485" y="434" text-anchor="middle" class="tiny">VNet peering</text>
  <text x="485" y="455" text-anchor="middle" class="tiny">allow forwarded traffic</text>
  <text x="1155" y="434" text-anchor="middle" class="tiny">VNet peering</text>
  <text x="1155" y="455" text-anchor="middle" class="tiny">hub ↔ PE VNet</text>

  <!-- FORWARD FLOW LANE -->
  <text x="70" y="1088" class="zone" fill="#0969da">Forward flow</text>
  <line x1="390" y1="520" x2="655" y2="570" stroke="#0969da" stroke-width="4" marker-end="url(#blueArrow)"/>
  <text x="520" y="518" text-anchor="middle" class="step">1. Route lookup selects UDR</text>
  <text x="520" y="541" text-anchor="middle" class="tiny">dst 10.20.1.4 → next hop 10.0.1.4</text>

  <line x1="985" y1="585" x2="1280" y2="585" stroke="#0969da" stroke-width="4" marker-end="url(#blueArrow)"/>
  <text x="1132" y="555" text-anchor="middle" class="step">2. Firewall allows + SNATs</text>
  <text x="1132" y="578" text-anchor="middle" class="tiny">source becomes firewall private address</text>

  <line x1="1510" y1="620" x2="1710" y2="620" stroke="#0969da" stroke-width="4" marker-end="url(#blueArrow)"/>
  <text x="1610" y="590" text-anchor="middle" class="step">3. Private Link</text>
  <text x="1610" y="613" text-anchor="middle" class="tiny">PE maps flow to PaaS subresource</text>

  <!-- RETURN FLOW LANE -->
  <text x="70" y="1130" class="zone" fill="#1a7f37">Return flow</text>
  <line x1="1710" y1="690" x2="1510" y2="690" stroke="#1a7f37" stroke-width="4" marker-end="url(#greenArrow)"/>
  <text x="1610" y="724" text-anchor="middle" class="step">4. Service reply returns through PE</text>

  <polyline points="1280,700 1170,700 1170,735 985,735" fill="none" stroke="#1a7f37" stroke-width="4" marker-end="url(#greenArrow)"/>
  <text x="1128" y="775" text-anchor="middle" class="step">5. Reply targets SNAT owner</text>
  <text x="1128" y="798" text-anchor="middle" class="tiny">destination = firewall-side translated session</text>

  <polyline points="655,735 500,735 500,640 390,640" fill="none" stroke="#1a7f37" stroke-width="4" marker-end="url(#greenArrow)"/>
  <text x="520" y="770" text-anchor="middle" class="step">6. Reverse SNAT + route to client</text>

  <!-- KEY NOTES -->
  <rect x="45" y="1090" width="1910" height="70" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="260" y="1120" class="small">Blue = forward path</text>
  <text x="500" y="1120" class="small">Green = return path</text>
  <text x="730" y="1120" class="small">Purple dashed = DNS/control plane</text>
  <text x="1070" y="1120" class="small">Key point: SNAT is what makes the PE-side return path unambiguously stateful through the firewall.</text>
  <text x="1070" y="1147" class="small">A generic 0.0.0.0/0 route alone is not sufficient when a more-specific PE route wins longest-prefix matching.</text>
</svg>