<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><rect width="1600" height="850" fill="white"/><text x="800" y="48" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle">Spoke / Distributed Ingress: Symmetry Stays Inside the Application VPC</text><rect x="210" y="110" width="1170" height="620" rx="24" fill="#f8fafc" stroke="#374151" stroke-width="2"/><text x="795" y="145" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle">Application VPC</text><rect x="40" y="300" width="120" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/><text x="100" y="335" font-family="Arial" font-size="18" text-anchor="middle" font-weight="700">Internet</text><text x="100" y="360" font-family="Arial" font-size="15" text-anchor="middle">Client IP</text><rect x="260" y="285" width="150" height="100" rx="12" fill="#ecfeff" stroke="#0891b2"/><text x="335" y="325" font-family="Arial" font-size="20" text-anchor="middle" font-weight="700">IGW</text><text x="335" y="352" font-family="Arial" font-size="14" text-anchor="middle">edge route table</text><rect x="500" y="285" width="180" height="100" rx="12" fill="#eff6ff" stroke="#2563eb"/><text x="590" y="322" font-family="Arial" font-size="20" text-anchor="middle" font-weight="700">GWLBE-a</text><text x="590" y="350" font-family="Arial" font-size="14" text-anchor="middle">same application VPC</text><rect x="760" y="190" width="230" height="110" rx="14" fill="#fef3c7" stroke="#d97706"/><text x="875" y="225" font-family="Arial" font-size="20" text-anchor="middle" font-weight="700">Central GWLB + NGFW</text><text x="875" y="253" font-family="Arial" font-size="15" text-anchor="middle">service-provider VPC</text><text x="875" y="278" font-family="Arial" font-size="15" text-anchor="middle">GENEVE / transparent</text><rect x="1070" y="285" width="210" height="100" rx="12" fill="#fff7ed" stroke="#ea580c"/><text x="1175" y="322" font-family="Arial" font-size="20" text-anchor="middle" font-weight="700">Public ALB / NLB</text><text x="1175" y="350" font-family="Arial" font-size="14" text-anchor="middle">or public EC2/EIP resource</text><rect x="1070" y="510" width="210" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a"/><text x="1175" y="547" font-family="Arial" font-size="20" text-anchor="middle" font-weight="700">Backend</text><text x="1175" y="575" font-family="Arial" font-size="14" text-anchor="middle">private subnet</text><path d="M160 340 H260" stroke="#d97706" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M410 335 H500" stroke="#d97706" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M680 325 C720 260,730 245,760 245" stroke="#d97706" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M990 245 C1030 260,1040 305,1070 325" stroke="#d97706" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M1175 385 V510" stroke="#d97706" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M1070 560 C900 680,650 680,590 385" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#b)"/><path d="M590 285 C620 170,760 170,760 215" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#b)"/><path d="M760 275 C690 420,500 430,410 355" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#b)"/><path d="M260 355 H160" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#b)"/><text x="800" y="675" font-family="Arial" font-size="17" fill="#2563eb" font-weight="700" text-anchor="middle">Return path is forced by the application-VPC subnet/edge route tables back through the same local GWLBE path — no TGW re-entry into a centralized ingress VPC.</text><rect x="350" y="755" width="900" height="60" rx="10" fill="#f0f9ff" stroke="#0369a1"/><text x="800" y="790" font-family="Arial" font-size="16" text-anchor="middle">Important: this removes the Experian TGW-AZ recovery problem, but NLB client-IP preservation is still unsupported if NLB→target traffic itself traverses a GWLBE.</text></svg>