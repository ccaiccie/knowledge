<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980"><defs><marker id="fo" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/></marker><marker id="rb" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/></marker></defs><rect width="1700" height="980" fill="white"/><text x="850" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Distributed / Spoke Internet Ingress — Local GWLBE Keeps the Return Path Symmetric</text><rect x="360" y="75" width="980" height="45" rx="10" fill="#f8fafc" stroke="#64748b"/><text x="850" y="103" text-anchor="middle" font-family="Arial" font-size="16">Forward flow = orange   |   Return flow = blue   |   All ingress/return steering stays in the Application VPC</text><rect x="40" y="260" width="150" height="95" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="115" y="298" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Internet Client</text><text x="115" y="326" text-anchor="middle" font-family="Arial" font-size="15">198.51.100.25</text><rect x="230" y="140" width="1040" height="650" rx="22" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="750" y="173" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Application VPC — AZ-a local data plane</text><rect x="285" y="240" width="210" height="120" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="390" y="276" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Internet Gateway</text><text x="390" y="302" text-anchor="middle" font-family="Arial" font-size="15">IGW edge route table</text><text x="390" y="328" text-anchor="middle" font-family="Arial" font-size="15">protected subnet → GWLBE-a</text><rect x="570" y="240" width="210" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="675" y="276" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">GWLBE-a</text><text x="675" y="302" text-anchor="middle" font-family="Arial" font-size="15">local zonal endpoint</text><text x="675" y="328" text-anchor="middle" font-family="Arial" font-size="15">route-table next hop</text><rect x="905" y="240" width="260" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1035" y="274" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Public ALB / NLB / EC2-EIP</text><text x="1035" y="300" text-anchor="middle" font-family="Arial" font-size="15">public endpoint in app VPC</text><text x="1035" y="326" text-anchor="middle" font-family="Arial" font-size="15">accepted traffic continues to backend</text><rect x="905" y="565" width="260" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="1035" y="600" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Backend / target subnet</text><text x="1035" y="626" text-anchor="middle" font-family="Arial" font-size="15">10.10.10.20</text><text x="1035" y="652" text-anchor="middle" font-family="Arial" font-size="15">return route toward local ingress path</text><rect x="520" y="565" width="300" height="135" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="670" y="597" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Return routing inside Application VPC</text><text x="670" y="622" text-anchor="middle" font-family="Arial" font-size="14">public-resource / subnet route table</text><text x="670" y="646" text-anchor="middle" font-family="Arial" font-size="14">0.0.0.0/0 or protected path → GWLBE-a</text><text x="670" y="670" text-anchor="middle" font-family="Arial" font-size="14">No TGW return-AZ reconstruction</text><rect x="1320" y="180" width="330" height="430" rx="22" fill="#fffbeb" stroke="#92400e" stroke-width="2"/><text x="1485" y="214" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Security / Service Provider VPC</text><rect x="1370" y="280" width="230" height="105" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1485" y="313" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Gateway Load Balancer</text><text x="1485" y="338" text-anchor="middle" font-family="Arial" font-size="15">GENEVE / UDP 6081</text><text x="1485" y="361" text-anchor="middle" font-family="Arial" font-size="15">flow stickiness</text><rect x="1370" y="455" width="230" height="105" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="1485" y="488" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">NGFW Fleet</text><text x="1485" y="513" text-anchor="middle" font-family="Arial" font-size="15">stateful inspection</text><text x="1485" y="536" text-anchor="middle" font-family="Arial" font-size="15">original flow preserved</text><rect x="430" y="745" width="830" height="65" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="2"/><text x="845" y="773" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700">NLB caveat: local symmetry does NOT make preserve_client_ip supported when the NLB-to-target leg itself traverses a GWLBE.</text><text x="845" y="796" text-anchor="middle" font-family="Arial" font-size="14">Keep edge inspection (IGW → GWLBE → NLB) distinct from post-NLB inspection.</text><rect x="330" y="835" width="1030" height="75" rx="10" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/><text x="845" y="866" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Why this is simpler than centralized ingress</text><text x="845" y="891" text-anchor="middle" font-family="Arial" font-size="15">The packet never returns through TGW into a separate Ingress VPC; the same application-VPC routing domain selects GWLBE-a in both directions.</text><!-- Forward --><path d="M190 308 H285" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#fo)"/><text x="235" y="294" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#d97706">1 inbound</text><path d="M495 300 H570" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#fo)"/><text x="532" y="286" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#d97706">2 IGW edge route</text><path d="M780 260 V185 H1280 V315 H1370" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#fo)"/><text x="1025" y="171" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#d97706">3 PrivateLink service chain</text><path d="M1485 385 V455" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#fo)"/><text x="1515" y="425" font-family="Arial" font-size="13" font-weight="700" fill="#d97706">4 GENEVE</text><path d="M1600 510 H1630 V330 H1600" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#fo)"/><text x="1640" y="420" font-family="Arial" font-size="13" font-weight="700" fill="#d97706" transform="rotate(-90 1640 420)">5 allow / return to GWLB</text><path d="M1370 350 H1280 V400 H840 V345 H780" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#fo)"/><text x="1080" y="388" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#d97706">6 back through GWLBE-a</text><path d="M780 320 H905" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#fo)"/><text x="842" y="306" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#d97706">7 to public endpoint</text><path d="M1035 360 V565" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#fo)"/><text x="1060" y="470" font-family="Arial" font-size="13" font-weight="700" fill="#d97706">8 LB / resource forwards</text><!-- Return --><path d="M1165 625 H1210 V405 H1100 V360" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="1225" y="505" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb" transform="rotate(-90 1225 505)">9 backend return</text><path d="M905 340 H850 V625 H820" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="836" y="500" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb" transform="rotate(-90 836 500)">10 endpoint subnet route</text><path d="M520 625 H470 V420 H650 V360" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="455" y="505" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb" transform="rotate(-90 455 505)">11 select local GWLBE-a</text><path d="M780 470 H1280 V350 H1370" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="1040" y="458" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb">12 service chain</text><path d="M1485 385 V455" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="1453" y="425" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb">13 stateful return</text><path d="M1600 520 H1640 V320 H1600" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="1650" y="420" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb" transform="rotate(-90 1650 420)">14 return through GWLB</text><path d="M1370 365 H1280 V535 H830 V345 H780" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="1060" y="522" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb">15 back to GWLBE-a</text><path d="M570 340 H530 V510 H390 V360" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="505" y="495" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb">16 IGW path</text><path d="M285 340 H240 V500 H115 V355" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="190" y="488" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb">17 Internet</text></svg>