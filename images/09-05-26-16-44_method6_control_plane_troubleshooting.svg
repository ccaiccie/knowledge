<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#0078D4"/></marker><style>.h{font:700 20px Segoe UI,Arial;fill:#0f172a}.t{font:15px Segoe UI,Arial;fill:#334155}.s{font:13px Segoe UI,Arial;fill:#475569}.b{stroke:#94a3b8;stroke-width:2;rx:18}.f{stroke:#0078D4;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="100%" height="100%" fill="white"/><text x="60" y="65" style="font:700 30px Segoe UI,Arial;fill:#0f172a">Control plane and troubleshooting checkpoints</text><rect x="60" y="170" width="310" height="470" fill="#f8fafc" class="b"/><text x="215" y="220" text-anchor="middle" class="h">Azure onboarding</text><text x="215" y="275" text-anchor="middle" class="t">1. Add security partner</text><text x="215" y="315" text-anchor="middle" class="t">2. Provider discovers hub</text><text x="215" y="355" text-anchor="middle" class="t">3. Tunnel provisioned</text><text x="215" y="395" text-anchor="middle" class="t">4. Opt in VNet/branch</text><text x="215" y="435" text-anchor="middle" class="t">5. 0.0.0.0/0 distributed</text><text x="215" y="520" text-anchor="middle" class="s">Do not manually advertise branch 0/0</text><text x="215" y="545" text-anchor="middle" class="s">just to recreate the integration.</text><rect x="520" y="170" width="360" height="470" fill="#e8f3ff" class="b"/><text x="700" y="220" text-anchor="middle" class="h">vHub observable state</text><text x="700" y="300" text-anchor="middle" class="t">Security connection: Provisioned</text><text x="700" y="345" text-anchor="middle" class="t">VPN tunnel: Connected</text><text x="700" y="390" text-anchor="middle" class="t">0.0.0.0/0 reaches opted-in connections</text><rect x="570" y="470" width="260" height="100" fill="#fee2e2" class="b"/><text x="700" y="510" text-anchor="middle" class="h">Failure clue</text><text x="700" y="545" text-anchor="middle" class="s">No 0/0 or tunnel down = no SECaaS path</text><rect x="1030" y="170" width="310" height="470" fill="#ecfeff" class="b"/><text x="1185" y="220" text-anchor="middle" class="h">Provider plane</text><text x="1185" y="300" text-anchor="middle" class="t">Hub synced / discovered</text><text x="1185" y="345" text-anchor="middle" class="t">IPsec location created</text><text x="1185" y="390" text-anchor="middle" class="t">Policy assigned</text><text x="1185" y="435" text-anchor="middle" class="t">Traffic/logs observed</text><text x="1185" y="515" text-anchor="middle" class="s">Troubleshoot Azure and provider portals</text><text x="1185" y="540" text-anchor="middle" class="s">as one end-to-end dependency chain.</text><path d="M370 340H520" class="f"/><path d="M880 340H1030" class="f"/></svg>