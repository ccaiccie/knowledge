<rect width="1600" height="900" fill="#ffffff"/>
<text x="60" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Forced tunneling with VPN Gateway + BGP default route</text><text x="60" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Internet-bound Azure traffic is carried to the enterprise edge for inspection and public Internet breakout.</text>
<rect x="45" y="125" width="930" height="660" rx="18" fill="#f8fbff" stroke="#0078D4" stroke-width="2"/>
<rect x="70" y="165" width="875" height="575" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 5"/><text x="65" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0078D4" text-anchor="start">Microsoft Azure</text><text x="90" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start">Hub-and-spoke virtual network environment</text><rect x="90" y="235" width="290" height="390" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><rect x="430" y="235" width="470" height="390" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="110" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start">Spoke VNet 10.10.0.0/16</text><text x="450" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start">Hub VNet 10.0.0.0/16</text><use href="#ico-vm" x="165" y="320" width="90" height="83"/><text x="210.0" y="429" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">Workload VM</text><text x="210.0" y="450" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">10.10.1.4</text><use href="#ico-gw" x="620" y="310" width="70" height="94"/><text x="655.0" y="430" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">Azure VPN Gateway</text><text x="655.0" y="451" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">GatewaySubnet</text><text x="235" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Effective route for 0.0.0.0/0</text>
<text x="235" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Next hop: Virtual network gateway</text>
<text x="235" y="555" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Origin: BGP</text><rect x="1015" y="125" width="525" height="660" rx="18" fill="#fafafa" stroke="#64748b" stroke-width="2"/><text x="1040" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="start">On-premises / enterprise edge</text><g transform="translate(1160,305)"><path d="M45 3 L82 17 V50 C82 77 63 94 45 103 C27 94 8 77 8 50 V17Z" fill="#f8fafc" stroke="#475569" stroke-width="3"/><path d="M22 34h46v37H22z" fill="#fff" stroke="#64748b" stroke-width="2"/><path d="M23 36h44" stroke="#ef4444" stroke-width="7" stroke-dasharray="18 5"/><path d="M23 48h44" stroke="#ef4444" stroke-width="7" stroke-dasharray="18 5"/><path d="M23 60h44" stroke="#ef4444" stroke-width="7" stroke-dasharray="18 5"/></g><text x="1205" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">On-premises NGFW</text><g transform="translate(1360,520)"><path d="M26 66C9 66 1 55 3 44c2-12 13-19 24-18C32 10 46 2 61 6c13 3 22 13 24 25 14-1 25 8 26 20 1 9-6 15-16 15z" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><text x="57" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">Internet</text></g><text x="1205" y="520" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">BGP advertises 0.0.0.0/0</text>
<text x="1205" y="540" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">to Azure VPN Gateway</text>
<text x="1205" y="560" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">NGFW performs Internet SNAT</text><path d="M255 350 H620" stroke="#0078D4" stroke-width="3" fill="none" marker-end="url(#arrBlue)"/><rect x="368" y="308" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="438" y="326" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#0078D4" text-anchor="middle">1  Default-route match</text><path d="M690 350 H1160" stroke="#0078D4" stroke-width="3" fill="none" marker-end="url(#arrBlue)"/><rect x="850" y="308" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="920" y="326" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#0078D4" text-anchor="middle">2  S2S IPsec tunnel</text><path d="M1250 365 H1435 V520" stroke="#0078D4" stroke-width="3" fill="none" marker-end="url(#arrBlue)"/><rect x="1300" y="380" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="1370" y="398" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#0078D4" text-anchor="middle">3  Inspect + SNAT</text><path d="M1435 615 H1260 V455" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#arrOrange)"/><rect x="1280" y="630" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="1350" y="648" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">4  Internet return</text><path d="M1160 450 H690" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#arrOrange)"/><rect x="850" y="665" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="920" y="683" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">5  Reverse NAT + IPsec</text><path d="M620 450 H255" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#arrOrange)"/><rect x="368" y="665" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="438" y="683" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">6  Deliver to VM</text><text x="780" y="825" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Blue = forward path    •    Orange = return path    •    Azure icons use the Azure2 architecture asset set</text></svg>