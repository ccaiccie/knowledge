<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
<rect width="1400" height="820" fill="#f8fafc"/>
<text x="700" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">ExpressRoute forced tunneling to on-premises Internet egress</text>
<text x="700" y="70" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">A default route is accepted only on ExpressRoute private peering and steers associated VNet Internet traffic to the customer network.</text>
<rect x="70" y="250" width="220" height="130" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="180.0" y="280" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">Azure workload</text>
<text x="180.0" y="306" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">10.20.1.4/24</text>
<text x="180.0" y="328" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Effective 0/0 from BGP</text>
<rect x="360" y="240" width="240" height="150" rx="14" fill="#e0e7ff" stroke="#334155" stroke-width="2"/>
<text x="480.0" y="270" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">ExpressRoute VNet Gateway</text>
<text x="480.0" y="296" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Private peering path</text>
<text x="480.0" y="318" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">No IPsec encryption</text>
<rect x="690" y="240" width="220" height="150" rx="14" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
<text x="800.0" y="270" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">Customer edge</text>
<text x="800.0" y="296" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Advertises 0.0.0.0/0</text>
<text x="800.0" y="318" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Receives Azure VNet prefixes</text>
<rect x="1000" y="230" width="240" height="170" rx="14" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="1120.0" y="260" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">On-prem NGFW</text>
<text x="1120.0" y="286" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Inspect outbound traffic</text>
<text x="1120.0" y="308" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">SNAT to public IP</text>
<rect x="1060" y="520" width="160" height="90" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="1140.0" y="550" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">Internet</text>
<text x="1140.0" y="576" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Public destination</text>
<line x1="290" y1="315" x2="360" y2="315" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="325.0" y="305.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e40af">1  0/0 match</text>
<line x1="600" y1="315" x2="690" y2="315" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="645.0" y="305.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e40af">2  ER private peering</text>
<line x1="910" y1="315" x2="1000" y2="315" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="955.0" y="305.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e40af">3  Corporate path</text>
<line x1="1120" y1="400" x2="1135" y2="520" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="1127.5" y="446.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e40af">4  Inspect + SNAT</text>
<line x1="1060" y1="565" x2="970" y2="400" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="1015.0" y="472.5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e40af">5  Return</text>
<line x1="1000" y1="350" x2="910" y2="350" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="955.0" y="340.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e40af">6  Reverse NAT</text>
<line x1="690" y1="350" x2="600" y2="350" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="645.0" y="340.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e40af">7  ER return</text>
<line x1="360" y1="350" x2="290" y2="350" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="325.0" y="340.0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e40af">8  Deliver</text>
<text x="50" y="770" font-family="Arial" font-size="13" fill="#475569">Failure caveat: if the advertised 0.0.0.0/0 disappears, Azure can fall back to its system Internet route unless you add explicit egress controls.</text>
<text x="50" y="788" font-family="Arial" font-size="13" fill="#475569">ExpressRoute provides private connectivity, not IPsec encryption; add encryption separately if required by policy.</text>
</svg>