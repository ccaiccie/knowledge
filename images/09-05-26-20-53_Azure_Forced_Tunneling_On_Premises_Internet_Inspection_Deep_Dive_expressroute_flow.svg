<rect width="1600" height="900" fill="#ffffff"/>
<text x="60" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Forced tunneling with ExpressRoute private peering</text><text x="60" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">A learned default route sends Azure Internet egress over ExpressRoute to an enterprise firewall and Internet edge.</text>
<rect x="45" y="125" width="900" height="660" rx="18" fill="#f8fbff" stroke="#0078D4" stroke-width="2"/><rect x="75" y="175" width="830" height="550" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 5"/><text x="65" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0078D4" text-anchor="start">Microsoft Azure</text><text x="95" y="208" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start">Azure VNet + ExpressRoute gateway</text><use href="#ico-vm" x="160" y="330" width="90" height="83"/><text x="205" y="439" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">Workload VM</text><text x="205" y="460" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569" text-anchor="middle">10.20.1.4</text><use href="#ico-gw" x="610" y="315" width="70" height="94"/><text x="645" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">ExpressRoute VNet Gateway</text><text x="645" y="456" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569" text-anchor="middle">GatewaySubnet</text><use href="#ico-er" x="790" y="320" width="95" height="87"/><text x="837.5" y="433" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">ExpressRoute circuit</text><text x="837.5" y="454" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569" text-anchor="middle">Private peering</text><text x="230" y="520" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Effective 0.0.0.0/0</text><text x="230" y="540" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">learned through BGP</text><text x="230" y="560" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">from ExpressRoute</text>
<rect x="985" y="125" width="555" height="660" rx="18" fill="#fafafa" stroke="#64748b" stroke-width="2"/><text x="1010" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="start">On-premises / peering location</text><text x="1095" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Customer edge routers</text><text x="1095" y="320" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">advertise default route</text><text x="1095" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">over private peering</text><g transform="translate(1190,380)"><path d="M45 3 L82 17 V50 C82 77 63 94 45 103 C27 94 8 77 8 50 V17Z" fill="#f8fafc" stroke="#475569" stroke-width="3"/><path d="M22 34h46v37H22z" fill="#fff" stroke="#64748b" stroke-width="2"/><path d="M23 36h44" stroke="#ef4444" stroke-width="7" stroke-dasharray="18 5"/><path d="M23 48h44" stroke="#ef4444" stroke-width="7" stroke-dasharray="18 5"/><path d="M23 60h44" stroke="#ef4444" stroke-width="7" stroke-dasharray="18 5"/></g><text x="1235" y="510" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">On-premises NGFW</text><g transform="translate(1390,565)"><path d="M26 66C9 66 1 55 3 44c2-12 13-19 24-18C32 10 46 2 61 6c13 3 22 13 24 25 14-1 25 8 26 20 1 9-6 15-16 15z" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><text x="57" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">Internet</text></g>
<path d="M250 360 H610" stroke="#0078D4" stroke-width="3" fill="none" marker-end="url(#arrBlue)"/><rect x="360" y="318" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="430" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#0078D4" text-anchor="middle">1  Default-route match</text><path d="M680 360 H790" stroke="#0078D4" stroke-width="3" fill="none" marker-end="url(#arrBlue)"/><rect x="665" y="318" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="735" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#0078D4" text-anchor="middle">2  ER gateway</text><path d="M885 360 H1190" stroke="#0078D4" stroke-width="3" fill="none" marker-end="url(#arrBlue)"/><rect x="965" y="318" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="1035" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#0078D4" text-anchor="middle">3  Private peering</text><path d="M1280 440 H1465 V565" stroke="#0078D4" stroke-width="3" fill="none" marker-end="url(#arrBlue)"/><rect x="1320" y="440" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="1390" y="458" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#0078D4" text-anchor="middle">4  Inspect + SNAT</text><path d="M1465 660 H1280 V520" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#arrOrange)"/><rect x="1325" y="675" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="1395" y="693" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">5  Internet return</text><path d="M1190 520 H885" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#arrOrange)"/><rect x="965" y="675" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="1035" y="693" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">6  Reverse NAT</text><path d="M790 520 H680" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#arrOrange)"/><rect x="665" y="675" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="735" y="693" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">7  ER return</text><path d="M610 520 H250" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#arrOrange)"/><rect x="360" y="675" width="140" height="24" rx="5" fill="#fff" opacity=".94"/><text x="430" y="693" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">8  Deliver</text><text x="780" y="825" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569" text-anchor="middle">ExpressRoute private peering carries the packet without IPsec; the on-premises firewall still owns the Internet SNAT/state.</text></svg>