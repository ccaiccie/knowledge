<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="40" y="48" font-family="Arial" font-size="28" font-weight="700" fill="#232f3e">send-via: Single-Hop vs Dual-Hop</text><text x="40" y="78" font-family="Arial" font-size="16" fill="#545b64">Single-hop inserts one NFG attachment. Dual-hop inserts at both source and destination core-network edges for inter-Region traffic.</text><rect x="40" y="120" width="250" height="120" rx="12" fill="#eaf4ff" stroke="#3b82f6" stroke-width="2"/><text x="56" y="148" font-family="Arial" font-size="17" font-weight="700">Source VPC — us-east-1</text><text x="56" y="172" font-family="Arial" font-size="14">10.10.0.0/16 | PROD</text><rect x="355" y="115" width="280" height="140" rx="12" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/><text x="371" y="143" font-family="Arial" font-size="17" font-weight="700">CNE us-east-1</text><text x="371" y="170" font-family="Arial" font-size="14">PROD route lookup / steering</text><rect x="700" y="90" width="300" height="180" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="716" y="118" font-family="Arial" font-size="17" font-weight="700">Inspection VPC East</text><text x="716" y="145" font-family="Arial" font-size="14">NFG attachment | stateful firewall</text><text x="716" y="168" font-family="Arial" font-size="14">Appliance mode</text><rect x="1065" y="115" width="280" height="140" rx="12" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/><text x="1081" y="143" font-family="Arial" font-size="17" font-weight="700">CNE us-west-2</text><text x="1081" y="170" font-family="Arial" font-size="14">Remote segment route lookup</text><rect x="1400" y="120" width="160" height="120" rx="12" fill="#eaf4ff" stroke="#3b82f6" stroke-width="2"/><text x="1416" y="148" font-family="Arial" font-size="17" font-weight="700">Dest VPC</text><text x="1416" y="172" font-family="Arial" font-size="14">10.20.0.0/16</text><rect x="700" y="520" width="300" height="180" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="716" y="548" font-family="Arial" font-size="17" font-weight="700">Inspection VPC West</text><text x="716" y="575" font-family="Arial" font-size="14">Second NFG attachment</text><text x="716" y="598" font-family="Arial" font-size="14">Required for dual-hop</text><rect x="355" y="500" width="280" height="200" rx="12" fill="#eefbf3" stroke="#16a34a" stroke-width="2"/><text x="371" y="528" font-family="Arial" font-size="17" font-weight="700">Single-hop</text><text x="371" y="555" font-family="Arial" font-size="14">Exactly one inserted attachment</text><text x="371" y="578" font-family="Arial" font-size="14">Edge override can prefer a Region</text><rect x="1065" y="500" width="280" height="200" rx="12" fill="#f4f1ff" stroke="#7c3aed" stroke-width="2"/><text x="1081" y="528" font-family="Arial" font-size="17" font-weight="700">Dual-hop</text><text x="1081" y="555" font-family="Arial" font-size="14">Source-edge AND destination-edge insertion</text><text x="1081" y="578" font-family="Arial" font-size="14">NFG cannot be reused for send-to/single-hop</text><path d="M290,180 L355,180" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M635,180 L700,180" stroke="#dc2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M1000,180 L1065,180" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M1345,180 L1400,180" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M850,270 L850,520" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/><text x="865" y="410" font-family="Arial" font-size="14" font-weight="700" fill="#7c3aed">dual-hop adds destination-edge inspection</text></svg>