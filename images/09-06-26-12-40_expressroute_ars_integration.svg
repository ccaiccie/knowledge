<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="630" viewBox="0 0 1500 630"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0078D4"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#107C10"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="750" y="38" text-anchor="middle" font-family="Segoe UI,Arial" font-size="26" font-weight="700" fill="#17324D">ExpressRoute + Azure Route Server: dynamic NVA route exchange</text><g font-family="Segoe UI,Arial" font-size="15" fill="#17324D"><rect x="50" y="245" width="240" height="110" rx="16" fill="#F1F8EE" stroke="#107C10" stroke-width="3"/><text x="75" y="290" font-weight="700">On-premises WAN</text><text x="75" y="320">10.10.0.0/16</text><rect x="360" y="245" width="250" height="110" rx="16" fill="#FFF5EE" stroke="#D83B01" stroke-width="3"/><text x="385" y="290" font-weight="700">ExpressRoute circuit</text><text x="385" y="320">Private peering</text><rect x="700" y="135" width="300" height="120" rx="16" fill="#EAF4FB" stroke="#0078D4" stroke-width="3"/><text x="725" y="180" font-weight="700">ExpressRoute VNet gateway</text><text x="725" y="210">GatewaySubnet</text><rect x="700" y="390" width="300" height="120" rx="16" fill="#F4F1FF" stroke="#6B4EFF" stroke-width="3"/><text x="725" y="435" font-weight="700">Azure Route Server</text><text x="725" y="465">RouteServerSubnet • ASN 65515</text><rect x="1110" y="390" width="300" height="120" rx="16" fill="#FFF5EE" stroke="#D83B01" stroke-width="3"/><text x="1135" y="435" font-weight="700">NVA / SD-WAN appliance</text><text x="1135" y="465">BGP peer ASN 65050</text><rect x="1110" y="135" width="300" height="120" rx="16" fill="#EAF4FB" stroke="#0078D4" stroke-width="3"/><text x="1135" y="180" font-weight="700">Hub / spoke VNets</text><text x="1135" y="210">Azure workload routes</text></g><g fill="none" stroke-