<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#0078d4"/></marker><style>text{font-family:Segoe UI,Arial}.t{font-size:28px;font-weight:700;fill:#16324f}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#334155}</style></defs><rect width="1200" height="650" fill="white" fill-opacity="0"/><text x="40" y="48" class="t">Azure Route Server + NVA: Control Plane vs Data Plane</text><rect x="70" y="190" width="240" height="120" rx="16" fill="#eef6ff" stroke="#0078d4" stroke-width="2"/><text x="90" y="225" class="h">Spoke workload</text><text x="90" y="252" class="s">Effective route → NVA</text><rect x="480" y="150" width="260" height="150" rx="16" fill="#fff4e5" stroke="#f59e0b" stroke-width="2"/><text x="500" y="188" class="h">Third-party NVA / NGFW</text><text x="500" y="216" class="s">Data-plane next hop</text><text x="500" y="240" class="s">BGP ASN 65001</text><rect x="480" y="430" width="260" height="130" rx="16" fill="#f3e8ff" stroke="#8a3ffc" stroke-width="2"/><text x="500" y="468" class="h">Azure Route Server</text><text x="500" y="496" class="s">ASN 65515</text><text x="500" y="520" class="s">Control plane only</text><rect x="910" y="190" width="220" height="120" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="930" y="225" class="h">Destination</text><text x="930" y="252" class="s">Internet / branch / spoke</text><path d="M310 250 L480 225" stroke="#0078d4" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M740 225 L910 250" stroke="#0078d4" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M610 430 L610 300" stroke="#8a3ffc" stroke-width="3" stroke-dasharray="9 7" fill="none" marker-end="url(#a)"/><text x="650" y="365" class="s">eBGP route exchange</text><text x="65" y="600" class="s">Packets never traverse Route Server. ARS distributes routes; the NVA forwards and inspects traffic.</text></svg>