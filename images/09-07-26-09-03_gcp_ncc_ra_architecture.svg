<path d="M615 270 H660 V470 H710" fill="none" stroke="#d93025" stroke-width="5" marker-end="url(#arrowR)"/><text x="628" y="250" font-family="Arial" font-size="14" fill="#d93025">1 data traffic</text><path d="M890 560 H940 V270 H985" fill="none" stroke="#d93025" stroke-width="5" marker-end="url(#arrowR)"/><text x="920" y="250" font-family="Arial" font-size="14" fill="#d93025">2 inspected traffic</text>
<text x="80" y="875" font-family="Arial" font-size="15" font-weight="700">Legend:</text><line x1="155" y1="870" x2="240" y2="870" stroke="#1a73e8" stroke-width="4" stroke-dasharray="10 7"/><text x="250" y="875" font-family="Arial" font-size="14">BGP control plane</text><line x1="420" y1="870" x2="505" y2="870" stroke="#188038" stroke-width="3" stroke-dasharray="7 6"/><text x="515" y="875" font-family="Arial" font-size="14">NCC attachment relationship</text><line x1="760" y1="870" x2="845" y2="870" stroke="#d93025" stroke-width="5"/><text x="855" y="875" font-family="Arial" font-size="14">forwarding / inspected data plane</text>
<text x="80" y="920" font-family="Arial" font-size="15">Key point: Cloud Router is control plane only; packets do not traverse Cloud Router. Learned dynamic routes make the Router Appliance VM the VPC next hop.</text>
