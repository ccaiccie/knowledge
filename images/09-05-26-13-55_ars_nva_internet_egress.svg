<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#0078d4"/></marker><style>text{font-family:Segoe UI,Arial}.t{font-size:28px;font-weight:700;fill:#16324f}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#334155}</style></defs><text x="40" y="48" class="t">Internet Egress via Dynamically Injected Default Route</text><rect x="70" y="240" width="250" height="110" rx="14" fill="#eef6ff" stroke="#0078d4"/><text x="90" y="275" class="h">Spoke workload</text><text x="90" y="303" class="s">0.0.0.0/0 → NVA</text><rect x="470" y="150" width="280" height="140" rx="14" fill="#fff4e5" stroke="#f59e0b"/><text x="490" y="185" class="h">Third-party NVA pair</text><text x="490" y="213" class="s">Inspect + SNAT as required</text><text x="490" y="238" class="s">Advertise 0.0.0.0/0</text><rect x="470" y="420" width="280" height="110" rx="14" fill="#f3e8ff" stroke="#8a3ffc"/><text x="490" y="455" class="h">Azure Route Server</text><text x="490" y="483" class="s">Injects default into spokes</text><rect x="930" y="240" width="210" height="110" rx="14" fill="#ecfdf5" stroke="#10b981"/><text x="950" y="275" class="h">Internet</text><text x="950" y="303" class="s">Return via NAT/state</text><path d="M320 295 L470 220" stroke="#0078d4" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M750 220 L930 295" stroke="#0078d4" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M930 325 L750 255" stroke="#10b981" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M610 420 L610 290" stroke="#8a3ffc" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/><text x="65" y="575" class="s">ARS injects the route; the NVA still owns inspection, NAT, egress reachability, HA and return-path state.</text></svg>