<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:22px;font-weight:bold}.n{font-size:16px}.s{font-size:14px}.box{rx:14;ry:14;stroke-width:2}.edge{stroke:#333;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:9 7}</style></defs><text x="800" y="28" text-anchor="middle" class="h">AWS Network Firewall — Transit Gateway + Direct Connect Hybrid Inspection</text><rect x="55" y="330" width="225" height="100" class="box" fill="#dae8fc" stroke="#6c8ebf"/><text x="168" y="360" text-anchor="middle" class="n">On-premises</text><text x="168" y="387" text-anchor="middle" class="s">10.100.0.0/16</text><text x="168" y="412" text-anchor="middle" class="s">Customer router</text><rect x="340" y="325" width="195" height="110" class="box" fill="#dae8fc" stroke="#6c8ebf"/><text x="438" y="355" text-anchor="middle" class="n">AWS Direct Connect</text><text x="438" y="384" text-anchor="middle" class="s">Transit VIF</text><text x="438" y="410" text-anchor="middle" class="s">eBGP</text><rect x="590" y="325" width="225" height="110" class="box" fill="#e1d5e7" stroke="#9673a6"/><text x="703" y="357" text-anchor="middle" class="n">Direct Connect Gateway</text><text x="703" y="390" text-anchor="middle" class="s">ASN must differ from TGW ASN</text><rect x="865" y="310" width="305" height="140" class="box" fill="#e1d5e7" stroke="#9673a6"/><text x="1018" y="342" text-anchor="middle" class="n">Transit Gateway</text><text x="1018" y="372" text-anchor="middle" class="s">DX/VPN + spoke attachments</text><text x="1018" y="402" text-anchor="middle" class="s">Route tables steer selected prefixes</text><text x="1018" y="426" text-anchor="middle" class="s">to inspection</text><rect x="1280" y="175" width="225" height="110" class="box" fill="#d5e8d4" stroke="#82b366"/><text x="1393" y="207" text-anchor="middle" class="n">Spoke VPC</text><text x="1393" y="235" text-anchor="middle" class="s">10.10.0.0/16</text><text x="1393" y="260" text-anchor="middle" class="s">App subnet → TGW</text><rect x="1185" y="505" width="365" height="305" class="box" fill="#fff2cc" stroke="#d6b656"/><text x="1368" y="535" text-anchor="middle" class="n">Inspection VPC</text><rect x="1225" y="570" width="285" height="90" class="box" fill="#e1d5e7" stroke="#9673a6"/><text x="1368" y="600" text-anchor="middle" class="n">TGW attachment subnet</text><text x="1368" y="627" text-anchor="middle" class="s">protected prefixes / 0/0 → firewall</text><text x="1368" y="647" text-anchor="middle" class="s">endpoint in same AZ</text><rect x="1225" y="700" width="285" height="90" class="box" fill="#f8cecc" stroke="#b85450"/><text x="1368" y="730" text-anchor="middle" class="n">AWS Network Firewall endpoint</text><text x="1368" y="756" text-anchor="middle" class="s">Dedicated firewall subnet</text><text x="1368" y="778" text-anchor="middle" class="s">stateful + stateless policy</text><path d="M280 380 H340" class="edge"/><text x="295" y="366" class="s">1 BGP</text><path d="M535 380 H590" class="edge"/><text x="545" y="366" class="s">2 transit VIF</text><path d="M815 380 H865" class="edge"/><text x="820" y="366" class="s">3 association</text><path d="M1170 380 H1200 V615 H1225" class="edge"/><text x="1180" y="520" class="s">4 route to inspection</text><path d="M1368 660 V700" class="edge"/><text x="1380" y="688" class="s">5 endpoint</text><path d="M1510 745 H1530 V230 H1505" class="edge dash"/><text x="1425" y="500" class="s">6 inspected → TGW → spoke</text></svg>