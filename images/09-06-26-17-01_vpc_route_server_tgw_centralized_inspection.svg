<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1473e6"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1b8f4b"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#c62828"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="45" font-family="Arial" font-size="27" font-weight="700">Centralized inspection — TGW selects the Inspection VPC; VPC Route Server selects the NVA ENI</text><g font-family="Arial" fill="#17233c"><rect x="45" y="150" width="215" height="125" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="60" y="182" font-size="19" font-weight="700">Spoke-1 VPC</text><text x="60" y="210" font-size="15">10.45.0.0/16</text><text x="60" y="235" font-size="15">Subnet RT: 0/0 → TGW</text><rect x="45" y="565" width="215" height="125" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="60" y="597" font-size="19" font-weight="700">Spoke-2 VPC</text><text x="60" y="625" font-size="15">10.46.0.0/16</text><text x="60" y="650" font-size="15">Subnet RT: 0/0 → TGW</text><rect x="335" y="315" width="260" height="175" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="350" y="347" font-size="19" font-weight="700">AWS Transit Gateway</text><text x="350" y="375" font-size="15">Spokes RT: 0/0 → Inspection</text><text x="350" y="400" font-size="15">Inspection RT:</text><text x="350" y="425" font-size="15">10.45/16 → Spoke1</text><text x="350" y="450" font-size="15">10.46/16 → Spoke2</text><rect x="655" y="315" width="275" height="175" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="670" y="347" font-size="19" font-weight="700">Inspection VPC TGW subnets</text><text x="670" y="375" font-size="15">10.47.1.0/24 + 10.47.2.0/24</text><text x="670" y="400" font-size="15">Route Server propagation:</text><text x="670" y="425" font-size="15">10.0.0.0/8 → active FW ENI</text><text x="670" y="450" font-size="15">optional 0/0 → active FW ENI</text><rect x="1010" y="125" width="230" height="145" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="1025" y="157" font-size="19" font-weight="700">fw01 AZ-a ACTIVE</text><text x="1025" y="185" font-size="15">ENI 10.47.3.42</text><text x="1025" y="210" font-size="15">Advertise 10/8</text><text x="1025" y="235" font-size="15">AS_PATH 65550</text><rect x="1010" y="565" width="230" height="145" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="1025" y="597" font-size="19" font-weight="700">fw02 AZ-b STANDBY</text><text x="1025" y="625" font-size="15">ENI 10.47.4.229</text><text x="1025" y="650" font-size="15">AS_PATH 65550 65550</text><rect x="1000" y="340" width="250" height="145" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1015" y="372" font-size="19" font-weight="700">VPC Route Server</text><text x="1015" y="400" font-size="15">ASN 65500 • one FIB winner</text><text x="1015" y="425" font-size="15">BGP/BFD selects NVA ENI</text><rect x="1320" y="335" width="145" height="130" rx="12" fill="#f5f5f5" stroke="#777" stroke-width="2"/><text x="1335" y="367" font-size="19" font-weight="700">IGW</text><text x="1335" y="395" font-size="15">FW subnet RT:</text><text x="1335" y="420" font-size="15">0/0 → IGW</text><text x="1335" y="445" font-size="15">10/8 → TGW</text></g><g fill="none" stroke-width="4"><path d="M260 212 H300 V402 H335" stroke="#1473e6" marker-end="url(#b)"/><path d="M595 402 H655" stroke="#1473e6" marker-end="url(#b)"/><path d="M930 402 H970 V197 H1010" stroke="#1473e6" marker-end="url(#b)"/><path d="M1010 197 H965 V285 H465 V315" stroke="#1473e6" marker-end="url(#b)"/><path d="M335 435 H300 V627 H260" stroke="#1473e6" marker-end="url(#b)"/><path d="M1240 197 H1280 V400 H1320" stroke="#1473e6" marker-end="url(#b)"/><path d="M1125 270 V340" stroke="#1b8f4b" stroke-dasharray="9 7" marker-end="url(#g)"/><path d="M1125 565 V485" stroke="#1b8f4b" stroke-dasharray="9 7" marker-end="url(#g)"/><path d="M1000 412 H930" stroke="#1b8f4b" stroke-dasharray="9 7" marker-end="url(#g)"/><path d="M1010 637 H965 V450 H930" stroke="#c62828" stroke-dasharray="9 7" marker-end="url(#r)"/></g><g font-family="Arial" font-size="14"><text x="270" y="195" fill="#1473e6">1 spoke → TGW</text><text x="610" y="390" fill="#1473e6">2 pre-inspection</text><text x="940" y="310" fill="#1473e6">3 propagated ENI next hop</text><text x="640" y="272" fill="#1473e6">4 inspected packet returns to TGW</text><text x="1260" y="290" fill="#1473e6">Internet egress</text><text x="950" y="525" fill="#c62828">Failover to fw02</text></g><text x="40" y="865" font-family="Arial" font-size="14" fill="#555">Blue: forwarding • Green dashed: BGP/BFD/FIB propagation • Red dashed: backup/failover</text></svg>