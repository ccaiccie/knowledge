<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#444"/></marker></defs><rect width="1600" height="1000" fill="white"/><text x="45" y="50" font-family="Arial" font-size="30" font-weight="700">Firewall insertion decision tree</text><rect x="500" y="100" width="600" height="80" rx="12" fill="#fff2cc" stroke="#666" stroke-width="2"/><text x="800" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Only HTTP(S) application protection?</text><rect x="1040" y="235" width="500" height="110" rx="12" fill="#d5e8d4" stroke="#666" stroke-width="2"/><text x="1290" y="270" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Use L7 ingress/WAF</text><text x="1290" y="298" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">AWS WAF • Azure Front Door/AppGW • GCP Cloud Armor</text><rect x="500" y="240" width="430" height="90" rx="12" fill="#dae8fc" stroke="#666" stroke-width="2"/><text x="715" y="275" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Must the firewall be transparent to workloads?</text><rect x="40" y="420" width="500" height="110" rx="12" fill="#e1d5e7" stroke="#666" stroke-width="2"/><text x="290" y="455" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Transparent service insertion</text><text x="290" y="483" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">AWS GWLB • Azure GWLB • GCP PBR→ILB</text><rect x="610" y="420" width="430" height="90" rx="12" fill="#dae8fc" stroke="#666" stroke-width="2"/><text x="825" y="455" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Need BGP-driven routed NVA failover?</text><rect x="1080" y="420" width="470" height="110" rx="12" fill="#f8cecc" stroke="#666" stroke-width="2"/><text x="1315" y="455" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Dynamic routed NVA</text><text x="1315" y="483" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">AWS VPC Route Server • Azure Route Server</text><rect x="610" y="600" width="430" height="90" rx="12" fill="#dae8fc" stroke="#666" stroke-width="2"/><text x="825" y="635" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Many spokes/branches need central policy?</text><rect x="40" y="770" width="560" height="120" rx="12" fill="#fff2cc" stroke="#666" stroke-width="2"/><text x="320" y="805" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Managed transit/hub insertion</text><text x="320" y="833" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">AWS Cloud WAN/TGW • Azure vWAN • GCP composed routing</text><rect x="900" y="770" width="620" height="120" rx="12" fill="#d5e8d4" stroke="#666" stroke-width="2"/><text x="1210" y="805" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Native managed firewall / routing policy</text><text x="1210" y="833" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">AWS Network Firewall • Azure Firewall • GCP Cloud NGFW</text><path d="M1100 140 H1290 V235" fill="none" stroke="#444" stroke-width="3" marker-end="url(#m)"/><text x="1190" y="128" font-family="Arial" font-size="13" font-weight="700">YES</text><path d="M800 180 V240" fill="none" stroke="#444" stroke-width="3" marker-end="url(#m)"/><text x="815" y="215" font-family="Arial" font-size="13" font-weight="700">NO</text><path d="M500 285 H300 V420" fill="none" stroke="#444" stroke-width="3" marker-end="url(#m)"/><text x="345" y="275" font-family="Arial" font-size="13" font-weight="700">YES</text><path d="M715 330 V420" fill="none" stroke="#444" stroke-width="3" marker-end="url(#m)"/><text x="728" y="385" font-family="Arial" font-size="13" font-weight="700">NO</text><path d="M1040 465 H1080" fill="none" stroke="#444" stroke-width="3" marker-end="url(#m)"/><text x="1045" y="450" font-family="Arial" font-size="13" font-weight="700">YES</text><path d="M825 510 V600" fill="none" stroke="#444" stroke-width="3" marker-end="url(#m)"/><text x="838" y="565" font-family="Arial" font-size="13" font-weight="700">NO</text><path d="M610 645 H320 V770" fill="none" stroke="#444" stroke-width="3" marker-end="url(#m)"/><text x="385" y="635" font-family="Arial" font-size="13" font-weight="700">YES</text><path d="M1040 645 H1210 V770" fill="none" stroke="#444" stroke-width="3" marker-end="url(#m)"/><text x="1080" y="635" font-family="Arial" font-size="13" font-weight="700">NO</text><text x="45" y="960" font-family="Arial" font-size="16" fill="#555">Always finish with: STEER → SELECT → STATE → NAT.</text></svg>