<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="940" viewBox="0 0 1650 940"><defs><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#CA5010"/></marker><filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/></filter><style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#14314A}.subtitle{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#4A4A4A}.label{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#173B5C}.small{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#173B5C}.tiny{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#173B5C}.legend{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#173B5C}</style></defs><text x="30" y="40" class="title">Inbound web inspection layers in Azure</text><text x="30" y="64" class="subtitle">Separate Layer 7 reverse-proxy/WAF inspection from Layer 3/4 DNAT publication so the design choice is explicit.</text><rect x="40" y="270" width="170" height="80" rx="16" fill="#F4F7FA" stroke="#6E6E6E" stroke-width="2" filter="url(#shadow)"/><text x="125" y="318" class="label" text-anchor="middle">Internet users</text><rect x="250" y="140" width="650" height="650" rx="22" fill="#F8FBFF" stroke="#0078D4" stroke-width="3" stroke-dasharray="7 5"/><text x="575" y="175" class="label" text-anchor="middle">Pattern A — Layer 7 inspection path</text><rect x="340" y="250" width="170" height="85" rx="14" fill="#F3F8FF" stroke="#0078D4" stroke-width="2" filter="url(#shadow)"/><text x="425" y="280" class="label" text-anchor="middle">Azure Front Door</text><text x="425" y="303" class="small" text-anchor="middle">WAF / edge reverse proxy</text><rect x="570" y="250" width="170" height="85" rx="14" fill="#F3F8FF" stroke="#0078D4" stroke-width="2" filter="url(#shadow)"/><text x="655" y="280" class="label" text-anchor="middle">Application Gateway</text><text x="655" y="303" class="small" text-anchor="middle">WAF / regional reverse proxy</text><rect x="390" y="430" width="300" height="180" rx="12" fill="#F8FCFF" stroke="#50B0F9" stroke-width="2" stroke-dasharray="7 5"/><text x="540" y="455" class="label" text-anchor="middle">Application subnet</text><rect x="495" y="505" width="90" height="55" rx="10" fill="white" stroke="#50B0F9" stroke-width="2" filter="url(#shadow)"/><text x="540" y="538" class="small" text-anchor="middle">Web app</text><polyline points="210,315 340,315" fill="none" stroke="#0078D4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowBlue)"/><polyline points="510,315 570,315" fill="none" stroke="#0078D4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowBlue)"/><polyline points="655,335 655,400 540,400 540,505" fill="none" stroke="#0078D4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowBlue)"/><circle cx="300" cy="315" r="14" fill="white" stroke="#0078D4" stroke-width="3"/><text x="300" y="320" class="legend" text-anchor="middle">1</text><text x="300" y="350" class="tiny" text-anchor="middle">L7 policy, TLS, URL rules</text><rect x="970" y="140" width="620" height="650" rx="22" fill="#FFFDF5" stroke="#D0A000" stroke-width="3" stroke-dasharray="7 5"/><text x="1280" y="175" class="label" text-anchor="middle">Pattern B — Layer 3/4 publication and inspection</text><rect x="1060" y="250" width="170" height="85" rx="14" fill="#F3F8FF" stroke="#0078D4" stroke-width="2" filter="url(#shadow)"/><text x="1145" y="300" class="label" text-anchor="middle">Public IP / LB</text><rect x="1300" y="250" width="160" height="85" rx="16" fill="#FFF6D8" stroke="#FFB900" stroke-width="2" filter="url(#shadow)"/><text x="1380" y="300" class="label" text-anchor="middle">Azure Firewall DNAT</text><rect x="1215" y="430" width="330" height="180" rx="12" fill="#F8FCFF" stroke="#50B0F9" stroke-width="2" stroke-dasharray="7 5"/><text x="1380" y="455" class="label" text-anchor="middle">Application subnet</text><rect x="1335" y="505" width="90" height="55" rx="10" fill="white" stroke="#50B0F9" stroke-width="2" filter="url(#shadow)"/><text x="1380" y="538" class="small" text-anchor="middle">TCP/UDP service</text><polyline points="210,355 920,355 920,670 1145,670 1145,335" fill="none" stroke="#CA5010" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowOrange)"/><polyline points="1230,292 1300,292" fill="none" stroke="#CA5010" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowOrange)"/><polyline points="1380,335 1380,505" fill="none" stroke="#CA5010" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowOrange)"/><circle cx="1080" cy="670" r="14" fill="white" stroke="#CA5010" stroke-width="3"/><text x="1080" y="675" class="legend" text-anchor="middle">2</text><text x="1080" y="705" class="tiny" text-anchor="middle">Use when DNAT / L3-L4 policy is the requirement</text><rect x="1220" y="35" width="340" height="86" rx="14" fill="white" stroke="#A0B3C4" stroke-width="1.5" filter="url(#shadow)"/><text x="1238" y="59" class="label">Legend</text><line x1="1238" y1="83" x2="1290" y2="83" stroke="#0078D4" stroke-width="4"/><text x="1302" y="88" class="small">Pattern A: reverse proxy + WAF</text><line x1="1238" y1="111" x2="1290" y2="111" stroke="#CA5010" stroke-width="4"/><text x="1302" y="116" class="small">Pattern B: public IP / LB + firewall DNAT</text></svg>