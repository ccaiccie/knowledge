<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1300" viewBox="0 0 1900 1300"><defs><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px}.m{font-size:13px;font-family:monospace}.box{fill:#fff;stroke:#64748b;stroke-width:2}.sec{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.rt{fill:#f8fafc;stroke:#475569;stroke-width:1.5}.f{fill:none;stroke:#d97706;stroke-width:4;marker-end:url(#o)}.r{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#b)}</style></defs><text x="35" y="42" class="t">Hybrid Enforcement — Direct Connect Transit VIF / DXGW / TGW and Site-to-Site VPN</text>
<rect x="25" y="80" width="500" height="1120" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="45" y="115" class="h">On-premises 172.16.0.0/16</text><rect x="60" y="150" width="420" height="100" rx="8" class="box"/><text x="80" y="182" class="h">Corporate router pair</text><text x="80" y="210" class="s">Advertise 172.16.0.0/16 using BGP</text><text x="80" y="234" class="s">Receive AWS allowed prefixes, e.g. 10.10.0.0/16 + 10.20.0.0/16</text><rect x="60" y="310" width="190" height="145" rx="8" class="box"/><text x="80" y="342" class="h">Direct Connect</text><text x="80" y="370" class="s">Transit VIF</text><text x="80" y="395" class="s">Customer VLAN/BGP</text><text x="80" y="420" class="s">→ DX Gateway</text><text x="80" y="445" class="s">→ TGW association</text><rect x="290" y="310" width="190" height="145" rx="8" class="box"/><text x="310" y="342" class="h">Site-to-Site VPN</text><text x="310" y="370" class="s">2 IPsec tunnels</text><text x="310" y="395" class="s">BGP to TGW</text><text x="310" y="420" class="s">Backup or primary</text><text x="310" y="445" class="s">vpn-attachment</text><rect x="60" y="525" width="420" height="260" rx="8" class="rt"/><text x="80" y="557" class="h">BGP / route-selection notes</text><text x="80" y="590" class="s">Transit VIF does NOT terminate on a VPC.</text><text x="80" y="618" class="s">Path: DX connection → Transit VIF → DXGW → TGW DXGW attachment.</text><text x="80" y="653" class="s">TGW can propagate routes learned from DXGW and VPN attachments.</text><text x="80" y="688" class="s">For equal prefixes, TGW route priority prefers DXGW-propagated</text><text x="80" y="713" class="s">routes over ordinary Site-to-Site VPN-propagated routes.</text><text x="80" y="748" class="s">A static route can override propagated paths; use intentionally.</text><rect x="60" y="845" width="420" height="250" rx="8" class="rt"/><text x="80" y="877" class="h">DXGW allowed-prefix example</text><text x="80" y="910" class="m">10.10.0.0/16</text><text x="80" y="935" class="m">10.20.0.0/16</text><text x="80" y="970" class="s">These are advertised by the Direct Connect gateway toward on-premises.</text><text x="80" y="1000" class="s">They do not themselves force inspection; inspection is enforced by</text><text x="80" y="1025" class="s">the route tables inside each spoke at the TGW ingress/egress boundary.</text>
<rect x="565" y="80" width="555" height="1120" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="585" y="115" class="h">AWS Transit Gateway tgw-1</text><rect x="600" y="150" width="485" height="130" rx="8" class="box"/><text x="620" y="182" class="h">Hybrid attachment-side TGW route table</text><text x="620" y="210" class="m">10.10.0.0/16 → att-Spoke-A</text><text x="620" y="235" class="m">10.20.0.0/16 → att-Spoke-B</text><text x="620" y="260" class="s">Associate DXGW and VPN attachments here for inbound routing.</text><rect x="600" y="330" width="485" height="155" rx="8" class="box"/><text x="620" y="362" class="h">Spoke-side TGW route table</text><text x="620" y="390" class="m">172.16.0.0/16 → att-DXGW   (preferred propagated example)</text><text x="620" y="415" class="m">172.16.0.0/16 → att-VPN    (backup; appears when preferred withdrawn)</text><text x="620" y="445" class="s">Associate Spoke A/B attachments here.</text><text x="620" y="468" class="s">Do not point hybrid traffic to a centralized inspection VPC in this pattern.</text><rect x="600" y="545" width="485" height="220" rx="8" class="rt"/><text x="620" y="577" class="h">TGW route evaluation that matters</text><text x="620" y="610" class="s">1. Longest prefix match wins.</text><text x="620" y="640" class="s">2. Same CIDR: static > prefix-list > VPC propagated > DXGW propagated</text><text x="620" y="670" class="s">   > Connect > private-DX VPN > Site-to-Site VPN propagated.</text><text x="620" y="705" class="s">3. Same attachment type: shorter AS_PATH, then lower MED.</text><text x="620" y="735" class="s">TGW shows the preferred route; backup may appear only after withdrawal.</text><rect x="600" y="825" width="485" height="235" rx="8" class="sec"/><text x="620" y="857" class="h">Where firewall state is enforced</text><text x="620" y="890" class="s">The TGW only chooses the target spoke attachment.</text><text x="620" y="920" class="s">Once packet reaches the spoke TGW ENI subnet, that subnet RT</text><text x="620" y="945" class="s">must steer the destination workload prefix to the local GWLBE.</text><text x="620" y="980" class="s">Return traffic from the workload subnet must steer 172.16.0.0/16</text><text x="620" y="1005" class="s">to the same local GWLBE before its endpoint-subnet RT sends to TGW.</text>
<rect x="1160" y="80" width="715" height="1120" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="1180" y="115" class="h">Spoke A VPC 10.10.0.0/16 — distributed hybrid inspection</text><rect x="1195" y="150" width="275" height="95" rx="8" class="box"/><text x="1215" y="182" class="h">TGW attach subnet A-a</text><text x="1215" y="210" class="s">10.10.200.0/28</text><text x="1215" y="233" class="s">Packet enters from DX/VPN via TGW</text><rect x="1540" y="150" width="275" height="95" rx="8" class="sec"/><text x="1560" y="182" class="h">GWLBE-A-a</text><text x="1560" y="210" class="s">10.10.100.0/28</text><text x="1560" y="233" class="s">→ central GWLB / NGFW fleet</text><rect x="1540" y="300" width="275" height="95" rx="8" class="box"/><text x="1560" y="332" class="h">EC2-A</text><text x="1560" y="360" class="s">10.10.10.10</text><text x="1560" y="383" class="s">App subnet 10.10.10.0/24</text><rect x="1195" y="445" width="620" height="400" rx="8" class="rt"/><text x="1215" y="477" class="h">Spoke A route tables — exact enforcement points</text><text x="1215" y="510" class="m">RT-A-TGW-a (10.10.200.0/28)</text><text x="1215" y="535" class="m">10.10.0.0/16  → local</text><text x="1215" y="560" class="m">10.10.10.0/24 → vpce-gwlb-A-a   # inbound on-prem → workload inspection</text><text x="1215" y="600" class="m">RT-A-GWLBE-a (10.10.100.0/28)</text><text x="1215" y="625" class="m">10.10.0.0/16  → local             # after inbound inspection to EC2</text><text x="1215" y="650" class="m">172.16.0.0/16 → tgw-1            # after outbound inspection to on-prem</text><text x="1215" y="690" class="m">RT-A-App-a (10.10.10.0/24)</text><text x="1215" y="715" class="m">10.10.0.0/16  → local</text><text x="1215" y="740" class="m">172.16.0.0/16 → vpce-gwlb-A-a   # workload → on-prem inspection</text><text x="1215" y="790" class="s">Forward inbound tuple example: 172.16.50.25:50000 → 10.10.10.10:443</text><text x="1215" y="818" class="s">No NAT required: GWLB/GWLBE are transparent service insertion.</text><rect x="1195" y="900" width="620" height="195" rx="8" class="rt"/><text x="1215" y="932" class="h">Return path</text><text x="1215" y="965" class="s">10.10.10.10 → RT-A-App-a → GWLBE-A-a → central NGFW → GWLBE-A-a</text><text x="1215" y="995" class="s">→ RT-A-GWLBE-a 172.16.0.0/16 → TGW → preferred DXGW or VPN attachment</text><text x="1215" y="1025" class="s">→ on-prem router. The local GWLBE is therefore traversed in both directions.</text>
<path d="M250 382 H290" class="f"/><path d="M480 382 H555 Q575 382 575 215 H600" class="f"/><path d="M1085 215 H1160 Q1180 215 1180 197 H1195" class="f"/><path d="M1470 197 H1540" class="f"/><path d="M1677 245 V300" class="f"/><path d="M1540 347 H1510 Q1490 347 1490 197 H1470" class="r"/><path d="M1195 220 H1140 Q1120 220 1120 407 H1085" class="r"/><path d="M600 407 H550 Q525 407 525 382 H480" class="r"/></svg>