<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
  </defs>
  <rect width="1500" height="900" fill="white"/>
  <text x="750" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">AWS Overlay Networking: Connect as Routed Service Insertion</text>
  <text x="750" y="82" text-anchor="middle" font-family="Arial" font-size="17">Connect provides the appliance path; route policy makes it inline</text>

  <rect x="80" y="170" width="260" height="150" rx="16" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="210" y="210" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Spoke / Branch</text>
  <text x="210" y="245" text-anchor="middle" font-family="Arial" font-size="16">10.10.0.0/16</text>
  <text x="210" y="275" text-anchor="middle" font-family="Arial" font-size="15">Protected source</text>

  <rect x="605" y="135" width="290" height="220" rx="18" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="750" y="180" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">AWS Transit Fabric</text>
  <text x="750" y="215" text-anchor="middle" font-family="Arial" font-size="17">TGW or Cloud WAN</text>
  <rect x="650" y="245" width="200" height="70" rx="10" fill="white" stroke="#555"/>
  <text x="750" y="275" text-anchor="middle" font-family="Arial" font-size="16">Route / policy lookup</text>
  <text x="750" y="299" text-anchor="middle" font-family="Arial" font-size="14">selects Connect</text>

  <rect x="1130" y="170" width="290" height="150" rx="16" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="1275" y="210" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Security / SD-WAN NVA</text>
  <text x="1275" y="245" text-anchor="middle" font-family="Arial" font-size="16">Firewall + routing + BGP</text>
  <text x="1275" y="275" text-anchor="middle" font-family="Arial" font-size="15">Inspection / policy</text>

  <line x1="340" y1="245" x2="605" y2="245" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="472" y="225" text-anchor="middle" font-family="Arial" font-size="15">VPC/TGW route</text>

  <line x1="895" y1="215" x2="1130" y2="215" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1012" y="194" text-anchor="middle" font-family="Arial" font-size="15">GRE + BGP</text>
  <text x="1012" y="244" text-anchor="middle" font-family="Arial" font-size="13">or Cloud WAN Tunnel-less BGP</text>

  <line x1="1130" y1="290" x2="895" y2="290" stroke="#666" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arrow)"/>
  <text x="1012" y="320" text-anchor="middle" font-family="Arial" font-size="14">BGP advertisements attract prefixes</text>

  <rect x="470" y="455" width="560" height="110" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <text x="750" y="490" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">Transport / Underlay</text>
  <text x="750" y="525" text-anchor="middle" font-family="Arial" font-size="17">VPC attachment or Direct Connect (TGW)</text>
  <text x="750" y="551" text-anchor="middle" font-family="Arial" font-size="17">VPC attachment (Cloud WAN)</text>

  <line x1="750" y1="355" x2="750" y2="455" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="770" y="410" font-family="Arial" font-size="15">underlay reachability</text>

  <rect x="80" y="665" width="400" height="150" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <text x="280" y="705" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Not automatic interception</text>
  <text x="280" y="740" text-anchor="middle" font-family="Arial" font-size="15">If the winning route is direct,</text>
  <text x="280" y="765" text-anchor="middle" font-family="Arial" font-size="15">traffic bypasses the NVA.</text>

  <rect x="550" y="665" width="400" height="150" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <text x="750" y="705" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Stateful implication</text>
  <text x="750" y="740" text-anchor="middle" font-family="Arial" font-size="15">Forward + return must traverse</text>
  <text x="750" y="765" text-anchor="middle" font-family="Arial" font-size="15">the compatible firewall state owner.</text>

  <rect x="1020" y="665" width="400" height="150" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <text x="1220" y="705" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Encapsulation implication</text>
  <text x="1220" y="740" text-anchor="middle" font-family="Arial" font-size="15">GRE adds overhead but encryption</text>
  <text x="1220" y="765" text-anchor="middle" font-family="Arial" font-size="15">must be provided separately.</text>
</svg>