<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="80" y="120" width="300" height="100" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="230" y="155" text-anchor="middle" font-size="16" font-weight="700"><tspan x="230">VPC network: prod-vpc</tspan><tspan x="230" dy="25">Subnet us-central1: 10.10.0.0/20</tspan></text><rect x="110" y="300" width="190" height="90" rx="12" fill="#fff" stroke="#5f6368" stroke-width="2"/><text x="205" y="330" text-anchor="middle" font-size="15"><tspan x="205">VM-A</tspan><tspan x="205" dy="22">us-central1-a</tspan><tspan x="205" dy="22">10.10.1.10</tspan></text><rect x="450" y="120" width="360" height="110" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/><text x="630" y="150" text-anchor="middle" font-size="15" font-weight="700"><tspan x="630">Global / Hierarchical firewall policy</tspan><tspan x="630" dy="24">Rule: apply_security_profile_group</tspan><tspan x="630" dy="24">Optional: --tls-inspect</tspan></text><rect x="450" y="310" width="320" height="120" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/><text x="610" y="340" text-anchor="middle" font-size="15"><tspan x="610">Firewall endpoint association</tspan><tspan x="610" dy="23">Project-level resource</tspan><tspan x="610" dy="23">prod-vpc ↔ endpoint-a</tspan><tspan x="610" dy="23">Zone: us-central1-a</tspan></text><rect x="910" y="290" width="360" height="140" rx="12" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/><text x="1090" y="320" text-anchor="middle" font-size="16" font-weight="700"><tspan x="1090">Cloud NGFW Enterprise</tspan><tspan x="1090" dy="24">Firewall endpoint: endpoint-a</tspan><tspan x="1090" dy="24">Dedicated Google-managed instances</tspan><tspan x="1090" dy="24">us-central1-a</tspan></text><rect x="900" y="80" width="380" height="140" rx="12" fill="#f3e8fd" stroke="#a142f4" stroke-width="2"/><text x="1090" y="110" text-anchor="middle" font-size="15"><tspan x="1090">Security profile group</tspan><tspan x="1090" dy="23">Threat prevention (IPS)</tspan><tspan x="1090" dy="23">URL filtering</tspan><tspan x="1090" dy="23">Advanced malware sandbox (Preview)</tspan></text><rect x="1340" y="305" width="210" height="100" rx="12" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/><text x="1445" y="340" text-anchor="middle" font-size="15"><tspan x="1445">Internet / remote workload /</tspan><tspan x="1445" dy="24">another VPC endpoint</tspan></text><rect x="520" y="540" width="720" height="90" rx="12" fill="#fff8e1" stroke="#fbbc04" stroke-width="2"/><text x="880" y="575" text-anchor="middle" font-size="14"><tspan x="880">No custom route-to-firewall next hop is required.</tspan><tspan x="880" dy="22">Packet Intercept diverts only flows matching apply_security_profile_group.</tspan></text><path d="M300 345 H340 V175 H450" fill="none" stroke="#1a73e8" stroke-width="3" marker-end="url(#arr)"/><text x="345" y="160" font-size="13" fill="#1a73e8">1. policy applies</text><path d="M810 175 H900" fill="none" stroke="#a142f4" stroke-width="3" marker-end="url(#arr)"/><text x="820" y="160" font-size="13" fill="#a142f4">2. profile reference</text><path d="M770 370 H910" fill="none" stroke="#34a853" stroke-width="3" marker-end="url(#arr)"/><text x="785" y="355" font-size="13" fill="#34a853">3. zonal association</text><path d="M205 390 V470 H1090 V430" fill="none" stroke="#ea4335" stroke-width="3" marker-end="url(#arr)"/><text x="600" y="490" font-size="13" fill="#ea4335">4. intercepted + inspected</text><path d="M1270 360 H1340" fill="none" stroke="#5f6368" stroke-width="3" marker-end="url(#arr)"/><text x="1275" y="345" font-size="13" fill="#5f6368">5. reinjected</text><path d="M1090 220 V290" fill="none" stroke="#a142f4" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="1105" y="260" font-size="13" fill="#a142f4">profile group</text></g></svg>