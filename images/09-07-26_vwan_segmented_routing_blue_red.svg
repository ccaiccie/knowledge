<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="700" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Custom Isolation: Blue / Red VNets + ExpressRoute Branch</text><rect x="40" y="280" width="230" height="140" rx="14" fill="#f7f9fc" stroke="#333" stroke-width="2"/><text x="155" y="310" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">On-prem / ER</text><text x="54" y="338" font-family="Arial" font-size="15">10.100.0.0/16</text><text x="54" y="360" font-family="Arial" font-size="15">Branch connection</text><text x="54" y="382" font-family="Arial" font-size="15">Assoc: Default</text><rect x="390" y="80" width="250" height="150" rx="14" fill="#f7f9fc" stroke="#333" stroke-width="2"/><text x="515" y="110" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">RT_BLUE</text><text x="404" y="138" font-family="Arial" font-size="15">Contains branch routes</text><text x="404" y="160" font-family="Arial" font-size="15">Contains Blue VNet routes</text><text x="404" y="182" font-family="Arial" font-size="15">No Red VNet routes</text><rect x="390" y="300" width="250" height="150" rx="14" fill="#f7f9fc" stroke="#333" stroke-width="2"/><text x="515" y="330" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">defaultRouteTable</text><text x="404" y="358" font-family="Arial" font-size="15">All branches associate here</text><text x="404" y="380" font-family="Arial" font-size="15">Can learn Blue + Red</text><text x="404" y="402" font-family="Arial" font-size="15">Branch forwarding table</text><rect x="390" y="520" width="250" height="150" rx="14" fill="#f7f9fc" stroke="#333" stroke-width="2"/><text x="515" y="550" text-anchor="middle" font-family