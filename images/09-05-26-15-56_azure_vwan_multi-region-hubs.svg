<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker>
</defs>
<rect width="100%" height="100%" fill="white" fill-opacity="0"/>
<text x="40" y="48" font-family="Arial" font-size="30" font-weight="700">Azure Virtual WAN — Multi-Region Hub Architecture</text>
<rect x="40" y="90" width="1520" height="760" rx="24" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
<text x="70" y="130" font-family="Arial" font-size="21" font-weight="700">One Standard Virtual WAN (global logical container)</text>
<rect x="90" y="180" width="420" height="560" rx="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="300" y="215" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">West US Region</text>
<rect x="170" y="280" width="260" height="170" rx="18" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="300" y="320" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Virtual Hub West</text>
<text x="300" y="350" text-anchor="middle" font-family="Arial" font-size="14">Regional vHub router</text>
<text x="300" y="375" text-anchor="middle" font-family="Arial" font-size="14">VPN / ER gateways</text>
<text x="300" y="400" text-anchor="middle" font-family="Arial" font-size="14">Azure Firewall or integrated NVA</text>
<rect x="120" y="540" width="150" height="90" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="195" y="575" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Spoke W1</text>
<text x="195" y="602" text-anchor="middle" font-family="Arial" font-size="13">10.10.0.0/16</text>
<rect x="320" y="540" width="150" height="90" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
<text x="395" y="575" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Branch West</text>
<text x="395" y="602" text-anchor="middle" font-family="Arial" font-size="13">VPN / ER</text>
<rect x="1090" y="180" width="420" height="560" rx="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="1300" y="215" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">East US Region</text>
<rect x="1170" y="280" width="260" height="170" rx="18" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="1300" y="320" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Virtual Hub East</text>
<text x="1300" y="350" text-anchor="middle" font-family="Arial" font-size="14">Regional vHub router</text>
<text x="1300" y="375" text-anchor="middle" font-family="Arial" font-size="14">VPN / ER gateways</text>
<text x="1300" y="400" text-anchor="middle" font-family="Arial" font-size="14">Azure Firewall or integrated NVA</text>
<rect x="1120" y="540" width="150" height="90" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="1195" y="575" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Spoke E1</text>
<text x="1195" y="602" text-anchor="middle" font-family="Arial" font-size="13">10.20.0.0/16</text>
<rect x="1320" y="540" width="150" height="90" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
<text x="1395" y="575" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Branch East</text>
<text x="1395" y="602" text-anchor="middle" font-family="Arial" font-size="13">VPN / ER</text>
<rect x="610" y="300" width="380" height="130" rx="30" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="800" y="345" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Microsoft Global Network</text>
<text x="800" y="375" text-anchor="middle" font-family="Arial" font-size="14">Automatic vHub-to-vHub connectivity</text>
<text x="800" y="400" text-anchor="middle" font-family="Arial" font-size="14">No customer hub-to-hub VPN or Global VNet Peering</text>
<line x1="430" y1="365" x2="610" y2="365" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="990" y1="365" x2="1170" y2="365" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="610" y1="400" x2="430" y2="400" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1170" y1="400" x2="990" y2="400" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="195" y1="540" x2="250" y2="450" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="395" y1="540" x2="350" y2="450" stroke="#EA580C" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1195" y1="540" x2="1250" y2="450" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1395" y1="540" x2="1350" y2="450" stroke="#EA580C" stroke-width="3" marker-end="url(#arrow)"/>
<text x="800" y="500" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Inter-region path example</text>
<text x="800" y="530" text-anchor="middle" font-family="Arial" font-size="14">Spoke W1 → Hub West → Microsoft backbone → Hub East → Spoke E1</text>
<text x="800" y="565" text-anchor="middle" font-family="Arial" font-size="14">With Routing Intent + Inter-hub enabled, each hub can insert its configured firewall/NVA.</text>
<text x="800" y="600" text-anchor="middle" font-family="Arial" font-size="14">Without inter-hub inspection, private traffic can use native hub-to-hub transit directly.</text>
<text x="70" y="805" font-family="Arial" font-size="14" font-weight="700">Key constraint:</text>
<text x="170" y="805" font-family="Arial" font-size="14">A VNet can connect to only one virtual hub. Place workload VNets near their preferred regional hub.</text>
</svg>