<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><rect width="1500" height="900" fill="white"/><text x="750" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">AWS Overlay Routing — Control Plane, Data Plane, and Underlay</text><rect x="80" y="150" width="310" height="180" rx="16" fill="#f7f7f7" stroke="#333" stroke-width="2"/><text x="235" y="195" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">AWS Transit Fabric</text><text x="235" y="235" text-anchor="middle" font-family="Arial" font-size="17">TGW / Cloud WAN Connect</text><rect x="1110" y="150" width="310" height="180" rx="16" fill="#f7f7f7" stroke="#333" stroke-width="2"/><text x="1265" y="195" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Third-Party Appliance</text><text x="1265" y="235" text-anchor="middle" font-family="Arial" font-size="17">SD-WAN / Router / NVA</text><line x1="390" y1="205" x2="1110" y2="205" stroke="#333" stroke-width="4" marker-end="url(#a)"/><text x="750" y="180" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">CONTROL PLANE — BGP</text><line x1="1110" y1="280" x2="390" y2="280" stroke="#555" stroke-width="4" marker-end="url(#a)"/><text x="750" y="315" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">DATA PLANE — GRE where applicable</text><rect x="430" y="440" width="640" height="160" rx="16" fill="#fafafa" stroke="#333" stroke-width="2"/><text x="750" y="485" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">UNDERLAY / TRANSPORT</text><text x="750" y="525" text-anchor="middle" font-family="Arial" font-size="18">VPC attachment / AWS backbone / Direct Connect</text><text x="750" y="560" text-anchor="middle" font-family="Arial" font-size="16">Provides endpoint reachability</text><line x1="235" y1="330" x2="520" y2="440" stroke="#333" stroke-width="3" marker-end="url(#a)"/><line x1="1265" y1="330" x2="980" y2="440" stroke="#333" stroke-width="3" marker-end="url(#a)"/><rect x="120" y="690" width="380" height="120" rx="12" fill="#fafafa" stroke="#333"/><text x="310" y="735" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Underlay</text><text x="310" y="770" text-anchor="middle" font-family="Arial" font-size="15">Can the endpoints reach each other?</text><rect x="560" y="690" width="380" height="120" rx="12" fill="#fafafa" stroke="#333"/><text x="750" y="735" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Overlay</text><text x="750" y="770" text-anchor="middle" font-family="Arial" font-size="15">Which prefixes are reachable through whom?</text><rect x="1000" y="690" width="380" height="120" rx="12" fill="#fafafa" stroke="#333"/><text x="1190" y="735" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Tunnel-less Cloud WAN</text><text x="1190" y="770" text-anchor="middle" font-family="Arial" font-size="15">Native BGP; no GRE tunnel</text></svg>