<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1200" viewBox="0 0 1900 1200">
<defs>
  <marker id="fwd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
  <marker id="ret" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D84315"/></marker>
</defs>
<rect width="1900" height="1200" fill="#FFFFFF"/>

<text x="950" y="42" text-anchor="middle" font-family="Arial" font-size="31" font-weight="bold">Palo Alto VM-Series + AWS GWLB — Internet ↔ DMZ Flow with Overlay Routing</text>
<text x="950" y="76" text-anchor="middle" font-family="Arial" font-size="17">Top lane = inbound/forward flow • Bottom lane = reverse flow • No shared arrow junctions</text>

<!-- VPC boundaries -->
<rect x="245" y="120" width="590" height="820" rx="22" fill="#FFF8E1" stroke="#FB8C00" stroke-width="4"/>
<text x="540" y="158" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold">DMZ VPC — 10.10.0.0/16</text>

<rect x="885" y="120" width="610" height="820" rx="22" fill="#E3F2FD" stroke="#1976D2" stroke-width="4"/>
<text x="1190" y="158" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold">Security VPC — 10.100.0.0/16</text>

<!-- Internet -->
<rect x="35" y="225" width="165" height="95" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
<text x="118" y="263" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Internet</text>
<text x="118" y="291" text-anchor="middle" font-family="Arial" font-size="14">198.51.100.25</text>

<!-- DMZ nodes -->
<rect x="295" y="210" width="205" height="115" rx="14" fill="#FFE0B2" stroke="#EF6C00" stroke-width="2"/>
<text x="398" y="247" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">Internet Gateway</text>
<text x="398" y="276" text-anchor="middle" font-family="Arial" font-size="14">IGW gateway RT</text>
<text x="398" y="301" text-anchor="middle" font-family="Arial" font-size="13">10.10.10.0/24 → vpce-dmz-a</text>

<rect x="595" y="210" width="195" height="115" rx="14" fill="#FFD180" stroke="#EF6C00" stroke-width="2"/>
<text x="692" y="247" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">GWLBE-DMZ-A</text>
<text x="692" y="276" text-anchor="middle" font-family="Arial" font-size="14">vpce-dmz-a</text>
<text x="692" y="301" text-anchor="middle" font-family="Arial" font-size="13">consumer endpoint</text>

<rect x="345" y="505" width="390" height="125" rx="14" fill="#FFF3E0" stroke="#FB8C00" stroke-width="2"/>
<text x="540" y="543" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">ALB / DMZ Application</text>
<text x="540" y="575" text-anchor="middle" font-family="Arial" font-size="15">ALB: 10.10.10.0/24</text>
<text x="540" y="603" text-anchor="middle" font-family="Arial" font-size="15">App: 10.10.20.0/24</text>

<rect x="330" y="705" width="420" height="145" rx="14" fill="#FFFDE7" stroke="#F9A825" stroke-width="2"/>
<text x="540" y="742" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Relevant AWS routing</text>
<text x="365" y="778" font-family="Arial" font-size="15">IGW RT:</text><text x="470" y="778" font-family="Arial" font-size="15">10.10.10.0/24 → vpce-dmz-a</text>
<text x="365" y="810" font-family="Arial" font-size="15">DMZ RT:</text><text x="470" y="810" font-family="Arial" font-size="15">0.0.0.0/0 → vpce-dmz-a</text>

<!-- Security nodes -->
<rect x="945" y="210" width="490" height="110" rx="14" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
<text x="1190" y="249" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">AWS Gateway Load Balancer</text>
<text x="1190" y="279" text-anchor="middle" font-family="Arial" font-size="14">PrivateLink endpoint service</text>
<text x="1190" y="303" text-anchor="middle" font-family="Arial" font-size="13">GENEVE UDP/6081 to VM-Series</text>

<rect x="960" y="420" width="460" height="255" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
<text x="1190" y="460" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Palo Alto VM-Series</text>
<text x="1190" y="500" text-anchor="middle" font-family="Arial" font-size="16">vpce-dmz-a → ethernet1/1.10 → DMZ</text>
<text x="1190" y="535" text-anchor="middle" font-family="Arial" font-size="16">Inspect inner packet + apply security policy</text>
<text x="1190" y="570" text-anchor="middle" font-family="Arial" font-size="16">Inner destination = DMZ ALB / application</text>
<text x="1190" y="605" text-anchor="middle" font-family="Arial" font-size="16">Result: remain on GWLB service path</text>
<text x="1190" y="640" text-anchor="middle" font-family="Arial" font-size="14">No native UNTRUST/TRANSIT exit for this specific inbound flow</text>

<!-- FORWARD FLOW -->
<text x="950" y="185" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1565C0">FORWARD / INBOUND FLOW</text>

<path d="M200 270 H295" fill="none" stroke="#1565C0" stroke-width="5" stroke-linecap="round" marker-end="url(#fwd)"/>
<text x="247" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#1565C0">1</text>

<path d="M500 270 H595" fill="none" stroke="#1565C0" stroke-width="5" stroke-linecap="round" marker-end="url(#fwd)"/>
<text x="547" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#1565C0">2</text>

<path d="M790 270 H860 Q885 270 885 295 V345 Q885 370 910 370 H1190 V320" fill="none" stroke="#1565C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fwd)"/>
<text x="875" y="250" text-anchor="middle" font-family="Arial" font-size="13" fill="#1565C0">3 PrivateLink</text>

<path d="M1190 320 V420" fill="none" stroke="#1565C0" stroke-width="5" stroke-linecap="round" marker-end="url(#fwd)"/>
<text x="1218" y="377" font-family="Arial" font-size="13" fill="#1565C0">4 GENEVE</text>

<path d="M960 555 H890 Q855 555 855 520 V470 Q855 440 825 440 H735 V505" fill="none" stroke="#1565C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fwd)"/>
<text x="840" y="500" text-anchor="middle" font-family="Arial" font-size="13" fill="#1565C0">5 return to GWLBE / continue to DMZ target</text>

<!-- RETURN FLOW -->
<text x="950" y="920" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#D84315">REVERSE FLOW — DMZ RESPONSE BACK TO INTERNET CLIENT</text>

<path d="M540 630 V895 Q540 925 570 925 H692 V325" fill="none" stroke="#D84315" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ret)"/>
<text x="615" y="900" text-anchor="middle" font-family="Arial" font-size="13" fill="#D84315">R1 DMZ app → GWLBE-DMZ</text>

<path d="M790 305 H830 Q865 305 865 335 V865 Q865 895 895 895 H1190 V675" fill="none" stroke="#D84315" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ret)"/>
<text x="935" y="878" text-anchor="middle" font-family="Arial" font-size="13" fill="#D84315">R2 GWLBE → GWLB → same VM-Series session</text>

<path d="M1420 545 H1460 Q1490 545 1490 510 V390 Q1490 360 1460 360 H1190 V320" fill="none" stroke="#D84315" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ret)"/>
<text x="1500" y="455" text-anchor="middle" font-family="Arial" font-size="13" fill="#D84315">R3 re-encapsulated GWLB return</text>

<path d="M945 250 H835 Q810 250 810 225 V165 Q810 140 785 140 H530 Q505 140 505 165 V210" fill="none" stroke="#D84315" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ret)"/>
<text x="680" y="128" text-anchor="middle" font-family="Arial" font-size="13" fill="#D84315">R4 GWLBE → IGW path</text>

<path d="M295 245 H205" fill="none" stroke="#D84315" stroke-width="5" stroke-linecap="round" marker-end="url(#ret)"/>
<text x="250" y="225" text-anchor="middle" font-family="Arial" font-size="14" fill="#D84315">R5</text>

<!-- Explainer -->
<rect x="65" y="980" width="1770" height="160" rx="16" fill="#FAFAFA" stroke="#455A64" stroke-width="2"/>
<text x="950" y="1018" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Why this version is easier to read</text>
<text x="100" y="1055" font-family="Arial" font-size="15"><tspan font-weight="bold">Forward:</tspan> blue arrows only, numbered 1–5, always move across the upper/middle portion of the canvas.</text>
<text x="100" y="1087" font-family="Arial" font-size="15"><tspan font-weight="bold">Reverse:</tspan> orange arrows only, numbered R1–R5, use independent outer lanes and never share a junction with the forward path.</text>
<text x="100" y="1119" font-family="Arial" font-size="15"><tspan font-weight="bold">Scope:</tspan> this overview shows Internet ↔ DMZ only. DMZ→Internet native egress and DMZ→TRUST are intentionally shown in separate diagrams.</text>
</svg>