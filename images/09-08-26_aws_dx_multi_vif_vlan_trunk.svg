<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="black"/></marker></defs><rect width="1800" height="1100" fill="white"/><g font-family="Arial" fill="none" stroke="black" stroke-width="2"><rect x="70" y="430" width="280" height="170" rx="20"/><text x="210" y="475" text-anchor="middle" fill="black" font-size="24" font-weight="bold">Customer Router</text><text x="210" y="515" text-anchor="middle" fill="black" font-size="20">DX physical port</text><text x="210" y="550" text-anchor="middle" fill="black" font-size="18">802.1Q trunk</text><rect x="450" y="390" width="300" height="250" rx="20"/><text x="600" y="430" text-anchor="middle" fill="black" font-size="24" font-weight="bold">One Direct Connect</text><text x="600" y="465" text-anchor="middle" fill="black" font-size="22">physical connection</text><text x="600" y="515" text-anchor="middle" fill="black" font-size="18">VLAN 100 = Transit VIF</text><text x="600" y="550" text-anchor="middle" fill="black" font-size="18">VLAN 200 = Public VIF</text><text x="600" y="585" text-anchor="middle" fill="black" font-size="18">VLAN 300 = Private VIF</text><rect x="860" y="120" width="320" height="180" rx="20"/><text x="1020" y="165" text-anchor="middle" fill="black" font-size="24" font-weight="bold">Transit VIF — VLAN 100</text><text x="1020" y="205" text-anchor="middle" fill="black" font-size="18">BGP session A</text><text x="1020" y="240" text-anchor="middle" fill="black" font-size="18">terminates on DXGW</text><rect x="1320" y="120" width="340" height="180" rx="20"/><text x="1490" y="165" text-anchor="middle" fill="black" font-size="24" font-weight="bold">DX Gateway → TGW</text><text x="1490" y="205" text-anchor="middle" fill="black" font-size="18">private hybrid routing</text><text x="1490" y="240" text-anchor="middle" fill="black" font-size="18">VPCs attached to TGW</text><rect x="860" y="455" width="320" height="180" rx="20"/><text x="1020" y="500" text-anchor="middle" fill="black" font-size="24" font-weight="bold">Public VIF — VLAN 200</text><text x="1020" y="540" text-anchor="middle" fill="black" font-size="18">BGP session B</text><text x="1020" y="575" text-anchor="middle" fill="black" font-size="18">AWS public services</text><rect x="1320" y="455" width="340" height="180" rx="20"/><text x="1490" y="500" text-anchor="middle" fill="black" font-size="24" font-weight="bold">AWS Public Prefixes</text><text x="1490" y="540" text-anchor="middle" fill="black" font-size="18">S3 / public AWS endpoints</text><text x="1490" y="575" text-anchor="middle" fill="black" font-size="18">not generic Internet transit</text><rect x="860" y="790" width="320" height="180" rx="20"/><text x="1020" y="835" text-anchor="middle" fill="black" font-size="24" font-weight="bold">Private VIF — VLAN 300</text><text x="1020" y="875" text-anchor="middle" fill="black" font-size="18">BGP session C</text><text x="1020" y="910" text-anchor="middle" fill="black" font-size="18">VGW or DXGW private path</text><rect x="1320" y="790" width="340" height="180" rx="20"/><text x="1490" y="835" text-anchor="middle" fill="black" font-size="24" font-weight="bold">VGW / DXGW</text><text x="1490" y="875" text-anchor="middle" fill="black" font-size="18">private VPC connectivity</text><path d="M350 515 H450" marker-end="url(#a)"/><path d="M750 465 C800 465 800 210 860 210" marker-end="url(#a)"/><path d="M750 515 H860" marker-end="url(#a)"/><path d="M750 565 C800 565 800 880 860 880" marker-end="url(#a)"/><path d="M1180 210 H1320" marker-end="url(#a)"/><path d="M1180 545 H1320" marker-end="url(#a)"/><path d="M1180 880 H1320" marker-end="url(#a)"/></g><g font-family="Arial" fill="black"><text x="900" y="70" text-anchor="middle" font-size="28" font-weight="bold">One physical Direct Connect connection can carry multiple VIFs on unique VLAN tags</text><text x="400" y="485" text-anchor="middle" font-size="16">single Ethernet handoff</text><text x="805" y="185" text-anchor="middle" font-size="16">tag 100</text><text x="805" y="500" text-anchor="middle" font-size="16">tag 200</text><text x="805" y="835" text-anchor="middle" font-size="16">tag 300</text><text x="900" y="1040" text-anchor="middle" font-size="18">VLAN IDs must be unique on the connection (1–4094). Hosted connections normally receive the VLAN from the DX Partner.</text></g></svg>