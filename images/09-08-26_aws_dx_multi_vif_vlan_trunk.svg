<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100"><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker><marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7e22ce"/></marker></defs><rect width="1800" height="1100" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif"><text x="900" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2937">One Direct Connect Link, Three VLANs, Three Independent VIF/BGP Services</text><rect x="70" y="430" width="280" height="180" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="210" y="478" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">Customer Router</text><text x="210" y="520" text-anchor="middle" font-size="19" fill="#1e3a8a">DX physical port</text><text x="210" y="558" text-anchor="middle" font-size="19" fill="#1e3a8a">802.1Q trunk</text><rect x="450" y="390" width="320" height="260" rx="18" fill="#fde68a" stroke="#d97706" stroke-width="3"/><text x="610" y="440" text-anchor="middle" font-size="23" font-weight="700" fill="#92400e">AWS Direct Connect</text><text x="610" y="478" text-anchor="middle" font-size="20" fill="#92400e">Physical Connection</text><text x="610" y="535" text-anchor="middle" font-size="18" fill="#92400e">One Ethernet handoff</text><text x="610" y="570" text-anchor="middle" font-size="18" fill="#92400e">carrying multiple tagged VLANs</text><rect x="900" y="110" width="300" height="180" rx="18" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/><text x="1050" y="158" text-anchor="middle" font-size="22" font-weight="700" fill="#9a3412">Transit VIF</text><text x="1050" y="200" text-anchor="middle" font-size="20" fill="#9a3412">VLAN 100</text><text x="1050" y="238" text-anchor="middle" font-size="19" fill="#9a3412">BGP session A</text><rect x="1370" y="110" width="330" height="180" rx="18" fill="#e9d5ff" stroke="#7e22ce" stroke-width="3"/><text x="1535" y="158" text-anchor="middle" font-size="22" font-weight="700" fill="#581c87">DX Gateway → TGW</text><text x="1535" y="200" text-anchor="middle" font-size="19" fill="#581c87">Private hybrid routing</text><text x="1535" y="238" text-anchor="middle" font-size="19" fill="#581c87">VPCs behind TGW</text><rect x="900" y="455" width="300" height="180" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1050" y="503" text-anchor="middle" font-size="22" font-weight="700" fill="#991b1b">Public VIF</text><text x="1050" y="545" text-anchor="middle" font-size="20" fill="#991b1b">VLAN 200</text><text x="1050" y="583" text-anchor="middle" font-size="19" fill="#991b1b">BGP session B</text><rect x="1370" y="455" width="330" height="180" rx="18" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/><text x="1535" y="503" text-anchor="middle" font-size="22" font-weight="700" fill="#7f1d1d">AWS Public Prefixes</text><text x="1535" y="545" text-anchor="middle" font-size="19" fill="#7f1d1d">S3 / public AWS endpoints</text><text x="1535" y="583" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">NOT generic Internet transit</text><rect x="900" y="800" width="300" height="180" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1050" y="848" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">Private VIF</text><text x="1050" y="890" text-anchor="middle" font-size="20" fill="#166534">VLAN 300</text><text x="1050" y="928" text-anchor="middle" font-size="19" fill="#166534">BGP session C</text><rect x="1370" y="800" width="330" height="180" rx="18" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/><text x="1535" y="853" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">VGW or DXGW</text><text x="1535" y="900" text-anchor="middle" font-size="19" fill="#14532d">Private VPC connectivity</text><path d="M350 520 H450" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/><path d="M770 520 H830 V200 H900" fill="none" stroke="#ea580c" stroke-width="5" marker-end="url(#orange)"/><path d="M770 520 H900" fill="none" stroke="#dc2626" stroke-width="5" marker-end="url(#red)"/><path d="M770 520 H830 V890 H900" fill="none" stroke="#16a34a" stroke-width="5" marker-end="url(#green)"/><path d="M1200 200 H1370" fill="none" stroke="#7e22ce" stroke-width="5" marker-end="url(#purple)"/><path d="M1200 545 H1370" fill="none" stroke="#dc2626" stroke-width="5" marker-end="url(#red)"/><path d="M1200 890 H1370" fill="none" stroke="#16a34a" stroke-width="5" marker-end="url(#green)"/><text x="400" y="500" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">single Ethernet handoff</text><text x="825" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">VLAN tag 100</text><text x="835" y="500" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">VLAN tag 200</text><text x="825" y="855" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">VLAN tag 300</text><rect x="430" y="1020" width="1000" height="55" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="930" y="1055" text-anchor="middle" font-size="18" fill="#374151">Each VIF uses a unique VLAN on the connection. Logical separation does not provide physical redundancy.</text></g></svg>