<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<defs>
  <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1473e6"/></marker>
  <marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7b1fa2"/></marker>
  <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1b8f4b"/></marker>
</defs>
<rect width="1600" height="950" fill="white"/>
<text x="40" y="45" font-family="Arial" font-size="28" font-weight="700">Same-VPC public service — protected inbound and symmetric return path</text>
<rect x="230" y="85" width="1320" height="760" rx="16" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="2"/>
<text x="255" y="118" font-family="Arial" font-size="18" font-weight="700">VPC 10.20.0.0/16</text>

<rect x="40" y="330" width="150" height="90" rx="16" fill="#f5f5f5" stroke="#777" stroke-width="2"/>
<text x="115" y="365" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Internet</text>
<text x="115" y="392" text-anchor="middle" font-family="Arial" font-size="14">Client</text>

<rect x="300" y="285" width="260" height="170" rx="16" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
<text x="430" y="318" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Internet Gateway</text>
<text x="430" y="348" text-anchor="middle" font-family="Arial" font-size="15">Gateway route table</text>
<text x="430" y="378" text-anchor="middle" font-family="Arial" font-size="15">10.20.20.0/24 → FW1 ENI</text>
<text x="430" y="408" text-anchor="middle" font-family="Arial" font-size="14">Inbound interception</text>

<rect x="690" y="270" width="280" height="190" rx="16" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
<text x="830" y="303" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">FW1 — ACTIVE</text>
<text x="830" y="333" text-anchor="middle" font-family="Arial" font-size="15">ENI 10.20.10.10</text>
<text x="830" y="363" text-anchor="middle" font-family="Arial" font-size="15">Stateful inspection</text>
<text x="830" y="393" text-anchor="middle" font-family="Arial" font-size="15">Advertises app CIDR + 0/0</text>
<text x="830" y="423" text-anchor="middle" font-family="Arial" font-size="14">short AS_PATH</text>

<rect x="1120" y="280" width="340" height="190" rx="16" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
<text x="1290" y="313" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Protected application subnet</text>
<text x="1290" y="343" text-anchor="middle" font-family="Arial" font-size="15">10.20.20.0/24</text>
<text x="1290" y="373" text-anchor="middle" font-family="Arial" font-size="15">App 10.20.20.25 + public IPv4/EIP</text>
<text x="1290" y="403" text-anchor="middle" font-family="Arial" font-size="15">Subnet RT: 0.0.0.0/0 → FW1 ENI</text>
<text x="1290" y="433" text-anchor="middle" font-family="Arial" font-size="14">No direct default to IGW</text>

<rect x="680" y="590" width="300" height="130" rx="16" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
<text x="830" y="623" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Firewall/provider subnet route table</text>
<text x="830" y="655" text-anchor="middle" font-family="Arial" font-size="15">0.0.0.0/0 → igw-id</text>
<text x="830" y="686" text-anchor="middle" font-family="Arial" font-size="14">Post-inspection Internet next hop</text>

<rect x="1100" y="610" width="360" height="115" rx="16" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
<text x="1280" y="642" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">VPC Route Server</text>
<text x="1280" y="672" text-anchor="middle" font-family="Arial" font-size="14">BGP/BFD control plane</text>
<text x="1280" y="700" text-anchor="middle" font-family="Arial" font-size="14">Best path installs active firewall ENI</text>

<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M190 360 C225 285 270 285 300 335" stroke="#1473e6" stroke-width="4" marker-end="url(#b)"/>
  <path d="M560 325 C610 205 655 205 690 315" stroke="#1473e6" stroke-width="4" marker-end="url(#b)"/>
  <path d="M970 315 C1020 205 1080 205 1120 325" stroke="#1473e6" stroke-width="4" marker-end="url(#b)"/>
  <path d="M1290 470 C1290 545 1120 565 1010 540 C950 528 925 500 905 460" stroke="#7b1fa2" stroke-width="4" marker-end="url(#p)"/>
  <path d="M830 460 C850 505 850 545 830 590" stroke="#7b1fa2" stroke-width="4" marker-end="url(#p)"/>
  <path d="M680 655 C585 655 520 610 480 545 C450 500 438 478 430 455" stroke="#7b1fa2" stroke-width="4" marker-end="url(#p)"/>
  <path d="M300 405 C270 500 220 500 190 395" stroke="#7b1fa2" stroke-width="4" marker-end="url(#p)"/>
  <path d="M970 410 C1040 450 1040 565 1100 650" stroke="#1b8f4b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#g)"/>
</g>

<g font-family="Arial" font-size="13" font-weight="700">
  <text x="205" y="275" fill="#1473e6">1  Internet → IGW</text>
  <text x="565" y="190" fill="#1473e6">2  IGW route table → active FW</text>
  <text x="995" y="190" fill="#1473e6">3  Stateful inspection → application</text>
  <text x="1050" y="550" fill="#7b1fa2">4  Return: application subnet RT → FW1</text>
  <text x="585" y="560" fill="#7b1fa2">5  FW/provider subnet RT → IGW</text>
  <text x="205" y="515" fill="#7b1fa2">6  IGW → Internet</text>
  <text x="1005" y="575" fill="#1b8f4b">BGP/BFD advertisements + withdrawal</text>
</g>

<rect x="275" y="770" width="1160" height="60" rx="12" fill="#fff7f7" stroke="#b85450"/>
<text x="855" y="807" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#8d2d2d">Critical: 0.0.0.0/0 → IGW in the application subnet would bypass the stateful firewall on return traffic.</text>
<text x="40" y="900" font-family="Arial" font-size="14" fill="#555">Blue = inbound forward path • Purple = return/egress path • Green dashed = Route Server control plane</text>
</svg>