<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1473e6"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7b1fa2"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1b8f4b"/></marker></defs>
<rect width="1600" height="950" fill="white"/><text x="40" y="45" font-family="Arial" font-size="28" font-weight="700">Same-VPC public service — protected inbound and symmetric return path</text>
<rect x="230" y="85" width="1320" height="760" rx="16" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="2"/><text x="255" y="118" font-family="Arial" font-size="18" font-weight="700">VPC 10.20.0.0/16</text>
<rect x="30" y="360" width="150" height="90" rx="12" fill="#f5f5f5" stroke="#777" stroke-width="2"/><text x="105" y="395" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Internet</text><text x="105" y="422" text-anchor="middle" font-family="Arial" font-size="14">Client</text>
<rect x="280" y="320" width="260" height="155" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="410" y="352" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Internet Gateway</text><text x="410" y="382" text-anchor="middle" font-family="Arial" font-size="15">Gateway route table</text><text x="410" y="412" text-anchor="middle" font-family="Arial" font-size="15">10.20.20.0/24 → FW1 ENI</text><text x="410" y="440" text-anchor="middle" font-family="Arial" font-size="14">Inbound interception only</text>
<rect x="650" y="280" width="280" height="180" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="790" y="312" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">FW1 — ACTIVE</text><text x="790" y="342" text-anchor="middle" font-family="Arial" font-size="15">ENI 10.20.10.10</text><text x="790" y="370" text-anchor="middle" font-family="Arial" font-size="15">Stateful inspection</text><text x="790" y="398" text-anchor="middle" font-family="Arial" font-size="15">Advertises app CIDR + 0/0</text><text x="790" y="426" text-anchor="middle" font-family="Arial" font-size="14">short AS_PATH</text>
<rect x="1080" y="300" width="330" height="180" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1245" y="332" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Protected application subnet</text><text x="1245" y="362" text-anchor="middle" font-family="Arial" font-size="15">10.20.20.0/24</text><text x="1245" y="390" text-anchor="middle" font-family="Arial" font-size="15">App 10.20.20.25 + public IPv4/EIP</text><text x="1245" y="420" text-anchor="middle" font-family="Arial" font-size="15">Subnet RT: 0.0.0.0/0 → FW1 ENI</text><text x="1245" y="448" text-anchor="middle" font-family="Arial" font-size="14">No direct default route to IGW</text>
<rect x="650" y="585" width="280" height="125" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="790" y="618" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Firewall/provider subnet RT</text><text x="790" y="650" text-anchor="middle" font-family="Arial" font-size="15">0.0.0.0/0 → igw-id</text><text x="790" y="680" text-anchor="middle" font-family="Arial" font-size="14">Only this subnet points directly to IGW</text>
<rect x="1020" y="620" width="390" height="105" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1215" y="653" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">VPC Route Server</text><text x="1215" y="683" text-anchor="middle" font-family="Arial" font-size="14">Best path selects which firewall ENI is installed</text>
<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M180 405 H280" stroke="#1473e6" stroke-width="4" marker-end="url(#b)"/><path d="M540 405 H650" stroke="#1473e6" stroke-width="4" marker-end="url(#b)"/><path d="M930 370 H1080" stroke="#1473e6" stroke-width="4" marker-end="url(#b)"/><path d="M1245 480 V535 H790 V460" stroke="#7b1fa2" stroke-width="4" marker-end="url(#p)"/><path d="M650 420 H600 V648 H650" stroke="#7b1fa2" stroke-width="4" marker-end="url(#p)"/><path d="M650 648 H510 V475" stroke="#7b1fa2" stroke-width="4" marker-end="url(#p)"/><path d="M930 410 H970 V672 H1020" stroke="#1b8f4b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#g)"/></g>
<g font-family="Arial" font-size="13" font-weight="700"><text x="195" y="390" fill="#1473e6">1 inbound</text><text x="555" y="390" fill="#1473e6">2 IGW RT → active FW</text><text x="955" y="355" fill="#1473e6">3 inspect → app</text><text x="1000" y="525" fill="#7b1fa2">4 return: app RT → FW1</text><text x="515" y="620" fill="#7b1fa2">5 FW subnet RT → IGW</text><text x="960" y="645" fill="#1b8f4b">BGP/BFD control plane</text></g>
<rect x="280" y="760" width="1120" height="60" rx="10" fill="#fff7f7" stroke="#b85450"/><text x="840" y="797" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#8d2d2d">Critical: putting 0.0.0.0/0 → IGW in the application subnet bypasses the stateful firewall on return traffic.</text>
<text x="40" y="900" font-family="Arial" font-size="14" fill="#555">Blue = inbound forward path • Purple = return/egress path • Green dashed = Route Server control plane</text></svg>