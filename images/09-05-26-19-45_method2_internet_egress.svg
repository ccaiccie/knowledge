<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs><style>.box{fill:#fff;stroke:#222;stroke-width:2}.t{font:16px Arial,sans-serif;fill:#111}.h{font:bold 24px Arial,sans-serif;fill:#111}.b{font:bold 16px Arial,sans-serif}.f{fill:none;stroke:#111;stroke-width:3;marker-end:url(#a)}.r{fill:none;stroke:#555;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#a)}</style><text x="800" y="55" text-anchor="middle" class="h">Method 2 — Internet egress through a customer-managed hub NVA</text><rect x="80" y="300" width="340" height="160" rx="14" class="box"/><text x="250" y="332" text-anchor="middle" class="b">Spoke A workload 10.1.1.10</text><text x="250" y="382" text-anchor="middle" class="t">UDR 0.0.0.0/0 →</text><text x="250" y="414" text-anchor="middle" class="t">VirtualAppliance 10.0.1.4</text><rect x="630" y="280" width="340" height="190" rx="14" class="box"/><text x="800" y="315" text-anchor="middle" class="b">Third-party NGFW/NVA</text><text x="800" y="348" text-anchor="middle" class="t">Inside/data IP 10.0.1.4</text><text x="800" y="380" text-anchor="middle" class="t">Stateful policy + route lookup</text><text x="800" y="412" text-anchor="middle" class="t">Vendor-specific SNAT / public egress</text><rect x="1190" y="320" width="280" height="120" rx="14" class="box"/><text x="1330" y="356" text-anchor="middle" class="b">Internet destination</text><text x="1330" y="392" text-anchor="middle" class="t">203.0.113.50:443</text><rect x="450" y="590" width="700" height="100" rx="14" class="box"/><text x="800" y="622" text-anchor="middle" class="t">The NVA must use a vendor-supported Azure egress/SNAT design.</text><text x="800" y="652" text-anchor="middle" class="t">Do not assume Azure automatically supplies deterministic Internet SNAT.</text><path d="M420 360 H630" class="f"/><text x="44