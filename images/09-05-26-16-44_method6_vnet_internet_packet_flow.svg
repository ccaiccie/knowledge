<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#0078D4"/></marker><style>.h{font:700 20px Segoe UI,Arial;fill:#0f172a}.t{font:15px Segoe UI,Arial;fill:#334155}.b{stroke:#94a3b8;stroke-width:2;rx:18}.f{stroke:#0078D4;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="100%" height="100%" fill="white"/><text x="60" y="65" style="font:700 30px Segoe UI,Arial;fill:#0f172a">VNet → Internet packet flow through SECaaS</text><rect x="60" y="250" width="220" height="130" fill="#f1f5f9" class="b"/><text x="170" y="300" text-anchor="middle" class="h">1. Spoke VM</text><text x="170" y="335" text-anchor="middle" class="t">10.10.1.10 → Internet</text><rect x="370" y="230" width="250" height="170" fill="#e8f3ff" class="b"/><text x="495" y="285" text-anchor="middle" class="h">2. vHub routing</text><text x="495" y="325" text-anchor="middle" class="t">0.0.0.0/0 → partner path</text><rect x="710" y="230" width="250" height="170" fill="#ede9fe" class="b"/><text x="835" y="285" text-anchor="middle" class="h">3. S2S VPN Gateway</text><text x="835" y="325" text-anchor="middle" class="t">IPsec to SECaaS</text><rect x="1050" y="200" width="290" height="220" fill="#ecfeff" class="b"/><text x="1195" y="255" text-anchor="middle" class="h">4. SECaaS Provider</text><text x="1195" y="295" text-anchor="middle" class="t">Inspect / allow / block</text><text x="1195" y="330" text-anchor="middle" class="t">Provider egress to Internet</text><rect x="1080" y="560" width="230" height="90" fill="#f8fafc" class="b"/><text x="1195" y="612" text-anchor="middle" class="h">Internet / SaaS</text><path d="M280 315H370" class="f"/><path d="M620 315H710" class="f"/><path d="M960 315H1050" class="f"/><path d="M1195 420V560" class="f"/><path d="M1080 600 C900 710,410 710,170 380" class="f"/><text x="620" y="690" class="t">5. Return traffic follows provider tunnel and vHub route back to the spoke</text></svg>