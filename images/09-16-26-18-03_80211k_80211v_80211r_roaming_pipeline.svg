<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><rect width="1200" height="420" fill="white"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold">802.11k / 802.11v / 802.11r Roaming Pipeline</text><g font-family="Arial" font-size="18" text-anchor="middle"><rect x="40" y="145" rx="18" width="190" height="110" fill="#e8f1ff" stroke="#4a78c2" stroke-width="2"/><text x="135" y="185">Current AP</text><text x="135" y="214">RSSI/load changes</text><rect x="280" y="145" rx="18" width="190" height="110" fill="#e7f6e7" stroke="#4b9a59" stroke-width="2"/><text x="375" y="182">802.11k</text><text x="375" y="210">Neighbor Report</text><text x="375" y="236">candidate discovery</text><rect x="520" y="145" rx="18" width="190" height="110" fill="#fff2d7" stroke="#c98c2a" stroke-width="2"/><text x="615" y="182">802.11v</text><text x="615" y="210">BSS Transition</text><text x="615" y="236">network advice</text><rect x="760" y="145" rx="18" width="190" height="110" fill="#f4e7ff" stroke="#8c5cb8" stroke-width="2"/><text x="855" y="182">Client decides</text><text x="855" y="212">target BSSID</text><rect x="1000" y="145" rx="18" width="160" height="110" fill="#ffe8e8" stroke="#bb5555" stroke-width="2"/><text x="1080" y="182">802.11r</text><text x="1080" y="210">Fast Transition</text><text x="1080" y="236">reassociate</text></g><g stroke="#333" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M230 200 H280"/><path d="M470 200 H520"/><path d="M710 200 H760"/><path d="M950 200 H1000"/></g><text x="600" y="330" text-anchor="middle" font-family="Arial" font-size="19">k reduces search cost • v improves network-assisted target selection • r reduces security transition cost</text></svg>