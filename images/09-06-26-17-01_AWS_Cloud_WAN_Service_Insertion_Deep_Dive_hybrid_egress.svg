<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="40" y="48" font-family="Arial" font-size="28" font-weight="700" fill="#232f3e">Hybrid and Internet Service Insertion</text><text x="40" y="78" font-family="Arial" font-size="16" fill="#545b64">Hybrid uses send-via between HYBRID and workload segments; Internet egress uses send-to toward an inspection/egress NFG.</text><g font-family="Arial"><rect x="40" y="120" width="240" height="130" rx="12" fill="#f4f1ff" stroke="#7c3aed" stroke-width="2"/><text x="56" y="150" font-size="17" font-weight="700">Corp DC</text><text x="56" y="178" font-size="14">192.168.1.0/16 | BGP to transit VIF</text><rect x="340" y="120" width="250" height="130" rx="12" fill="#eefbf3" stroke="#16a34a" stroke-width="2"/><text x="356" y="150" font-size="17" font-weight="700">Direct Connect Gateway</text><text x="356" y="178" font-size="14">Cloud WAN attachment → HYBRID</text><rect x="650" y="105" width="280" height="165" rx="12" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/><text x="666" y="135" font-size="17" font-weight="700">CNE / HYBRID segment</text><text x="666" y="163" font-size="14">10.30.0.0/16 redirected to NFG</text><text x="666" y="186" font-size="14">edge override can select Region</text><rect x="990" y="90" width="300" height="195" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1006" y="120" font-size="17" font-weight="700">Inspection VPC / NFG</text><text x="1006" y="148" font-size="14">Core Network ENI → GWLB/GWLBE or ANFW</text><text x="1006" y="171" font-size="14">Stateful inspection → return to Cloud WAN</text><rect x="1360" y="120" width="190" height="130" rx="12" fill="#eaf4ff" stroke="#3b82f6" stroke-width="2"/><text x="1376" y="150" font-size="17" font-weight="700">Prod VPC</text><text x="1376" y="178" font-size="14">10.30.0.0/16 | PROD</text><rect x="650" y="520" width="280" height="170" rx="12" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/><text x="666" y="550" font-size="17" font-weight="700">PROD default route</text><text x="666" y="578" font-size="14">0/0, ::/0 → NFG</text><text x="666" y="601" font-size="14">VPC default → Core Network</text><rect x="990" y="500" width="300" height="205" rx="12" fill="#eefbf3" stroke="#16a34a" stroke-width="2"/><text x="1006" y="530" font-size="17" font-weight="700">Internet Egress Stack</text><text x="1006" y="558" font-size="14">Firewall endpoint → NAT Gateway → IGW</text><text x="1006" y="581" font-size="14">send-to exits; no Cloud WAN re-entry</text></g><path d="M280,185 L340,185" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M590,185 L650,185" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M930,185 L990,185" stroke="#dc2626" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M1290,185 L1360,185" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M930,605 L990,605" stroke="#16a34a" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="950" y="590" font-family="Arial" font-size="14" fill="#16a34a" font-weight="700">send-to egress</text></svg>