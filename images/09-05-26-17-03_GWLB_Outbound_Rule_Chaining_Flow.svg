<text x="40" y="55" class="t">GWLB Outbound Inspection — Private-Only VM via Standard LB Outbound Rule</text><rect x="285" y="95" width="610" height="610" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" stroke-dasharray="10 8"/><text x="310" y="130" class="lab" fill="#0f172a">Consumer: Standard Public Load Balancer</text><rect x="960" y="95" width="420" height="440" rx="14" fill="#faf5ff" stroke="#a78bfa" stroke-width="2" stroke-dasharray="10 8"/><text x="985" y="130" class="lab" fill="#0f172a">Provider: GWLB + NVAs</text><rect x="40" y="225" width="190" height="100" rx="14" fill="#ede9fe" stroke="#334155" stroke-width="2"/><text x="135.0" y="260.0" text-anchor="middle" class="b">Private-only VM</text><text x="135.0" y="280.0" text-anchor="middle" class="b">10.0.1.4</text><text x="135.0" y="300.0" text-anchor="middle" class="b">No public IP</text><rect x="340" y="180" width="220" height="85" rx="14" fill="#ede9fe" stroke="#334155" stroke-width="2"/><text x="450.0" y="217.5" text-anchor="middle" class="b">Backend pool</text><text x="450.0" y="237.5" text-anchor="middle" class="b">app-backend-pool</text><rect x="340" y="325" width="220" height="85" rx="14" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="450.0" y="362.5" text-anchor="middle" class="b">Outbound rule</text><text x="450.0" y="382.5" text-anchor="middle" class="b">myOutboundRule</text><rect x="340" y="480" width="270" height="110" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="475.0" y="520.0" text-anchor="middle" class="b">Frontend IP configuration</text><text x="475.0" y="540.0" text-anchor="middle" class="b">myOutboundFrontend</text><text x="475.0" y="560.0" text-anchor="middle" class="b">Public IP 20.50.60.70</text><rect x="645" y="480" width="205" height="110" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="747.5" y="530.0" text-anchor="middle" class="b" font-weight="700">gatewayLoadBalancer reference</text><text x="747.5" y="550.0" text-anchor="middle" class="b" font-weight="700">→ security-gwlb/gwlb-frontend</text><rect x="1005" y="205" width="175" height="90" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="1092.5" y="255.0" text-anchor="middle" class="b">Gateway Load Balancer</text><rect x="1230" y="195" width="120" height="110" rx="14" fill="#ffedd5" stroke="#334155" stroke-width="2"/><text x="1290.0" y="245.0" text-anchor="middle" class="b">NVA pool</text><text x="1290.0" y="265.0" text-anchor="middle" class="b">NVA-1 / NVA-2</text><rect x="1430" y="225" width="130" height="90" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="1495.0" y="275.0" text-anchor="middle" class="b">Internet</text><rect x="1000" y="600" width="430" height="100" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1215.0" y="645.0" text-anchor="middle" class="b" font-weight="700">Return path follows the same chained consumer flow</text><text x="1215.0" y="665.0" text-anchor="middle" class="b" font-weight="700">so the stateful NVA sees both directions.</text><path d="M 230,275 L 255,275 L 255,222 L 320,222 L 340,222" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><text x="55" y="205" class="lab" fill="#0f172a">1 VM is in backend pool</text><path d="M 450,265 L 450,290 L 450,305 L 450,325" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><text x="470" y="300" class="lab" fill="#0f172a">2 Outbound rule applies</text><path d="M 450,410 L 450,435 L 450,460 L 450,480" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><text x="470" y="450" class="lab" fill="#0f172a">3 Rule selects frontend</text><path d="M 610,535 L 630,535 L 900,535 L 900,250 L 985,250 L 1005,250" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><text x="650" y="520" class="lab" fill="#0f172a">4 Chained frontend invokes GWLB</text><path d="M 1180,235 L 1205,235 L 1205,165 L 1215,165 L 1215,235 L 1230,235" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#ap)"/><text x="1170" y="155" class="lab" fill="#7c3aed">5 VXLAN to NVA</text><path d="M 1230,285 L 1215,285 L 1215,355 L 1195,355 L 1195,275 L 1180,275" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#ag)"/><text x="1170" y="380" class="lab" fill="#16a34a">6 Inspected return</text><path d="M 1180,250 L 1400,250 L 1430,250" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><text x="1220" y="225" class="lab" fill="#0f172a">7 LB completes SNAT / Internet egress</text></svg>