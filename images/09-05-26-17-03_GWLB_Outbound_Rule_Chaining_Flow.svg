<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
<defs>
<marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#2563eb"/></marker>
<marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#7c3aed"/></marker>
<marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#16a34a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a} .lab{font-size:13px;font-weight:700;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style>
</defs><rect width="1800" height="900" fill="white"/>
<text x="40" y="55" font-size="25" font-weight="700">Private-Only VM Outbound Inspection — Exact GWLB / Standard LB Handoff</text>
<rect x="250" y="90" width="900" height="700" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" stroke-dasharray="10 8"/><text x="275" y="125" font-size="17" font-weight="700">Consumer: Standard Public Load Balancer</text><rect x="1190" y="90" width="540" height="430" rx="16" fill="#faf5ff" stroke="#a78bfa" stroke-width="2" stroke-dasharray="10 8"/><text x="1215" y="125" font-size="17" font-weight="700">Provider: Gateway Load Balancer + NVA</text><rect x="45" y="195" width="170" height="95" rx="16" fill="#ede9fe" stroke="#334155" stroke-width="2"/><text x="130" y="227" text-anchor="middle" font-size="14" font-weight="600">Private-only VM</text><text x="130" y="247" text-anchor="middle" font-size="14" font-weight="600">10.0.1.4</text><text x="130" y="267" text-anchor="middle" font-size="14" font-weight="600">No public IP</text><rect x="300" y="180" width="180" height="95" rx="16" fill="#ede9fe" stroke="#334155" stroke-width="2"/><text x="390" y="222" text-anchor="middle" font-size="14" font-weight="600">Backend pool</text><text x="390" y="242" text-anchor="middle" font-size="14" font-weight="600">app-backend-pool</text><rect x="555" y="180" width="180" height="95" rx="16" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="645" y="222" text-anchor="middle" font-size="14" font-weight="600">Outbound rule</text><text x="645" y="242" text-anchor="middle" font-size="14" font-weight="600">myOutboundRule</text><rect x="810" y="165" width="255" height="125" rx="16" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="937.5" y="212" text-anchor="middle" font-size="14" font-weight="600">Frontend IP configuration</text><text x="937.5" y="232" text-anchor="middle" font-size="14" font-weight="600">myOutboundFrontend</text><text x="937.5" y="252" text-anchor="middle" font-size="14" font-weight="600">Public IP 20.50.60.70</text><rect x="810" y="345" width="255" height="95" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="937.5" y="387" text-anchor="middle" font-size="13" font-weight="700">gatewayLoadBalancer property</text><text x="937.5" y="406" text-anchor="middle" font-size="13" font-weight="700">= resource ID of gwlb-frontend</text><rect x="1240" y="180" width="190" height="95" rx="16" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="1335" y="222" text-anchor="middle" font-size="14" font-weight="600">Gateway Load Balancer</text><text x="1335" y="242" text-anchor="middle" font-size="14" font-weight="600">gwlb-frontend</text><rect x="1495" y="175" width="180" height="105" rx="16" fill="#ffedd5" stroke="#334155" stroke-width="2"/><text x="1585" y="222" text-anchor="middle" font-size="14" font-weight="600">Selected NVA</text><text x="1585" y="242" text-anchor="middle" font-size="14" font-weight="600">Stateful firewall</text><rect x="760" y="555" width="310" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="915" y="600" text-anchor="middle" font-size="14" font-weight="700">Return to the chained</text><text x="915" y="620" text-anchor="middle" font-size="14" font-weight="700">Standard LB frontend /</text><text x="915" y="640" text-anchor="middle" font-size="14" font-weight="700">outbound-rule processing</text><rect x="380" y="555" width="285" height="120" rx="16" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="522.5" y="600" text-anchor="middle" font-size="14" font-weight="600">Standard LB outbound SNAT</text><text x="522.5" y="620" text-anchor="middle" font-size="14" font-weight="600">10.0.1.4 → 20.50.60.70</text><text x="522.5" y="640" text-anchor="middle" font-size="14" font-weight="600">(using myOutboundFrontend)</text><rect x="45" y="570" width="190" height="90" rx="16" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="140" y="610" text-anchor="middle" font-size="14" font-weight="600">Internet</text><text x="140" y="630" text-anchor="middle" font-size="14" font-weight="600">destination</text><rect x="1110" y="575" width="575" height="135" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1397.5" y="628" text-anchor="middle" font-size="13" font-weight="600">Key point: GWLB does not itself provide the Internet SNAT public IP.</text><text x="1397.5" y="647" text-anchor="middle" font-size="13" font-weight="600">After inspection, Azure returns the flow to the chained Standard Load Balancer consumer context.</text><text x="1397.5" y="666" text-anchor="middle" font-size="13" font-weight="600">The Standard LB outbound rule then uses the selected frontend public IP for SNAT.</text><path d="M 215,242 L 270,242 L 300,228" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="225" y="220" class="lab" fill="#2563eb">1  VM is a backend-pool member</text><path d="M 480,228 L 530,228 L 555,228" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="485" y="205" class="lab" fill="#2563eb">2  Outbound rule applies</text><path d="M 735,228 L 785,228 L 810,228" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="740" y="205" class="lab" fill="#2563eb">3  Rule selects this frontend</text><path d="M 1065,228 L 1160,228 L 1215,228 L 1240,228" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="1080" y="205" class="lab" fill="#2563eb">4  Frontend reference invokes GWLB</text><path d="M 1430,213 L 1465,213 L 1495,213" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#purple)"/><text x="1435" y="185" class="lab" fill="#7c3aed">5  VXLAN to selected NVA</text><path d="M 1495,250 L 1470,250 L 1470,330 L 1450,330 L 1450,248 L 1430,248" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#green)"/><text x="1455" y="355" class="lab" fill="#16a34a">6  Inspected return</text><path d="M 1335,275 L 1335,500 L 1110,500 L 1110,615 L 1070,615" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/><text x="1120" y="485" class="lab" fill="#16a34a">7  Back to consumer resource</text><path d="M 760,615 L 690,615 L 665,615" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="680" y="595" class="lab" fill="#2563eb">8  Resume Standard LB outbound processing</text><path d="M 380,615 L 260,615 L 235,615" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="255" y="595" class="lab" fill="#2563eb">9  SNAT and send to Internet</text></svg>