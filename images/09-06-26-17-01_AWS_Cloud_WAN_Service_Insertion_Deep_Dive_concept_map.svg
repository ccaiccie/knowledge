<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950">
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="48" font-family="Arial" font-size="27" font-weight="700" fill="#232f3e">Cloud WAN Service Insertion — Relating It to GWLBE and DMZ Policy Routing</text>
<text x="40" y="78" font-family="Arial" font-size="15" fill="#5b6167">Start with the familiar idea: route selected traffic through a firewall. Cloud WAN centralizes the steering policy; GWLBE/GWLB can still provide the firewall dataplane.</text>
<rect x="40" y="130" width="275" height="150" rx="14" fill="#eaf4ff" stroke="#3b82f6" stroke-width="2"/>
<text x="55" y="158" font-family="Arial" font-size="17" font-weight="700" fill="#232f3e">Distributed GWLBE</text>
<text x="55" y="182" font-family="Arial" font-size="13.5" fill="#3b4146">GWLBE = Gateway Load Balancer Endpoint</text><text x="55" y="202" font-family="Arial" font-size="13.5" fill="#3b4146">Endpoint close to workload/edge</text><text x="55" y="222" font-family="Arial" font-size="13.5" fill="#3b4146">VPC route table steers to GWLBE</text>
<rect x="40" y="540" width="275" height="155" rx="14" fill="#eaf4ff" stroke="#3b82f6" stroke-width="2"/>
<text x="55" y="568" font-family="Arial" font-size="17" font-weight="700" fill="#232f3e">Centralized GWLBE</text><text x="55" y="592" font-family="Arial" font-size="13.5" fill="#3b4146">Shared Inspection VPC</text><text x="55" y="612" font-family="Arial" font-size="13.5" fill="#3b4146">GWLBE/GWLB/firewall fleet centralized</text><text x="55" y="632" font-family="Arial" font-size="13.5" fill="#3b4146">TGW or Cloud WAN gets traffic there</text>
<rect x="400" y="285" width="315" height="245" rx="14" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/>
<text x="415" y="313" font-family="Arial" font-size="17" font-weight="700" fill="#232f3e">Service-Insertion Idea</text><text x="415" y="337" font-family="Arial" font-size="13.5" fill="#3b4146">DMZ / policy-routing concept</text><text x="415" y="357" font-family="Arial" font-size="13.5" fill="#3b4146">Before A reaches B, go through firewall</text><text x="415" y="377" font-family="Arial" font-size="13.5" fill="#3b4146">Routing intent, not the firewall</text><text x="415" y="397" font-family="Arial" font-size="13.5" fill="#3b4146">Cloud WAN automates the WAN steering</text>
<rect x="820" y="135" width="350" height="180" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="835" y="163" font-family="Arial" font-size="17" font-weight="700" fill="#232f3e">AWS Cloud WAN</text><text x="835" y="187" font-family="Arial" font-size="13.5" fill="#3b4146">CNE = Core Network Edge</text><text x="835" y="207" font-family="Arial" font-size="13.5" fill="#3b4146">Segment = VRF-like routing domain</text><text x="835" y="227" font-family="Arial" font-size="13.5" fill="#3b4146">NFG = Network Function Group</text><text x="835" y="247" font-family="Arial" font-size="13.5" fill="#3b4146">send-via = attachment-to-attachment</text>
<rect x="820" y="500" width="350" height="180" rx="14" fill="#eefbf3" stroke="#16a34a" stroke-width="2"/><text x="835" y="528" font-family="Arial" font-size="17" font-weight="700" fill="#232f3e">Inspection VPC</text><text x="835" y="552" font-family="Arial" font-size="13.5" fill="#3b4146">GWLBE = Gateway Load Balancer Endpoint</text><text x="835" y="572" font-family="Arial" font-size="13.5" fill="#3b4146">GWLB = Gateway Load Balancer</text><text x="835" y="592" font-family="Arial" font-size="13.5" fill="#3b4146">NGFW = Next-Generation Firewall</text><text x="835" y="612" font-family="Arial" font-size="13.5" fill="#3b4146">or AWS Network Firewall</text>
<rect x="1280" y="285" width="350" height="225" rx="14" fill="#f4f1ff" stroke="#7c3aed" stroke-width="2"/><text x="1295" y="313" font-family="Arial" font-size="17" font-weight="700" fill="#232f3e">Result</text><text x="1295" y="337" font-family="Arial" font-size="13.5" fill="#3b4146">Cloud WAN chooses inspection attachment</text><text x="1295" y="357" font-family="Arial" font-size="13.5" fill="#3b4146">VPC routes choose firewall endpoint</text><text x="1295" y="377" font-family="Arial" font-size="13.5" fill="#3b4146">Firewall applies security policy</text><text x="1295" y="397" font-family="Arial" font-size="13.5" fill="#3b4146">Return path remains symmetric</text>
<path d="M 315,205 L 400,350" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M 315,615 L 400,465" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M 715,360 L 820,225" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#a)"/><path d="M 995,315 L 995,500" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#a)"/><path d="M 1170,585 L 1280,420" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/>
<text x="325" y="280" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb">same security goal</text><text x="330" y="560" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb">same security goal</text><text x="720" y="290" font-family="Arial" font-size="13" font-weight="700" fill="#ea580c">Cloud WAN expresses intent</text><text x="1010" y="410" font-family="Arial" font-size="13" font-weight="700" fill="#dc2626">NFG sends to inspection</text><text x="1170" y="510" font-family="Arial" font-size="13" font-weight="700" fill="#16a34a">inspected packet</text>
</svg>