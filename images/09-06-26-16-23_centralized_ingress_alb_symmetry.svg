<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="800" y="45" font-size="28" text-anchor="middle" font-family="Arial" font-weight="700">Centralized Ingress: Why ALB Makes Return-GWLBE Recovery Possible</text><rect x="70" y="110" width="500" height="690" rx="22" fill="#f7fafc" stroke="#374151" stroke-width="2"/><text x="320" y="145" font-size="22" text-anchor="middle" font-family="Arial" font-weight="700">Ingress VPC</text><rect x="110" y="190" width="180" height="90" rx="12" fill="#fff7ed" stroke="#ea580c"/><text x="200" y="225" font-family="Arial" font-size="18" text-anchor="middle" font-weight="700">ALB AZ-a</text><text x="200" y="250" font-family="Arial" font-size="15" text-anchor="middle">10.255.50.0/24</text><rect x="350" y="190" width="170" height="90" rx="12" fill="#eff6ff" stroke="#2563eb"/><text x="435" y="225" font-family="Arial" font-size="18" text-anchor="middle" font-weight="700">GWLBE-a</text><text x="435" y="250" font-family="Arial" font-size="15" text-anchor="middle">vpce-a</text><rect x="350" y="385" width="170" height="90" rx="12" fill="#eff6ff" stroke="#2563eb"/><text x="435" y="420" font-family="Arial" font-size="18" text-anchor="middle" font-weight="700">GWLBE-c</text><text x="435" y="445" font-family="Arial" font-size="15" text-anchor="middle">vpce-c</text><rect x="110" y="385" width="180" height="100" rx="12" fill="#eef2ff" stroke="#4f46e5"/><text x="200" y="420" font-family="Arial" font-size="18" text-anchor="middle" font-weight="700">TGW subnet AZ-c</text><text x="200" y="447" font-family="Arial" font-size="14" text-anchor="middle">RT-TGW-c:</text><text x="200" y="468" font-family="Arial" font-size="14" text-anchor="middle">10.255.50.0/24 → GWLBE-a</text><rect x="690" y="185" width="220" height="110" rx="14" fill="#fef3c7" stroke="#d97706"/><text x="800" y="220" font-family="Arial" font-size="20" text-anchor="middle" font-weight="700">GWLB + NGFW fleet</text><text x="800" y="250" font-family="Arial" font-size="15" text-anchor="middle">GENEVE / stateful flow</text><text x="800" y="273" font-family="Arial" font-size="15" text-anchor="middle">must return via GWLBE-a</text><rect x="1010" y="320" width="190" height="100" rx="12" fill="#ecfeff" stroke="#0891b2"/><text x="1105" y="355" font-family="Arial" font-size="20" text-anchor="middle" font-weight="700">Transit Gateway</text><text x="1105" y="385" font-family="Arial" font-size="15" text-anchor="middle">return may enter</text><text x="1105" y="405" font-family="Arial" font-size="15" text-anchor="middle">Ingress VPC in AZ-c</text><rect x="1300" y="190" width="220" height="130" rx="14" fill="#f0fdf4" stroke="#16a34a"/><text x="1410" y="225" font-family="Arial" font-size="20" text-anchor="middle" font-weight="700">Application VPC</text><text x="1410" y="255" font-family="Arial" font-size="16" text-anchor="middle">Backend 10.10.10.20</text><text x="1410" y="282" font-family="Arial" font-size="15" text-anchor="middle">return dst = ALB-a IP</text><path d="M290 235 H350" stroke="#d97706" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M520 235 H690" stroke="#d97706" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M910 240 C1040 240, 1000 250, 1105 320" stroke="#d97706" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M1200 360 C1260 330, 1280 280, 1300 255" stroke="#d97706" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="810" y="155" font-family="Arial" font-size="16" fill="#d97706" font-weight="700">Forward backend flow: ALB-a → GWLBE-a → firewall → TGW → backend</text><path d="M1300 300 C1220 410, 1190 430, 1200 430" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#b)"/><path d="M1010 390 C800 560, 420 590, 290 445" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#b)"/><path d="M290 435 C330 330, 360 300, 400 280" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#b)"/><path d="M435 280 C560 330, 620 330, 690 280" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#b)"/><path d="M690 260 C590 180, 520 180, 520 220" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#b)"/><path d="M350 240 H290" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#b)"/><text x="800" y="650" font-family="Arial" font-size="17" fill="#2563eb" font-weight="700" text-anchor="middle">Return can enter through TGW AZ-c, but RT-TGW-c matches ALB-a subnet and sends cross-AZ to GWLBE-a</text><rect x="735" y="710" width="760" height="100" rx="12" fill="#fff1f2" stroke="#be123c"/><text x="1115" y="745" font-family="Arial" font-size="17" text-anchor="middle" font-weight="700">Why ALB matters</text><text x="1115" y="773" font-family="Arial" font-size="15" text-anchor="middle">ALB proxies the connection. Backend return destination is the ALB node/subnet,</text><text x="1115" y="797" font-family="Arial" font-size="15" text-anchor="middle">which provides a deterministic route-table key for the original GWLBE.</text></svg>