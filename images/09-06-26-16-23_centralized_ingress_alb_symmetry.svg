<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100"><defs><marker id="fo" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/></marker><marker id="rb" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/></marker><marker id="rp" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker></defs><rect width="1800" height="1100" fill="white"/><text x="900" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Centralized Ingress with ALB — How the Return Path Recovers the Original GWLBE</text><rect x="470" y="75" width="860" height="45" rx="10" fill="#f8fafc" stroke="#64748b"/><text x="900" y="103" text-anchor="middle" font-family="Arial" font-size="15">ORANGE = forward backend flow    BLUE = return flow    PURPLE = routing decision / mapping</text><rect x="180" y="140" width="790" height="800" rx="20" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text x="575" y="175" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Ingress VPC</text><rect x="220" y="210" width="710" height="270" rx="16" fill="#fff7ed" stroke="#f97316" stroke-dasharray="8 6"/><text x="575" y="240" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">AZ-a — original ingress / inspection path</text><rect x="220" y="560" width="710" height="310" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="8 6"/><text x="575" y="590" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">AZ-c — TGW return re-entry</text><text x="220" y="190" font-family="Arial" font-size="18" font-weight="700" fill="#c2410c">FORWARD BACKEND FLOW</text><text x="220" y="540" font-family="Arial" font-size="18" font-weight="700" fill="#1d4ed8">RETURN FLOW — TGW RE-ENTERS INGRESS VPC IN AZ-c</text><rect x="20" y="270" width="140" height="80" rx="12" fill="#fff" stroke="#64748b"/><text x="90" y="300" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Internet client</text><text x="90" y="325" text-anchor="middle" font-family="Arial" font-size="14">198.51.100.25:53000</text><rect x="260" y="285" width="250" height="120" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="385" y="315" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Public ALB node — AZ-a</text><text x="385" y="342" text-anchor="middle" font-family="Arial" font-size="15">ALB subnet: 10.255.50.0/24</text><text x="385" y="369" text-anchor="middle" font-family="Arial" font-size="14">Backend source = ALB node private IP</text><rect x="620" y="285" width="220" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="315" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">GWLBE-a</text><text x="730" y="342" text-anchor="middle" font-family="Arial" font-size="15">vpce-gwlbe-a</text><text x="730" y="369" text-anchor="middle" font-family="Arial" font-size="14">Original service-chain endpoint</text><rect x="260" y="625" width="245" height="105" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="382" y="655" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">TGW attachment subnet — AZ-c</text><text x="382" y="685" text-anchor="middle" font-family="Arial" font-size="14">Return packet lands here from TGW</text><rect x="545" y="595" width="300" height="135" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="695" y="625" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">RT-TGW-c route lookup</text><text x="695" y="651" text-anchor="middle" font-family="Arial" font-size="14">Destination = ALB-a node IP</text><text x="695" y="676" text-anchor="middle" font-family="Arial" font-size="14">10.255.50.0/24 → GWLBE-a</text><text x="695" y="704" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700">Therefore return crosses AZ-c → AZ-a</text><rect x="650" y="745" width="235" height="95" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="7 6"/><text x="767" y="775" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">GWLBE-c</text><text x="767" y="800" text-anchor="middle" font-family="Arial" font-size="14">vpce-gwlbe-c</text><text x="767" y="823" text-anchor="middle" font-family="Arial" font-size="13">Local endpoint — NOT selected</text><rect x="1010" y="200" width="300" height="650" rx="20" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="1160" y="235" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Security VPC / Appliance Service</text><rect x="1050" y="390" width="220" height="150" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1160" y="422" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Gateway Load Balancer</text><text x="1160" y="448" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">+ NGFW fleet</text><text x="1160" y="480" text-anchor="middle" font-family="Arial" font-size="14">GENEVE UDP/6081</text><text x="1160" y="505" text-anchor="middle" font-family="Arial" font-size="14">Stateful inspection</text><rect x="1360" y="390" width="220" height="150" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="1470" y="422" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">AWS Transit Gateway</text><text x="1470" y="455" text-anchor="middle" font-family="Arial" font-size="14">Forward: sends to App VPC</text><text x="1470" y="480" text-anchor="middle" font-family="Arial" font-size="14">Return may re-enter Ingress VPC</text><text x="1470" y="505" text-anchor="middle" font-family="Arial" font-size="14">through AZ-c attachment subnet</text><rect x="1600" y="200" width="180" height="650" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="1690" y="235" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Application VPC</text><rect x="1620" y="405" width="140" height="135" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="1690" y="438" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Backend</text><text x="1690" y="463" text-anchor="middle" font-family="Arial" font-size="14">10.10.10.20:8443</text><text x="1690" y="493" text-anchor="middle" font-family="Arial" font-size="13">Return destination =</text><text x="1690" y="516" text-anchor="middle" font-family="Arial" font-size="13">ALB-a node private IP</text><path d="M160 310 H260" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#fo)"/><text x="185" y="294" font-family="Arial" font-size="13" fill="#c2410c">1 Client → ALB</text><path d="M510 345 H620" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#fo)"/><text x="525" y="328" font-family="Arial" font-size="13" fill="#c2410c">2 ALB backend flow</text><path d="M840 345 H930 V440 H1050" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#fo)"/><text x="860" y="425" font-family="Arial" font-size="13" fill="#c2410c">3 GENEVE</text><path d="M1270 465 H1360" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#fo)"/><text x="1285" y="448" font-family="Arial" font-size="13" fill="#c2410c">4 Inspected flow</text><path d="M1580 465 H1620" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#fo)"/><text x="1580" y="445" font-family="Arial" font-size="13" fill="#c2410c">5 TGW → App</text><path d="M1690 540 V610 H1470 V540" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="1560" y="630" font-family="Arial" font-size="13" fill="#1d4ed8">6 Backend reply</text><path d="M1470 540 V900 H382 V730" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="905" y="924" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">7 TGW return can land in AZ-c</text><path d="M505 677 H545" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#rp)"/><text x="510" y="660" font-family="Arial" font-size="13" fill="#6d28d9">8 Route lookup</text><path d="M845 665 H900 V455 H730 V405" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="905" y="548" font-family="Arial" font-size="13" fill="#1d4ed8" transform="rotate(-90 905 548)">9 Cross-AZ to original GWLBE-a</text><path d="M840 320 H930 V580 H1050 V520" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="940" y="600" font-family="Arial" font-size="13" fill="#1d4ed8">10 GENEVE / state match</text><path d="M1050 430 H1000 V250 H730 V285" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="845" y="235" font-family="Arial" font-size="13" fill="#1d4ed8">11 Return from service chain</text><path d="M620 390 H560 V430 H385 V405" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#rb)"/><text x="430" y="452" font-family="Arial" font-size="13" fill="#1d4ed8">12 ALB receives backend response</text><path d="M505 705 H520 V792 H650" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#gray)"/><text x="535" y="780" font-family="Arial" font-size="13" fill="#64748b">Not this path</text><rect x="300" y="970" width="1200" height="85" rx="14" fill="#fff1f2" stroke="#be123c" stroke-width="2"/><text x="900" y="1002" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Key insight: ALB is a proxy. The backend replies to the ALB node, not to the Internet client.</text><text x="900" y="1030" text-anchor="middle" font-family="Arial" font-size="15">That ALB subnet is the deterministic routing key that lets every TGW attachment-subnet route table send the return packet back to the original GWLBE-a.</text></svg>