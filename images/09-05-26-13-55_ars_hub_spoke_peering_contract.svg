<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
  </marker>
  <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
  </marker>
  <style>
    .title { font: 700 30px 'Segoe UI', Arial; fill:#0f172a; }
    .sub { font: 400 16px 'Segoe UI', Arial; fill:#475569; }
    .bt { font: 700 18px 'Segoe UI', Arial; fill:#0f172a; }
    .bs { font: 400 14px 'Segoe UI', Arial; fill:#334155; }
    .label { font: 600 13px 'Segoe UI', Arial; fill:#1d4ed8; }
    .small { font: 400 13px 'Segoe UI', Arial; fill:#7c2d12; }
  </style>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="48" class="title">How the Spoke Is Tied to the Hub Route Server</text>
<text x="40" y="78" class="sub">VNet peering is the attachment; directional peering settings enable remote Route Server use and NVA transit.</text>
<rect x="80" y="160" width="550" height="460" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="105" y="195" class="bt">HUB VNet — 10.0.0.0/16</text>
<text x="105" y="225" class="bs">RouteServerSubnet 10.0.1.0/26</text>
<text x="105" y="248" class="bs">Azure Route Server — ASN 65515</text>
<text x="105" y="271" class="bs">NVA subnet 10.0.2.0/24</text>
<text x="105" y="294" class="bs">NVA 10.0.2.4 — ASN 65001</text>
<rect x="125" y="335" width="210" height="110" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="145" y="368" class="bt">Hub → Spoke peering</text>
<text x="145" y="398" class="bs">Allow gateway/Route Server</text>
<text x="145" y="420" class="bs">to forward to the spoke</text>
<rect x="370" y="335" width="210" height="110" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="390" y="368" class="bt">Transit traffic</text>
<text x="390" y="398" class="bs">Allow forwarded traffic</text>
<text x="390" y="420" class="bs">when NVA transit requires it</text>
<rect x="870" y="160" width="550" height="460" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="895" y="195" class="bt">SPOKE VNet — 10.20.0.0/16</text>
<text x="895" y="225" class="bs">Workload subnet 10.20.1.0/24</text>
<text x="895" y="248" class="bs">VM 10.20.1.10</text>
<rect x="930" y="335" width="410" height="110" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="950" y="368" class="bt">Spoke → Hub peering</text>
<text x="950" y="398" class="bs">Use the remote virtual network's gateway or Route Server = Enabled</text>
<text x="950" y="420" class="bs">This opts the spoke into the hub Route Server's route distribution.</text>
<path d="M 630 260 L 870 260" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
<path d="M 870 295 L 630 295" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
<text x="750" y="245" text-anchor="middle" class="label">VNet peering — bidirectional connectivity object</text>
<path d="M 335 390 L 930 390" stroke="#7c3aed" stroke-width="4" stroke-dasharray="9 7" fill="none" marker-end="url(#arrowPurple)"/>
<text x="750" y="375" text-anchor="middle" class="label">Route Server propagation relationship</text>
<rect x="130" y="675" width="1240" height="120" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="155" y="708" class="bt">What happens after the peering contract is satisfied</text>
<text x="155" y="739" class="bs">1. NVA advertises 0.0.0.0/0 or private prefixes to Route Server over BGP.</text>
<text x="155" y="762" class="bs">2. Route Server injects eligible BGP routes into the spoke VM NIC's effective routes through Azure SDN.</text>
<text x="155" y="785" class="bs">3. The workload packet crosses the VNet peering directly toward the NVA next hop; Route Server never carries the packet.</text>
<rect x="40" y="830" width="1420" height="45" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
<text x="60" y="858" class="small">Critical: VNet peering does not create arbitrary transit. The NVA must forward the packet, and peering must allow the forwarded traffic required by the design.</text>
</svg>