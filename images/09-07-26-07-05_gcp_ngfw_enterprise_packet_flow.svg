<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="70" y="330" width="210" height="90" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="175" y="362" text-anchor="middle" font-size="16"><tspan x="175">Client VM</tspan><tspan x="175" dy="24">10.10.1.10:49152</tspan></text><rect x="360" y="290" width="290" height="160" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/><text x="505" y="322" text-anchor="middle" font-size="15"><tspan x="505">Firewall policy engine</tspan><tspan x="505" dy="24">EGRESS priority 200</tspan><tspan x="505" dy="24">dst 0.0.0.0/0 tcp:443</tspan><tspan x="505" dy="24">apply_security_profile_group</tspan></text><rect x="740" y="310" width="270" height="120" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/><text x="875" y="342" text-anchor="middle" font-size="15"><tspan x="875">Google Packet Intercept</tspan><tspan x="875" dy="24">Preserves original routing intent</tspan><tspan x="875" dy="24">Adds VPC network identifier</tspan></text><rect x="1090" y="280" width="270" height="180" rx="12" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/><text x="1225" y="312" text-anchor="middle" font-size="15"><tspan x="1225">Firewall endpoint</tspan><tspan x="1225" dy="24">TLS decrypt (if enabled)</tspan><tspan x="1225" dy="24">IPS / URL / malware inspection</tspan><tspan x="1225" dy="24">Re-encrypt</tspan></text><rect x="1430" y="330" width="150" height="90" rx="12" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/><text x="1505" y="362" text-anchor="middle" font-size="16"><tspan x="1505">Destination</tspan><tspan x="1505" dy="24">203.0.113.20:443</tspan></text><rect x="430" y="610" width="760" height="90" rx="12" fill="#f3e8fd" stroke="#a142f4" stroke-width="2"/><text x="810" y="644" text-anchor="middle" font-size="14"><tspan x="810">Return packets use connection-tracking state created by apply_security_profile_group.</tspan><tspan x="810" dy="22">No user-managed firewall next-hop route is inserted.</tspan></text><path d="M280 375 H360" fill="none" stroke="#1a73e8" stroke-width="3" marker-end="url(#arr)"/><text x="285" y="360" font-size="13" fill="#1a73e8">1. new connection</text><path d="M650 370 H740" fill="none" stroke="#f9ab00" stroke-width="3" marker-end="url(#arr)"/><text x="655" y="355" font-size="13" fill="#b06000">2. rule match → intercept</text><path d="M1010 370 H1090" fill="none" stroke="#34a853" stroke-width="3" marker-end="url(#arr)"/><text x="1015" y="355" font-size="13" fill="#188038">3. diverted</text><path d="M1360 375 H1430" fill="none" stroke="#ea4335" stroke-width="3" marker-end="url(#arr)"/><text x="1365" y="360" font-size="13" fill="#c5221f">4. reinjected</text><path d="M1505 420 V520 H175 V420" fill="none" stroke="#a142f4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="780" y="545" font-size="13" fill="#7b1fa2">5. return flow remains statefully intercepted</text></g></svg>