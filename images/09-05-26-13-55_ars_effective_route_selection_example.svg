<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="c" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker><style>.t{font:700 30px Segoe UI,Arial;fill:#0f172a}.s{font:400 16px Segoe UI,Arial;fill:#475569}.bt{font:700 18px Segoe UI,Arial;fill:#0f172a}.bs{font:400 14px Segoe UI,Arial;fill:#334155}.al{font:600 13px Segoe UI,Arial;fill:#1d4ed8}.note{font:400 13px Segoe UI,Arial;fill:#7c2d12}</style></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="48" class="t">Minute Route-Selection Example on a Spoke NIC</text><text x="40" y="78" class="s">System routes, BGP routes, and UDRs are merged into one effective routing decision.</text><rect x="60" y="160" width="300" height="210" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="76" y="188" class="bt">System routes</text><text x="76" y="215" class="bs">10.20.0.0/16 → VNet peering</text><text x="76" y="235" class="bs">0.0.0.0/0 → Internet</text><text x="76" y="255" class="bs">Created by Azure</text><rect x="430" y="160" width="300" height="210" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="446" y="188" class="bt">BGP via Route Server</text><text x="446" y="215" class="bs">0.0.0.0/0 → 10.0.2.4</text><text x="446" y="235" class="bs">10.100.0.0/16 → 10.0.2.4</text><text x="446" y="255" class="bs">Dynamically learned from NVA</text><rect x="800" y="160" width="300" height="210" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="816" y="188" class="bt">Optional UDRs</text><text x="816" y="215" class="bs">203.0.113.0/24 → Internet</text><text x="816" y="235" class="bs">10.100.10.0/24 → 10.0.2.5</text><text x="816" y="255" class="bs">Configured by administrator</text><rect x="1170" y="150" width="270" height="240" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="1186" y="178" class="bt">Effective route selection</text><text x="1186" y="205" class="bs">Step 1: longest prefix wins</text><text x="1186" y="225" class="bs">Step 2: if same prefix, source precedence</text><text x="1186" y="245" class="bs">Result varies by destination</text><text x="1186" y="265" class="bs">This is what NIC uses</text><rect x="250" y="520" width="1000" height="170" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="266" y="548" class="bt">Example packet decisions</text><text x="266" y="575" class="bs">8.8.8.8 → matches 0/0; NVA BGP default beats system Internet default</text><text x="266" y="595" class="bs">10.100.50.25 → matches BGP 10.100.0.0/16; goes to NVA</text><text x="266" y="615" class="bs">10.100.10.50 → matches UDR /24; UDR wins by longer prefix</text><text x="266" y="635" class="bs">203.0.113.25 → matches UDR /24; explicit exception bypasses NVA</text><path d="M 360 265 L 1170 230" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="765" y="239.5" text-anchor="middle" class="al">Candidate</text><path d="M 730 265 L 1170 270" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="950" y="259.5" text-anchor="middle" class="al">Candidate</text><path d="M 1100 265 L 1170 310" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="1135" y="279.5" text-anchor="middle" class="al">Candidate</text><path d="M 1305 390 L 750 520" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="1027.5" y="447" text-anchor="middle" class="al">Selected next hop</text><rect x="40" y="790" width="1420" height="80" rx="12" fill="#fff7ed" stroke="#f59e0b"/><text x="58" y="820" class="note">The NVA never needs permission to modify Azure route-table objects for this BGP mechanism; Route Server supplies dynamic routes to Azure&#x27;s forwarding control plane.</text><text x="58" y="842" class="note">Use &#x27;az network nic show-effective-route-table&#x27; and Network Watcher Next Hop to see the actual result for a destination.</text></svg>