<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1220" viewBox="0 0 1900 1220"><defs><marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px}.m{font-size:13px;font-family:monospace}.box{fill:#fff;stroke:#64748b;stroke-width:2}.rt{fill:#f8fafc;stroke:#475569;stroke-width:1.5}.sec{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.f{fill:none;stroke:#d97706;stroke-width:4;marker-end:url(#f)}.r{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#r)}</style></defs><text x="35" y="42" class="t">Centralized Internet Ingress — ALB → GWLBE → GWLB/NGFW → TGW → Private App VPC</text><rect x="25" y="80" width="300" height="1020" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="45" y="115" class="h">Internet</text><rect x="60" y="155" width="225" height="90" rx="8" class="box"/><text x="80" y="188" class="h">Client</text><text x="80" y="216" class="s">198.51.100.25:53000</text><text x="80" y="238" class="s">HTTPS app1.example.com</text><rect x="365" y="80" width="890" height="1020" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="385" y="115" class="h">Ingress VPC 10.254.0.0/16</text><rect x="405" y="150" width="210" height="85" rx="8" class="box"/><text x="425" y="183" class="h">Internet Gateway</text><text x="425" y="210" class="s">igw-ingress</text><rect x="670" y="150" width="250" height="105" rx="8" class="box"/><text x="690" y="183" class="h">Internet-facing ALB</text><text x="690" y="210" class="s">Public subnet AZ-a</text><text x="690" y="235" class="s">10.254.10.0/27</text><rect x="985" y="150" width="230" height="105" rx="8" class="sec"/><text x="1005" y="183" class="h">GWLBE-a</text><text x="1005" y="210" class="s">10.254.100.0/28</text><text x="1005" y="235" class="s">same-AZ insertion</text><rect x="985" y="315" width="230" height="115" rx="8" class="sec"/><text x="1005" y="348" class="h">GWLB + NGFW</text><text x="1005" y="375" class="s">GENEVE UDP/6081</text><text x="1005" y="400" class="s">Inspect ALB→backend flow</text><rect x="670" y="315" width="250" height="105" rx="8" class="box"/><text x="690" y="348" class="h">TGW attachment subnet</text><text x="690" y="375" class="s">10.254.200.0/27</text><text x="690" y="400" class="s">return enforcement point</text><rect x="405" y="485" width="810" height="500" rx="8" class="rt"/><text x="425" y="517" class="h">Ingress VPC route tables — AZ-a</text><text x="425" y="555" class="m">RT-Ingress-ALB-a</text><text x="425" y="580" class="m">10.254.0.0/16  → local</text><text x="425" y="605" class="m">10.10.0.0/16   → vpce-gwlb-a</text><text x="425" y="630" class="m">10.20.0.0/16   → vpce-gwlb-a</text><text x="425" y="655" class="m">0.0.0.0/0      → igw-ingress</text><text x="425" y="700" class="m">RT-Ingress-GWLBE-a</text><text x="425" y="725" class="m">10.254.0.0/16  → local</text><text x="425" y="750" class="m">10.10.0.0/16   → tgw-1</text><text x="425" y="775" class="m">10.20.0.0/16   → tgw-1</text><text x="425" y="820" class="m">RT-Ingress-TGW-a</text><text x="425" y="845" class="m">10.254.0.0/16  → local</text><text x="425" y="870" class="m">10.254.10.0/27 → vpce-gwlb-a  # more-specific return route</text><text x="425" y="915" class="s">ALB terminates the client connection. NGFW after ALB sees the backend flow.</text><text x="425" y="942" class="s">Original client IP is normally carried in X-Forwarded-For for HTTP/HTTPS.</text><rect x="1295" y="80" width="580" height="1020" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="1315" y="115" class="h">Transit + Application VPC A</text><rect x="1335" y="150" width="500" height="125" rx="8" class="box"/><text x="1355" y="183" class="h">Transit Gateway</text><text x="1355" y="210" class="m">TGW-RT-INGRESS: 10.10.0.0/16 → att-App-A</text><text x="1355" y="235" class="m">TGW-RT-APPS:    10.254.0.0/16 → att-Ingress</text><text x="1355" y="260" class="s">Ingress and app attachments use different routing perspectives</text><rect x="1335" y="335" width="500" height="105" rx="8" class="box"/><text x="1355" y="368" class="h">App VPC A 10.10.0.0/16</text><text x="1355" y="395" class="s">Backend subnet 10.10.10.0/24</text><text x="1355" y="420" class="s">Target 10.10.10.50:443</text><rect x="1335" y="500" width="500" height="205" rx="8" class="rt"/><text x="1355" y="532" class="h">App subnet route table</text><text x="1355" y="570" class="m">10.10.0.0/16  → local</text><text x="1355" y="595" class="m">10.254.0.0/16 → tgw-1</text><text x="1355" y="635" class="s">Return traffic is toward the ALB backend connection,</text><text x="1355" y="660" class="s">not directly toward the Internet client.</text><rect x="1335" y="765" width="500" height="185" rx="8" class="rt"/><text x="1355" y="797" class="h">Key symmetry rule</text><text x="1355" y="835" class="s">TGW return enters Ingress TGW subnet → more-specific</text><text x="1355" y="860" class="s">ALB-subnet route sends it to same-AZ GWLBE → NGFW</text><text x="1355" y="885" class="s">→ local route → ALB node.</text><text x="1355" y="925" class="s">Do not assume TGW Appliance Mode alone solves ingress.</text><path d="M285 200 H405" class="f"/><text x="315" y="185" class="s">1 public HTTPS</text><path d="M615 192 H670" class="f"/><text x="620" y="177" class="s">2</text><path d="M920 202 H985" class="f"/><text x="930" y="187" class="s">3 backend route</text><path d="M1100 255 V315" class="f"/><text x="1115" y="292" class="s">4 GENEVE</text><path d="M985 372 H945 Q925 372 925 367 H920" class="f"/><text x="930" y="352" class="s">5 allowed</text><path d="M670 367 H635 Q620 367 620 212 H615" style="display:none"/><path d="M670 367 H645 Q630 367 630 275 H1255 V212 H1335" class="f"/><text x="930" y="290" class="s">6 GWLBE RT → TGW → App A</text><path d="M1585 440 V470 H1265 V390 H920" class="r"/><text x="1290" y="455" class="s">7 return via TGW to Ingress attachment</text><path d="M670 390 H645 Q625 390 625 202 H670" style="display:none"/><path d="M920 390 H955 Q970 390 970 202 H985" class="r"/><text x="940" y="430" class="s">8 RT-Ingress-TGW-a → GWLBE-a</text><path d="M1100 315 V270" class="r"/><path d="M985 220 H940 Q920 220 920 220" class="r"/><path d="M670 220 H630 Q615 220 615 220" class="r"/><path d="M405 220 H325" class="r"/><text x="35" y="1155" class="h">Orange = client/backend forward direction. Blue = backend return direction. The ALB creates a new backend flow, so the NGFW after ALB does not see the Internet client as the L3 source.</text></svg>