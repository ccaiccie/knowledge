<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><defs><marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="1400" height="700" fill="none"/><text x="700" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">HA + Routing Convergence: Separate the Failure Timers</text><g font-family="Arial"><rect x="70" y="120" rx="15" width="245" height="115" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="192" y="162" text-anchor="middle" font-size="19" font-weight="700">1. Failure detected</text><text x="192" y="192" text-anchor="middle" font-size="14">link / heartbeat / BFD</text><text x="192" y="215" text-anchor="middle" font-size="14">cluster health</text><rect x="390" y="120" rx="15" width="245" height="115" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="512" y="162" text-anchor="middle" font-size="19" font-weight="700">2. HA ownership</text><text x="512" y="192" text-anchor="middle" font-size="14">VIP/MAC/state role moves</text><text x="512" y="215" text-anchor="middle" font-size="14">sessions preserved if synced</text><rect x="710" y="120" rx="15" width="245" height="115" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="832" y="162" text-anchor="middle" font-size="19" font-weight="700">3. Routing reconverges</text><text x="832" y="192" text-anchor="middle" font-size="14">BGP/OSPF withdrawal</text><text x="832" y="215" text-anchor="middle" font-size="14">RIB/FIB update</text><rect x="1030" y="120" rx="15" width="245" height="115" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1152" y="162" text-anchor="middle" font-size="19" font-weight="700">4. Traffic stabilizes</text><text x="1152" y="192" text-anchor="middle" font-size="14">neighbors refresh</text><text x="1152" y="215" text-anchor="middle" font-size="14">stateful symmetry restored</text><line x1="315" y1="177" x2="390" y2="177" stroke="#334155" stroke-width="4" marker-end="url(#a3)"/><line x1="635" y1="177" x2="710" y2="177" stroke="#334155" stroke-width="4" marker-end="url(#a3)"/><line x1="955" y1="177" x2="1030" y2="177" stroke="#334155" stroke-width="4" marker-end="url(#a3)"/><rect x="130" y="365" rx="16" width="1140" height="180" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text x="700" y="405" text-anchor="middle" font-size="21" font-weight="700">Do not answer “failover is X seconds” without decomposing the chain</text><text x="700" y="442" text-anchor="middle" font-size="16">HA heartbeat/member detection can be faster or slower than routing protocol failure detection.</text><text x="700" y="472" text-anchor="middle" font-size="16">BFD may accelerate a routing adjacency, but it does not by itself guarantee application recovery or state synchronization.</text><text x="700" y="502" text-anchor="middle" font-size="16">Validate downstream/upstream FIB convergence, ARP/ND, ECMP hashing, NAT/session ownership, and asymmetric-return risk.</text></g></svg>