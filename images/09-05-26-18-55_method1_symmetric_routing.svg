s="return"/><text x="705" y="650" class="lbl">5 GatewaySubnet UDR</text><rect x="85" y="770" width="1430" height="75" rx="14" fill="#FFF7DB" stroke="#D6A500" stroke-width="2"/><text x="110" y="800" class="h">Critical rule</text><text x="110" y="828" class="s">Use explicit remote prefixes where a more-specific system/peering route could bypass the default route. Verify effective routes on both directions.</text></svg>