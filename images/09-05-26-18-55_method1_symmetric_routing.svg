<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker><style>.b{fill:#fff;stroke:#333;stroke-width:2}.g{fill:#fafafa;stroke:#777;stroke-width:2;stroke-dasharray:8 6}.t{font:19px Arial}.s{font:15px Arial}.f{stroke:#333;stroke-width:3;fill:none;marker-end:url(#a)}.r{stroke:#777;stroke-width:3;fill:none;marker-end:url(#a);stroke-dasharray:8 5}</style></defs>
<text x="35" y="45" class="t">Forward path — Spoke A → Spoke B and Spoke A → On-premises</text>
<rect x="40" y="90" width="270" height="110" rx="12" class="b"/><text x="78" y="130" class="t">Spoke A workload</text><text x="73" y="162" class="s">10.10.1.10</text><text x="73" y="186" class="s">UDR: 10.20.0.0/16 + 172.16.0.0/16 → 10.0.1.4</text>
<rect x="410" y="90" width="270" height="110" rx="12" class="b"/><text x="478" y="130" class="t">Azure Firewall</text><text x="489" y="160" class="s">10.0.1.4</text><text x="447" y="186" class="s">state + policy enforcement</text>
<rect x="790" y="55" width="270" height="110" rx="12" class="b"/><text x="850" y="95" class="t">Spoke B workload</text><text x="850" y="127" class="s">10.20.1.20</text><text x="835" y="151" class="s">reverse UDR → 10.0.1.4</text>
<rect x="790" y="205" width="270" height="110" rx="12" class="b"/><text x="829" y="245" class="t">VNet Gateway</text><text x="836" y="277" class="s">GatewaySubnet</text>
<rect x="1170" y="205" width="270" height="110" rx="12" class="b"/><text x="1232" y="245" class="t">On-premises</text><text x="1242" y="277" class="s">172.16.0.0/16</text>
<path d="M310 125 H410" class="f"/><text x="330" y="110" class="s">1 UDR</text><path d="M680 115 H790" class="f"/><text x="710" y="100" class="s">2 route to Spoke B</text><path d="M680 175 H740 V260 H790" class="f"/><text x="695" y="218" class="s">2 route to gateway</text><path d="M1060 260 H1170" class="f"/><text x="1090" y="245" class="s">3 VPN/ER</text>
<text x="35" y="405" class="t">Return path — must re-enter the same stateful firewall</text>
<rect x="40" y="455" width="270" height="110" rx="12" class="b"/><text x="78" y="495" class="t">Spoke A workload</text><text x="104" y="527" class="s">10.10.1.10</text>
<rect x="410" y="455" width="270" height="110" rx="12" class="b"/><text x="478" y="495" class="t">Azure Firewall</text><text x="448" y="527" class="s">existing session/state</text>
<rect x="790" y="420" width="270" height="110" rx="12" class="b"/><text x="850" y="460" class="t">Spoke B workload</text><text x="828" y="492" class="s">UDR 10.10.0.0/16 → 10.0.1.4</text>
<rect x="790" y="570" width="270" height="110" rx="12" class="b"/><text x="829" y="610" class="t">VNet Gateway</text><text x="816" y="642" class="s">GatewaySubnet UDR for spoke prefix → 10.0.1.4</text>
<rect x="1170" y="570" width="270" height="110" rx="12" class="b"/><text x="1232" y="610" class="t">On-premises</text><text x="1218" y="642" class="s">returns via VPN / ER</text>
<path d="M790 475 H680" class="r"/><text x="700" y="458" class="s">4 reverse UDR</text><path d="M410 510 H310" class="r"/><text x="325" y="493" class="s">5 state match</text><path d="M1170 625 H1060" class="r"/><text x="1085" y="608" class="s">4 return</text><path d="M790 625 H720 V540 H680" class="r"/><text x="690" y="597" class="s">5 GatewaySubnet UDR</text>
<rect x="65" y="760" width="1370" height="90" rx="12" class="g"/><text x="90" y="795" class="t">Critical routing rule</text><text x="90" y="825" class="s">A default route alone may not override a more-specific peering/system route. Use exact spoke prefixes where required, and verify effective routes on both ends.</text></svg>