<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930"><defs><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#CA5010"/></marker><filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/></filter><style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#14314A}.subtitle{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#4A4A4A}.label{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#173B5C}.small{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#173B5C}.tiny{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#173B5C}.legend{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#173B5C}</style></defs><text x="30" y="40" class="title">Private Endpoint inspection path</text><text x="30" y="64" class="subtitle">Inspection controls access to Private Link resources by steering client subnets through a firewall or NVA before they reach the Private Endpoint subnet.</text><rect x="260" y="130" width="1080" height="680" rx="22" fill="#F8FBFF" stroke="#0078D4" stroke-width="3" stroke-dasharray="7 5"/><text x="800" y="165" class="label" text-anchor="middle">Hub-and-spoke Private Link design</text><rect x="330" y="230" width="260" height="220" rx="12" fill="#F8FCFF" stroke="#50B0F9" stroke-width="2" stroke-dasharray="7 5"/><text x="460" y="255" class="label" text-anchor="middle">Client spoke VNet</text><rect x="415" y="315" width="90" height="55" rx="10" fill="white" stroke="#50B0F9" stroke-width="2" filter="url(#shadow)"/><text x="460" y="348" class="small" text-anchor="middle">Client VM / AKS</text><rect x="360" y="400" width="128" height="24" rx="12" fill="white" stroke="#0078D4" stroke-width="2"/><text x="424" y="417" class="tiny" text-anchor="middle">UDR → firewall</text><rect x="680" y="230" width="260" height="250" rx="14" fill="#FFFDF5" stroke="#D0A000" stroke-width="2" stroke-dasharray="7 5"/><text x="810" y="255" class="label" text-anchor="middle">Inspection hub</text><rect x="740" y="330" width="140" height="75" rx="16" fill="#FFF6D8" stroke="#FFB900" stroke-width="2" filter="url(#shadow)"/><text x="810" y="374" class="label" text-anchor="middle">Azure Firewall</text><rect x="710" y="430" width="232" height="24" rx="12" fill="white" stroke="#FFB900" stroke-width="2"/><text x="826" y="447" class="tiny" text-anchor="middle">FQDN, TLS, or network rules</text><rect x="1030" y="210" width="250" height="290" rx="12" fill="#F8FCFF" stroke="#50B0F9" stroke-width="2" stroke-dasharray="7 5"/><text x="1155" y="235" class="label" text-anchor="middle">Private Endpoint VNet / subnet</text><rect x="1085" y="315" width="140" height="70" rx="10" fill="#EAF3FF" stroke="#50B0F9" stroke-width="2" filter="url(#shadow)"/><text x="1155" y="355" class="small" text-anchor="middle">Private Endpoint</text><rect x="1065" y="410" width="180" height="50" rx="10" fill="white" stroke="#50B0F9" stroke-width="2" filter="url(#shadow)"/><text x="1155" y="440" class="small" text-anchor="middle">Private DNS zone / resolver</text><rect x="1045" y="560" width="220" height="140" rx="12" fill="#F8FCFF" stroke="#50B0F9" stroke-width="2" stroke-dasharray="7 5"/><text x="1155" y="585" class="label" text-anchor="middle">PaaS service</text><rect x="1110" y="625" width="90" height="55" rx="10" fill="white" stroke="#50B0F9" stroke-width="2" filter="url(#shadow)"/><text x="1155" y="655" class="small" text-anchor="middle">Storage / SQL</text><polyline points="505,345 740,345" fill="none" stroke="#0078D4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowBlue)"/><polyline points="880,345 1085,345" fill="none" stroke="#0078D4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowBlue)"/><polyline points="1155,385 1155,560" fill="none" stroke="#0078D4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowBlue)"/><polyline points="1110,650 900,650 900,405 880,405" fill="none" stroke="#CA5010" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowOrange)"/><circle cx="620" cy="345" r="14" fill="white" stroke="#0078D4" stroke-width="3"/><text x="620" y="350" class="legend" text-anchor="middle">1</text><text x="655" y="350" class="tiny">Client traffic is steered to the inspection point</text><circle cx="1155" cy="515" r="14" fill="white" stroke="#0078D4" stroke-width="3"/><text x="1155" y="520" class="legend" text-anchor="middle">2</text><text x="1190" y="520" class="tiny">Private Endpoint NIC receives connection</text><circle cx="900" cy="650" r="14" fill="white" stroke="#CA5010" stroke-width="3"/><text x="900" y="655" class="legend" text-anchor="middle">3</text><text x="935" y="655" class="tiny">Return path must remain symmetric</text><rect x="1160" y="35" width="340" height="86" rx="14" fill="white" stroke="#A0B3C4" stroke-width="1.5" filter="url(#shadow)"/><text x="1178" y="59" class="label">Legend</text><line x1="1178" y1="83" x2="1230" y2="83" stroke="#0078D4" stroke-width="4"/><text x="1242" y="88" class="small">Forward inspected path to Private Endpoint</text><line x1="1178" y1="111" x2="1230" y2="111" stroke="#CA5010" stroke-width="4"/><text x="1242" y="116" class="small">Return path and symmetry requirement</text></svg>