<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="c" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker><style>.t{font:700 28px Segoe UI,Arial;fill:#0f172a}.bt{font:700 17px Segoe UI,Arial;fill:#0f172a}.bs{font:400 14px Segoe UI,Arial;fill:#334155}.n{font:400 13px Segoe UI,Arial;fill:#7c2d12}</style></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="48" class="t">VPN Gateway + Route Server + NVA: requirements, route exchange, and packet flow</text><rect x="60" y="240" width="250" height="145" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="80" y="275" class="bt">On-prem VPN device</text><text x="80" y="305" class="bs">IPsec/IKE S2S tunnel</text><text x="80" y="328" class="bs">BGP optional for ARS integration</text><rect x="390" y="240" width="280" height="145" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="410" y="275" class="bt">Azure VPN Gateway</text><text x="410" y="305" class="bs">GatewaySubnet</text><text x="410" y="328" class="bs">Active-active required with ARS</text><text x="410" y="351" class="bs">ASN must be 65515</text><rect x="760" y="130" width="280" height="155" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="780" y="165" class="bt">Azure Route Server</text><text x="780" y="195" class="bs">RouteServerSubnet</text><text x="780" y="218" class="bs">Branch-to-branch enabled</text><text x="780" y="241" class="bs">Managed route exchange with VPN GW</text><rect x="760" y="470" width="280" height="155" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="780" y="505" class="bt">Third-party NVA</text><text x="780" y="535" class="bs">Peers to both ARS IPs</text><text x="780" y="558" class="bs">Can learn VPN prefixes</text><text x="780" y="581" class="bs">Can advertise branch/NVA prefixes</text><rect x="1130" y="240" width="280" height="145" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1150" y="275" class="bt">Spoke workload</text><text x="1150" y="305" class="bs">Consumes remote Route Server</text><text x="1150" y="328" class="bs">Effective routes select VPN/NVA path</text><path d="M310 312 L390 312" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M670 312 L760 207" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 6" fill="none" marker-end="url(#c)"/><path d="M900 285 L900 470" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 6" fill="none" marker-end="url(#c)"/><path d="M1040 548 L1130 312" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 6" fill="none" marker-end="url(#c)"/><rect x="40" y="730" width="1420" height="80" rx="12" fill="#fff7ed" stroke="#f59e0b"/><text x="60" y="763" class="n">The S2S tunnel terminates on Azure VPN Gateway, not on Route Server. Route Server exchanges routes between the VPN gateway and NVA only when branch-to-branch is enabled.</text><text x="60" y="786" class="n">BGP need not be enabled on the VPN gateway merely for VPN Gateway ↔ Route Server communication; routes can come from BGP or local-network-gateway definitions.</text></svg>