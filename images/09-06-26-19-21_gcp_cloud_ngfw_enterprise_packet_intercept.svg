<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f29900"/></marker><style>text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:700}.boxTitle{font-size:19px;font-weight:700}.boxText{font-size:15px}.label{font-size:15px;font-weight:700}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="48" class="title">Cloud NGFW Enterprise — L7 Packet Intercept path</text>
<rect x="70" y="170" width="260" height="145" rx="16" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="86" y="200" class="boxTitle">Workload VM</text><text x="86" y="224" class="boxText">web-1 10.10.10.10</text><text x="86" y="248" class="boxText">us-central1-a</text><text x="86" y="272" class="boxText">New TLS flow to 198.51.100.25:443</text>
<rect x="410" y="130" width="300" height="180" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="426" y="160" class="boxTitle">Global network firewall policy</text><text x="426" y="184" class="boxText">Rule 300</text><text x="426" y="208" class="boxText">action=apply_security_profile_group</text><text x="426" y="232" class="boxText">target=role=web</text><text x="426" y="256" class="boxText">dest=0.0.0.0/0 tcp:443</text><text x="426" y="280" class="boxText">optional --tls-inspect</text>
<rect x="790" y="130" width="280" height="180" rx="16" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/><text x="806" y="160" class="boxTitle">Security profile group</text><text x="806" y="184" class="boxText">References threat-prevention profile</text><text x="806" y="208" class="boxText">Optional URL filtering / WildFire</text><text x="806" y="232" class="boxText">Organization- or project-scoped</text>
<rect x="790" y="420" width="280" height="175" rx="16" fill="#fce8e6" stroke="#d93025" stroke-width="2"/><text x="806" y="450" class="boxTitle">Firewall endpoint</text><text x="806" y="474" class="boxText">Zonal resource: us-central1-a</text><text x="806" y="498" class="boxText">Associated to prod-vpc</text><text x="806" y="522" class="boxText">Performs L7 inspection</text><text x="806" y="546" class="boxText">No user-managed route next hop</text>
<rect x="1160" y="170" width="250" height="145" rx="16" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/><text x="1176" y="200" class="boxTitle">Destination</text><text x="1176" y="224" class="boxText">Internet server 198.51.100.25:443</text><text x="1176" y="248" class="boxText">Or another Google Cloud workload</text><text x="1176" y="272" class="boxText">Original route remains authoritative</text>
<rect x="410" y="470" width="270" height="135" rx="16" fill="#fef7e0" stroke="#f29900" stroke-width="2"/><text x="426" y="500" class="boxTitle">Packet Intercept</text><text x="426" y="524" class="boxText">Managed steering mechanism</text><text x="426" y="548" class="boxText">Adds VPC network identifier</text><text x="426" y="572" class="boxText">Traffic is transparently sent to endpoint</text>
<rect x="1160" y="450" width="250" height="145" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="1176" y="480" class="boxTitle">TLS inspection (optional)</text><text x="1176" y="504" class="boxText">CA Service-backed interception</text><text x="1176" y="528" class="boxText">Decrypt → inspect → re-encrypt</text><text x="1176" y="552" class="boxText">Clients must trust inspection CA chain</text>
<path d="M 330,240 L 410,240" fill="none" stroke="#1a73e8" stroke-width="4" marker-end="url(#blueArrow)"/><rect x="404" y="222" width="224" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="410" y="240" class="label" fill="#1a73e8">1 new connection hits policy</text>
<path d="M 710,220 L 790,220" fill="none" stroke="#f29900" stroke-width="4" marker-end="url(#orangeArrow)"/><rect x="784" y="202" width="208" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="790" y="220" class="label" fill="#f29900">2 references profile group</text>
<path d="M 560,310 L 560,470" fill="none" stroke="#1a73e8" stroke-width="4" marker-end="url(#blueArrow)"/><rect x="554" y="452" width="208" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="560" y="470" class="label" fill="#1a73e8">3 match triggers intercept</text>
<path d="M 680,535 L 790,535" fill="none" stroke="#1a73e8" stroke-width="4" marker-end="url(#blueArrow)"/><rect x="784" y="517" width="144" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="790" y="535" class="label" fill="#1a73e8">4 managed steering</text>
<path d="M 1070,505 L 1120,505 L 1120,290 L 1160,290" fill="none" stroke="#1a73e8" stroke-width="4" marker-end="url(#blueArrow)"/><rect x="1074" y="372" width="296" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="1080" y="390" class="label" fill="#1a73e8">5 clean traffic resumes original path</text>
<path d="M 1160,245 L 1120,245 L 1120,470 L 1070,470" fill="none" stroke="#188038" stroke-width="4" marker-end="url(#greenArrow)"/><rect x="1074" y="432" width="216" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="1080" y="450" class="label" fill="#188038">6 return inspected/stateful</text>
<path d="M 1070,535 L 1160,535" fill="none" stroke="#f29900" stroke-width="4" marker-end="url(#orangeArrow)" stroke-dasharray="8 7"/><rect x="1154" y="517" width="192" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="1160" y="535" class="label" fill="#f29900">optional TLS policy / CA</text>
<path d="M 790,470 L 730,470 L 730,280 L 710,280" fill="none" stroke="#188038" stroke-width="4" marker-end="url(#greenArrow)"/><rect x="614" y="427" width="264" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="620" y="445" class="label" fill="#188038">7 endpoint verdict/state returned</text>
<text x="40" y="790" class="boxText">The endpoint must exist in the same zone as workloads whose traffic you inspect. Deploy endpoints per required workload zone.</text><text x="40" y="814" class="boxText">Per-connection throughput documented by Google: up to 250 Mbps with TLS inspection and 1.25 Gbps without TLS inspection.</text></svg>