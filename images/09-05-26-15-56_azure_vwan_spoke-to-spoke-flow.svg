<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><rect width="100%" height="100%" fill="white" fill-opacity="0"/><text x="30" y="45" font-family="Arial" font-size="28" font-weight="700">Spoke-to-spoke packet flow with Private Traffic routing policy</text><rect x="60" y="300" rx="18" ry="18" width="250" height="110" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="185" y="334" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">VM-A in Spoke A</text><text x="185" y="364" text-anchor="middle" font-family="Arial" font-size="14">10.10.1.4 → 10.20.1.4</text><rect x="420" y="170" rx="18" ry="18" width="300" height="110" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="570" y="204" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">vHub Router</text><text x="570" y="234" text-anchor="middle" font-family="Arial" font-size="14">Private Traffic policy active</text><rect x="420" y="430" rx="18" ry="18" width="300" height="110" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/><text x="570" y="464" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Azure Firewall / NVA</text><text x="570" y="494" text-anchor="middle" font-family="Arial" font-size="14">Stateful inspection</text><text x="570" y="514" text-anchor="middle" font-family="Arial" font-size="14">No SNAT for RFC1918 by default in Azure Firewall</text><rect x="840" y="170" rx="18" ry="18" width="300" height="110" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="990" y="204" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">vHub Router (return)</text><text x="990" y="234" text-anchor="middle" font-family="Arial" font-size="14">Route to Spoke B</text><rect x="840" y="430" rx="18" ry="18" width="300" height="110" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="990" y="464" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">VM-B in Spoke B</text><text x="990" y="494" text-anchor="middle" font-family="Arial" font-size="14">10.20.1.4</text><line x1="310" y1="355" x2="420" y2="225" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="290" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">1. Spoke→hub</text><line x1="570" y1="280" x2="570" y2="430" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><text x="570" y="355" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">2. steer to firewall</text><line x1="720" y1="485" x2="840" y2="225" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><text x="780" y="355" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">3. inspected return to router</text><line x1="990" y1="280" x2="990" y2="430" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><text x="990" y="355" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">4. deliver to B</text><line x1="990" y1="430" x2="720" y2="485" stroke="#111827" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="855" y="458" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">Return follows same policy</text></svg>