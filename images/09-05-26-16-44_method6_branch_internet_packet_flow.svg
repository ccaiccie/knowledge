<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0078D4"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".18"/></filter>
    <style>.title{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#475569}.h{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.t{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#1e293b}.s{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#475569}.box{stroke:#94a3b8;stroke-width:1.5;rx:16;filter:url(#shadow)}.flow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.flowb{stroke:#0078D4;stroke-width:4;fill:none;marker-end:url(#arrowBlue)}</style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/><text x="60" y="55" class="title">Branch → Internet through Virtual WAN Security Partner</text><text x="60" y="84" class="subtitle">Branch Internet traffic can be centralized through the vHub and provider cloud, while Microsoft recommends local breakout for key Microsoft 365 connectivity.</text>
  <rect x="45" y="180" width="250" height="150" fill="#f8fafc" class="box"/><text x="170" y="220" text-anchor="middle" class="h">Branch LAN</text><text x="170" y="252" text-anchor="middle" class="t">User / appliance</text><text x="170" y="280" text-anchor="middle" class="s">Microsoft 365 may need local</text><text x="170" y="302" text-anchor="middle" class="s">breakout before Azure</text>
  <rect x="385" y="180" width="250" height="150" fill="#e8f3ff" class="box"/><text x="510" y="220" text-anchor="middle" class="h">Virtual WAN Hub</text><text x="510" y="252" text-anchor="middle" class="t">Branch route + Internet policy</text><text x="510" y="280" text-anchor="middle" class="s">0/0 steered to SECaaS</text>
  <rect x="725" y="180" width="250" height="150" fill="#ede9fe" class="box"/><text x="850" y="220" text-anchor="middle" class="h">S2S VPN Gateway</text><text x="850" y="252" text-anchor="middle" class="t">IPsec to provider</text><text x="850" y="280" text-anchor="middle" class="s">Required for this integration</text>
  <rect x="1065" y="145" width="290" height="220" fill="#ecfeff" class="box"/><text x="1210" y="190" text-anchor="middle" class="h">Security Provider Cloud</text><text x="1210" y="225" text-anchor="middle" class="t">Internet / SaaS filtering</text><text x="1210" y="255" text-anchor="middle" class="t">User-aware controls if supported</text><text x="1210" y="300" text-anchor="middle" class="s">Egress happens from provider</text><text x="1210" y="325" text-anchor="middle" class="s">service toward the public Internet</text>
  <rect x="90" y="500" width="280" height="120" fill="#fff7ed" class="box"/><text x="230" y="540" text-anchor="middle" class="h">M365 local breakout</text><text x="230" y="570" text-anchor="middle" class="t">Recommended by Microsoft</text><text x="230" y="595" text-anchor="middle" class="s">for key Microsoft 365 flows</text>
  <rect x="1065" y="500" width="290" height="120" fill="#f1f5f9" class="box"/><text x="1210" y="540" text-anchor="middle" class="h">Internet / SaaS</text><text x="1210" y="572" text-anchor="middle" class="t">Non-bypassed traffic</text>
  <path d="M295 255 L385 255" class="flowb"/><path d="M635 255 L725 255" class="flowb"/><path d="M975 255 L1065 255" class="flowb"/><path d="M1210 365 L1210 500" class="flowb"/><path d="M170 330 C170 410 205 445 230 500" class="flow"/><text x="145" y="428" class="s">direct</text><path d="M370 560 C670 680 970 670 1065 560" class="flow"/><text x="650" y="650" class="s">Local branch egress for selected Microsoft 365 traffic</text>
</svg>