<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1220" viewBox="0 0 1900 1220"><defs><marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px}.m{font-size:13px;font-family:monospace}.box{fill:#fff;stroke:#64748b;stroke-width:2}.rt{fill:#f8fafc;stroke:#475569;stroke-width:1.5}.sec{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.warn{fill:#fffbeb;stroke:#d97706;stroke-width:2}.f{fill:none;stroke:#d97706;stroke-width:4;marker-end:url(#f)}.r{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#r)}.dash{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:10 8}</style></defs><text x="35" y="42" class="t">East-West — Distributed GWLBE Enforcement with TGW Used Only as Inter-VPC Transport</text><rect x="25" y="80" width="590" height="960" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="45" y="115" class="h">Spoke A — enforcement VPC 10.10.0.0/16</text><rect x="55" y="150" width="225" height="90" rx="8" class="box"/><text x="70" y="180" class="h">EC2-A</text><text x="70" y="207" class="s">10.10.10.10</text><text x="70" y="230" class="s">Destination 10.20.10.20:443</text><rect x="335" y="150" width="240" height="90" rx="8" class="sec"/><text x="350" y="180" class="h">GWLBE-A-a</text><text x="350" y="207" class="s">Subnet 10.10.100.0/28</text><text x="350" y="230" class="s">The actual inspection insertion point</text><rect x="335" y="305" width="240" height="90" rx="8" class="box"/><text x="350" y="335" class="h">TGW attachment subnet</text><text x="350" y="362" class="s">10.10.200.0/28</text><text x="350" y="385" class="s">Transport toward tgw-1</text><rect x="55" y="445" width="520" height="430" rx="8" class="rt"/><text x="70" y="475" class="h">Spoke A route tables — source-side enforcement</text><text x="70" y="508" class="m">RT-A-App-a  (10.10.10.0/24)</text><text x="70" y="533" class="m">10.10.0.0/16  → local</text><text x="70" y="558" class="m">10.20.0.0/16  → vpce-gwlb-A-a</text><text x="70" y="598" class="m">RT-A-GWLBE-a  (10.10.100.0/28)</text><text x="70" y="623" class="m">10.10.0.0/16  → local</text><text x="70" y="648" class="m">10.20.0.0/16  → tgw-1</text><text x="70" y="688" class="m">RT-A-TGW-a  (10.10.200.0/28)</text><text x="70" y="713" class="m">10.10.0.0/16  → local</text><text x="70" y="738" class="m">10.10.10.0/24  → vpce-gwlb-A-a</text><text x="70" y="785" class="s">Forward: workload RT → GWLBE-A → firewall service →</text><text x="70" y="810" class="s">GWLBE-A RT → TGW. Return: TGW subnet RT → GWLBE-A → workload.</text><text x="70" y="842" class="s">TGW never points to the Security VPC in this model.</text><rect x="655" y="80" width="590" height="960" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><text x="675" y="115" class="h">Transport plane + centralized firewall service</text><rect x="690" y="150" width="520" height="125" rx="8" class="box"/><text x="710" y="182" class="h">AWS Transit Gateway tgw-1 — TRANSPORT ONLY</text><text x="710" y="210" class="m">10.10.0.0/16 → att-Spoke-A</text><text x="710" y="235" class="m">10.20.0.0/16 → att-Spoke-B</text><text x="710" y="260" class="s">No route to a Security/Inspection VPC attachment in this pattern.</text><rect x="690" y="335" width="520" height="130" rx="8" class="sec"/><text x="710" y="368" class="h">Central GWLB endpoint service</text><text x="710" y="395" class="s">GWLBE-A → PrivateLink service → GWLB</text><text x="710" y="420" class="s">GWLB → GENEVE UDP/6081 → healthy NGFW target</text><text x="710" y="445" class="s">Allowed packet returns to the same GWLBE-A service context.</text><rect x="690" y="520" width="520" height="125" rx="8" class="box"/><text x="710" y="553" class="h">NGFW fleet — Security VPC 10.255.0.0/16</text><text x="710" y="580" class="s">NGFW-A 10.255.10.10 | NGFW-B 10.255.20.10</text><text x="710" y="607" class="s">Inspects inner tuple 10.10.10.10 → 10.20.10.20</text><text x="710" y="632" class="s">Security VPC is service-provider location, not TGW transit hop.</text><rect x="690" y="710" width="520" height="235" rx="8" class="warn"/><text x="710" y="742" class="h">Do not confuse this with canonical centralized TGW inspection</text><text x="710" y="775" class="s">Different method:</text><text x="730" y="802" class="m">Spoke A → TGW → Security VPC attachment → GWLBE →</text><text x="730" y="827" class="m">GWLB/NGFW → TGW → Spoke B</text><text x="710" y="870" class="s">That design normally uses an appliance/inspection VPC attachment</text><text x="710" y="895" class="s">and TGW appliance mode. It is not the flow drawn here.</text><text x="710" y="928" class="s">This diagram uses local GWLBE insertion before/after TGW transport.</text><rect x="1285" y="80" width="590" height="960" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="1305" y="115" class="h">Spoke B — destination VPC 10.20.0.0/16</text><rect x="1320" y="150" width="245" height="90" rx="8" class="box"/><text x="1335" y="180" class="h">TGW attachment subnet</text><text x="1335" y="207" class="s">10.20.200.0/28</text><text x="1335" y="230" class="s">Source-side-only model: route locally</text><rect x="1610" y="150" width="225" height="90" rx="8" class="box"/><text x="1625" y="180" class="h">EC2-B</text><text x="1625" y="207" class="s">10.20.10.20</text><text x="1625" y="230" class="s">TCP/443 destination</text><rect x="1320" y="305" width="515" height="230" rx="8" class="rt"/><text x="1335" y="337" class="h">Spoke B route tables — no destination-side inspection</text><text x="1335" y="370" class="m">RT-B-TGW-a  (10.20.200.0/28)</text><text x="1335" y="395" class="m">10.20.0.0/16  → local</text><text x="1335" y="435" class="m">RT-B-App-a  (10.20.10.0/24)</text><text x="1335" y="460" class="m">10.20.0.0/16  → local</text><text x="1335" y="485" class="m">10.10.0.0/16  → tgw-1</text><text x="1335" y="517" class="s">Return reaches TGW directly, then Spoke A performs return inspection.</text><rect x="1320" y="610" width="515" height="300" rx="8" class="warn"/><text x="1335" y="642" class="h">Optional second trust-boundary inspection — separate choice</text><text x="1335" y="675" class="s">If you intentionally want B-side ingress/egress inspection, add:</text><text x="1335" y="710" class="m">RT-B-TGW-a: 10.20.10.0/24 → GWLBE-B</text><text x="1335" y="738" class="m">RT-B-App-a: 10.10.0.0/16 → GWLBE-B</text><text x="1335" y="766" class="m">RT-B-GWLBE-a: 10.10.0.0/16 → tgw-1</text><text x="1335" y="810" class="s">That adds another local service-chain traversal in Spoke B.</text><text x="1335" y="838" class="s">It is not TGW centralized inspection, but it causes double inspection</text><text x="1335" y="866" class="s">of the same inter-VPC connection and duplicate policy/log processing.</text><path d="M280 195 H335" class="f"/><text x="295" y="178" class="s">1</text><path d="M575 195 H645 Q670 195 670 400 H690" class="f"/><text x="590" y="180" class="s">2 PrivateLink</text><path d="M950 465 V520" class="f"/><text x="965" y="500" class="s">3 GENEVE</text><path d="M690 430 H650 Q625 430 625 350 H575" class="f"/><text x="590" y="455" class="s">4 allowed</text><path d="M575 350 H635 Q655 350 655 212 H690" class="f"/><text x="590" y="335" class="s">5 to TGW</text><path d="M1210 212 H1285 Q1305 212 1305 195 H1320" class="f"/><text x="1220" y="190" class="s">6 transport</text><path d="M1565 195 H1610" class="f"/><text x="1572" y="178" class="s">7 local</text><path d="M1610 220 H1578 Q1565 220 1565 255 H1305 Q1285 255 1285 235 H1210" class="r"/><text x="1460" y="275" class="s">return → TGW</text><path d="M690 245 H645 Q620 245 620 350 H575" class="r"/><path d="M335 350 H300 Q280 350 280 195" class="r"/><text x="35" y="1090" class="h">Primary flow shown: source-side distributed GWLBE inspection only. TGW performs VPC-to-VPC transport; it does not send traffic to the Security VPC.</text><text x="35" y="1125" class="s">Forward inner tuple remains 10.10.10.10:ephemeral → 10.20.10.20:443. Blue return path is forced through GWLBE-A when it re-enters Spoke A through the TGW attachment subnet.</text><text x="35" y="1160" class="s">The optional B-side box is a separate layered-enforcement choice, not a second TGW inspection method.</text></svg>