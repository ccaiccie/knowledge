<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1180" viewBox="0 0 1900 1180"><defs><marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px}.m{font-size:13px;font-family:monospace}.box{fill:#fff;stroke:#64748b;stroke-width:2}.rt{fill:#f8fafc;stroke:#475569;stroke-width:1.5}.sec{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.f{fill:none;stroke:#d97706;stroke-width:4;marker-end:url(#f)}.r{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#r)}</style></defs><text x="35" y="42" class="t">East-West Enforcement — Spoke A 10.10.0.0/16 ↔ Spoke B 10.20.0.0/16</text>
<rect x="25" y="80" width="640" height="950" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="45" y="115" class="h">Spoke A</text><rect x="55" y="150" width="230" height="95" rx="8" class="box"/><text x="70" y="180" class="h">EC2-A</text><text x="70" y="207" class="s">10.10.10.10 / app-a 10.10.10.0/24</text><text x="70" y="230" class="s">Source flow: → 10.20.10.20:443</text><rect x="360" y="150" width="245" height="95" rx="8" class="sec"/><text x="375" y="180" class="h">GWLBE-A-a</text><text x="375" y="207" class="s">10.10.100.0/28</text><text x="375" y="230" class="s">Distributed inspection entry/return</text><rect x="360" y="300" width="245" height="90" rx="8" class="box"/><text x="375" y="332" class="h">TGW attach subnet A-a</text><text x="375" y="360" class="s">10.10.200.0/28 → tgw-1</text>
<rect x="55" y="445" width="550" height="425" rx="8" class="rt"/><text x="70" y="475" class="h">Spoke A route tables</text><text x="70" y="505" class="m">RT-A-App-a</text><text x="70" y="530" class="m">10.10.0.0/16 local</text><text x="70" y="555" class="m">10.20.0.0/16 → vpce-gwlb-A-a</text><text x="70" y="590" class="m">RT-A-GWLBE-a</text><text x="70" y="615" class="m">10.10.0.0/16 local</text><text x="70" y="640" class="m">10.20.0.0/16 → tgw-1</text><text x="70" y="675" class="m">RT-A-TGW-a</text><text x="70" y="700" class="m">10.10.0.0/16 local</text><text x="70" y="725" class="m">10.10.10.0/24 → vpce-gwlb-A-a</text><text x="70" y="765" class="s">Return enforcement: packet arriving from TGW for EC2-A</text><text x="70" y="790" class="s">hits RT-A-TGW-a, is sent through the same local GWLBE,</text><text x="70" y="815" class="s">then the GWLBE subnet's local route reaches EC2-A.</text>
<rect x="710" y="80" width="480" height="950" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="730" y="115" class="h">Transit + centralized firewall service</text><rect x="740" y="150" width="420" height="120" rx="8" class="box"/><text x="760" y="183" class="h">AWS Transit Gateway tgw-1</text><text x="760" y="210" class="m">RT-Spoke: 10.20.0.0/16 → att-Spoke-B</text><text x="760" y="235" class="m">RT-Spoke: 10.10.0.0/16 → att-Spoke-A</text><text x="760" y="258" class="s">No centralized inspection attachment in this pattern</text><rect x="740" y="335" width="420" height="120" rx="8" class="sec"/><text x="760" y="368" class="h">GWLB endpoint service</text><text x="760" y="395" class="s">GWLBE-A/B → AWS PrivateLink → GWLB</text><text x="760" y="420" class="s">GWLB → GENEVE UDP/6081 → healthy NGFW</text><text x="760" y="445" class="s">Allowed packet returns to the SAME GWLBE</text><rect x="740" y="510" width="420" height="120" rx="8" class="box"/><text x="760" y="543" class="h">NGFW fleet — Security VPC 10.255.0.0/16</text><text x="760" y="570" class="s">AZ-a NGFW 10.255.10.10</text><text x="760" y="595" class="s">AZ-b NGFW 10.255.20.10</text><text x="760" y="620" class="s">Original source/destination tuple inspected</text><rect x="740" y="690" width="420" height="245" rx="8" class="rt"/><text x="760" y="722" class="h">Inspection policy choices</text><text x="760" y="753" class="s">A. Source-VPC enforcement only:</text><text x="780" y="778" class="s">A outbound + A return both traverse GWLBE-A.</text><text x="760" y="813" class="s">B. Both VPCs enforce:</text><text x="780" y="838" class="s">A outbound crosses GWLBE-A and B inbound crosses GWLBE-B.</text><text x="780" y="863" class="s">Return crosses B outbound and A inbound.</text><text x="760" y="900" class="s">Result: same connection may be inspected twice per direction.</text>
<rect x="1235" y="80" width="640" height="950" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="1255" y="115" class="h">Spoke B</text><rect x="1295" y="150" width="245" height="95" rx="8" class="box"/><text x="1310" y="180" class="h">TGW attach subnet B-a</text><text x="1310" y="207" class="s">10.20.200.0/28</text><text x="1310" y="230" class="s">Inbound route → GWLBE-B-a</text><rect x="1600" y="150" width="235" height="95" rx="8" class="sec"/><text x="1615" y="180" class="h">GWLBE-B-a</text><text x="1615" y="207" class="s">10.20.100.0/28</text><text x="1615" y="230" class="s">Optional destination-side enforcement</text><rect x="1600" y="300" width="235" height="95" rx="8" class="box"/><text x="1615" y="330" class="h">EC2-B</text><text x="1615" y="357" class="s">10.20.10.20 / app-b 10.20.10.0/24</text><text x="1615" y="380" class="s">Destination TCP/443</text>
<rect x="1295" y="445" width="540" height="425" rx="8" class="rt"/><text x="1310" y="475" class="h">Spoke B route tables when destination-side inspection is enabled</text><text x="1310" y="505" class="m">RT-B-TGW-a</text><text x="1310" y="530" class="m">10.20.0.0/16 local</text><text x="1310" y="555" class="m">10.20.10.0/24 → vpce-gwlb-B-a</text><text x="1310" y="590" class="m">RT-B-GWLBE-a</text><text x="1310" y="615" class="m">10.20.0.0/16 local</text><text x="1310" y="640" class="m">10.10.0.0/16 → tgw-1</text><text x="1310" y="675" class="m">RT-B-App-a</text><text x="1310" y="700" class="m">10.20.0.0/16 local</text><text x="1310" y="725" class="m">10.10.0.0/16 → vpce-gwlb-B-a</text><text x="1310" y="765" class="s">For source-only enforcement, omit B-side steering and let TGW</text><text x="1310" y="790" class="s">reach B locally. The A-side inbound TGW route still forces the</text><text x="1310" y="815" class="s">return direction through GWLBE-A before EC2-A.</text>
<path d="M285 197 H330 Q350 197 350 197 H360" class="f"/><text x="295" y="180" class="s">1</text><path d="M605 197 H690 Q710 197 710 395 H740" class="f"/><text x="620" y="180" class="s">2 PrivateLink</text><path d="M950 455 V510" class="f"/><text x="965" y="490" class="s">3 GENEVE</text><path d="M740 395 H700 Q680 395 680 345 H605" class="f"/><text x="620" y="420" class="s">4 allowed</text><path d="M605 345 H700 Q710 345 710 210 H740" class="f"/><text x="620" y="330" class="s">5 TGW</text><path d="M1160 210 H1235 Q1255 210 1255 197 H1295" class="f"/><text x="1170" y="190" class="s">6</text><path d="M1540 197 H1570 Q1585 197 1585 197 H1600" class="f"/><text x="1548" y="180" class="s">7</text><path d="M1835 197 H1860 V345 H1835" class="r"/><text x="1845" y="275" class="s">return</text><path d="M1600 345 H1570 Q1555 345 1555 345 H1540" class="r"/><path d="M1295 220 H1215 Q1190 220 1190 240 H1160" class="r"/><path d="M740 235 H690 Q665 235 665 345 H605" class="r"/><path d="M360 345 H315 Q290 345 290 197 H285" class="r"/><text x="35" y="1080" class="h">Forward tuple remains 10.10.10.10:ephemeral → 10.20.10.20:443 through TGW and GWLBE; no SNAT is required for this east-west transparent service-insertion path.</text><text x="35" y="1115" class="s">Orange = forward direction; blue = return direction. If both spokes use destination-side enforcement, the central NGFW fleet sees two service-chain traversals per direction; policy/logging must account for that deliberately.</text></svg>