<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="700" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#111827">Mental Model: Leak the Route, Not the Packet</text>
  <text x="700" y="74" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#4b5563">Each VRF owns a separate RIB/FIB. Route leaking copies selected reachability into another routing table.</text>

  <!-- Dedicated label lane -->
  <g>
    <rect x="215" y="100" width="300" height="48" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="365" y="131" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">1. Replicate selected route</text>

    <rect x="865" y="100" width="330" height="48" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="1030" y="131" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#15803d">2. Install in destination RIB</text>
  </g>

  <!-- Main nodes -->
  <g>
    <rect x="85" y="230" width="310" height="205" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="240" y="266" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#111827">Global VRF / Default RIB</text>
    <text x="240" y="304" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1f2937">10.50.50.0/24 = connected</text>
    <text x="240" y="334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1f2937">0.0.0.0/0 = upstream</text>
    <text x="240" y="364" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1f2937">No VRF-103 routes initially</text>
  </g>

  <g>
    <rect x="545" y="200" width="310" height="270" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="700" y="238" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#111827">IOS XE Router</text>
    <text x="700" y="282" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1f2937">route-replicate selects prefixes</text>
    <text x="700" y="314" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1f2937">Destination RIB installs replica</text>
    <text x="700" y="346" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1f2937">RIB decides forwarding</text>
    <text x="700" y="378" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1f2937">Redistribution is separate</text>
  </g>

  <g>
    <rect x="1005" y="230" width="310" height="205" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="1160" y="266" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#111827">VRF 103 RIB</text>
    <text x="1160" y="304" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1f2937">10.10.10.0/24 = connected</text>
    <text x="1160" y="334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1f2937">No global routes initially</text>
    <text x="1160" y="364" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1f2937">Leaked route appears with +</text>
  </g>

  <g>
    <rect x="545" y="590" width="310" height="120" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
    <text x="700" y="627" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#111827">Routing Neighbor</text>
    <text x="700" y="661" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1f2937">BGP / OSPF / EIGRP</text>
    <text x="700" y="690" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1f2937">Learns only after redistribution</text>
  </g>

  <defs>
    <marker id="ahBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="ahGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="ahPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9333ea"/>
    </marker>
  </defs>

  <!-- Thin arrows kept completely clear of labels -->
  <path d="M395 334 H545" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ahBlue)"/>
  <path d="M855 334 H1005" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ahGreen)"/>
  <path d="M700 470 V590" fill="none" stroke="#9333ea" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ahPurple)"/>

  <!-- Step 3 callout is beside, not on top of, the vertical connector -->
  <g>
    <rect x="885" y="505" width="415" height="54" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="1092.5" y="538" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#7e22ce">3. Redistribute if neighbor must learn it</text>
    <path d="M885 532 H760" fill="none" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="6 5"/>
  </g>
</svg>