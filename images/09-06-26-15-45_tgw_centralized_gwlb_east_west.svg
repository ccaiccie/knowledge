<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1050" viewBox="0 0 1900 1050"><defs><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px}.m{font-family:monospace;font-size:13px}.box{fill:#fff;stroke:#64748b;stroke-width:2}.f{fill:none;stroke:#d97706;stroke-width:4;marker-end:url(#o)}.rf{fill:none;stroke:#dc2626;stroke-width:4;marker-end:url(#r)}</style></defs><text x="30" y="45" class="t">East-West — Spoke A → TGW → Central Inspection VPC → TGW → Spoke B</text><rect x="40" y="130" width="300" height="130" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="60" y="165" class="h">Spoke A</text><text x="60" y="195" class="s">EC2-A 10.10.10.10</text><text x="60" y="225" class="m">RT-A-App: 10.20.0.0/16 → tgw-1</text><rect x="430" y="130" width="330" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="450" y="165" class="h">TGW-RT-SPOKES</text><text x="450" y="198" class="m">10.20.0.0/16 → att-Inspection</text><text x="450" y="228" class="m">10.10.0.0/16 → att-Inspection</text><rect x="850" y="100" width="350" height="180" rx="10" class="box"/><text x="870" y="135" class="h">Inspection TGW subnet AZ-a</text><text x="870" y="165" class="s">10.255.200.0/28</text><text x="870" y="195" class="m">RT-Insp-TGW-a:</text><text x="870" y="225" class="m">10.20.0.0/16 → vpce-gwlb-a</text><text x="870" y="255" class="m">10.10.0.0/16 → vpce-gwlb-a</text><rect x="1280" y="100" width="360" height="180" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="1300" y="135" class="h">GWLBE-a 10.255.100.0/28</text><text x="1300" y="168" class="s">GWLBE → GWLB → NGFW fleet → same GWLBE</text><text x="1300" y="200" class="m">RT-GWLBE-a:</text><text x="1300" y="230" class="m">10.0.0.0/8 → tgw-1</text><rect x="850" y="380" width="350" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="870" y="415" class="h">TGW-RT-INSPECTION</text><text x="870" y="448" class="m">10.20.0.0/16 → att-Spoke-B</text><text x="870" y="478" class="m">10.10.0.0/16 → att-Spoke-A</text><text x="870" y="508" class="s">Associated with att-Inspection</text><rect x="430" y="390" width="330" height="140" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="450" y="425" class="h">Spoke B</text><text x="450" y="455" class="s">TGW subnet → local routing</text><text x="450" y="485" class="s">EC2-B 10.20.10.20</text><text x="450" y="515" class="m">RT-B-App: 10.10.0.0/16 → tgw-1</text><rect x="1280" y="390" width="500" height="210" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="1300" y="425" class="h">APPLIANCE MODE on att-Inspection</text><text x="1300" y="462" class="s">Forward flow pins to one Inspection-VPC attachment ENI/AZ.</text><text x="1300" y="492" class="s">Reverse flow uses the same ENI/AZ for the flow lifetime.</text><text x="1300" y="522" class="s">Required for stateful east-west inspection across attachments.</text><rect x="80" y="650" width="1660" height="270" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text x="105" y="685" class="h">Packet walk: 10.10.10.10:49152 → 10.20.10.20:443</text><text x="105" y="720" class="m">1  Spoke A subnet RT → TGW</text><text x="105" y="750" class="m">2  TGW-RT-SPOKES → att-Inspection</text><text x="105" y="780" class="m">3  Inspection TGW-subnet RT → GWLBE-a</text><text x="105" y="810" class="m">4  GWLBE → GWLB → NGFW → GWLBE</text><text x="105" y="840" class="m">5  GWLBE-subnet RT → TGW</text><text x="105" y="870" class="m">6  TGW-RT-INSPECTION → att-Spoke-B → EC2-B</text><path d="M340 195 H430" class="f"/><path d="M760 195 H850" class="f"/><path d="M120