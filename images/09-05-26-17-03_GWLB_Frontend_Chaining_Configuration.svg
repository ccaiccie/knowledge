<rect width="1600" height="950" fill="#ffffff"/>
<text x="40" y="55" class="t">GWLB Chaining — The Consumer Frontend Reference Triggers Inspection</text><rect x="280" y="105" width="570" height="560" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" stroke-dasharray="10 8"/><text x="305" y="140" class="lab" fill="#0f172a">Consumer: Standard Public Load Balancer</text><rect x="930" y="105" width="550" height="440" rx="14" fill="#faf5ff" stroke="#a78bfa" stroke-width="2" stroke-dasharray="10 8"/><text x="955" y="140" class="lab" fill="#0f172a">Provider: GWLB + NVA pool</text><rect x="40" y="230" width="190" height="90" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="135.0" y="270.0" text-anchor="middle" class="b">Internet client</text><text x="135.0" y="290.0" text-anchor="middle" class="b">203.0.113.25:49152</text><rect x="340" y="190" width="270" height="120" rx="14" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="475.0" y="235.0" text-anchor="middle" class="b">Frontend IP configuration</text><text x="475.0" y="255.0" text-anchor="middle" class="b">app-frontend</text><text x="475.0" y="275.0" text-anchor="middle" class="b">Public IP 52.160.10.10</text><rect x="340" y="375" width="390" height="105" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="535.0" y="422.5" text-anchor="middle" class="b" font-weight="700">gatewayLoadBalancer reference</text><text x="535.0" y="442.5" text-anchor="middle" class="b" font-weight="700">→ GWLB frontend resource ID</text><rect x="340" y="545" width="270" height="85" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="475.0" y="582.5" text-anchor="middle" class="b">LB rule</text><text x="475.0" y="602.5" text-anchor="middle" class="b">TCP 443 → app-backend-pool</text><rect x="990" y="210" width="210" height="95" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="1095.0" y="252.5" text-anchor="middle" class="b">Gateway Load Balancer</text><text x="1095.0" y="272.5" text-anchor="middle" class="b">gwlb-frontend</text><rect x="1285" y="200" width="145" height="115" rx="14" fill="#ffedd5" stroke="#334155" stroke-width="2"/><text x="1357.5" y="252.5" text-anchor="middle" class="b">NVA backend pool</text><text x="1357.5" y="272.5" text-anchor="middle" class="b">NVA-1   NVA-2</text><rect x="700" y="745" width="220" height="90" rx="14" fill="#ede9fe" stroke="#334155" stroke-width="2"/><text x="810.0" y="785.0" text-anchor="middle" class="b">Application backend</text><text x="810.0" y="805.0" text-anchor="middle" class="b">10.0.1.4:443</text><rect x="1040" y="635" width="330" height="95" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1205.0" y="677.5" text-anchor="middle" class="b" font-weight="700">The yellow reference is the chain.</text><text x="1205.0" y="697.5" text-anchor="middle" class="b" font-weight="700">No UDR points to GWLB.</text><path d="M 230,275 L 260,275 L 260,250 L 320,250 L 340,250" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><text x="80" y="215" class="lab" fill="#0f172a">1 Public frontend</text><path d="M 610,250 L 640,250 L 760,250 L 760,145 L 900,145 L 900,258 L 970,258 L 990,258" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><text x="665" y="130" class="lab" fill="#0f172a">2 Frontend reference invokes GWLB</text><path d="M 1200,240 L 1230,240 L 1230,165 L 1260,165 L 1260,235 L 1285,235" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#ap)"/><text x="1195" y="155" class="lab" fill="#7c3aed">3 VXLAN to NVA</text><path d="M 1285,290 L 1260,290 L 1260,365 L 1230,365 L 1230,280 L 1200,280" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#ag)"/><text x="1190" y="390" class="lab" fill="#16a34a">4 Inspected return</text><path d="M 990,285 L 970,285 L 900,285 L 900,690 L 650,690 L 650,588 L 630,588 L 610,588" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><text x="660" y="675" class="lab" fill="#0f172a">5 Return to consumer LB</text><path d="M 475,630 L 475,660 L 475,790 L 680,790 L 700,790" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><text x="480" y="775" class="lab" fill="#0f172a">6 Normal LB rule selects backend</text></svg>