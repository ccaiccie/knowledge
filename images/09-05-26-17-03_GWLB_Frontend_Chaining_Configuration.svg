<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a} .t{font-size:26px;font-weight:700} .h{font-size:17px;font-weight:700} .b{font-size:14px} .s{font-size:12px} .lab{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}</style>
