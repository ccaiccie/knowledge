<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#0078d4"/></marker><style>text{font-family:Segoe UI,Arial}.t{font-size:28px;font-weight:700;fill:#16324f}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#334155}</style></defs><text x="40" y="48" class="t">East-West Dynamic Service Insertion Between Spokes</text><rect x="70" y="180" width="240" height="110" rx="14" fill="#eef6ff" stroke="#0078d4"/><text x="90" y="215" class="h">Spoke A</text><text x="90" y="243" class="s">10.10.0.0/16</text><rect x="70" y="430" width="240" height="110" rx="14" fill="#eef6ff" stroke="#0078d4"/><text x="90" y="465" class="h">Spoke B</text><text x="90" y="493" class="s">10.20.0.0/16</text><rect x="480" y="170" width="270" height="140" rx="14" fill="#fff4e5" stroke="#f59e0b"/><text x="500" y="205" class="h">Third-party NVA pair</text><text x="500" y="233" class="s">Inspect / state / NAT</text><text x="500" y="258" class="s">Advertise private summary</text><rect x="480" y="430" width="270" height="110" rx="14" fill="#f3e8ff" stroke="#8a3ffc"/><text x="500" y="465" class="h">Azure Route Server</text><text x="500" y="493" class="s">Injects NVA BGP paths</text><rect x="930" y="280" width="220" height="140" rx="14" fill="#ecfdf5" stroke="#10b981"/><text x="950" y="315" class="h">Route decision</text><text x="950" y="343" class="s">Both directions must</text><text x="950" y="368" class="s">select inspection path</text><path d="M310 235 L480 235" stroke="#0078d4" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M480 275 L310 485" stroke="#0078d4" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M310 485 L480 275" stroke="#10b981" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M615 430 L615 310" stroke="#8a3ffc" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/><text x="65" y="605" class="s">Cross-VNet inspection is a strong ARS use case. Same-VNet inter-subnet forcing still needs UDR/service design.</text></svg>