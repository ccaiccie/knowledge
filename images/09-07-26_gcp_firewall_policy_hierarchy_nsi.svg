<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="1800" height="1100" fill="white"/><text x="900" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">GCP Firewall Policy Hierarchy, goto_next, and NSI Invocation</text><rect x="80" y="120" width="300" height="100" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="230" y="155" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Organization</text><text x="230" y="185" text-anchor="middle" font-family="Arial" font-size="16">Hierarchical firewall policy association</text><rect x="80" y="270" width="300" height="100" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="230" y="305" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Top-level Folder</text><text x="230" y="335" text-anchor="middle" font-family="Arial" font-size="16">Optional hierarchical policy</text><rect x="80" y="420" width="300" height="100" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="230" y="455" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Child Folder</text><text x="230" y="485" text-anchor="middle" font-family="Arial" font-size="16">Optional hierarchical policy</text><rect x="80" y="570" width="300" height="115" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text x="230" y="605" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Project</text><text x="230" y="635" text-anchor="middle" font-family="Arial" font-size="16">Contains the VPC</text><text x="230" y="660" text-anchor="middle" font-family="Arial" font-size="15">No hierarchical policy attaches directly here</text><rect x="80" y="735" width="300" height="145" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="230" y="770" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">VPC network</text><text x="230" y="800" text-anchor="middle" font-family="Arial" font-size="15">Global network firewall policy association</text><text x="230" y="825" text-anchor="middle" font-family="Arial" font-size="15">Regional policy association(s)</text><text x="230" y="850" text-anchor="middle" font-family="Arial" font-size="15">Classic VPC firewall rules</text><path d="M230 220 V270" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M230 370 V420" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M230 520 V570" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M230 685 V735" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="500" y="120" width="520" height="300" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="760" y="155" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">NEW CONNECTION — EVALUATION ORDER</text><text x="530" y="195" font-family="Arial" font-size="17">1. Organization hierarchical policy</text><text x="530" y="230" font-family="Arial" font-size="17">2. Folder policies, top-down</text><text x="530" y="265" font-family="Arial" font-size="17">3. Regional system firewall policy</text><text x="530" y="300" font-family="Arial" font-size="17">4/5. Network policies vs classic rules</text><text x="560" y="330" font-family="Arial" font-size="15">BEFORE_CLASSIC_FIREWALL or AFTER_CLASSIC_FIREWALL</text><text x="530" y="365" font-family="Arial" font-size="17">6. Implied action</text><rect x="500" y="470" width="520" height="260" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="760" y="505" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">MATCH ACTION</text><text x="530" y="550" font-family="Arial" font-size="17">ALLOW = final permit, stop</text><text x="530" y="585" font-family="Arial" font-size="17">DENY = final drop, stop</text><text x="530" y="620" font-family="Arial" font-size="17">APPLY_SECURITY_PROFILE_GROUP = send to inspection</text><text x="530" y="655" font-family="Arial" font-size="17">GOTO_NEXT = leave this policy; continue downward</text><path d="M760 420 V470" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="1130" y="180" width="500" height="165" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1380" y="215" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Security Profile Group</text><text x="1380" y="255" text-anchor="middle" font-family="Arial" font-size="16">Hierarchical rule → organization-level SPG only</text><text x="1380" y="290" text-anchor="middle" font-family="Arial" font-size="16">Global network policy → organization- or project-level SPG</text><rect x="1200" y="430" width="360" height="110" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1380" y="470" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">NSI / intercept endpoint group</text><text x="1380" y="505" text-anchor="middle" font-family="Arial" font-size="16">transparent packet interception</text><rect x="1200" y="625" width="360" height="120" rx="14" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="1380" y="665" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">VM-Series / inspection service</text><text x="1380" y="700" text-anchor="middle" font-family="Arial" font-size="16">stateful firewall verdict: ALLOW or DROP</text><path d="M1020 600 H1080 V260 H1130" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="1080" y="425" font-family="Arial" font-size="14" transform="rotate(-90 1080 425)">APPLY_SECURITY_PROFILE_GROUP</text><path d="M1380 345 V430" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1380 540 V625" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="470" y="820" width="1110" height="130" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="1025" y="860" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Key mental model</text><text x="1025" y="895" text-anchor="middle" font-family="Arial" font-size="17">Hierarchy = who gets first say. Priority = which rule inside that policy gets first say.</text><text x="1025" y="925" text-anchor="middle" font-family="Arial" font-size="17">goto_next = ask the next stage. apply_security_profile_group = inspection owns the decision.</text></svg>