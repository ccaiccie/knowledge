 x="810" y="165" class="h">TGW-RT-HYBRID</text><text x="810" y="198" class="m">10.10.0.0/16 → att-Inspection</text><text x="810" y="228" class="m">10.20.0.0/16 → att-Inspection</text><text x="810" y="258" class="s">Associated with DXGW/VPN attachments</text><rect x="1240" y="110" width="460" height="190" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="1260" y="145" class="h">Inspection VPC AZ-a</text><text x="1260" y="175" class="s">TGW subnet 10.255.200.0/28</text><text x="1260" y="205" class="m">RT-Insp-TGW-a: 10.10.0.0/16 → vpce-gwlb-a</text><text x="1260" y="235" class="s">GWLBE → GWLB → NGFW → GWLBE</text><text x="1260" y="265" class="m">RT-GWLBE-a: 10.10.0.0/16 → tgw-1</text><rect x="1240" y="400" width="460" height="160" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1260" y="435" class="h">TGW-RT-INSPECTION</text><text x="1260" y="468" class="m">10.10.0.0/16 → att-Spoke-A</text><text x="1260" y="498" class="m">10.20.0.0/16 → att-Spoke-B</text><text x="1260" y="528" class="m">172.16.0.0/16 → DXGW preferred / VPN backup</text><rect x="790" y="430" width="360" height="145" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="810" y="465" class="h">Spoke A VPC 10.10.0.0/16</text><text x="810" y="495" class="s">TGW attachment → local app subnet</text><text x="810" y="525" class="s">EC2-A 10.10.10.10</text><text x="810" y="555" class="m">RT-A-App: 172.16.0.0/16 → tgw-1</text><rect x="100" y="660" width="1600" height="220" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text x="125" y="695" class="h">Return flow</text><text x="125" y="735" class="s">EC2-A → TGW → route 172.16.0.0/16 to att-Inspection → Inspection TGW subnet</text><text x="125" y="765" class="s">→ GWLBE/GWLB/NGFW → GWLBE → TGW → TGW-RT-INSPECTION chooses DXGW or VPN</text><text x="125" y="795" class="s">→ on-prem. Direct Connect and VPN remain transport attachments; neither bypasses centralized inspection.</text><path d="M320 190 H390" 