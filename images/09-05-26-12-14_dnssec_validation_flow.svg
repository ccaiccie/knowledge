<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#445"/></marker></defs>
<rect width="1200" height="700" fill="white" fill-opacity="0"/>
<g font-family="Arial">
<text x="600" y="45" text-anchor="middle" font-size="28" font-weight="700">DNSSEC Recursive Validation Flow</text>
<rect x="40" y="105" rx="18" width="210" height="105" fill="#eef3ff" stroke="#345" stroke-width="2"/>
<text x="145" y="145" text-anchor="middle" font-size="20" font-weight="700">Client / Stub</text><text x="145" y="178" text-anchor="middle" font-size="15">www.example.com A?</text>
<rect x="360" y="90" rx="18" width="260" height="135" fill="#eaf8ea" stroke="#365" stroke-width="2"/>
<text x="490" y="133" text-anchor="middle" font-size="20" font-weight="700">Validating Resolver</text><text x="490" y="165" text-anchor="middle" font-size="15">Recursion + cryptographic</text><text x="490" y="188" text-anchor="middle" font-size="15">DNSSEC checks</text>
<rect x="760" y="80" rx="18" width="190" height="100" fill="#fff4dc" stroke="#765" stroke-width="2"/>
<text x="855" y="120" text-anchor="middle" font-size="20" font-weight="700">Root</text><text x="855" y="150" text-anchor="middle" font-size="15">DNSKEY / DS path</text>
<rect x="760" y="275" rx="18" width="190" height="100" fill="#f4f0ff" stroke="#546" stroke-width="2"/>
<text x="855" y="315" text-anchor="middle" font-size="20" font-weight="700">.com Parent</text><text x="855" y="345" text-anchor="middle" font-size="15">DS example.com</text>
<rect x="760" y="470" rx="18" width="250" height="120" fill="#f9e9f0" stroke="#635" stroke-width="2"/>
<text x="885" y="510" text-anchor="middle" font-size="20" font-weight="700">example.com Authoritative</text><text x="885" y="542" text-anchor="middle" font-size="15">DNSKEY + A + RRSIG</text><text x="885" y="565" text-anchor="middle" font-size="15">NSEC/NSEC3 if negative</text>
<line x1="250" y1="157" x2="350" y2="157" stroke="#445" stroke-width="3" marker-end="url(#b)"/>
<text x="300" y="139" text-anchor="middle" font-size="13">query</text>
<line x1="620" y1="130" x2="750" y2="130" stroke="#445" stroke-width="3" marker-end="url(#b)"/>
<line x1="750" y1="325" x2="620" y2="185" stroke="#445" stroke-width="3" marker-end="url(#b)"/>
<line x1="620" y1="185" x2="750" y2="325" stroke="#445" stroke-width="3" marker-end="url(#b)"/>
<line x1="620" y1="205" x2="750" y2="520" stroke="#445" stroke-width="3" marker-end="url(#b)"/>
<line x1="760" y1="550" x2="620" y2="215" stroke="#445" stroke-width="3" marker-end="url(#b)"/>
<text x="686" y="108" text-anchor="middle" font-size="13">trust/delegation</text>
<text x="684" y="300" text-anchor="middle" font-size="13">DS</text>
<text x="673" y="445" text-anchor="middle" font-size="13">signed data</text>
<rect x="350" y="400" rx="18" width="280" height="160" fill="#eef8ff" stroke="#357" stroke-width="2"/>
<text x="490" y="438" text-anchor="middle" font-size="20" font-weight="700">Validation Result</text>
<text x="490" y="475" text-anchor="middle" font-size="16">Secure → return answer</text>
<text x="490" y="502" text-anchor="middle" font-size="16">Insecure → unsigned but proven</text>
<text x="490" y="529" text-anchor="middle" font-size="16">Bogus → reject / SERVFAIL</text>
<line x1="490" y1="225" x2="490" y2="390" stroke="#445" stroke-width="3" marker-end="url(#b)"/>
<line x1="350" y1="480" x2="250" y2="190" stroke="#445" stroke-width="3" marker-end="url(#b)"/>
<text x="235" y="365" text-anchor="middle" font-size="13" transform="rotate(-72 235 365)">validated response</text>
</g></svg>