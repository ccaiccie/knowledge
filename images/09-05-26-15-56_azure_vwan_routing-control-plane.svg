<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><rect width="100%" height="100%" fill="white" fill-opacity="0"/><text x="30" y="45" font-family="Arial" font-size="28" font-weight="700">Routing Intent and route programming — control plane view</text><rect x="50" y="130" rx="18" width="260" height="100" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="180" y="164" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Spoke Prefix</text><text x="180" y="194" text-anchor="middle" font-family="Arial" font-size="14">10.10.0.0/16</text><rect x="50" y="520" rx="18" width="260" height="100" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="180" y="554" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Branch Prefix</text><text x="180" y="584" text-anchor="middle" font-family="Arial" font-size="14">10.50.0.0/16 via BGP</text><rect x="430" y="240" rx="18" width="330" height="240" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="595" y="274" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Virtual Hub Router</text><text x="595" y="304" text-anchor="middle" font-family="Arial" font-size="14">Builds effective routes</text><text x="595" y="324" text-anchor="middle" font-family="Arial" font-size="14">Associations + propagations</text><text x="595" y="344" text-anchor="middle" font-family="Arial" font-size="14">Routing Intent overrides steering</text><rect x="900" y="120" rx="18" width="330" height="110" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="1065" y="154" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Spoke Effective Routes</text><text x="1065" y="184" text-anchor="middle" font-family="Arial" font-size="14">Private prefixes via vHub</text><text x="1065" y="204" text-anchor="middle" font-family="Arial" font-size="14">0/0 via hub when internet security enabled</text><rect x="900" y="500" rx="18" width="330" height="110" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/><text x="1065" y="534" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Firewall/NVA Next Hop</text><text x="1065" y="564" text-anchor="middle" font-family="Arial" font-size="14">Private and/or Internet policy target</text><line x1="310" y1="180" x2="430" y2="300" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><text x="370" y="240" text-anchor="middle" font-family="Arial" font-size="13">propagate</text><line x1="310" y1="570" x2="430" y2="420" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><text x="370" y="495" text-anchor="middle" font-family="Arial" font-size="13">BGP learned</text><line x1="760" y1="300" x2="900" y2="175" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><text x="830" y="238" text-anchor="middle" font-family="Arial" font-size="13">program spoke</text><line x1="760" y1="420" x2="900" y2="555" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/><text x="830" y="488" text-anchor="middle" font-family="Arial" font-size="13">policy next hop</text><line x1="1065" y1="500" x2="1065" y2="230" stroke="#111827" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="1065" y="365" text-anchor="middle" font-family="Arial" font-size="13">traffic steering</text></svg>