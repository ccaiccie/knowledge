<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280"><defs><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px}.m{font-size:13px;font-family:monospace}.box{fill:#fff;stroke:#64748b;stroke-width:2}.sec{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.rt{fill:#f8fafc;stroke:#475569;stroke-width:1.5}.f{fill:none;stroke:#d97706;stroke-width:4;marker-end:url(#o)}.r{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#b)}</style></defs><text x="35" y="42" class="t">North-South / South-North — Distributed GWLBE for Internet Ingress and Egress</text>
<rect x="25" y="80" width="860" height="1110" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="45" y="115" class="h">Internet ingress (North → South) — public ALB/NLB or public-IP workload</text><rect x="60" y="150" width="180" height="80" rx="8" class="box"/><text x="85" y="182" class="h">Internet</text><text x="85" y="208" class="s">Client 198.51.100.25</text><rect x="300" y="150" width="220" height="80" rx="8" class="box"/><text x="320" y="182" class="h">IGW igw-A</text><text x="320" y="208" class="s">Edge-associated RT-IGW-A</text><rect x="585" y="150" width="245" height="80" rx="8" class="sec"/><text x="605" y="182" class="h">GWLBE-A-a</text><text x="605" y="208" class="s">Subnet 10.10.100.0/28</text><rect x="585" y="285" width="245" height="90" rx="8" class="box"/><text x="605" y="317" class="h">Public ALB/NLB</text><text x="605" y="344" class="s">Public subnet 10.10.30.0/24</text><text x="605" y="366" class="s">Backend example 10.10.10.10</text><rect x="60" y="420" width="770" height="285" rx="8" class="rt"/><text x="80" y="452" class="h">Ingress route tables</text><text x="80" y="482" class="m">RT-IGW-A (edge association)</text><text x="80" y="507" class="m">10.10.30.0/24 → vpce-gwlb-A-a     # steer public-subnet destination to inspection</text><text x="80" y="542" class="m">RT-A-GWLBE-a</text><text x="80" y="567" class="m">10.10.0.0/16  → local               # after inspection, VPC router reaches ALB/NLB</text><text x="80" y="602" class="m">RT-A-Public-a (ALB/NLB subnet)</text><text x="80" y="627" class="m">0.0.0.0/0     → vpce-gwlb-A-a     # return path is re-inspected</text><text x="80" y="662" class="m">RT-A-GWLBE-a return</text><text x="80" y="687" class="m">0.0.0.0/0     → igw-A              # allowed return exits Internet Gateway</text><rect x="60" y="760" width="770" height="330" rx="8" class="rt"/><text x="80" y="792" class="h">Ingress packet transformation</text><text x="80" y="825" class="s">Before inspection: 198.51.100.25:53000 → public-service-address:443</text><text x="80" y="855" class="s">GWLBE is transparent; GWLB carries original IP packet to central firewall fleet.</text><text x="80" y="885" class="s">GENEVE exists only GWLB ↔ NGFW. The firewall sees the original client/server tuple.</text><text x="80" y="915" class="s">If the destination is ALB, ALB later terminates TCP/TLS and creates a new backend connection.</text><text x="80" y="945" class="s">If destination is NLB with client-IP preservation, backend behavior follows NLB target settings.</text><text x="80" y="985" class="s">Critical symmetry rule: public-facing subnet return default must point back to GWLBE.</text><text x="80" y="1015" class="s">Otherwise replies can exit directly to IGW and bypass stateful inspection.</text>
<rect x="930" y="80" width="945" height="1110" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="950" y="115" class="h">Internet egress (South → North) — private workload through GWLBE + NAT Gateway</text><rect x="970" y="150" width="220" height="80" rx="8" class="box"/><text x="990" y="182" class="h">EC2-A</text><text x="990" y="208" class="s">10.10.10.10 private workload</text><rect x="1250" y="150" width="220" height="80" rx="8" class="sec"/><text x="1270" y="182" class="h">GWLBE-A-a</text><text x="1270" y="208" class="s">10.10.100.0/28</text><rect x="1530" y="150" width="220" height="80" rx="8" class="box"/><text x="1550" y="182" class="h">NAT Gateway nat-a</text><text x="1550" y="208" class="s">Public subnet 10.10.40.0/24</text><rect x="1530" y="285" width="220" height="80" rx="8" class="box"/><text x="1550" y="317" class="h">IGW → Internet</text><text x="1550" y="344" class="s">SNAT EIP 203.0.113.10</text><rect x="970" y="420" width="780" height="330" rx="8" class="rt"/><text x="990" y="452" class="h">Egress route tables</text><text x="990" y="482" class="m">RT-A-App-a (10.10.10.0/24)</text><text x="990" y="507" class="m">0.0.0.0/0     → vpce-gwlb-A-a</text><text x="990" y="542" class="m">RT-A-GWLBE-a (10.10.100.0/28)</text><text x="990" y="567" class="m">0.0.0.0/0     → nat-a</text><text x="990" y="602" class="m">RT-A-NAT-a (10.10.40.0/24)</text><text x="990" y="627" class="m">0.0.0.0/0     → igw-A</text><text x="990" y="652" class="m">10.10.10.0/24 → vpce-gwlb-A-a     # force return from NAT toward workload through inspection</text><text x="990" y="687" class="m">RT-A-GWLBE-a return</text><text x="990" y="712" class="m">10.10.10.0/24 → local</text><rect x="970" y="805" width="780" height="285" rx="8" class="rt"/><text x="990" y="837" class="h">Egress packet transformation</text><text x="990" y="870" class="s">1. Workload emits 10.10.10.10:49152 → 1.1.1.1:443.</text><text x="990" y="900" class="s">2. NGFW inspects the private source before NAT.</text><text x="990" y="930" class="s">3. NAT Gateway SNAT: 10.10.10.10:49152 → 203.0.113.10:mapped-port.</text><text x="990" y="960" class="s">4. Internet return arrives to NAT Gateway, which reverses NAT to 10.10.10.10.</text><text x="990" y="990" class="s">5. NAT-subnet route for 10.10.10.0/24 points to GWLBE, preserving firewall symmetry.</text><text x="990" y="1020" class="s">6. Endpoint local route delivers allowed packet to EC2-A.</text>
<rect x="760" y="1120" width="400" height="95" rx="10" class="sec"/><text x="785" y="1152" class="h">Central Security VPC</text><text x="785" y="1178" class="s">All GWLBE paths → PrivateLink → GWLB → GENEVE/6081 → NGFW fleet</text><text x="785" y="1202" class="s">The firewall fleet is shared; the ingress/egress insertion points are per-VPC.</text>
<path d="M240 190 H300" class="f"/><path d="M520 190 H585" class="f"/><path d="M707 230 V285" class="f"/><path d="M830 190 H900 Q930 190 930 1167 H760" class="f"/><path d="M1190 190 H1250" class="f"/><path d="M1470 190 H1530" class="f"/><path d="M1640 230 V285" class="f"/><path d="M1530 325 H1500 Q1475 325 1475 190 H1470" class="r"/><path d="M1250 205 H1220 Q1190 205 1190 190" class="r"/></svg>