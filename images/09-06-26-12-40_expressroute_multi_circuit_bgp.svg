<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0078D4"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#107C10"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="750" y="38" text-anchor="middle" font-family="Segoe UI,Arial" font-size="26" font-weight="700" fill="#17324D">Two locations, two ExpressRoute circuits: ECMP and failover</text><g font-family="Segoe UI,Arial" font-size="15" fill="#17324D"><rect x="40" y="120" width="290" height="150" rx="16" fill="#F1F8EE" stroke="#107C10" stroke-width="3"/><text x="65" y="165" font-weight="700">Site A / Los Angeles</text><text x="65" y="195">10.10.0.0/16 • ASN 65010</text><rect x="40" y="440" width="290" height="150" rx="16" fill="#F1F8EE" stroke="#107C10" stroke-width="3"/><text x="65" y="485" font-weight="700">Site B / Dallas</text><text x="65" y="515">10.20.0.0/16 • ASN 65010</text><rect x="420" y="120" width="300" height="150" rx="16" fill="#FFF5EE" stroke="#D83B01" stroke-width="3"/><text x="445" y="165" font-weight="700">ExpressRoute Circuit 1</text><text x="445" y="195">Peering location A</text><rect x="420" y="440" width="300" height="150" rx="16" fill="#FFF5EE" stroke="#D83B01" stroke-width="3"/><text x="445" y="485" font-weight="700">ExpressRoute Circuit 2</text><text x="445" y="515">Peering location B</text><rect x="820" y="250" width="300" height="170" rx="16" fill="#EAF4FB" stroke="#0078D4" stroke-width="3"/><text x="845" y="300" font-weight="700">Azure ER gateway / routing</text><text x="845" y="330">Learns both BGP paths</text><text x="845" y="360">Equal paths → ECMP</text><text x="845" y="390">Prepend → primary / backup</text><rect x="1190" y="250" width="260" height="170" rx="16" fill="#EAF4FB" stroke="#0078D4" stroke-width="3"/><text x="1215" y="300" font-weight="700">Azure VNet</text><text x="1215" y="330">10.50.0.0/16</text></g><g fill="none" stroke-width="5"><path d="M330 195H420" stroke="#107C10" marker-end="url(#g)"/><path d="M330 515H420" stroke="#107C10" marker-end="url(#g)"/><path d="M720 195H770V295H820" stroke="#0078D4" marker-end="url(#a)"/><path d="M720 515H770V375H820" stroke="#0078D4" marker-end="url(#a)"/><path d="M1120 335H1190" stroke="#0078D4" marker-end="url(#a)"/></g><g font-family="Segoe UI,Arial" font-size="13" font-weight="600" fill="#17324D"><text x="350" y="185">Advertise local prefix</text><text x="735" y="180">BGP path 1</text><text x="735" y="505">BGP path 2</text><text x="1125" y="325">Selected/ECMP</text></g><rect x="260" y="650" width="980" height="65" rx="12" fill="#FFFBEA" stroke="#E6C84F"/><text x="750" y="677" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#17324D">Azure → on-prem: AS-path / connection preference. On-prem → Azure: LOCAL_PREF. Align both directions when stateful firewalls exist.</text><text x="750" y="700" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#17324D">If Circuit 1 is withdrawn, Circuit 2 becomes the surviving path; size each circuit for the required failover load.</text></svg>