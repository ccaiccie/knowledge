<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340">
<style>text{font-family:Arial,sans-serif;fill:#111}.f{fill:#fff;stroke:#111;stroke-width:2}</style>
<text x="700" y="42" text-anchor="middle" font-size="26" font-weight="bold">Simplified MACsec Ethernet frame</text>
<rect class="f" x="60" y="120" width="180" height="90"/><text x="150" y="172" text-anchor="middle" font-size="21">Dst MAC</text>
<rect class="f" x="240" y="120" width="180" height="90"/><text x="330" y="172" text-anchor="middle" font-size="21">Src MAC</text>
<rect class="f" x="420" y="120" width="190" height="90"/><text x="515" y="172" text-anchor="middle" font-size="21">SecTAG</text>
<rect class="f" x="610" y="120" width="420" height="90"/><text x="820" y="172" text-anchor="middle" font-size="21">Encrypted / protected payload</text>
<rect class="f" x="1030" y="120" width="170" height="90"/><text x="1115" y="172" text-anchor="middle" font-size="21">ICV</text>
<rect class="f" x="1200" y="120" width="130" height="90"/><text x="1265" y="172" text-anchor="middle" font-size="21">FCS</text>
<text x="700" y="270" text-anchor="middle" font-size="18">MAC addresses remain visible for Ethernet forwarding. SecTAG carries MACsec metadata; ICV provides integrity/authenticity.</text>
</svg>