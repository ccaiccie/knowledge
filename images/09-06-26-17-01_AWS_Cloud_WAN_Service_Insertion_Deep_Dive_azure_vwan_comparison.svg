<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900"><defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="40" y="48" font-family="Arial" font-size="27" font-weight="700" fill="#232f3e">AWS Cloud WAN vs Azure Virtual WAN (vWAN) — Conceptual Mapping</text><text x="40" y="78" font-family="Arial" font-size="15" fill="#5b6167">Analogy, not a one-to-one implementation mapping. Both provide managed WAN transit plus policy-driven security steering.</text><rect x="50" y="125" width="715" height="700" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="65" y="153" font-family="Arial" font-size="17" font-weight="700">AWS Cloud WAN</text><text x="65" y="177" font-family="Arial" font-size="13.5">Managed global WAN fabric</text><text x="65" y="197" font-family="Arial" font-size="13.5">CNE (Core Network Edge) = managed regional routing edge</text><text x="65" y="217" font-family="Arial" font-size="13.5">Segment = logical routing domain</text><text x="65" y="237" font-family="Arial" font-size="13.5">NFG (Network Function Group) = service-insertion target</text><text x="65" y="257" font-family="Arial" font-size="13.5">send-via = attachment-to-attachment inspection</text><text x="65" y="277" font-family="Arial" font-size="13.5">send-to = traffic leaves Cloud WAN after inspection</text><text x="65" y="297" font-family="Arial" font-size="13.5">Inspection commonly lives in separate Inspection VPC</text><text x="65" y="317" font-family="Arial" font-size="13.5">AWS Network Firewall or GWLBE/GWLB + NGFW</text><rect x="930" y="125" width="715" height="700" rx="14" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/><text x="945" y="153" font-family="Arial" font-size="17" font-weight="700">Azure Virtual WAN (vWAN)</text><text x="945" y="177" font-family="Arial" font-size="13.5">Managed WAN fabric with regional virtual hubs</text><text x="945" y="197" font-family="Arial" font-size="13.5">Virtual hub router = managed routing function</text><text x="945" y="217" font-family="Arial" font-size="13.5">Hub route tables = routing/propagation domains</text><text x="945" y="237" font-family="Arial" font-size="13.5">Routing Intent = declarative security steering</text><text x="945" y="257" font-family="Arial" font-size="13.5">Private Traffic policy = private/branch inspection</text><text x="945" y="277" font-family="Arial" font-size="13.5">Internet Traffic policy = Internet-bound inspection</text><text x="945" y="297" font-family="Arial" font-size="13.5">Azure Firewall / supported NGFW integrated with hub</text><text x="945" y="317" font-family="Arial" font-size="13.5">ExpressRoute / VPN / VNet connections attach to hub</text><path d="M 765,250 L 930,250" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/><text x="785" y="230" font-family="Arial" font-size="13" font-weight="700" fill="#7c3aed">CNE ~ virtual hub router</text><path d="M 765,380 L 930,380" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/><text x="770" y="360" font-family="Arial" font-size="13" font-weight="700" fill="#7c3aed">NFG/send-via ~ Routing Intent private policy</text><path d="M 765,510 L 930,510" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/><text x="790" y="490" font-family="Arial" font-size="13" font-weight="700" fill="#7c3aed">send-to ~ Internet Traffic routing policy</text><path d="M 765,650 L 930,650" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/><text x="810" y="630" font-family="Arial" font-size="13" font-weight="700" fill="#7c3aed">DX/VPN ~ ExpressRoute/VPN</text></svg>