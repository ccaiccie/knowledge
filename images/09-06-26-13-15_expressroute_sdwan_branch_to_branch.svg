<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="900" viewBox="0 0 1650 900">
<defs>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0078D4"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#107C10"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6B4EFF"/></marker>
</defs><rect width="100%" height="100%" fill="white"/>
<text x="825.0" y="40" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#17324D">ExpressRoute + Azure Route Server + SD-WAN — branch-to-branch route exchange</text>
<text x="825.0" y="70" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5B6573">Route Server exchanges BGP routes; it does not forward the data packets</text>
<rect x="35" y="110" width="360" height="650" rx="20" fill="#F7F9FC" stroke="#C8D6E5" stroke-width="2"/>
<rect x="430" y="110" width="760" height="650" rx="20" fill="#EEF6FC" stroke="#C8D6E5" stroke-width="2"/>
<rect x="1225" y="110" width="390" height="650" rx="20" fill="#F8F4FF" stroke="#C8D6E5" stroke-width="2"/>
<text x="55" y="140" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#5B6573">ExpressRoute branch</text>
<text x="450" y="140" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#5B6573">Azure customer-managed hub VNet</text>
<text x="1245" y="140" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#5B6573">SD-WAN branch</text>
<rect x="85" y="210" width="250" height="105" rx="16" fill="#F1F8EE" stroke="#107C10" stroke-width="2.5"/><text x="210.0" y="246" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#17324D">Branch A</text><text x="210.0" y="271" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#5B6573">10.10.0.0/16</text>
<rect x="470" y="210" width="260" height="105" rx="16" fill="#DCEEFF" stroke="#0078D4" stroke-width="2.5"/><text x="600.0" y="246" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#17324D">ExpressRoute Gateway</text><text x="600.0" y="271" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#5B6573">GatewaySubnet</text>
<rect x="760" y="360" width="300" height="120" rx="16" fill="#F4F1FF" stroke="#6B4EFF" stroke-width="2.5"/><text x="910.0" y="396" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#17324D">Azure Route Server</text><text x="910.0" y="421" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#5B6573">ASN 65515 • control plane only</text>
<rect x="890" y="590" width="250" height="105" rx="16" fill="#FFF5EE" stroke="#D83B01" stroke-width="2.5"/><text x="1015.0" y="626" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#17324D">SD-WAN NVA</text><text x="1015.0" y="651" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#5B6573">Fortinet / Palo Alto / Cisco</text>
<rect x="1270" y="590" width="290" height="105" rx="16" fill="#F4F1FF" stroke="#6B4EFF" stroke-width="2.5"/><text x="1415.0" y="626" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#17324D">Branch B</text><text x="1415.0" y="651" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#5B6573">10.20.0.0/16</text>
<polyline points="335,262 405,262 405,262 470,262" fill="none" stroke="#107C10" stroke-width="4" marker-end="url(#ag)"/><text x="405" y="248" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#107C10">ExpressRoute</text>
<polyline points="730,262 810,262 810,360" fill="none" stroke="#6B4EFF" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ap)"/><text x="790" y="245" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#6B4EFF">Route exchange</text>
<polyline points="910,480 910,545 1015,545 1015,590" fill="none" stroke="#6B4EFF" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ap)"/><text x="1000" y="525" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#6B4EFF">eBGP</text>
<polyline points="1140,642 1270,642" fill="none" stroke="#0078D4" stroke-width="4" marker-end="url(#ab)"/><text x="1205" y="626" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#0078D4">SD-WAN overlay</text>
<polyline points="335,290 440,290 440,335 620,335 620,645 890,645" fill="none" stroke="#0078D4" stroke-width="5" marker-end="url(#ab)"/><text x="620" y="625" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#0078D4">DATA PLANE: Branch A -&gt; ER GW -&gt; NVA</text>
<polyline points="1270,675 1160,675 1160,720 650,720 650,350 470,350 470,300" fill="none" stroke="#107C10" stroke-width="4" marker-end="url(#ag)"/><text x="835" y="742" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#107C10">RETURN DATA PLANE</text>
<rect x="530" y="520" width="300" height="115" rx="12" fill="#FFFBEA" stroke="#E6C84F"/><text x="680" y="548" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#17324D">Branch-to-branch enabled</text><text x="680" y="574" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#17324D">10.10/16 -&gt; advertised to NVA</text><text x="680" y="597" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#17324D">10.20/16 -&gt; advertised to ER gateway</text><text x="680" y="620" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#D83B01">ARS is NOT a next hop for packets</text>
<rect x="75" y="795" width="1500" height="70" rx="12" fill="#FBFCFE" stroke="#C8D6E5"/><text x="825" y="823" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#17324D">Control plane = dashed purple.  Forward data = blue.  Return data = green.</text><text x="825" y="848" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5B6573">For two separate ExpressRoute circuits, use Global Reach rather than Route Server as circuit-to-circuit transit.</text>
</svg>