<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs><style>.box{fill:#fff;stroke:#222;stroke-width:2}.t{font:16px Arial,sans-serif;fill:#111}.h{font:bold 24px Arial,sans-serif;fill:#111}.b{font:bold 16px Arial,sans-serif}.f{fill:none;stroke:#111;stroke-width:3;marker-end:url(#a)}.d{fill:none;stroke:#555;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#a)}</style><text x="800" y="55" text-anchor="middle" class="h">Method 2 — Highly available NVA pair behind one Internal Standard Load Balancer</text><rect x="80" y="300" width="350" height="160" rx="14" class="box"/><text x="255" y="332" text-anchor="middle" class="b">Spoke workload subnet 10.1.1.0/24</text><text x="255" y="382" text-anchor="middle" class="t">UDR 0.0.0.0/0 →</text><text x="255" y="414" text-anchor="middle" class="t">VirtualAppliance 10.0.1.10</text><rect x="600" y="280" width="400" height="190" rx="14" class="box"/><text x="800" y="315" text-anchor="middle" class="b">Internal Standard Load Balancer</text><text x="800" y="348" text-anchor="middle" class="t">HA Ports VIP: 10.0.1.10</text><text x="800" y="380" text-anchor="middle" class="t">Protocol All / frontend+backend ports 0</text><text x="800" y="412" text-anchor="middle" class="t">Health probe selects healthy backends</text><rect x="1160" y="180" width="260" height="120" rx="14" class="box"/><text x="1290" y="215" text-anchor="middle" class="b">NVA-1</text><text x="1290" y="247" text-anchor="middle" class="t">10.0.1.4 — backend pool</text><rect x="1160" y="500" width="260" height="120" rx="14" class="box"/><text x="1290" y="535" text-anchor="middle" class="b">NVA-2</text><text x="1290" y="567" text-anchor="middle" class="t">10.0.1.5 — backend pool</text><rect x="1170" y="350" width="250" height="80" rx="14" class="box"/><text x="1295" y="397" text-anchor="middle" class="t">Internet / remote destination</text><rect x="510" y="650" width="580" height="95" rx="14" class="box"/><text x="800" y="682" text-anchor="middle" class="t">Flow symmetry requires a supported single-ILB / single-backend-pool</text><text x="800" y="712" text-anchor="middle" class="t">HA-Ports topology. Two independent LBs do not coordinate selection.</text><path d="M430 375 H600" class="f"/><text x="465" y="355" class="t">1 UDR → ILB VIP</text><path d="M1000 325 H1080 V240 H1160" class="f"/><text x="1030" y="215" class="t">2 per-flow</text><path d="M1000 425 H1080 V560 H1160" class="d"/><text x="1010" y="585" class="t">2 alternate backend</text><path d="M1290 300 V350" class="f"/><path d="M1290 500 V430" class="d"/></svg>