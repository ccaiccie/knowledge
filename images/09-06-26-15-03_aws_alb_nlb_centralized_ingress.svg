<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:22px;font-weight:bold}.n{font-size:16px}.s{font-size:14px}.box{rx:14;ry:14;stroke-width:2}.edge{stroke:#333;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><text x="800" y="28" text-anchor="middle" class="h">Centralized Internet Ingress — Firewall Inspection with ALB / NLB</text><ellipse cx="145" cy="365" rx="85" ry="33" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="145" y="371" text-anchor="middle" class="n">Internet clients</text><rect x="280" y="315" width="235" height="95" class="box" fill="#fff2cc" stroke="#d6b656"/><text x="398" y="345" text-anchor="middle" class="n">Optional CloudFront + AWS WAF</text><text x="398" y="375" text-anchor="middle" class="s">Layer-7 filtering / TLS</text><rect x="560" y="150" width="650" height="520" class="box" fill="#d5e8d4" stroke="#82b366"/><text x="885" y="180" text-anchor="middle" class="n">Centralized Ingress VPC</text><rect x="615" y="230" width="230" height="90" class="box" fill="#dae8fc" stroke="#6c8ebf"/><text x="730" y="260" text-anchor="middle" class="n">Internet Gateway</text><text x="730" y="288" text-anchor="middle" class="s">ingress route table → firewall</text><rect x="900" y="230" width="255" height="90" class="box" fill="#f8cecc" stroke="#b85450"/><text x="1028" y="260" text-anchor="middle" class="n">AWS Network Firewall endpoint</text><text x="1028" y="288" text-anchor="middle" class="s">or GWLBE → GWLB → NGFW</text><rect x="625" y="405" width="230" height="105" class="box" fill="#fff2cc" stroke="#d6b656"/><text x="740" y="435" text-anchor="middle" class="n">Internet-facing ALB</text><text x="740" y="462" text-anchor="middle" class="s">HTTP/HTTPS reverse proxy</text><text x="740" y="486" text-anchor="middle" class="s">L7 routing + TLS termination</text><rect x="895" y="405" width="250" height="105" class="box" fill="#fff2cc" stroke="#d6b656"/><text x="1020" y="435" text-anchor="middle" class="n">Internet-facing NLB</text><text x="1020" y="462" text-anchor="middle" class="s">TCP/UDP/TLS, static IPs/EIPs</text><text x="1020" y="486" text-anchor="middle" class="s">source-IP behavior depends on targets</text><rect x="755" y="560" width="260" height="80" class="box" fill="#e1d5e7" stroke="#9673a6"/><text x="885" y="590" text-anchor="middle" class="n">Transit Gateway / Cloud WAN</text><text x="885" y="617" text-anchor="middle" class="s">private routing to application VPCs</text><rect x="1300" y="220" width="235" height="110" class="box" fill="#d5e8d4" stroke="#82b366"/><text x="1418" y="252" text-anchor="middle" class="n">Application VPC A</text><text x="1418" y="280" text-anchor="middle" class="s">Private NLB / IP targets</text><text x="1418" y="305" text-anchor="middle" class="s">10.10.0.0/16</text><rect x="1300" y="500" width="235" height="110" class="box" fill="#d5e8d4" stroke="#82b366"/><text x="1418" y="532" text-anchor="middle" class="n">Application VPC B</text><text x="1418" y="560" text-anchor="middle" class="s">Private targets</text><text x="1418" y="585" text-anchor="middle" class="s">10.20.0.0/16</text><path d="M230 365 H280" class="edge"/><text x="240" y="350" class="s">1 HTTPS</text><path d="M515 365 H585 V275 H615" class="edge"/><text x="535" y="345" class="s">2</text><path d="M845 275 H900" class="edge"/><text x="858" y="260" class="s">3 ingress route</text><path d="M1028 320 V355 H740 V405" class="edge"/><text x="820" y="348" class="s">4a HTTP(S)</text><path d="M1028 320 V405" class="edge"/><text x="1040" y="370" class="s">4b TCP/UDP/TLS</text><path d="M740 510 V600 H755" class="edge"/><path d="M1020 510 V600 H1015" class="edge"/><text x="780" y="550" class="s">5 private target routing</text><path d="M1015 600 H1240 V275 H1300" class="edge"/><text x="1