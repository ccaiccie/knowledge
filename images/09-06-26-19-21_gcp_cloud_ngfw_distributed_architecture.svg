<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f29900"/></marker><style>text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:700}.boxTitle{font-size:19px;font-weight:700}.boxText{font-size:15px}.label{font-size:15px;font-weight:700}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="48" class="title">GCP Cloud NGFW — distributed enforcement and optional Enterprise inspection</text>
<rect x="60" y="120" width="240" height="125" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="76" y="150" class="boxTitle">Global network firewall policy</text>
<text x="76" y="174" class="boxText">Rules 100/200/300...</text>
<text x="76" y="198" class="boxText">Targets: secure tags / SAs</text>
<text x="76" y="222" class="boxText">Stateful L3/L4 enforcement</text>
<rect x="60" y="310" width="240" height="150" rx="16" fill="#fef7e0" stroke="#f29900" stroke-width="2"/>
<text x="76" y="340" class="boxTitle">Secure tags</text><text x="76" y="364" class="boxText">role=web</text><text x="76" y="388" class="boxText">role=app</text><text x="76" y="412" class="boxText">role=db</text><text x="76" y="436" class="boxText">GCE_FIREWALL purpose</text>
<rect x="380" y="100" width="1020" height="650" rx="16" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="2"/><text x="396" y="130" class="boxTitle">VPC: prod-vpc (global VPC network)</text><text x="396" y="154" class="boxText">Subnets are regional; firewall policy is associated to the VPC</text>
<rect x="430" y="180" width="250" height="170" rx="16" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="446" y="210" class="boxTitle">us-central1 / subnet-web</text><text x="446" y="234" class="boxText">10.10.10.0/24</text><text x="446" y="258" class="boxText">web-1: 10.10.10.10</text><text x="446" y="282" class="boxText">secure tag role=web</text>
<rect x="760" y="180" width="250" height="170" rx="16" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="776" y="210" class="boxTitle">us-central1 / subnet-app</text><text x="776" y="234" class="boxText">10.10.20.0/24</text><text x="776" y="258" class="boxText">app-1: 10.10.20.10</text><text x="776" y="282" class="boxText">secure tag role=app</text>
<rect x="1090" y="180" width="250" height="170" rx="16" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="1106" y="210" class="boxTitle">us-east1 / subnet-db</text><text x="1106" y="234" class="boxText">10.20.30.0/24</text><text x="1106" y="258" class="boxText">db-1: 10.20.30.10</text><text x="1106" y="282" class="boxText">secure tag role=db</text>
<rect x="430" y="500" width="250" height="130" rx="16" fill="#fce8e6" stroke="#d93025" stroke-width="2"/><text x="446" y="530" class="boxTitle">Internet / external peers</text><text x="446" y="554" class="boxText">North-south ingress/egress</text><text x="446" y="578" class="boxText">No central firewall VM hop for L3/L4 rules</text>
<rect x="930" y="500" width="320" height="150" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="946" y="530" class="boxTitle">Optional Cloud NGFW Enterprise</text><text x="946" y="554" class="boxText">Zonal firewall endpoint(s)</text><text x="946" y="578" class="boxText">Only matched apply_security_profile_group traffic</text><text x="946" y="602" class="boxText">Packet Intercept sends flow for L7 inspection</text>
<path d="M 300,180 L 360,180 L 360,240 L 430,240" fill="none" stroke="#f29900" stroke-width="4" marker-end="url(#orangeArrow)"/><rect x="304" y="137" width="248" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="310" y="155" class="label" fill="#f29900">policy applied at workload edge</text>
<path d="M 300,385 L 350,385 L 350,300 L 430,300" fill="none" stroke="#f29900" stroke-width="4" marker-end="url(#orangeArrow)" stroke-dasharray="8 7"/><rect x="299" y="342" width="224" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="305" y="360" class="label" fill="#f29900">tag identity selects targets</text>
<path d="M 680,245 L 760,245" fill="none" stroke="#1a73e8" stroke-width="4" marker-end="url(#blueArrow)"/><rect x="679" y="207" width="168" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="685" y="225" class="label" fill="#1a73e8">1  web → app tcp/8443</text>
<path d="M 760,290 L 680,290" fill="none" stroke="#188038" stroke-width="4" marker-end="url(#greenArrow)"/><rect x="679" y="312" width="144" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="685" y="330" class="label" fill="#188038">2  stateful return</text>
<path d="M 1010,245 L 1090,245" fill="none" stroke="#1a73e8" stroke-width="4" marker-end="url(#blueArrow)"/><rect x="1009" y="207" width="160" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="1015" y="225" class="label" fill="#1a73e8">3  app → db tcp/5432</text>
<path d="M 1090,290 L 1010,290" fill="none" stroke="#188038" stroke-width="4" marker-end="url(#greenArrow)"/><rect x="1009" y="312" width="144" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="1015" y="330" class="label" fill="#188038">4  stateful return</text>
<path d="M 555,500 L 555,410 L 555,350" fill="none" stroke="#1a73e8" stroke-width="4" marker-end="url(#blueArrow)"/><rect x="569" y="422" width="208" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="575" y="440" class="label" fill="#1a73e8">Internet ingress evaluated</text>
<path d="M 600,350 L 600,420 L 600,500" fill="none" stroke="#188038" stroke-width="4" marker-end="url(#greenArrow)"/><rect x="609" y="447" width="120" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="615" y="465" class="label" fill="#188038">egress / return</text>
<path d="M 880,350 L 880,575 L 930,575" fill="none" stroke="#1a73e8" stroke-width="4" marker-end="url(#blueArrow)" stroke-dasharray="8 7"/><rect x="684" y="537" width="360" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="690" y="555" class="label" fill="#1a73e8">only if action = apply_security_profile_group</text>
<text x="40" y="790" class="boxText">Blue = forward/new-connection path. Green = stateful return. Orange/dashed = policy/tag control relationship.</text><text x="40" y="814" class="boxText">L3/L4 Cloud NGFW policy enforcement is distributed; it does not require routing traffic through a centralized firewall VM.</text></svg>