<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1250" viewBox="0 0 2000 1250"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1a73e8"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d93025"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f29900"/></marker></defs><rect width="2000" height="1250" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="1000" y="55" text-anchor="middle" font-size="28" font-weight="700">Traditional VM-Series + internal passthrough ILB + PBR/static-route inspection</text><rect x="50" y="100" width="1900" height="500" rx="18" fill="#f4f8ff" stroke="#1a73e8" stroke-width="2"/><text x="80" y="138" font-size="20" font-weight="700">A. East-west inspection — two routed directions through the same firewall fleet</text><rect x="90" y="245" width="210" height="100" rx="10" fill="#fff" stroke="#5f6368" stroke-width="2"/><text x="195" y="280" text-anchor="middle" font-size="15"><tspan x="195">Workload A</tspan><tspan x="195" dy="22">10.10.1.10</tspan><tspan x="195" dy="22">VPC/segment A</tspan></text><rect x="370" y="220" width="240" height="145" rx="10" fill="#d2e3fc" stroke="#1a73e8" stroke-width="2"/><text x="490" y="260" text-anchor="middle" font-size="15"><tspan x="490">PBR or static route A</tspan><tspan x="490" dy="22">match destination B</tspan><tspan x="490" dy="22">next hop ILB-A</tspan></text><rect x="680" y="235" width="220" height="115" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="790" y="275" text-anchor="middle" font-size="15"><tspan x="790">Internal passthrough ILB-A</tspan><tspan x="790" dy="22">fronts trust-side NIC</tspan><tspan x="790" dy="22">symmetric hashing</tspan></text><rect x="970" y="195" width="300" height="190" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="1120" y="235" text-anchor="middle" font-size="15" font-weight="700"><tspan x="1120">VM-Series fleet</tspan><tspan x="1120" dy="24" font-weight="400">PAN-OS virtual router</tspan><tspan x="1120" dy="22" font-weight="400">Security / App-ID / Threat</tspan><tspan x="1120" dy="22" font-weight="400">optional NAT</tspan><tspan x="1120" dy="22" font-weight="400">route lookup after inspection</tspan></text><rect x="1340" y="235" width="220" height="115" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="1450" y="275" text-anchor="middle" font-size="15"><tspan x="1450">Internal passthrough ILB-B</tspan><tspan x="1450" dy="22">fronts B-facing NIC</tspan><tspan x="1450" dy="22">return steering</tspan></text><rect x="1630" y="220" width="240" height="145" rx="10" fill="#d2e3fc" stroke="#1a73e8" stroke-width="2"/><text x="1750" y="260" text-anchor="middle" font-size="15"><tspan x="1750">PBR or static route B</tspan><tspan x="1750" dy="22">match destination A</tspan><tspan x="1750" dy="22">next hop ILB-B</tspan></text><rect x="1680" y="420" width="210" height="100" rx="10" fill="#fff" stroke="#5f6368" stroke-width="2"/><text x="1785" y="455" text-anchor="middle" font-size="15"><tspan x="1785">Workload B</tspan><tspan x="1785" dy="22">10.20.1.20</tspan><tspan x="1785" dy="22">VPC/segment B</tspan></text><path d="M300 295 H370" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M610 295 H680" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M900 295 H970" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M1270 295 H1340" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M1560 295 H1630 V420" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><text x="320" y="278" font-size="12" fill="#1a73e8">forward</text><path d="M1680 470 H1570 V535 H1450 V370" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M1450 370 V535 H1120 V405" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M1120 405 V535 H790 V370" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M790 370 V535 H490 V385" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M490 385 V555 H195 V365" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><text x="1000" y="565" text-anchor="middle" font-size="13" fill="#d93025">Return direction must also be steered. Symmetric hashing helps the paired ILB directions choose the same eligible firewall backend for a flow.</text><rect x="50" y="650" width="1900" height="520" rx="18" fill="#fff8f1" stroke="#f29900" stroke-width="2"/><text x="80" y="688" font-size="20" font-weight="700">B. Internet north-south — trust-side ILB steers egress; VM-Series untrust owns Internet-facing forwarding/NAT</text><rect x="100" y="805" width="210" height="100" rx="10" fill="#fff" stroke="#5f6368" stroke-width="2"/><text x="205" y="840" text-anchor="middle" font-size="15"><tspan x="205">Workload VM</tspan><tspan x="205" dy="22">10.10.1.10</tspan><tspan x="205" dy="22">trust/workload VPC</tspan></text><rect x="370" y="785" width="240" height="140" rx="10" fill="#d2e3fc" stroke="#1a73e8" stroke-width="2"/><text x="490" y="825" text-anchor="middle" font-size="15"><tspan x="490">0.0.0.0/0 static route</tspan><tspan x="490" dy="22">or PBR</tspan><tspan x="490" dy="22">next hop trust ILB</tspan></text><rect x="680" y="805" width="220" height="100" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="790" y="842" text-anchor="middle" font-size="15"><tspan x="790">Trust ILB</tspan><tspan x="790" dy="22">healthy firewall selection</tspan></text><rect x="980" y="750" width="320" height="210" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="1140" y="790" text-anchor="middle" font-size="15" font-weight="700"><tspan x="1140">VM-Series</tspan><tspan x="1140" dy="24" font-weight="400">trust → Security policy</tspan><tspan x="1140" dy="22" font-weight="400">route to untrust</tspan><tspan x="1140" dy="22" font-weight="400">SNAT if designed on PAN-OS</tspan><tspan x="1140" dy="22" font-weight="400">state owns reverse translation</tspan></text><rect x="1380" y="800" width="230" height="110" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="1495" y="840" text-anchor="middle" font-size="15"><tspan x="1495">Untrust VPC / Internet edge</tspan><tspan x="1495" dy="22">external IP or supported</tspan><tspan x="1495" dy="22">external passthrough LB</tspan></text><rect x="1690" y="810" width="190" height="90" rx="10" fill="#fff" stroke="#5f6368" stroke-width="2"/><text x="1785" y="845" text-anchor="middle" font-size="15"><tspan x="1785">Internet</tspan><tspan x="1785" dy="22">198.51.100.25</tspan></text><path d="M310 855 H370" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M610 855 H680" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M900 855 H980" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M1300 855 H1380" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M1610 855 H1690" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M1785 930 V1060 H1495 V930" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M1495 930 V1060 H1140 V980" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M1140 980 V1095 H205 V925" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><text x="1050" y="1125" text-anchor="middle" font-size="13" fill="#d93025">Return Internet packet reaches the same firewall state owner through the Internet-facing design, PAN-OS reverses NAT/inspects, then routes the original private flow back toward the workload.</text></g></svg>