<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#37474f"/></marker><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1a73e8"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#188038"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d93025"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><text x="40" y="48" font-family="Arial" font-size="28" font-weight="700" fill="#202124">NCC Site-to-Site Data Transfer — Hybrid Spoke Transit</text>
<rect x="30" y="80" width="1440" height="620" rx="18" fill="#fafafa" stroke="#9aa0a6" stroke-width="2" stroke-dasharray="8 6"/><text x="48" y="112" font-family="Arial" font-size="18" font-weight="700" fill="#3c4043">All hybrid spokes with site-to-site transfer must use the same routing VPC; enable global dynamic routing for cross-region exchange</text>
<polyline points="310,340 390,240" stroke="#188038" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/><text x="390" y="240" font-family="Arial" font-size="15" font-weight="600" fill="#188038">1. 10.1/16 via BGP</text>
<polyline points="660,230 785,230 785,340" stroke="#188038" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/><text x="785" y="230" font-family="Arial" font-size="15" font-weight="600" fill="#188038">2. NCC learns 10.1/16</text>
<polyline points="910,395 1080,395 1080,510" stroke="#188038" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/><text x="1080" y="395" font-family="Arial" font-size="15" font-weight="600" fill="#188038">3. propagate to other hybrid spoke</text>
<polyline points="1230,565 1360,565 1360,420" stroke="#188038" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/><text x="1260" y="550" font-family="Arial" font-size="15" font-weight="600" fill="#188038">4. advertise 10.1/16 to Branch B</text>
<polyline points="310,390 350,390 350,650 1360,650 1360,420" stroke="#1a73e8" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/><text x="650" y="635" font-family="Arial" font-size="15" font-weight="600" fill="#1a73e8">5. data path A → Google backbone → B</text>
<polyline points="1360,310 1360,120 180,120 180,310" stroke="#d93025" stroke-width="4" fill="none" marker-end="url(#arrowRed)"/><text x="650" y="105" font-family="Arial" font-size="15" font-weight="600" fill="#d93025">6. return path uses exchanged 10.1/16</text>
<rect x="60" y="310" width="250" height="110" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="3"/><text x="185" y="343" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">Branch A</text><text x="185" y="365" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">10.1.0.0/16</text><text x="185" y="387" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">CPE / BGP</text>
<rect x="390" y="170" width="270" height="110" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="3"/><text x="525" y="203" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">HA VPN spoke</text><text x="525" y="225" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">us-central1</text><text x="525" y="247" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">Cloud Router A</text>
<rect x="660" y="340" width="250" height="110" rx="12" fill="#fff7e0" stroke="#f9ab00" stroke-width="3"/><text x="785" y="373" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">NCC Hub</text><text x="785" y="395" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">site-to-site data transfer</text><text x="785" y="417" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">enabled on both spokes</text>
<rect x="930" y="510" width="300" height="110" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="3"/><text x="1080" y="543" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">Interconnect spoke</text><text x="1080" y="565" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">europe-west1</text><text x="1080" y="587" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">Cloud Router B</text>
<rect x="1260" y="310" width="200" height="110" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="3"/><text x="1360" y="343" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">Branch B / DC</text><text x="1360" y="365" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">10.2.0.0/16</text><text x="1360" y="387" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600">CPE / BGP</text></svg>