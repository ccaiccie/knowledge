<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="40" y="48" font-family="Arial" font-size="27" font-weight="700" fill="#232f3e">Centralized GWLBE Behind AWS Cloud WAN Service Insertion</text><text x="40" y="78" font-family="Arial" font-size="15" fill="#5b6167">Cloud WAN replaces the transit-policy plumbing; the centralized GWLBE/GWLB/NGFW inspection VPC remains a routed security VPC.</text><rect x="40" y="140" width="245" height="130" rx="14" fill="#eaf4ff" stroke="#3b82f6" stroke-width="2"/><text x="55" y="168" font-family="Arial" font-size="17" font-weight="700">Application VPC A</text><text x="55" y="192" font-family="Arial" font-size="13.5">10.10.0.0/16</text><text x="55" y="212" font-family="Arial" font-size="13.5">PROD segment</text><rect x="40" y="600" width="245" height="130" rx="14" fill="#eaf4ff" stroke="#3b82f6" stroke-width="2"/><text x="55" y="628" font-family="Arial" font-size="17" font-weight="700">Application VPC B</text><text x="55" y="652" font-family="Arial" font-size="13.5">10.20.0.0/16</text><text x="55" y="672" font-family="Arial" font-size="13.5">DEV segment</text><rect x="355" y="300" width="285" height="235" rx="14" fill="#fff4e5" stroke="#ff9900" stroke-width="2"/><text x="370" y="328" font-family="Arial" font-size="17" font-weight="700">Cloud WAN CNE</text><text x="370" y="352" font-family="Arial" font-size="13.5">CNE = Core Network Edge</text><text x="370" y="372" font-family="Arial" font-size="13.5">Managed regional router</text><text x="370" y="392" font-family="Arial" font-size="13.5">PROD → DEV via NFG</text><text x="370" y="412" font-family="Arial" font-size="13.5">Policy replaces transit steering</text><rect x="745" y="275" width="300" height="265" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="760" y="303" font-family="Arial" font-size="17" font-weight="700">NFG Inspection Attachment</text><text x="760" y="327" font-family="Arial" font-size="13.5">NFG = Network Function Group</text><text x="760" y="347" font-family="Arial" font-size="13.5">Logical service-insertion target</text><text x="760" y="367" font-family="Arial" font-size="13.5">Points into Inspection VPC</text><text x="760" y="387" font-family="Arial" font-size="13.5">Think: firewall next-hop policy</text><rect x="1145" y="230" width="420" height="355" rx="14" fill="#eefbf3" stroke="#16a34a" stroke-width="2"/><text x="1160" y="258" font-family="Arial" font-size="17" font-weight="700">Central Inspection VPC</text><text x="1160" y="282" font-family="Arial" font-size="13.5">Core Network attachment subnet</text><text x="1160" y="302" font-family="Arial" font-size="13.5">route → GWLBE</text><text x="1160" y="322" font-family="Arial" font-size="13.5">GWLBE = Gateway Load Balancer Endpoint</text><text x="1160" y="342" font-family="Arial" font-size="13.5">GWLB = Gateway Load Balancer</text><text x="1160" y="362" font-family="Arial" font-size="13.5">NGFW = Next-Generation Firewall fleet</text><text x="1160" y="382" font-family="Arial" font-size="13.5">post-inspection route → Cloud WAN</text><path d="M 285,205 L 355,360" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="300" y="290" font-family="Arial" font-size="13" font-weight="700" fill="#2563eb">1. A sends to B</text><path d="M 640,400 L 745,400" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#a)"/><text x="650" y="380" font-family="Arial" font-size="13" font-weight="700" fill="#dc2626">2. send-via policy</text><path d="M 1045,400 L 1145,400" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#a)"/><text x="1050" y="380" font-family="Arial" font-size="13" font-weight="700" fill="#ea580c">3. enter Inspection VPC</text><path d="M 1145,505 L 1045,505 L 1045,630 L 285,665" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/><text x="520" y="640" font-family="Arial" font-size="13" font-weight="700" fill="#16a34a">4. allowed packet returns via Cloud WAN</text></svg>