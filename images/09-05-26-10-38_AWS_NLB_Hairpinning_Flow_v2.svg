<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#1f2937"/></linearGradient><linearGradient id="nlb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b46cff"/><stop offset="1" stop-color="#6b21a8"/></linearGradient><linearGradient id="ec2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ed7100"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".35"/></filter><marker id="aw" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4z" fill="#fff"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4z" fill="#ff5a5f"/></marker><style>.f{font-family:Inter,Segoe UI,Arial,sans-serif}.t{fill:#fff;font-size:34px;font-weight:800}.st{fill:#cbd5e1;font-size:17px}.h{fill:#fff;font-size:18px;font-weight:800}.b{fill:#fff;font-size:16px}.s{fill:#d1d5db;font-size:14px}.flow{stroke:#fff;stroke-width:4;fill:none;marker-end:url(#aw)}.hair{stroke:#ff5a5f;stroke-width:5;fill:none;stroke-dasharray:12 9;marker-end:url(#ar)}</style></defs><rect width="1600" height="980" fill="url(#bg)"/><circle cx="1370" cy="80" r="240" fill="#6b21a8" opacity=".16"/><text class="f t" x="800" y="55" text-anchor="middle">AWS NLB Hairpinning &amp; Client Identity</text><text class="f st" x="800" y="88" text-anchor="middle">Client-IP preservation vs Proxy Protocol v2</text><rect x="285" y="125" width="1240" height="500" rx="28" fill="#123d2e" stroke="#3fae49" stroke-width="3" filter="url(#shadow)"/><rect x="310" y="145" width="175" height="45" rx="12" fill="#1b5e20"/><text class="f h" x="397" y="174" text-anchor="middle">AWS VPC</text><g filter="url(#shadow)"><rect x="65" y="265" width="185" height="175" rx="24" fill="#2f80ed" stroke="#8bd8ff" stroke-width="3"/><rect x="110" y="303" width="95" height="62" rx="8" fill="none" stroke="#fff" stroke-width="5"/><line x1="157" y1="365" x2="157" y2="390" stroke="#fff" stroke-width="5"/><line x1="130" y1="390" x2="184" y2="390" stroke="#fff" stroke-width="5"/><text class="f h" x="157" y="418" text-anchor="middle">Client</text></g><g filter="url(#shadow)"><rect x="595" y="220" width="330" height="220" rx="30" fill="url(#nlb)" stroke="#d8b4fe" stroke-width="3"/><circle cx="760" cy="292" r="34" fill="none" stroke="#fff" stroke-width="6"/><circle cx="690" cy="254" r="12" fill="#fff"/><circle cx="690" cy="330" r="12" fill="#fff"/><circle cx="830" cy="254" r="12" fill="#fff"/><circle cx="830" cy="330" r="12" fill="#fff"/><line x1="730" y1="277" x2="702" y2="260" stroke="#fff" stroke-width="5"/><line x1="730" y1="307" x2="702" y2="324" stroke="#fff" stroke-width="5"/><line x1="790" y1="277" x2="818" y2="260" stroke="#fff" stroke-width="5"/><line x1="790" y1="307" x2="818" y2="324" stroke="#fff" stroke-width="5"/><text class="f h" x="760" y="375" text-anchor="middle">Network Load Balancer</text><text class="f s" x="760" y="403" text-anchor="middle">Internal NLB · TCP</text></g><g filter="url(#shadow)"><rect x="1105" y="190" width="305" height="180" rx="24" fill="#2a2115" stroke="#ed7100" stroke-width="3"/><rect x="1140" y="225" width="80" height="80" rx="18" fill="url(#ec2)"/><rect x="1161" y="246" width="38" height="38" fill="none" stroke="#fff" stroke-width="4"/><text class="f h" x="1255" y="240">Proxy-A</text><text class="f s" x="1255" y="270">EC2 target · 10.0.1.10</text><rect x="1248" y="310" width="140" height="32" rx="10" fill="#7f1d1d"/><text class="f s" x="1318" y="332" text-anchor="middle">ALSO CALLS NLB</text></g><g filter="url(#shadow)"><rect x="1105" y="410" width="305" height="155" rx="24" fill="#2a2115" stroke="#ed7100" stroke-width="3"/><rect x="1140" y="447" width="80" height="80" rx="18" fill="url(#ec2)"/><rect x="1161" y="468" width="38" height="38" fill="none" stroke="#fff" stroke-width="4"/><text class="f h" x="1255" y="460">Proxy-B</text><text class="f s" x="1255" y="490">EC2 target · 10.0.2.10</text></g><path class="flow" d="M250 350 C380 350 475 330 595 330"/><text class="f b" x="420" y="310" text-anchor="middle">① TCP request</text><path class="flow" d="M925 305 C985 285 1040 270 1105 270"/><text class="f b" x="1015" y="245" text-anchor="middle">② target selection</text><path class="flow" d="M925 360 C985 420 1040 475 1105 485"/><text class="f b" x="1010" y="440" text-anchor="middle">② target selection</text><path class="hair" d="M1105 225 C1030 150 960 145 890 158 C825 170 790 193 790 220"/><rect x="850" y="114" width="250" height="42" rx="12" fill="#7f1d1d" stroke="#ff5a5f" stroke-width="2"/><text class="f b" x="975" y="141" text-anchor="middle">③ HAIRPIN: Proxy-A → NLB</text><rect x="65" y="675" width="700" height="235" rx="24" fill="#450a0a" stroke="#ff5a5f" stroke-width="3" filter="url(#shadow)"/><text class="f h" x="100" y="725">✕ BAD: client-IP preservation enabled</text><text class="f b" x="100" y="770">Proxy-A calls NLB → NLB selects Proxy-A again</text><text class="f h" x="120" y="815">SRC = 10.0.1.10</text><text class="f h" x="390" y="815">DST = 10.0.1.10</text><text class="f s" x="100" y="860">AWS: NAT loopback / hairpinning is unsupported in this mode.</text><rect x="835" y="675" width="700" height="235" rx="24" fill="#134e4a" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/><text class="f h" x="870" y="725">✓ GOOD: disable preservation + use PPv2</text><text class="f b" x="870" y="765">1. Disable client-IP preservation.</text><text class="f b" x="870" y="800">2. Target sees NLB private IP at Layer 3.</text><text class="f b" x="870" y="835">3. Enable Proxy Protocol v2 after backend supports it.</text><text class="f b" x="870" y="870">4. Recover original client IP/port from PPv2 metadata.</text><text class="f s" x="800" y="952" text-anchor="middle">NLB = Network Load Balancer · EC2 = Elastic Compute Cloud · PPv2 = Proxy Protocol v2</text></svg>