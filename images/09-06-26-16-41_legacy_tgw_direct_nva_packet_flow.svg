<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2D72B8"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8A4F9E"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#E38B2C"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C93C37"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3A8D3A"/></marker><style>text{font-family:Arial,sans-serif;fill:#1f2937}.t{font-size:22px;font-weight:700}.h{font-size:15px;font-weight:700}.x{font-size:13px}.box{rx:16;ry:16;stroke-width:2}</style></defs><rect width="1800" height="950" fill="white"/><text x="900" y="45" text-anchor="middle" class="t">Spoke-A → Spoke-B: forward and return through legacy direct NVA</text>
<rect class="box" x="50" y="180" width="250" height="120" fill="#E8F1FB" stroke="#2D72B8"/><text x="175" y="210" text-anchor="middle" class="h">Spoke-A EC2</text><text x="175" y="238" text-anchor="middle" class="x">10.10.10.10:49152</text><text x="175" y="265" text-anchor="middle" class="x">App RT: 10.20/16 → TGW</text>
<rect class="box" x="390" y="180" width="270" height="120" fill="#F4E4F7" stroke="#8A4F9E"/><text x="525" y="210" text-anchor="middle" class="h">TGW PRE lookup</text><text x="525" y="238" text-anchor="middle" class="x">Ingress: Spoke-A attachment</text><text x="525" y="265" text-anchor="middle" class="x">10.20/16 → Inspection</text>
<rect class="box" x="750" y="180" width="280" height="120" fill="#FFF7E6" stroke="#E38B2C"/><text x="890" y="210" text-anchor="middle" class="h">Inspection TGW attachment ENI</text><text x="890" y="238" text-anchor="middle" class="x">Appliance Mode selects AZ-a</text><text x="890" y="265" text-anchor="middle" class="x">RT-INSPECT-TGW-A → eni-fw-a</text>
<rect class="box" x="1120" y="180" width="270" height="120" fill="#FCE8E6" stroke="#C93C37"/><text x="1255" y="210" text-anchor="middle" class="h">FW-A / NVA</text><text x="1255" y="238" text-anchor="middle" class="x">Stateful inspection</text><text x="1255" y="265" text-anchor="middle" class="x">Original tuple unless NAT configured</text>
<rect class="box" x="1480" y="180" width="270" height="120" fill="#EAF6EA" stroke="#3A8D3A"/><text x="1615" y="210" text-anchor="middle" class="h">Post-FW subnet + TGW POST</text><text x="1615" y="238" text-anchor="middle" class="x">Subnet: 10.20/16 → TGW</text><text x="1615" y="265" text-anchor="middle" class="x">POST: 10.20/16 → Spoke-B</text>
<rect class="box" x="1480" y="600" width="270" height="120" fill="#E8F1FB" stroke="#2D72B8"/><text x="1615" y="630" text-anchor="middle" class="h">Spoke-B EC2</text><text x="1615" y="658" text-anchor="middle" class="x">10.20.20.20:443</text><text x="1615" y="685" text-anchor="middle" class="x">Local VPC delivery</text>
<rect class="box" x="1120" y="600" width="270" height="120" fill="#EAF6EA" stroke="#3A8D3A"/><text x="1255" y="630" text-anchor="middle" class="h">Reverse POST lookup</text><text x="1255" y="658" text-anchor="middle" class="x">After FW: 10.10/16 → Spoke-A</text>
<rect class="box" x="750" y="600" width="280" height="120" fill="#FCE8E6" stroke="#C93C37"/><text x="890" y="630" text-anchor="middle" class="h">Same FW-A state owner</text><text x="890" y="658" text-anchor="middle" class="x">SYN-ACK matches existing session</text><text x="890" y="685" text-anchor="middle" class="x">Reverse NAT if configured</text>
<rect class="box" x="390" y="600" width="270" height="120" fill="#FFF7E6" stroke="#E38B2C"/><text x="525" y="630" text-anchor="middle" class="h">Same Inspection attachment AZ</text><text x="525" y="658" text-anchor="middle" class="x">Appliance Mode keeps TGW symmetry</text><text x="525" y="685" text-anchor="middle" class="x">Zonal RT maps back to FW-A</text>
