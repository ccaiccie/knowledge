<rect class="box" x="490" y="790" width="820" height="100" fill="#F7F7F7" stroke="#666"/><text x="900" y="820" text-anchor="middle" class="x">Solid = forward 10.10.10.10:49152 → 10.20.20.20:443</text><text x="900" y="845" text-anchor="middle" class="x">Dashed = return 10.20.20.20:443 → 10.10.10.10:49152</text><text x="900" y="870" text-anchor="middle" class="x">PRE sends uninspected traffic to Inspection; POST sends inspected traffic to the real destination.</text></svg>