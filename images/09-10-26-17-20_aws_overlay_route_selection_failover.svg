<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#37474F"/></marker></defs>
<rect width="1600" height="980" fill="white"/><text x="800" y="45" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold">PAN-OS GWLB Overlay Routing — Inner-Header Decision Logic</text>
<rect x="570" y="90" width="460" height="85" rx="12" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/><text x="800" y="125" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">GENEVE packet arrives from AWS GWLB</text><text x="800" y="153" text-anchor="middle" font-family="Arial" font-size="15">Original customer packet remains inside</text>
<line x1="800" y1="175" x2="800" y2="230" stroke="#37474F" stroke-width="4" marker-end="url(#a)"/>
<rect x="570" y="230" width="460" height="90" rx="12" fill="#FFE0B2" stroke="#EF6C00" stroke-width="2"/><text x="800" y="265" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Identify VPC Endpoint ID</text><text x="800" y="295" text-anchor="middle" font-family="Arial" font-size="15">vpce-dmz → e1/1.10 → DMZ zone</text>
<line x1="800" y1="320" x2="800" y2="375" stroke="#37474F" stroke-width="4" marker-end="url(#a)"/>
<rect x="570" y="375" width="460" height="90" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="800" y="410" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Session + Security Policy</text><text x="800" y="440" text-anchor="middle" font-family="Arial" font-size="15">App-ID / zones / profiles / NAT policy</text>
<line x1="800" y1="465" x2="800" y2="520" stroke="#37474F" stroke-width="4" marker-end="url(#a)"/>
<polygon points="800,520 1030,620 800,720 570,620" fill="#FFF9C4" stroke="#F9A825" stroke-width="3"/><text x="800" y="603" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Inner-header L3 route lookup</text><text x="800" y="635" text-anchor="middle" font-family="Arial" font-size="15">Where should the ORIGINAL destination go?</text>
<line x1="570" y1="620" x2="310" y2="620" stroke="#1565C0" stroke-width="4" marker-end="url(#a)"/><text x="435" y="595" text-anchor="middle" font-family="Arial" font-size="16">same overlay/service path</text>
<rect x="70" y="560" width="240" height="125" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="190" y="600" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Remain in GWLB path</text><text x="190" y="630" text-anchor="middle" font-family="Arial" font-size="14">re-encapsulate/return</text><text x="190" y="655" text-anchor="middle" font-family="Arial" font-size="14">through GWLB/GWLBE</text>
<line x1="1030" y1="620" x2="1290" y2="620" stroke="#8E24AA" stroke-width="4" marker-end="url(#a)"/><text x="1160" y="595" text-anchor="middle" font-family="Arial" font-size="16">different L3 egress</text>
<rect x="1290" y="530" width="250" height="180" rx="12" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2"/><text x="1415" y="570" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Decapsulate + Route</text><text x="1415" y="605" text-anchor="middle" font-family="Arial" font-size="15">e1/2 → UNTRUST</text><text x="1415" y="635" text-anchor="middle" font-family="Arial" font-size="15">e1/3 → TRANSIT</text><text x="1415" y="665" text-anchor="middle" font-family="Arial" font-size="15">native L3 packet</text>
<rect x="340" y="800" width="920" height="100" rx="12" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/><text x="800" y="838" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">This is Palo Alto GWLB overlay routing — not TGW Connect GRE/BGP.</text><text x="800" y="870" text-anchor="middle" font-family="Arial" font-size="15">AWS route tables cause GWLBE interception; PAN-OS inner-header routing decides whether the packet remains encapsulated or exits another interface.</text>
</svg>