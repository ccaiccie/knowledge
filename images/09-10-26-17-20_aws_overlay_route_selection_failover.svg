<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><rect width="1500" height="900" fill="white"/><text x="750" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">AWS Overlay Route Selection and Failover</text><rect x="70" y="180" width="260" height="130" rx="14" fill="#f7f7f7" stroke="#333" stroke-width="2"/><text x="200" y="225" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Spoke VPC</text><text x="200" y="265" text-anchor="middle" font-family="Arial" font-size="16">10.10.0.0/16</text><rect x="520" y="145" width="340" height="210" rx="14" fill="#f7f7f7" stroke="#333" stroke-width="2"/><text x="690" y="190" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Transit Gateway</text><text x="690" y="235" text-anchor="middle" font-family="Arial" font-size="16">192.168.0.0/16 → Connect</text><text x="690" y="275" text-anchor="middle" font-family="Arial" font-size="16">192.168.10.0/24 → VPN</text><text x="690" y="320" text-anchor="middle" font-family="Arial" font-size="14">Longest prefix wins</text><rect x="1080" y="110" width="300" height="120" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/><text x="1230" y="155" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">Connect Peer A</text><text x="1230" y="190" text-anchor="middle" font-family="Arial" font-size="15">BGP path A</text><rect x="1080" y="300" width="300" height="120" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/><text x="1230" y="345" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">Connect Peer B</text><text x="1230" y="380" text-anchor="middle" font-family="Arial" font-size="15">BGP path B / failover</text><line x1="330" y1="245" x2="520" y2="245" stroke="#333" stroke-width="3" marker-end="url(#a2)"/><line x1="860" y1="210" x2="1080" y2="170" stroke="#333" stroke-width="3" marker-end="url(#a2)"/><line x1="860" y1="285" x2="1080" y2="350" stroke="#333" stroke-width="3" marker-end="url(#a2)"/><rect x="150" y="570" width="1200" height="180" rx="15" fill="#fafafa" stroke="#333" stroke-width="2"/><text x="750" y="620" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Failure chain</text><text x="750" y="665" text-anchor="middle" font-family="Arial" font-size="17">Underlay failure → GRE loss → BGP withdrawal → TGW route change → alternate peer/path</text><text x="750" y="710" text-anchor="middle" font-family="Arial" font-size="16">Reachability convergence does not guarantee application or firewall-session continuity.</text></svg>