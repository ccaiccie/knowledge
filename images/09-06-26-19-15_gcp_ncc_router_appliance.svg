<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#37474f"/></marker><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1a73e8"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#188038"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d93025"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="48" font-family="Arial" font-size="28" font-weight="700" fill="#202124">NCC Router Appliance — Control Plane, Data Plane, and HA</text>
<rect x="360" y="100" width="750" height="610" rx="18" fill="#f8fff9" stroke="#188038" stroke-width="2" stroke-dasharray="8 6"/>
<text x="378" y="132" font-family="Arial" font-size="18" font-weight="700" fill="#3c4043">Routing VPC / region — forwarding VMs + Cloud Router</text>
<rect x="1130" y="120" width="330" height="520" rx="18" fill="#fffdf6" stroke="#f9ab00" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1148" y="152" font-family="Arial" font-size="18" font-weight="700" fill="#3c4043">NCC control plane</text>
<polyline points="280,380 340,380 340,240 400,240" stroke="#1a73e8" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
<rect x="332" y="220" width="135" height="28" rx="5" fill="white" opacity="0.92"/><text x="340" y="240" font-family="Arial" font-size="15" font-weight="600" fill="#1a73e8">1. overlay data</text>
<polyline points="280,430 340,430 340,560 400,560" stroke="#1a73e8" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/><rect x="332" y="540" width="120" height="28" rx="5" fill="white" opacity="0.92"/><text x="340" y="560" font-family="Arial" font-size="15" font-weight="600" fill="#1a73e8">HA alternate</text>
<polyline points="660,240 735,240 735,380 810,380" stroke="#188038" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/><rect x="727" y="360" width="126" height="28" rx="5" fill="white" opacity="0.92"/><text x="735" y="380" font-family="Arial" font-size="15" font-weight="600" fill="#188038">2. BGP TCP/179</text>
<polyline points="660,560 735,560 735,430 810,430" stroke="#188038" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/><rect x="727" y="410" width="120" height="28" rx="5" fill="white" opacity="0.92"/><text x="735" y="430" font-family="Arial" font-size="15" font-weight="600" fill="#188038">BGP TCP/179</text>
<polyline points="1090,380 1140,380 1140,240 1160,240" stroke="#f9ab00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1132" y="220" width="171" height="28" rx="5" fill="white" opacity="0.92"/><text x="1140" y="240" font-family="Arial" font-size="15" font-weight="600" fill="#f9ab00">3. linked resources</text>
<polyline points="1295,290 1295,510" stroke="#188038" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/><rect x="1287" y="490" width="162" height="28" rx="5" fill="white" opacity="0.92"/><text x="1295" y="510" font-family="Arial" font-size="15" font-weight="600" fill="#188038">4. routes into hub</text>
<polyline points="1160,560 1000,560 1000,700 180,700 180,460" stroke="#d93025" stroke-width="4" fill="none" marker-end="url(#arrowRed)"/><rect x="492" y="665" width="423" height="28" rx="5" fill="white" opacity="0.92"/><text x="500" y="685" font-family="Arial" font-size="15" font-weight="600" fill="#d93025">5. return traffic follows selected BGP next hop</text>
<rect x="40" y="350" width="240" height="110" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="3"/><text x="160" y="383" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">Branch / Other Cloud</text><text x="160" y="405" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">192.168.50.0/24</text><text x="160" y="427" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">IPsec/SD-WAN to NVAs</text>
<rect x="400" y="190" width="260" height="100" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="3"/><text x="530" y="218" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">Router Appliance VM A</text><text x="530" y="240" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">10.200.1.10</text><text x="530" y="262" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">ASN 65010</text>
<rect x="400" y="510" width="260" height="100" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="3"/><text x="530" y="538" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">Router Appliance VM B</text><text x="530" y="560" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">10.200.1.11</text><text x="530" y="582" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">ASN 65010</text>
<rect x="810" y="350" width="280" height="110" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/><text x="950" y="383" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">Cloud Router</text><text x="950" y="405" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">ASN 64514</text><text x="950" y="427" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">BGP peers to both NVAs</text>
<rect x="1160" y="190" width="270" height="100" rx="12" fill="#fff7e0" stroke="#f9ab00" stroke-width="3"/><text x="1295" y="229" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">Router Appliance Spoke</text><text x="1295" y="251" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">links both NVA instances</text>
<rect x="1160" y="510" width="270" height="100" rx="12" fill="#fff7e0" stroke="#f9ab00" stroke-width="3"/><text x="1295" y="538" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">NCC Hub</text><text x="1295" y="560" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">propagates dynamic routes</text><text x="1295" y="582" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#202124">to eligible spokes</text>
</svg>