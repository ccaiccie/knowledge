<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
<marker id="c" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
<style>.t{font:700 29px Segoe UI,Arial;fill:#0f172a}.sub{font:400 16px Segoe UI,Arial;fill:#475569}.bt{font:700 17px Segoe UI,Arial;fill:#0f172a}.bs{font:400 13px Segoe UI,Arial;fill:#334155}.al{font:600 12px Segoe UI,Arial;fill:#1d4ed8}.note{font:400 13px Segoe UI,Arial;fill:#7c2d12}</style>
</defs><rect width="100%" height="100%" fill="white"/>
<text x="40" y="48" class="t">ExpressRoute + Route Server + NVA: Termination, Route Exchange, and Flow</text><text x="40" y="77" class="sub">ExpressRoute terminates on the ExpressRoute virtual network gateway in GatewaySubnet; Route Server is the routing broker, and the NVA is the inspection data plane.</text>
<rect x="55" y="300" width="245" height="145" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="70" y="328" class="bt">On-premises</text><text x="70" y="352" class="bs">CE router / WAN</text><text x="70" y="371" class="bs">Private prefixes 10.100.0.0/16</text><text x="70" y="390" class="bs">BGP to provider/MSEE</text>
<rect x="365" y="300" width="235" height="145" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="380" y="328" class="bt">ExpressRoute circuit</text><text x="380" y="352" class="bs">Private peering</text><text x="380" y="371" class="bs">Microsoft Enterprise Edge (MSEE)</text><text x="380" y="390" class="bs">Circuit is not terminated on NVA</text>
<rect x="685" y="165" width="275" height="155" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="700" y="193" class="bt">ExpressRoute Gateway</text><text x="700" y="217" class="bs">Deployed in GatewaySubnet</text><text x="700" y="236" class="bs">Same hub VNet as Route Server</text><text x="700" y="255" class="bs">Azure VNet termination point</text><text x="700" y="274" class="bs">Learns on-prem routes</text>
<rect x="685" y="500" width="275" height="155" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="700" y="528" class="bt">Azure Route Server</text><text x="700" y="552" class="bs">RouteServerSubnet</text><text x="700" y="571" class="bs">ASN 65515</text><text x="700" y="590" class="bs">Branch-to-branch = Enabled</text><text x="700" y="609" class="bs">Exchanges routes with ER gateway + NVA</text>
<rect x="1065" y="165" width="265" height="155" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="1080" y="193" class="bt">Third-party NVA</text><text x="1080" y="217" class="bs">Firewall / SD-WAN</text><text x="1080" y="236" class="bs">BGP peer to both ARS IPs</text><text x="1080" y="255" class="bs">Inspects service-inserted flows</text><text x="1080" y="274" class="bs">Can learn ER prefixes from ARS</text>
<rect x="1065" y="500" width="265" height="155" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="1080" y="528" class="bt">Spoke VM</text><text x="1080" y="552" class="bs">10.20.1.10</text><text x="1080" y="571" class="bs">Uses remote hub Route Server</text><text x="1080" y="590" class="bs">Effective routes determine path</text><text x="1080" y="609" class="bs">Does not BGP-peer itself</text>
<rect x="1380" y="330" width="180" height="145" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="1395" y="358" class="bt">Key decision</text><text x="1395" y="382" class="bs">Direct ER route vs NVA route</text><text x="1395" y="401" class="bs">Longest prefix first</text><text x="1395" y="420" class="bs">Then hub routing preference</text><text x="1395" y="439" class="bs">ER is default preference</text>
<path d="M 300 372 L 365 372" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="332.5" y="364" text-anchor="middle" class="al">BGP/private peering</text>
<path d="M 600 372 L 685 242" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="642.5" y="299" text-anchor="middle" class="al">ER data path</text>
<path d="M 822 320 L 822 500" stroke="#2563eb" stroke-width="4" fill="none" stroke-dasharray="8 6" marker-end="url(#c)"/><text x="822" y="402" text-anchor="middle" class="al">Gateway routes</text>
<path d="M 960 575 L 1065 242" stroke="#2563eb" stroke-width="4" fill="none" stroke-dasharray="8 6" marker-end="url(#c)"/><text x="1012.5" y="400.5" text-anchor="middle" class="al">Routes to NVA</text>
<path d="M 960 575 L 1065 575" stroke="#2563eb" stroke-width="4" fill="none" stroke-dasharray="8 6" marker-end="url(#c)"/><text x="1012.5" y="567" text-anchor="middle" class="al">Routes to spoke</text>
<path d="M 1065 242 L 960 242" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="1012.5" y="234" text-anchor="middle" class="al">NVA forwards to ER GW</text>
<path d="M 1065 575 L 1200 320" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="1132.5" y="439.5" text-anchor="middle" class="al">Spoke→NVA when inspection route wins</text>
<rect x="40" y="850" width="1520" height="70" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
<text x="58" y="878" class="note">Branch-to-branch must be enabled for Route Server to propagate routes between the NVA and ExpressRoute gateway.</text><text x="58" y="898" class="note">ExpressRoute is the default Route Server hub-routing preference for equal destinations unless VpnGateway or ASPath preference is configured.</text>
</svg>