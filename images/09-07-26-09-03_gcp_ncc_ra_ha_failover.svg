<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1a73e8"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d93025"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#188038"/></marker></defs><rect width="1680" height="980" fill="white"/><text x="840" y="40" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Router Appliance High Availability — ECMP, MED, and BGP Withdrawal</text>
<rect x="50" y="100" width="1580" height="735" rx="20" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/><text x="75" y="135" font-family="Arial" font-size="20" font-weight="700">us-central1 — recommended multi-zone firewall pair</text>
<rect x="90" y="190" width="340" height="160" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/><text x="260" y="228" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">VPC workload route table</text><text x="115" y="265" font-family="Arial" font-size="15">10.20.20.0/24 → fw-ra-1</text><text x="115" y="295" font-family="Arial" font-size="15">10.20.20.0/24 → fw-ra-2</text><text x="115" y="325" font-family="Arial" font-size="14" fill="#188038">same AS path + MED ⇒ ECMP</text>
<rect x="555" y="170" width="250" height="210" rx="12" fill="#fff7e0" stroke="#f9ab00" stroke-width="3"/><text x="680" y="207" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Cloud Router</text><text x="680" y="240" text-anchor="middle" font-family="Arial" font-size="15">2 redundant interfaces</text><text x="680" y="270" text-anchor="middle" font-family="Arial" font-size="15">BGP peers to both NVAs</text><text x="680" y="300" text-anchor="middle" font-family="Arial" font-size="15">best path: AS path, then MED</text><text x="680" y="335" text-anchor="middle" font-family="Arial" font-size="14">control plane only</text>
<rect x="930" y="120" width="300" height="280" rx="15" fill="#e6f4ea" stroke="#188038" stroke-width="4"/><text x="1080" y="158" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Zone us-central1-a</text><rect x="970" y="195" width="220" height="150" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="3"/><text x="1080" y="230" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">fw-ra-1</text><text x="1080" y="262" text-anchor="middle" font-family="Arial" font-size="15">ASN 65001</text><text x="1080" y="292" text-anchor="middle" font-family="Arial" font-size="15">advertise 10.20.20.0/24</text><text x="1080" y="322" text-anchor="middle" font-family="Arial" font-size="15">MED 100</text>
<rect x="1290" y="120" width="300" height="280" rx="15" fill="#e6f4ea" stroke="#188038" stroke-width="4"/><text x="1440" y="158" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Zone us-central1-b</text><rect x="1330" y="195" width="220" height="150" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="3"/><text x="1440" y="230" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">fw-ra-2</text><text x="1440" y="262" text-anchor="middle" font-family="Arial" font-size="15">ASN 65002</text><text x="1440" y="292" text-anchor="middle" font-family="Arial" font-size="15">advertise 10.20.20.0/24</text><text x="1440" y="322" text-anchor="middle" font-family="Arial" font-size="15">MED 100</text>
<path d="M805 235 H920 V255 H970" fill="none" stroke="#1a73e8" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#b)"/><path d="M805 305 H1260 V255 H1330" fill="none" stroke="#1a73e8" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#b)"/><text x="850" y="220" font-family="Arial" font-size="14" fill="#1a73e8">BGP</text><text x="1220" y="290" font-family="Arial" font-size="14" fill="#1a73e8">BGP</text>
<path d="M430 270 H555" stroke="#188038" stroke-width="5" marker-end="url(#g)"/><text x="490" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#188038">route install/update</text>
<rect x="90" y="460" width="700" height="290" rx="14" fill="white" stroke="#5f6368" stroke-width="2"/><text x="115" y="500" font-family="Arial" font-size="20" font-weight="700">Normal state — active/active ECMP</text><text x="120" y="545" font-family="Arial" font-size="16">1. Both appliances advertise the same prefix.</text><text x="120" y="580" font-family="Arial" font-size="16">2. If AS-path and MED are equivalent, Google Cloud can install both next hops.</text><text x="120" y="615" font-family="Arial" font-size="16">3. New flows are ECMP-distributed across fw-ra-1 and fw-ra-2.</text><text x="120" y="650" font-family="Arial" font-size="16">4. Stateful firewalls require a vendor-supported HA/state strategy if sessions can move.</text><text x="120" y="685" font-family="Arial" font-size="16">5. Do not assume ECMP alone synchronizes firewall sessions.</text><text x="120" y="720" font-family="Arial" font-size="15" fill="#188038">Alternative: use unequal MED/AS-path to make one appliance preferred and one standby.</text>
<rect x="860" y="460" width="700" height="290" rx="14" fill="white" stroke="#5f6368" stroke-width="2"/><text x="885" y="500" font-family="Arial" font-size="20" font-weight="700">Failure state — fw-ra-1 loses BGP/VM reachability</text><text x="890" y="545" font-family="Arial" font-size="16">1. BGP session to fw-ra-1 goes down or the next hop becomes inaccessible.</text><text x="890" y="580" font-family="Arial" font-size="16">2. Cloud Router withdraws the dynamic path through fw-ra-1.</text><text x="890" y="615" font-family="Arial" font-size="16">3. VPC route state converges to remaining path through fw-ra-2.</text><text x="890" y="650" font-family="Arial" font-size="16">4. New packets use fw-ra-2; existing stateful sessions can reset unless synchronized.</text><text x="890" y="685" font-family="Arial" font-size="16">5. If both paths disappear, the dynamic prefix is removed and traffic fails.</text><text x="890" y="720" font-family="Arial" font-size="15" fill="#d93025">BGP convergence is not a substitute for application/session-level HA design.</text>
<path d="M1080 345 V430 H1210 V460" fill="none" stroke="#d93025" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#r)"/><text x="1110" y="420" font-family="Arial" font-size="14" fill="#d93025">failure / withdrawal</text><path d="M1440 345 V430 H1370 V460" fill="none" stroke="#188038" stroke-width="5" marker-end="url(#g)"/><text x="1430" y="420" font-family="Arial" font-size="14" fill="#188038">remaining next hop</text>
<text x="90" y="885" font-family="Arial" font-size="16" font-weight="700">Design rule:</text><text x="195" y="885" font-family="Arial" font-size="16">place at least two router appliance VMs in different zones for VM-level availability; advertise identical prefixes for ECMP or deliberately manipulate path attributes for active/standby.</text><text x="90" y="925" font-family="Arial" font-size="15">For a stateful NGFW, validate vendor HA/session synchronization behavior and return-path symmetry before enabling active/active traffic distribution.</text></svg>