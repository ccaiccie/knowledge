<svg xmlns="http://www.w3.org/2000/svg" width="2050" height="1200" viewBox="0 0 2050 1200"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1a73e8"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d93025"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f29900"/></marker></defs><rect width="2050" height="1200" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="1025" y="55" text-anchor="middle" font-size="28" font-weight="700">Traditional ILB + PBR hybrid inspection — Cloud Interconnect and HA VPN</text><rect x="60" y="100" width="1930" height="970" rx="18" fill="#f9fbff" stroke="#5f6368" stroke-width="2"/><rect x="100" y="175" width="300" height="245" rx="12" fill="#fff" stroke="#5f6368" stroke-width="2"/><text x="250" y="215" text-anchor="middle" font-size="18" font-weight="700"><tspan x="250">On-premises</tspan><tspan x="250" dy="28" font-weight="400">10.100.0.0/16</tspan><tspan x="250" dy="24" font-weight="400">CE / edge routers</tspan><tspan x="250" dy="24" font-weight="400">BGP toward Google</tspan></text><rect x="470" y="150" width="300" height="130" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="620" y="190" text-anchor="middle" font-size="15"><tspan x="620">Cloud Interconnect path</tspan><tspan x="620" dy="22">VLAN attachments + Cloud Router</tspan><tspan x="620" dy="22">dynamic routes</tspan></text><rect x="470" y="330" width="300" height="130" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="620" y="370" text-anchor="middle" font-size="15"><tspan x="620">HA VPN path</tspan><tspan x="620" dy="22">HA VPN tunnels + Cloud Router</tspan><tspan x="620" dy="22">dynamic routes</tspan></text><rect x="840" y="190" width="300" height="220" rx="10" fill="#d2e3fc" stroke="#1a73e8" stroke-width="2"/><text x="990" y="230" text-anchor="middle" font-size="15" font-weight="700"><tspan x="990">Hybrid ingress steering</tspan><tspan x="990" dy="25" font-weight="400">PBR in inspection VPC</tspan><tspan x="990" dy="22" font-weight="400">source 10.100.0.0/16</tspan><tspan x="990" dy="22" font-weight="400">destination workload CIDRs</tspan><tspan x="990" dy="22" font-weight="400">next hop trust ILB</tspan><tspan x="990" dy="22" font-weight="400">Interconnect: can scope by attachment region</tspan><tspan x="990" dy="22" font-weight="400">VPN: route can apply network-wide</tspan></text><rect x="1210" y="200" width="250" height="190" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="1335" y="240" text-anchor="middle" font-size="15"><tspan x="1335">Trust-side internal</tspan><tspan x="1335" dy="22">passthrough ILB</tspan><tspan x="1335" dy="22">global access recommended</tspan><tspan x="1335" dy="22">healthy backend selection</tspan><tspan x="1335" dy="22">symmetric hashing</tspan></text><rect x="1530" y="165" width="330" height="260" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="1695" y="205" text-anchor="middle" font-size="15" font-weight="700"><tspan x="1695">VM-Series firewall fleet</tspan><tspan x="1695" dy="26" font-weight="400">PAN-OS Security / App-ID / Threat</tspan><tspan x="1695" dy="22" font-weight="400">virtual-router route lookup</tspan><tspan x="1695" dy="22" font-weight="400">on-prem prefixes via dynamic routing path</tspan><tspan x="1695" dy="22" font-weight="400">workload prefixes via VPC routes</tspan><tspan x="1695" dy="22" font-weight="400">optional NAT only if design requires it</tspan></text><rect x="1510" y="585" width="350" height="170" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="1685" y="625" text-anchor="middle" font-size="15"><tspan x="1685">Workload / spoke networks</tspan><tspan x="1685" dy="24">10.10.0.0/16, 10.20.0.0/16</tspan><tspan x="1685" dy="24">static routes / PBRs back to ILB</tspan><tspan x="1685" dy="24">for return inspection</tspan></text><rect x="880" y="635" width="320" height="180" rx="10" fill="#d2e3fc" stroke="#1a73e8" stroke-width="2"/><text x="1040" y="675" text-anchor="middle" font-size="15" font-weight="700"><tspan x="1040">Hybrid return steering</tspan><tspan x="1040" dy="26" font-weight="400">workload → on-prem</tspan><tspan x="1040" dy="22" font-weight="400">PBR/static route → trust ILB</tspan><tspan x="1040" dy="22" font-weight="400">VM-Series inspect</tspan><tspan x="1040" dy="22" font-weight="400">then Cloud Router-selected path</tspan></text><rect x="470" y="640" width="300" height="165" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="620" y="680" text-anchor="middle" font-size="15"><tspan x="620">Cloud Router route choice</tspan><tspan x="620" dy="24">Interconnect or HA VPN</tspan><tspan x="620" dy="24">according to BGP best path /</tspan><tspan x="620" dy="24">advertisements and priorities</tspan></text><path d="M400 245 H470" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M400 350 H470" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M770 215 H840" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M770 395 H840" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M1140 295 H1210" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M1460 295 H1530" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M1695 425 V585" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#b)"/><text x="1130" y="455" text-anchor="middle" font-size="13" fill="#1a73e8">ON-PREM → GCP: hybrid attachment/tunnel → PBR → ILB → VM-Series → workload</text><path d="M1510 670 H1200" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M880 725 H770" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M620 640 V500 H1695 V445" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M620 805 V930 H250 V440" stroke="#d93025" stroke-width="3" fill="none" marker-end="url(#r)"/><text x="1120" y="965" text-anchor="middle" font-size="13" fill="#d93025">GCP → ON-PREM return: workload steering → ILB → same logical firewall service → Cloud Router → selected Interconnect/HA VPN path → on-prem</text><rect x="145" y="975" width="1740" height="65" rx="10" fill="#fff4e5" stroke="#f29900" stroke-width="2"/><text x="1015" y="1002" text-anchor="middle" font-size="14"><tspan x="1015">Important: PBRs can apply to all VMs/VPN tunnels/Interconnect attachments when unscoped. For Cloud Interconnect they can instead be scoped by attachment region.</tspan><tspan x="1015" dy="22">Prevent recursion by excluding firewall backend traffic from the same PBR or by using tags / next-hop-other-routes / carefully chosen match ranges.</tspan></text></g></svg>