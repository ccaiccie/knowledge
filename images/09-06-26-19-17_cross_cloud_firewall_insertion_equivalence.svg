<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050"><rect width="1700" height="1050" fill="white"/><text x="50" y="50" font-family="Arial" font-size="30" font-weight="700">Cross-cloud firewall insertion equivalence map</text><text x="50" y="82" font-family="Arial" font-size="16" fill="#555">Same row = similar architectural role, not feature-identical.</text><rect x="250" y="120" width="430" height="85" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="465" y="154" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">AWS</text><text x="465" y="183" text-anchor="middle" font-family="Arial" font-size="15">Endpoint / route-table centric</text><rect x="735" y="120" width="430" height="85" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="950" y="154" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Azure</text><text x="950" y="183" text-anchor="middle" font-family="Arial" font-size="15">Hub / next-hop centric</text><rect x="1220" y="120" width="430" height="85" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1435" y="154" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">GCP</text><text x="1435" y="183" text-anchor="middle" font-family="Arial" font-size="15">Policy / forwarding-rule centric</text><rect x="35" y="245" width="180" height="105" rx="10" fill="#f5f5f5" stroke="#777"/><text x="125" y="300" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Routed NVA</text><rect x="250" y="245" width="430" height="105" rx="10" fill="#fffaf0" stroke="#d6b656" stroke-width="2"/><text x="465" y="285" text-anchor="middle" font-family="Arial" font-size="16"><tspan x="465" dy="0">VPC route / ENI</tspan><tspan x="465" dy="24">TGW Inspection VPC</tspan></text><rect x="735" y="245" width="430" height="105" rx="10" fill="#f3f7fc" stroke="#6c8ebf" stroke-width="2"/><text x="950" y="285" text-anchor="middle" font-family="Arial" font-size="16"><tspan x="950" dy="0">UDR → NVA / ILB</tspan><tspan x="950" dy="24">Route Server</tspan></text><rect x="1220" y="245" width="430" height="105" rx="10" fill="#f4faf4" stroke="#82b366" stroke-width="2"/><text x="1435" y="285" text-anchor="middle" font-family="Arial" font-size="16"><tspan x="1435" dy="0">Static route / PBR</tspan><tspan x="1435" dy="24">→ VM or internal ILB</tspan></text><rect x="35" y="370" width="180" height="105" rx="10" fill="#f5f5f5" stroke="#777"/><text x="125" y="425" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Transparent service</text><rect x="250" y="370" width="430" height="105" rx="10" fill="#fffaf0" stroke="#d6b656" stroke-width="2"/><text x="465" y="410" text-anchor="middle" font-family="Arial" font-size="16"><tspan x="465" dy="0">GWLB + GWLBE</tspan><tspan x="465" dy="24">GENEVE</tspan></text><rect x="735" y="370" width="430" height="105" rx="10" fill="#f3f7fc" stroke="#6c8ebf" stroke-width="2"/><text x="950" y="410" text-anchor="middle" font-family="Arial" font-size="16"><tspan x="950" dy="0">Gateway Load Balancer</tspan><tspan x="950" dy="24">VXLAN</tspan></text><rect x="1220" y="370" width="430" height="105" rx="10" fill="#f4faf4" stroke="#82b366" stroke-width="2"/><text x="1435" y="410" text-anchor="middle" font-family="Arial" font-size="16"><tspan x="1435" dy="0">PBR/static route →</tspan><tspan x="1435" dy="24">internal passthrough NLB</tspan></text><rect x="35" y="495" width="180" height="105" rx="10" fill="#f5f5f5" stroke="#777"/><text x="125" y="550" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Dynamic BGP HA</text><rect x="250" y="495" width="430" height="105" rx="10" fill="#fffaf0" stroke="#d6b656" stroke-width="2"/><text x="465" y="535" text-anchor="middle" font-family="Arial" font-size="16"><tspan x="465" dy="0">VPC Route Server</tspan><tspan x="465" dy="24">BGP chooses ENI</tspan></text><rect x="735" y="495" width="430" height="105" rx="10" fill="#f3f7fc" stroke="#6c8ebf" stroke-width="2"/><text x="950" y="535" text-anchor="middle" font-family="Arial" font-size="16"><tspan x="950" dy="0">Azure Route Server</tspan><tspan x="950" dy="24">BGP ↔ Azure SDN</tspan></text><rect x="1220" y="495" width="430" height="105" rx="10" fill="#f4faf4" stroke="#82b366" stroke-width="2"/><text x="1435" y="535" text-anchor="middle" font-family="Arial" font-size="16"><tspan x="1435" dy="0">No direct 1:1 equivalent</tspan><tspan x="1435" dy="24">ILB health often selects NVA</tspan></text><rect x="35" y="620" width="180" height="105" rx="10" fill="#f5f5f5" stroke="#777"/><text x="125" y="675" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Managed transit hub</text><rect x="250" y="620" width="430" height="105" rx="10" fill="#fffaf0" stroke="#d6b656" stroke-width="2"/><text x="465" y="660" text-anchor="middle" font-family="Arial" font-size="16"><tspan x="465" dy="0">Cloud WAN NFG</tspan><tspan x="465" dy="24">TGW network function</tspan></text><rect x="735" y="620" width="430" height="105" rx="10" fill="#f3f7fc" stroke="#6c8ebf" stroke-width="2"/><text x="950" y="660" text-anchor="middle" font-family="Arial" font-size="16"><tspan x="950" dy="0">vWAN secured hub</tspan><tspan x="950" dy="24">Routing Intent</tspan></text><rect x="1220" y="620" width="430" height="105" rx="10" fill="#f4faf4" stroke="#82b366" stroke-width="2"/><text x="1435" y="660" text-anchor="middle" font-family="Arial" font-size="16"><tspan x="1435" dy="0">No exact equivalent</tspan><tspan x="1435" dy="24">compose NCC + routing/PBR</tspan></text><rect x="35" y="745" width="180" height="105" rx="10" fill="#f5f5f5" stroke="#777"/><text x="125" y="800" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Native firewall</text><rect x="250" y="745" width="430" height="105" rx="10" fill="#fffaf0" stroke="#d6b656" stroke-width="2"/><text x="465" y="800" text-anchor="middle" font-family="Arial" font-size="16">AWS Network Firewall</text><rect x="735" y="745" width="430" height="105" rx="10" fill="#f3f7fc" stroke="#6c8ebf" stroke-width="2"/><text x="950" y="800" text-anchor="middle" font-family="Arial" font-size="16">Azure Firewall</text><rect x="1220" y="745" width="430" height="105" rx="10" fill="#f4faf4" stroke="#82b366" stroke-width="2"/><text x="1435" y="800" text-anchor="middle" font-family="Arial" font-size="16">Cloud NGFW</text><rect x="35" y="870" width="180" height="105" rx="10" fill="#f5f5f5" stroke="#777"/><text x="125" y="925" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">L7 ingress</text><rect x="250" y="870" width="430" height="105" rx="10" fill="#fffaf0" stroke="#d6b656" stroke-width="2"/><text x="465" y="925" text-anchor="middle" font-family="Arial" font-size="16">WAF + ALB/CloudFront</text><rect x="735" y="870" width="430" height="105" rx="10" fill="#f3f7fc" stroke="#6c8ebf" stroke-width="2"/><text x="950" y="925" text-anchor="middle" font-family="Arial" font-size="16">Front Door/AppGW WAF</text><rect x="1220" y="870" width="430" height="105" rx="10" fill="#f4faf4" stroke="#82b366" stroke-width="2"/><text x="1435" y="925" text-anchor="middle" font-family="Arial" font-size="16">Cloud Armor + ext. ALB</text><text x="50" y="1020" font-family="Arial" font-size="15" fill="#555">Mnemonic: AWS = Endpoint • Azure = Hub • GCP = Policy</text></svg>