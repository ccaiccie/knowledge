<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px}.m{font-size:14px;font-family:monospace}.v{fill:#fff;stroke:#64748b;stroke-width:2}.aws{fill:#fff7ed;stroke:#f59e0b;stroke-width:3}.rt{fill:#f8fafc;stroke:#475569;stroke-width:1.5}.sec{fill:#fef2f2;stroke:#dc2626;stroke-width:2.5}.flow{fill:none;stroke:#d97706;stroke-width:4;marker-end:url(#a)}.flow2{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#b)}.dash{stroke-dasharray:9 7}</style></defs>
<text x="40" y="45" class="t">Distributed GWLBE + Centralized Third-Party Firewall Fleet — Master Routing Architecture</text>
<rect x="30" y="80" width="540" height="870" rx="16" class="aws"/><text x="50" y="115" class="h">Spoke A VPC 10.10.0.0/16</text>
<rect x="55" y="145" width="225" height="125" rx="10" class="v"/><text x="70" y="175" class="h">AZ-a workload</text><text x="70" y="205" class="s">App subnet 10.10.10.0/24</text><text x="70" y="230" class="s">EC2 10.10.10.10</text><text x="70" y="252" class="s">RT-A-App-a</text>
<rect x="320" y="145" width="225" height="125" rx="10" class="v"/><text x="335" y="175" class="h">AZ-b workload</text><text x="335" y="205" class="s">App subnet 10.10.20.0/24</text><text x="335" y="230" class="s">EC2 10.10.20.10</text><text x="335" y="252" class="s">RT-A-App-b</text>
<rect x="55" y="300" width="225" height="105" rx="10" class="sec"/><text x="70" y="330" class="h">GWLBE-A-a</text><text x="70" y="355" class="s">10.10.100.0/28</text><text x="70" y="380" class="s">vpce-gwlb-a</text>
<rect x="320" y="300" width="225" height="105" rx="10" class="sec"/><text x="335" y="330" class="h">GWLBE-A-b</text><text x="335" y="355" class="s">10.10.100.16/28</text><text x="335" y="380" class="s">vpce-gwlb-b</text>
<rect x="55" y="440" width="225" height="90" rx="10" class="v"/><text x="70" y="470" class="h">TGW attach AZ-a</text><text x="70" y="498" class="s">10.10.200.0/28</text>
<rect x="320" y="440" width="225" height="90" rx="10" class="v"/><text x="335" y="470" class="h">TGW attach AZ-b</text><text x="335" y="498" class="s">10.10.200.16/28</text>
<rect x="55" y="565" width="490" height="340" rx="10" class="rt"/><text x="70" y="595" class="h">Key Spoke A VPC route tables</text><text x="70" y="625" class="m">RT-A-App-a (10.10.10.0/24)</text><text x="70" y="650" class="m">10.20.0.0/16  → vpce-gwlb-a   (east-west)</text><text x="70" y="675" class="m">172.16.0.0/16 → vpce-gwlb-a   (hybrid)</text><text x="70" y="700" class="m">0.0.0.0/0     → vpce-gwlb-a   (internet egress)</text><text x="70" y="735" class="m">RT-A-GWLBE-a (10.10.100.0/28)</text><text x="70" y="760" class="m">10.20.0.0/16  → tgw-1</text><text x="70" y="785" class="m">172.16.0.0/16 → tgw-1</text><text x="70" y="810" class="m">0.0.0.0/0     → nat-a   [internet variant]</text><text x="70" y="845" class="m">RT-A-TGW-a (10.10.200.0/28)</text><text x="70" y="870" class="m">10.10.10.0/24 → vpce-gwlb-a   (inbound enforcement)</text>
<rect x="630" y="80" width="520" height="870" rx="16" class="aws"/><text x="650" y="115" class="h">Central Security VPC 10.255.0.0/16</text>
<rect x="660" y="160" width="460" height="125" rx="12" class="sec"/><text x="680" y="195" class="h">Gateway Load Balancer</text><text x="680" y="225" class="s">Endpoint service: com.amazonaws.vpce...vpce-svc-SEC</text><text x="680" y="250" class="s">Flow hashing → healthy NGFW target; GENEVE UDP/6081</text>
<rect x="660" y="330" width="205" height="130" rx="10" class="v"/><text x="680" y="362" class="h">AZ-a firewall</text><text x="680" y="390" class="s">Subnet 10.255.10.0/24</text><text x="680" y="417" class="s">NGFW-A 10.255.10.10</text><text x="680" y="442" class="s">GENEVE target</text>
<rect x="915" y="330" width="205" height="130" rx="10" class="v"/><text x="935" y="362" class="h">AZ-b firewall</text><text x="935" y="390" class="s">Subnet 10.255.20.0/24</text><text x="935" y="417" class="s">NGFW-B 10.255.20.10</text><text x="935" y="442" class="s">GENEVE target</text>
<rect x="660" y="520" width="460" height="250" rx="10" class="rt"/><text x="680" y="552" class="h">Central policy / state</text><text x="680" y="585" class="s">• Central GWLB service shared to workload accounts/VPCs</text><text x="680" y="615" class="s">• GWLBE is the distributed route target; not a proxy/NAT</text><text x="680" y="645" class="s">• Original 5-tuple remains visible to the NGFW</text><text x="680" y="675" class="s">• GWLB encapsulates only between GWLB and appliance</text><text x="680" y="705" class="s">• Endpoint routing determines where allowed traffic resumes</text><text x="680" y="735" class="s">• Build one endpoint per required AZ to avoid cross-AZ paths</text>
<rect x="1210" y="80" width="560" height="870" rx="16" class="aws"/><text x="1230" y="115" class="h">AWS Transit / External Domains</text>
<rect x="1240" y="155" width="500" height="160" rx="10" class="v"/><text x="1260" y="188" class="h">AWS Transit Gateway tgw-1</text><text x="1260" y="218" class="m">RT-Spoke: 10.20.0.0/16 → att-Spoke-B</text><text x="1260" y="243" class="m">RT-Spoke: 172.16.0.0/16 → att-DXGW/VPN</text><text x="1260" y="268" class="m">RT-Hybrid: 10.10.0.0/16 → att-Spoke-A</text><text x="1260" y="293" class="m">RT-Hybrid: 10.20.0.0/16 → att-Spoke-B</text>
<rect x="1240" y="355" width="240" height="170" rx="10" class="v"/><text x="1260" y="388" class="h">Direct Connect</text><text x="1260" y="418" class="s">Transit VIF</text><text x="1260" y="445" class="s">→ Direct Connect gateway</text><text x="1260" y="472" class="s">→ TGW DXGW attachment</text><text x="1260" y="499" class="s">BGP: 172.16.0.0/16</text>
<rect x="1500" y="355" width="240" height="170" rx="10" class="v"/><text x="1520" y="388" class="h">Site-to-Site VPN</text><text x="1520" y="418" class="s">2 IPsec tunnels</text><text x="1520" y="445" class="s">BGP to TGW attachment</text><text x="1520" y="472" class="s">Backup or primary</text><text x="1520" y="499" class="s">172.16.0.0/16 learned</text>
<rect x="1240" y="570" width="500" height="120" rx="10" class="v"/><text x="1260" y="605" class="h">On-premises 172.16.0.0/16</text><text x="1260" y="635" class="s">DC routers advertise prefixes via Transit VIF and/or VPN BGP</text><text x="1260" y="662" class="s">TGW normally prefers equal-prefix DXGW propagation over VPN propagation</text>
<rect x="1240" y="735" width="500" height="150" rx="10" class="v"/><text x="1260" y="770" class="h">Internet</text><text x="1260" y="800" class="s">Per-VPC IGW + NAT Gateway for distributed egress</text><text x="1260" y="827" class="s">IGW edge route table → GWLBE for public inbound</text><text x="1260" y="854" class="s">NAT-public subnet return route → GWLBE for symmetric egress</text>
<path d="M280 210 H600 Q620 210 620 225 H660" class="flow"/><text x="390" y="195" class="s">service insertion</text><path d="M1120 225 H1190 Q1210 225 1210 235 H1240" class="flow2 dash"/><text x="1125" y="205" class="s">not data path: central service control</text><path d="M545 485 H1180 Q1210 485 1210 240 H1240" class="flow"/><text x="760" y="475" class="s">inspected packet → TGW</text><path d="M1480 525 V570" class="flow2"/><path d="M1620 525 V570" class="flow2"/>
<text x="40" y="1000" class="h">Enforcement principle</text><text x="40" y="1032" class="s">Every traffic class is forced through a local GWLBE by the route table at the side where that traffic ENTERS or LEAVES the workload VPC. GWLB and firewalls remain centralized.</text><text x="40" y="1062" class="s">For hybrid inbound, use the TGW-attachment subnet route table → GWLBE. For workload outbound, use the workload subnet route table → GWLBE. For Internet inbound, use the IGW edge route table → GWLBE.</text><text x="40" y="1092" class="s">The GWLBE subnet route table then sends the permitted packet onward to TGW, NAT/IGW, or the local workload subnet as appropriate.</text>
</svg>