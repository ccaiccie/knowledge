<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><style>.t{font:700 28px Segoe UI,Arial;fill:#0f172a}.bt{font:700 17px Segoe UI,Arial;fill:#0f172a}.bs{font:400 14px Segoe UI,Arial;fill:#334155}.n{font:400 13px Segoe UI,Arial;fill:#7c2d12}</style></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="48" class="t">ExpressRoute inspection caveat: route exchange does not automatically force the NVA inline</text><rect x="80" y="180" width="250" height="130" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="100" y="215" class="bt">On-premises</text><text x="100" y="245" class="bs">10.100.0.0/16</text><rect x="420" y="180" width="280" height="130" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="440" y="215" class="bt">ExpressRoute Gateway</text><text x="440" y="245" class="bs">GatewaySubnet</text><text x="440" y="268" class="bs">Directly knows ER-learned prefixes</text><rect x="790" y="180" width="260" height="130" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="810" y="215" class="bt">NVA / Firewall</text><text x="810" y="245" class="bs">Inspection only if its route wins</text><rect x="1140" y="180" width="260" height="130" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1160" y="215" class="bt">Spoke VM</text><text x="1160" y="245" class="bs">Effective route selects next hop</text><rect x="470" y="480" width="560" height="160" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="495" y="515" class="bt">Azure Route Server</text><text x="495" y="545" class="bs">Shares routes between ExpressRoute gateway and NVA when branch-to-branch is enabled.</text><text x="495" y="570" class="bs">It does not insert itself into the packet path and does not automatically create a service chain.</text><text x="495" y="595" class="bs">More-specific ER routes can beat an NVA default route.</text><path d="M330 245 L420 245" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M700 245 L790 245" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M1050 245 L1140 245" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="40" y="740" width="1420" height="65" rx="12" fill="#fff7ed" stroke="#f59e0b"/><text x="60" y="778" class="n">Verify the exact winning route in each direction. Branch-to-branch enables route exchange; it does not guarantee that ExpressRoute traffic is inspected by the NVA.</text></svg>