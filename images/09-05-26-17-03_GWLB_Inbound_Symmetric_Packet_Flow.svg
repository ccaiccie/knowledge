ke-width="2"/><text x="705" y="740.167" text-anchor="middle" style="font-size:14px;font-weight:600">Stateful symmetry: both directions traverse the same NVA instance.</text><text x="705" y="759.167" text-anchor="middle" style="font-size:14px;font-weight:600">Source and destination IPs remain preserved through the transparent GWLB service chain.</text><path d="M 190,205 L 250,205" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowBlue)"/><text x="258" y="197" class="edgeLabel" fill="#2563eb">1</text><path d="M 430,205 L 500,205" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowBlue)"/><text x="508" y="197" class="edgeLabel" fill="#2563eb">2  Chained frontend</text><path d="M 665,205 L 700,205 L 700,110 L 720,110 L 720,205 L 745,205" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#arrowPurple)"/><text x="728" y="102" class="edgeLabel" fill="#7c3aed">3/4  VXLAN external</text><path d="M 745,232.5 L 715,235 L 715,320 L 690,320 L 690,228 L 665,227.5" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#arrowGreen)"/><text x="698" y="312" class="edgeLabel" fill="#16a34a">5/6  Inspected return</text><path d="M 665,205 L 690,185 L 690,85 L 1080,85 L 1080,205 L 1120,205" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowBlue)"/><text x="1088" y="77" class="edgeLabel" fill="#2563eb">7/8  Deliver to app</text><path d="M 1120,543 L 1080,542 L 1080,440 L 700,440 L 700,542 L 665,541.5" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowBlue)"/><text x="708" y="432" class="edgeLabel" fill="#2563eb">A/B  Return enters chain</text><path d="M 665,555 L 700,555 L 700,640 L 720,640 L 720,555 L 745,555" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#arrowPurple)"/><text x="728" y="632" class="edgeLabel" fill="#7c3aed">C  Same NVA</text><path d="M 745,582.5 L 715,582 L 715,665 L 690,665 L 690,578 L 665,577.5" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#arrowGreen)"/><text x="698" y="657" class="edgeLabel" fill="#16a34a">D  Existing session</text><path d="M 500,555 L 430,555" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowBlue)"/><text x="438" y="547" class="edgeLabel" fill="#2563eb">E  Return to public LB</text><path d="M 250,555 L 190,555" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowBlue)"/><text x="198" y="547" class="edgeLabel" fill="#2563eb">F  Internet response</text></svg>