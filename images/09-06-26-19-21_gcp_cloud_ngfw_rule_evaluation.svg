<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker><marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker><marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f29900"/></marker><style>text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:700}.boxTitle{font-size:19px;font-weight:700}.boxText{font-size:15px}.label{font-size:15px;font-weight:700}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="48" class="title">Cloud NGFW rule evaluation — why policy placement matters</text>
<rect x="80" y="110" width="250" height="120" rx="16" fill="#fce8e6" stroke="#d93025" stroke-width="2"/><text x="96" y="140" class="boxTitle">1. Hierarchical policy</text><text x="96" y="164" class="boxText">Organization → folders</text><text x="96" y="188" class="boxText">allow / deny / goto_next</text><text x="96" y="212" class="boxText">Can enforce non-overridable guardrails</text>
<rect x="400" y="110" width="250" height="120" rx="16" fill="#fef7e0" stroke="#f29900" stroke-width="2"/><text x="416" y="140" class="boxTitle">2. Regional system policy</text><text x="416" y="164" class="boxText">Google-managed policy stage</text><text x="416" y="188" class="boxText">Evaluated before network/classic rules</text>
<rect x="720" y="110" width="270" height="120" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="736" y="140" class="boxTitle">3. Global network policy</text><text x="736" y="164" class="boxText">Associated with the VPC</text><text x="736" y="188" class="boxText">allow / deny / goto_next / L7 intercept</text>
<rect x="1060" y="110" width="270" height="120" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="1076" y="140" class="boxTitle">4. Regional network policy</text><text x="1076" y="164" class="boxText">Associated with VPC + region</text><text x="1076" y="188" class="boxText">Regional workload policy layer</text>
<rect x="400" y="360" width="250" height="120" rx="16" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/><text x="416" y="390" class="boxTitle">5. Classic VPC firewall rules</text><text x="416" y="414" class="boxText">Position depends on enforcement order</text><text x="416" y="438" class="boxText">AFTER_CLASSIC is default</text>
<rect x="720" y="360" width="270" height="120" rx="16" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/><text x="736" y="390" class="boxTitle">6. Implied actions</text><text x="736" y="414" class="boxText">Implied deny ingress</text><text x="736" y="438" class="boxText">Implied allow egress</text><text x="736" y="462" class="boxText">Reached only if earlier stages delegate/no match</text>
<rect x="80" y="600" width="580" height="150" rx="16" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="96" y="630" class="boxTitle">BEFORE_CLASSIC_FIREWALL</text><text x="96" y="654" class="boxText">Hierarchical → regional system → global network → regional network → classic VPC → implied</text><text x="96" y="678" class="boxText">Recommended when migrating to policy-first enforcement and you intentionally want network policies ahead of classic rules.</text>
<rect x="760" y="600" width="580" height="150" rx="16" fill="#fff4e5" stroke="#f29900" stroke-width="2"/><text x="776" y="630" class="boxTitle">AFTER_CLASSIC_FIREWALL (default)</text><text x="776" y="654" class="boxText">Hierarchical → regional system → classic VPC → global network → regional network → implied</text><text x="776" y="678" class="boxText">A classic VPC allow/deny can stop evaluation before the network firewall policy is reached.</text>
<path d="M 330,170 L 400,170" fill="none" stroke="#f29900" stroke-width="4" marker-end="url(#orangeArrow)"/><rect x="394" y="152" width="160" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="400" y="170" class="label" fill="#f29900">goto_next / no match</text>
<path d="M 650,170 L 720,170" fill="none" stroke="#f29900" stroke-width="4" marker-end="url(#orangeArrow)"/><rect x="714" y="152" width="110" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="720" y="170" class="label" fill="#f29900">continue</text>
<path d="M 990,170 L 1060,170" fill="none" stroke="#f29900" stroke-width="4" marker-end="url(#orangeArrow)"/><rect x="1054" y="152" width="110" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="1060" y="170" class="label" fill="#f29900">goto_next</text>
<path d="M 1195,230 L 1195,300 L 850,300 L 850,360" fill="none" stroke="#f29900" stroke-width="4" marker-end="url(#orangeArrow)"/><rect x="954" y="272" width="152" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="960" y="290" class="label" fill="#f29900">BEFORE_CLASSIC path</text>
<path d="M 650,420 L 720,420" fill="none" stroke="#f29900" stroke-width="4" marker-end="url(#orangeArrow)"/><rect x="714" y="402" width="160" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="720" y="420" class="label" fill="#f29900">if no decisive match</text>
<path d="M 525,360 L 525,300 L 840,300 L 840,230" fill="none" stroke="#5f6368" stroke-width="4" marker-end="url(#blueArrow)" stroke-dasharray="8 7"/><rect x="464" y="267" width="408" height="24" rx="5" fill="#fff" opacity="0.93"/><text x="470" y="285" class="label" fill="#5f6368">AFTER_CLASSIC moves classic before network policies</text>
<text x="40" y="790" class="boxText">Priority 0 is highest priority inside a firewall policy. A decisive allow/deny stops evaluation at that stage.</text><text x="40" y="814" class="boxText">Network firewall policies have predefined lowest-priority rules that delegate to the next stage.</text></svg>