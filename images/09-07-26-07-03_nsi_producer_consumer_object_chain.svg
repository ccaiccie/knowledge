<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100"><defs><marker id="arrBlue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1a73e8"/></marker><marker id="arrGreen" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#34a853"/></marker><marker id="arrRed" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#ea4335"/></marker><marker id="arrOrange" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#f29900"/></marker></defs><rect width="1800" height="1100" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="430" y="30" width="940" height="70" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="900" y="73" text-anchor="middle" font-size="22" font-weight="700">Google Cloud NSI in-band: how producer and consumer objects tie together</text><rect x="70" y="140" width="1660" height="360" rx="14" fill="#f3f8ff" stroke="#1a73e8" stroke-width="2"/><text x="95" y="175" font-size="18" font-weight="700">CONSUMER PROJECT — app-prod-1</text><rect x="70" y="560" width="1660" height="430" rx="14" fill="#fff8f1" stroke="#f29900" stroke-width="2"/><text x="95" y="595" font-size="18" font-weight="700">PRODUCER PROJECT — pan-sec-prod</text><g font-size="14"><rect x="110" y="260" width="170" height="80" rx="10" fill="#fff" stroke="#5f6368" stroke-width="2"/><text x="195" y="290" text-anchor="middle"><tspan x="195">Workload VM</tspan><tspan x="195" dy="22">10.10.1.10</tspan></text><rect x="330" y="240" width="230" height="120" rx="10" fill="#d2e3fc" stroke="#1a73e8" stroke-width="2"/><text x="445" y="285" text-anchor="middle" font-weight="700"><tspan x="445">Firewall policy rule</tspan><tspan x="445" dy="24">APPLY_SECURITY_PROFILE_GROUP</tspan></text><rect x="610" y="250" width="190" height="100" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="705" y="288" text-anchor="middle"><tspan x="705">Security profile group</tspan><tspan x="705" dy="24">pan-spg</tspan></text><rect x="850" y="250" width="210" height="100" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="955" y="288" text-anchor="middle"><tspan x="955">Custom-intercept profile</tspan><tspan x="955" dy="24">pan-custom-intercept</tspan></text><rect x="1110" y="230" width="240" height="140" rx="10" fill="#d9ead3" stroke="#34a853" stroke-width="2"/><text x="1230" y="270" text-anchor="middle" font-weight="700"><tspan x="1230">Intercept endpoint group</tspan><tspan x="1230" dy="22">pan-ieg</tspan><tspan x="1230" dy="24" font-weight="400">consumer-side pointer</tspan><tspan x="1230" dy="20" font-weight="400">to producer service</tspan></text><rect x="1400" y="230" width="250" height="140" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/><text x="1525" y="270" text-anchor="middle"><tspan x="1525">Endpoint-group association</tspan><tspan x="1525" dy="22">pan-ieg-app-vpc</tspan><tspan x="1525" dy="24">binds pan-ieg to app-vpc</tspan></text><rect x="1430" y="400" width="190" height="70" rx="10" fill="#fff" stroke="#5f6368" stroke-width="2"/><text x="1525" y="428" text-anchor="middle"><tspan x="1525">Consumer VPC</tspan><tspan x="1525" dy="22">app-vpc</tspan></text><rect x="1080" y="650" width="270" height="140" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="1215" y="690" text-anchor="middle" font-weight="700"><tspan x="1215">Intercept deployment group</tspan><tspan x="1215" dy="22">pan-idg — GLOBAL</tspan><tspan x="1215" dy="24" font-weight="400">logical producer service / umbrella</tspan></text><rect x="760" y="650" width="240" height="130" rx="10" fill="#ffe6cc" stroke="#f29900" stroke-width="2"/><text x="880" y="690" text-anchor="middle" font-weight="700"><tspan x="880">Intercept deployment</tspan><tspan x="880" dy="22">pan-id-uscentral1a</tspan><tspan x="880" dy="24" font-weight="400">ZONAL: us-central1-a</tspan></text><rect x="1080" y="830" width="270" height="110" rx="10" fill="#ffe6cc" stroke="#f29900" stroke-width="2" stroke-dasharray="8 6"/><text x="1215" y="867" text-anchor="middle"><tspan x="1215">Optional second intercept deployment</tspan><tspan x="1215" dy="22">ZONAL: us-central1-b</tspan><tspan x="1215" dy="22">references zone-B service frontend</tspan></text><rect x="470" y="650" width="220" height="130" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/><text x="580" y="688" text-anchor="middle" font-weight="700"><tspan x="580">Internal forwarding rule</tspan><tspan x="580" dy="22">pan-nsi-ilb-fr</tspan><tspan x="580" dy="24" font-weight="400">regional UDP/6081 frontend</tspan></text><rect x="230" y="650" width="190" height="130" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/><text x="325" y="688" text-anchor="middle"><tspan x="325">Backend service</tspan><tspan x="325" dy="22">pan-nsi-ilb-bs</tspan><tspan x="325" dy="24">regional INTERNAL / UDP</tspan></text><rect x="100" y="830" width="260" height="110" rx="10" fill="#fff" stroke="#5f6368" stroke-width="2"/><text x="230" y="865" text-anchor="middle"><tspan x="230">VM-Series instance group</tspan><tspan x="230" dy="22">healthy firewall backends</tspan><tspan x="230" dy="22">GENEVE inspection</tspan></text><rect x="450" y="850" width="540" height="100" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/><text x="720" y="882" text-anchor="middle" font-size="13" font-weight="700"><tspan x="720">CONTROL / REFERENCE CHAIN: consumer selects producer service by object references.</tspan><tspan x="720" dy="24">DATA PATH after rule match: NSI selects a zonal deployment → forwarding rule →</tspan><tspan x="720" dy="22">backend service → healthy VM-Series → verdict / reinjection.</tspan></text></g><g fill="none" stroke-linejoin="round"><path d="M280 300 H330" stroke="#1a73e8" stroke-width="3" marker-end="url(#arrBlue)"/><text x="292" y="285" fill="#1a73e8" font-size="12">1. packet</text><path d="M560 300 H610" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#arrBlue)"/><text x="565" y="284" fill="#1a73e8" font-size="12">2. rule references</text><path d="M800 300 H850" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#arrBlue)"/><text x="807" y="284" fill="#1a73e8" font-size="12">3. contains</text><path d="M1060 300 H1110" stroke="#34a853" stroke-width="2.5" marker-end="url(#arrGreen)"/><text x="1062" y="284" fill="#188038" font-size="12">4. profile points to</text><path d="M1230 370 V520 H1215 V650" stroke="#34a853" stroke-width="3" marker-end="url(#arrGreen)"/><text x="1242" y="520" fill="#188038" font-size="12">5. endpoint group references producer offering</text><path d="M1525 370 V400" stroke="#ea4335" stroke-width="2.5" marker-end="url(#arrRed)"/><text x="1540" y="392" fill="#c5221f" font-size="12">association</text><path d="M1400 300 H1350" stroke="#ea4335" stroke-width="2.5" marker-end="url(#arrRed)"/><text x="1358" y="285" fill="#c5221f" font-size="12">binds endpoint group</text><path d="M1080 720 H1000" stroke="#f29900" stroke-width="3" marker-end="url(#arrOrange)"/><text x="1010" y="700" fill="#b06000" font-size="12">6. group owns zonal deployment</text><path d="M760 715 H690" stroke="#ea4335" stroke-width="3" marker-end="url(#arrRed)"/><text x="695" y="695" fill="#c5221f" font-size="12">7. deployment references frontend</text><path d="M470 715 H420" stroke="#ea4335" stroke-width="3" marker-end="url(#arrRed)"/><text x="423" y="695" fill="#c5221f" font-size="12">8. forwards to</text><path d="M325 780 V815 H230 V830" stroke="#ea4335" stroke-width="3" marker-end="url(#arrRed)"/><text x="337" y="812" fill="#c5221f" font-size="12">9. healthy backend</text><path d="M1215 790 V830" stroke="#f29900" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrOrange)"/><text x="1232" y="818" fill="#b06000" font-size="12">additional zone</text></g></g></svg>