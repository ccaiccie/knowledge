<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040"><defs><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d93025"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1a73e8"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#188038"/></marker></defs><rect width="1700" height="1040" fill="white"/><text x="850" y="38" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">East-West Inspection Flow — VM-A 10.10.10.20 → VM-B 10.20.20.20</text>
<rect x="50" y="110" width="475" height="760" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/><text x="75" y="145" font-family="Arial" font-size="21" font-weight="700">VPC-A / 10.10.10.0/24</text><rect x="90" y="190" width="390" height="100" rx="10" fill="white" stroke="#5f6368" stroke-width="2"/><text x="285" y="228" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">VM-A</text><text x="285" y="260" text-anchor="middle" font-family="Arial" font-size="16">10.10.10.20</text><rect x="90" y="350" width="390" height="210" rx="10" fill="#fff7e0" stroke="#f9ab00" stroke-width="3"/><text x="285" y="388" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">VPC-A effective route model</text><text x="115" y="425" font-family="Arial" font-size="15">10.10.10.0/24 → local subnet route</text><text x="115" y="455" font-family="Arial" font-size="15" fill="#d93025">10.20.20.0/24 → dynamic route</text><text x="115" y="485" font-family="Arial" font-size="15" fill="#d93025">next hop: fw-ra-1 nic0 10.10.10.8</text><text x="115" y="520" font-family="Arial" font-size="14">Installed from BGP learned by Cloud Router A</text>
<rect x="90" y="635" width="390" height="150" rx="10" fill="#fff7e0" stroke="#f9ab00" stroke-width="3"/><text x="285" y="670" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Cloud Router A — control plane</text><text x="285" y="705" text-anchor="middle" font-family="Arial" font-size="15">learns 10.20.20.0/24 from NGFW</text><text x="285" y="735" text-anchor="middle" font-family="Arial" font-size="15">does not forward VM packets</text><text x="285" y="765" text-anchor="middle" font-family="Arial" font-size="14">BGP sessions → 10.10.10.8</text>
<rect x="610" y="250" width="480" height="480" rx="18" fill="#fce8e6" stroke="#d93025" stroke-width="4"/><text x="850" y="292" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Router Appliance / NGFW — fw-ra-1</text><rect x="655" y="340" width="180" height="90" rx="8" fill="white" stroke="#d93025"/><text x="745" y="372" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">nic0 / VPC-A</text><text x="745" y="402" text-anchor="middle" font-family="Arial" font-size="15">10.10.10.8</text><rect x="865" y="340" width="180" height="90" rx="8" fill="white" stroke="#d93025"/><text x="955" y="372" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">nic1 / VPC-B</text><text x="955" y="402" text-anchor="middle" font-family="Arial" font-size="15">10.20.20.8</text><rect x="665" y="480" width="370" height="170" rx="8" fill="white" stroke="#5f6368" stroke-width="2"/><text x="850" y="515" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Firewall forwarding decision</text><text x="690" y="550" font-family="Arial" font-size="15">Ingress: nic0</text><text x="690" y="580" font-family="Arial" font-size="15">Policy: allow/inspect A → B</text><text x="690" y="610" font-family="Arial" font-size="15">Route: 10.20.20.0/24 reachable via nic1</text><text x="690" y="640" font-family="Arial" font-size="15">Session state created; no NAT assumed</text>
<rect x="1175" y="110" width="475" height="760" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/><text x="1200" y="145" font-family="Arial" font-size="21" font-weight="700">VPC-B / 10.20.20.0/24</text><rect x="1215" y="190" width="390" height="100" rx="10" fill="white" stroke="#5f6368" stroke-width="2"/><text x="1410" y="228" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">VM-B</text><text x="1410" y="260" text-anchor="middle" font-family="Arial" font-size="16">10.20.20.20</text><rect x="1215" y="350" width="390" height="210" rx="10" fill="#fff7e0" stroke="#f9ab00" stroke-width="3"/><text x="1410" y="388" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">VPC-B effective route model</text><text x="1240" y="425" font-family="Arial" font-size="15">10.20.20.0/24 → local subnet route</text><text x="1240" y="455" font-family="Arial" font-size="15" fill="#d93025">10.10.10.0/24 → dynamic route</text><text x="1240" y="485" font-family="Arial" font-size="15" fill="#d93025">next hop: fw-ra-1 nic1 10.20.20.8</text><text x="1240" y="520" font-family="Arial" font-size="14">Installed from BGP learned by Cloud Router B</text><rect x="1215" y="635" width="390" height="150" rx="10" fill="#fff7e0" stroke="#f9ab00" stroke-width="3"/><text x="1410" y="670" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Cloud Router B — control plane</text><text x="1410" y="705" text-anchor="middle" font-family="Arial" font-size="15">learns 10.10.10.0/24 from NGFW</text><text x="1410" y="735" text-anchor="middle" font-family="Arial" font-size="15">does not forward VM packets</text><text x="1410" y="765" text-anchor="middle" font-family="Arial" font-size="14">BGP sessions → 10.20.20.8</text>
<path d="M480 240 H570 V385 H655" fill="none" stroke="#d93025" stroke-width="5" marker-end="url(#r)"/><text x="510" y="220" font-family="Arial" font-size="15" fill="#d93025">1 route lookup selects RA next hop</text><path d="M1045 385 H1130 V240 H1215" fill="none" stroke="#d93025" stroke-width="5" marker-end="url(#r)"/><text x="1090" y="220" font-family="Arial" font-size="15" fill="#d93025">3 after inspection → VM-B</text><path d="M480 710 H565 V420 H655" fill="none" stroke="#1a73e8" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#b)"/><text x="505" y="690" font-family="Arial" font-size="14" fill="#1a73e8">BGP advertises B prefix</text><path d="M1215 710 H1135 V420 H1045" fill="none" stroke="#1a73e8" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#b)"/><text x="1120" y="690" font-family="Arial" font-size="14" fill="#1a73e8">BGP advertises A prefix</text><path d="M835 385 H865" stroke="#188038" stroke-width="5" marker-end="url(#g)"/><text x="850" y="460" text-anchor="middle" font-family="Arial" font-size="15" fill="#188038">2 firewall policy + stateful inspection</text>
<path d="M1215 270 H1135 V680 H1045" fill="none" stroke="#d93025" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#r)"/><path d="M655 680 H565 V270 H480" fill="none" stroke="#d93025" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#r)"/><text x="850" y="820" text-anchor="middle" font-family="Arial" font-size="16" fill="#d93025">Return flow uses VPC-B learned 10.10.10.0/24 route → same firewall path → VPC-A (symmetry)</text><text x="70" y="925" font-family="Arial" font-size="15" font-weight="700">Packet fields (no NAT example):</text><text x="70" y="955" font-family="Arial" font-size="15">Before firewall: src 10.10.10.20, dst 10.20.20.20. After firewall: src 10.10.10.20, dst 10.20.20.20. The NVA changes the forwarding path, not necessarily the IP header.</text><text x="70" y="990" font-family="Arial" font-size="15">Critical design point: both VPCs must learn the opposite prefix through the appliance. Advertising only one direction produces asymmetric routing or a failed return path.</text></svg>