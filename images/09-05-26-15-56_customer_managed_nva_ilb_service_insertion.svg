<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <style>
      .box{fill:#fff;stroke-width:2;rx:12;ry:12}.txt{font-family:Arial,sans-serif;fill:#222;text-anchor:middle}.title{font-size:18px;font-weight:bold}.body{font-size:15px}.small{font-size:13px}.line{fill:none;stroke:#333;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}.label{font-family:Arial,sans-serif;font-size:13px;fill:#222;text-anchor:middle}
    </style>
  </defs>
  <rect x="360" y="100" width="420" height="190" rx="14" ry="14" fill="#EAF3FF" stroke="#4A76A8" stroke-width="2"/>
  <text x="570" y="130" class="txt title">Azure Virtual WAN managed vHub</text>
  <rect x="470" y="160" width="200" height="75" rx="12" ry="12" class="box" stroke="#4A76A8"/>
  <text x="570" y="188" class="txt body">vHub Router</text><text x="570" y="212" class="txt small">Static / propagated route</text>
  <rect x="70" y="150" width="210" height="100" rx="12" ry="12" class="box" stroke="#5B8C5A"/>
  <text x="175" y="180" class="txt body">Workload VNet</text><text x="175" y="205" class="txt small">10.1.0.0/16</text><text x="175" y="228" class="txt small">VM 10.1.1.10</text>
  <rect x="850" y="70" width="600" height="520" rx="14" ry="14" fill="#FFF4E6" stroke="#B97822" stroke-width="2"/>
  <text x="1150" y="105" class="txt title">Customer-owned NVA VNet 10.5.0.0/16</text>
  <rect x="1030" y="150" width="250" height="95" rx="12" ry="12" class="box" stroke="#B97822"/>
  <text x="1155" y="178" class="txt body">Internal Standard Load Balancer</text><text x="1155" y="202" class="txt small">VIP 10.5.10.10</text><text x="1155" y="225" class="txt small">HA Ports / health probe</text>
  <rect x="930" y="320" width="210" height="90" rx="12" ry="12" class="box" stroke="#B97822"/>
  <text x="1035" y="350" class="txt body">Firewall VM 1</text><text x="1035" y="374" class="txt small">10.5.10.11</text><text x="1035" y="397" class="txt small">Healthy</text>
  <rect x="1190" y="320" width="210" height="90" rx="12" ry="12" class="box" stroke="#B97822"/>
  <text x="1295" y="350" class="txt body">Firewall VM 2</text><text x="1295" y="374" class="txt small">10.5.10.12</text><text x="1295" y="397" class="txt small">Healthy</text>
  <rect x="1035" y="470" width="245" height="80" rx="12" ry="12" class="box" stroke="#6A5ACD"/>
  <text x="1158" y="500" class="txt body">Destination</text><text x="1158" y="526" class="txt small">Internet / branch / remote VNet</text>
  <rect x="350" y="360" width="430" height="130" rx="12" ry="12" fill="#F7F7F7" stroke="#777" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="565" y="392" class="txt small">Service insertion is customer-managed:</text><text x="565" y="416" class="txt small">vHub route points to ILB VIP.</text><text x="565" y="440" class="txt small">ILB selects a healthy firewall.</text><text x="565" y="464" class="txt small">It does not program vWAN routes or guarantee session symmetry.</text>
  <path d="M280 200 H470" class="line"/><text x="375" y="188" class="label">1. VNet connection</text>
  <path d="M670 198 H1030" class="line"/><text x="850" y="185" class="label">2. Prefix match → next hop 10.5.10.10</text>
  <path d="M1120 245 V285 H1035 V320" class="line"/><text x="1025" y="280" class="label">3. Hash to healthy backend</text>
  <path d="M1190 245 V285 H1295 V320" class="line dash"/><text x="1300" y="280" class="label">alternate new flows</text>
  <path d="M1035 410 V450 H1158 V470" class="line"/><text x="1065" y="447" class="label">4. Inspect / forward</text>
  <path d="M1280 510 H1370 V200 H1280" class="line dash"/><text x="1370" y="340" class="label" transform="rotate(90 1370 340)">5. Return must traverse same logical state domain</text>
</svg>