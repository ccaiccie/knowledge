<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><rect width="1200" height="620" fill="white"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold">802.11k Neighbor Discovery + 802.11v BSS Transition</text><g font-family="Arial" font-size="18" text-anchor="middle"><rect x="70" y="80" rx="16" width="220" height="90" fill="#eef3ff" stroke="#5078b8" stroke-width="2"/><text x="180" y="118">Client / STA</text><text x="180" y="145">associated to AP-1</text><rect x="490" y="80" rx="16" width="220" height="90" fill="#e8f7eb" stroke="#4d9860" stroke-width="2"/><text x="600" y="118">AP-1 / Controller</text><text x="600" y="145">current BSS</text><rect x="900" y="80" rx="16" width="220" height="90" fill="#fff0dc" stroke="#c48531" stroke-width="2"/><text x="1010" y="118">AP-2</text><text x="1010" y="145">candidate BSS</text></g><g stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M290 230 H490"/><path d="M490 280 H290"/><path d="M710 330 H900"/><path d="M710 400 H290"/><path d="M290 470 H490"/></g><g font-family="Arial" font-size="17"><text x="340" y="220">1. 802.11k Neighbor Report Request</text><text x="315" y="270">2. Neighbor Report: AP-2 BSSID, channel, operating info</text><text x="735" y="320">3. Infrastructure knows AP-2 is a candidate</text><text x="320" y="390">4. 802.11v BSS Transition Request / candidate advice</text><text x="330" y="460">5. Client response / client makes final roam decision</text></g><text x="600" y="560" text-anchor="middle" font-family="Arial" font-size="18">Management-plane assistance: no user IP header rewrite is implied by k or v.</text></svg>